<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Território 1v1 — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-blue: #3b82f6;
    --c-amber: #fbbf24;
    --c-red-player: #ef4444;
    --c-blue-player: #3b82f6;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 500px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 8px 4px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    line-height: 1.2;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

/* ==========================================================
   PLACAR DOS JOGADORES
   ========================================================== */
.placar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}
.jogador-card {
    padding: 12px;
    border-radius: var(--radius-md);
    border: 2px solid transparent;
    transition: all 0.3s ease;
    background: var(--input-bg);
    position: relative;
    overflow: hidden;
}
.jogador-card.red {
    border-color: rgba(239, 68, 68, 0.3);
}
.jogador-card.blue {
    border-color: rgba(59, 130, 246, 0.3);
}
.jogador-card.ativo.red {
    border-color: var(--c-red-player);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.1);
}
.jogador-card.ativo.blue {
    border-color: var(--c-blue-player);
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    background: rgba(59, 130, 246, 0.1);
}
.jogador-nome {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 4px;
}
.jogador-card.red .jogador-nome { color: #fca5a5; }
.jogador-card.blue .jogador-nome { color: #93c5fd; }
.jogador-pontos {
    font-size: 24px;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
}
.jogador-card.red .jogador-pontos { color: var(--c-red-player); }
.jogador-card.blue .jogador-pontos { color: var(--c-blue-player); }
.jogador-territorio {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 600;
}

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

/* ==========================================================
   GRID
   ========================================================== */
#grid-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
#grid-container {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 3px;
}
.cell {
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    min-width: 0;
    min-height: 0;
    padding: 0;
    font-family: inherit;
}
.cell:hover:not(.pintada) {
    background: rgba(99, 102, 241, 0.25);
    transform: scale(1.03);
}
.cell:disabled {
    cursor: default;
}
.cell.pintada {
    cursor: default;
}
.cell.pintada.red {
    background: var(--c-red-player);
    border-color: rgba(255, 255, 255, 0.25);
}
.cell.pintada.blue {
    background: var(--c-blue-player);
    border-color: rgba(255, 255, 255, 0.25);
}
.cell.nova {
    animation: cell-pop 0.35s ease;
}
@keyframes cell-pop {
    0% { transform: scale(0.85); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
}
.cell.capturada {
    animation: captura 0.6s ease;
}
@keyframes captura {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.3); box-shadow: 0 0 30px currentColor; }
    60% { transform: scale(0.9); }
}
.cell.preview-red {
    box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.6);
}
.cell.preview-blue {
    box-shadow: inset 0 0 0 2px rgba(59, 130, 246, 0.6);
}

/* ==========================================================
   CONTROLES
   ========================================================== */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

/* ==========================================================
   OVERLAY
   ========================================================== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.94);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 24px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 48px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
}
.overlay .grande.red { color: var(--c-red-player); text-shadow: 0 0 20px var(--c-red-player); }
.overlay .grande.blue { color: var(--c-blue-player); text-shadow: 0 0 20px var(--c-blue-player); }
.overlay .grande.empate { color: var(--c-amber); }
.overlay button {
    max-width: 260px;
}
.overlay .trofeu {
    font-size: 64px;
    animation: trofeu-anim 1.4s infinite ease-in-out;
}
@keyframes trofeu-anim {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
}

/* Feedback flutuante */
.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.captura { color: var(--c-amber); text-shadow: 0 0 20px var(--c-amber); font-size: 52px; }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}

/* Badge de fase */
.fase-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 28px;
    line-height: 16px;
}
.fase-badge.red {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.4);
}
.fase-badge.blue {
    background: rgba(59, 130, 246, 0.15);
    color: #93c5fd;
    border-color: rgba(59, 130, 246, 0.4);
}
.fase-badge.ia {
    background: rgba(168, 85, 247, 0.15);
    color: #d8b4fe;
    border-color: rgba(168, 85, 247, 0.4);
}

/* Indicador de bónus */
.regras {
    display: flex;
    justify-content: center;
    gap: 10px;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
}
.regras span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.regras strong {
    color: var(--c-amber);
    font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="2p">👥 2P</button>
        <button class="mode-btn" data-mode="facil">🤖 Fácil</button>
        <button class="mode-btn" data-mode="medio">🤖 Médio</button>
        <button class="mode-btn" data-mode="dificil">🤖 Difícil</button>
    </div>

    <div class="placar">
        <div class="jogador-card red ativo" id="card-red">
            <div class="jogador-nome" id="nome-red">🔴 Jogador 1</div>
            <div class="jogador-pontos" id="pontos-red">0</div>
            <div class="jogador-territorio" id="terr-red">0 células</div>
        </div>
        <div class="jogador-card blue" id="card-blue">
            <div class="jogador-nome" id="nome-blue">🔵 Jogador 2</div>
            <div class="jogador-pontos" id="pontos-blue">0</div>
            <div class="jogador-territorio" id="terr-blue">0 células</div>
        </div>
    </div>

    <div style="text-align:center;">
        <span class="fase-badge red" id="fase-badge">🔴 Sua vez, Jogador 1</span>
    </div>

    <p class="instructions" id="info-instrucao">
        👆 Toque numa célula para pintá-la com a sua cor. Territórios adjacentes valem bónus!
    </p>

    <div id="grid-wrapper">
        <div id="grid-container"></div>
        <div id="overlay" class="overlay hidden"></div>
    </div>

    <div class="controls-grid">
        <button id="btn-iniciar">▶️ Iniciar Jogo</button>
        <button id="btn-reiniciar" class="btn-secondary">🔄 Reiniciar</button>
    </div>

    <div class="regras">
        <span>🎯 Adjacente <strong>+2</strong></span>
        <span>💥 Cercar <strong>+5</strong></span>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-territorio] Inicializando...');

    // ==========================================================
    // CONFIGURAÇÃO
    // ==========================================================
    var TAMANHO = 7; // Grid 7×7 = 49 células (número ímpar evita empates na maioria dos casos)

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = '2p';              // 2p | facil | medio | dificil
    var tabuleiro = [];                 // matriz [r][c] = null | 'red' | 'blue'
    var pontosRed = 0;
    var pontosBlue = 0;
    var territoriosRed = 0;
    var territoriosBlue = 0;
    var jogadorAtual = 'red';           // 'red' | 'blue'
    var jogoAtivo = false;
    var modoIA = false;
    var iaPensando = false;

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        play: function(freq, type, duration, vol) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(vol || 0.07, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duration + 0.02);
            } catch (e) {}
        },
        pintar:   function(cor) {
            var freq = (cor === 'red') ? 440 : 330;
            this.play(freq, 'triangle', 0.12);
        },
        captura:  function() {
            var self = this;
            [600, 800, 1000].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'square', 0.1, 0.05); }, i * 60);
            });
        },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.22); }, i * 110);
            });
        },
        erro: function() {
            this.play(200, 'sawtooth', 0.2);
        }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function criarTabuleiroVazio() {
        var t = [];
        for (var r = 0; r < TAMANHO; r++) {
            var linha = [];
            for (var c = 0; c < TAMANHO; c++) linha.push(null);
            t.push(linha);
        }
        return t;
    }

    function vizinhos(r, c) {
        var viz = [];
        if (r > 0) viz.push({ r: r - 1, c: c });
        if (r < TAMANHO - 1) viz.push({ r: r + 1, c: c });
        if (c > 0) viz.push({ r: r, c: c - 1 });
        if (c < TAMANHO - 1) viz.push({ r: r, c: c + 1 });
        return viz;
    }

    function contarVizinhosCor(r, c, cor) {
        var count = 0;
        var v = vizinhos(r, c);
        for (var i = 0; i < v.length; i++) {
            if (tabuleiro[v[i].r][v[i].c] === cor) count++;
        }
        return count;
    }

    function contarTerritorio(cor) {
        var count = 0;
        for (var r = 0; r < TAMANHO; r++) {
            for (var c = 0; c < TAMANHO; c++) {
                if (tabuleiro[r][c] === cor) count++;
            }
        }
        return count;
    }

    function contarVazias() {
        var count = 0;
        for (var r = 0; r < TAMANHO; r++) {
            for (var c = 0; c < TAMANHO; c++) {
                if (tabuleiro[r][c] === null) count++;
            }
        }
        return count;
    }

    // ==========================================================
    // RENDERIZAÇÃO
    // ==========================================================
    function montarGrid() {
        var gridContainer = $('grid-container');
        gridContainer.innerHTML = '';
        gridContainer.style.display = 'grid';
        gridContainer.style.gridTemplateColumns = 'repeat(' + TAMANHO + ', 1fr)';
        gridContainer.style.gridTemplateRows = 'repeat(' + TAMANHO + ', 1fr)';
        gridContainer.style.gap = '3px';

        for (var r = 0; r < TAMANHO; r++) {
            for (var c = 0; c < TAMANHO; c++) {
                (function(rr, cc) {
                    var cell = document.createElement('button');
                    cell.type = 'button';
                    cell.className = 'cell';
                    cell.dataset.r = rr;
                    cell.dataset.c = cc;
                    cell.disabled = true;

                    cell.addEventListener('click', function() {
                        tentarPintar(rr, cc);
                    });

                    gridContainer.appendChild(cell);
                })(r, c);
            }
        }

        atualizarVisualGrid();
    }

    function atualizarVisualGrid() {
        var cells = document.querySelectorAll('.cell');
        for (var i = 0; i < cells.length; i++) {
            var cell = cells[i];
            var r = parseInt(cell.dataset.r, 10);
            var c = parseInt(cell.dataset.c, 10);
            var cor = tabuleiro[r][c];

            cell.classList.remove('pintada', 'red', 'blue');
            cell.style.background = '';

            if (cor) {
                cell.classList.add('pintada', cor);
                cell.disabled = true;
            } else {
                cell.disabled = !jogoAtivo || (modoIA && jogadorAtual === 'blue');
            }
        }
    }

    function atualizarPlacar() {
        territoriosRed = contarTerritorio('red');
        territoriosBlue = contarTerritorio('blue');

        $('pontos-red').textContent = String(pontosRed);
        $('pontos-blue').textContent = String(pontosBlue);
        $('terr-red').textContent = territoriosRed + ' células';
        $('terr-blue').textContent = territoriosBlue + ' células';

        // Destaca o jogador ativo
        $('card-red').classList.toggle('ativo', jogadorAtual === 'red' && jogoAtivo);
        $('card-blue').classList.toggle('ativo', jogadorAtual === 'blue' && jogoAtivo);
    }

    function atualizarBadge() {
        var b = $('fase-badge');
        b.classList.remove('red', 'blue', 'ia');

        if (!jogoAtivo) {
            b.textContent = 'Pronto para começar';
            b.classList.add('red');
            return;
        }

        if (jogadorAtual === 'red') {
            b.textContent = '🔴 Sua vez, Jogador 1';
            b.classList.add('red');
        } else {
            if (modoIA) {
                b.textContent = '🤖 IA pensando...';
                b.classList.add('ia');
            } else {
                b.textContent = '🔵 Sua vez, Jogador 2';
                b.classList.add('blue');
            }
        }
    }

    // ==========================================================
    // MOTOR DO JOGO
    // ==========================================================
    function tentarPintar(r, c) {
        if (!jogoAtivo) return;
        if (tabuleiro[r][c] !== null) return;
        if (modoIA && jogadorAtual === 'blue') return; // bloqueia input durante IA

        pintarCelula(r, c, jogadorAtual);
    }

    function pintarCelula(r, c, cor) {
        tabuleiro[r][c] = cor;

        // Calcula pontos
        var pontos = 1; // base
        var bonusAdj = contarVizinhosCor(r, c, cor);
        var ganhoAdj = bonusAdj * 2;
        pontos += ganhoAdj;

        // Verifica capturas: células inimigas adjacentes que agora estão cercadas
        var capturadas = [];
        var v = vizinhos(r, c);
        for (var i = 0; i < v.length; i++) {
            var vr = v[i].r;
            var vc = v[i].c;
            var vizinhoCor = tabuleiro[vr][vc];
            if (vizinhoCor && vizinhoCor !== cor) {
                // Verifica se ficou cercado (todos vizinhos são da cor do jogador)
                var vv = vizinhos(vr, vc);
                var cercado = true;
                for (var j = 0; j < vv.length; j++) {
                    if (tabuleiro[vv[j].r][vv[j].c] !== cor) {
                        cercado = false;
                        break;
                    }
                }
                if (cercado) {
                    capturadas.push({ r: vr, c: vc, corAntiga: vizinhoCor });
                }
            }
        }

        // Aplica capturas
        var ganhoCaptura = 0;
        for (var k = 0; k < capturadas.length; k++) {
            tabuleiro[capturadas[k].r][capturadas[k].c] = cor;
            ganhoCaptura += 5;
            // Animação
            var cellCap = document.querySelector('.cell[data-r="' + capturadas[k].r + '"][data-c="' + capturadas[k].c + '"]');
            if (cellCap) {
                cellCap.classList.add('capturada');
                (function(el) {
                    setTimeout(function() { el.classList.remove('capturada'); }, 700);
                })(cellCap);
            }
        }

        var ganhoTotal = pontos + ganhoCaptura;

        if (cor === 'red') pontosRed += ganhoTotal;
        else pontosBlue += ganhoTotal;

        // Visual da célula pintada
        var cell = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
        if (cell) {
            cell.classList.add('pintada', cor, 'nova');
            (function(el) {
                setTimeout(function() { el.classList.remove('nova'); }, 400);
            })(cell);
        }

        // Som e feedback
        som.pintar(cor);
        mostrarFeedbackFloat('+' + ganhoTotal, ganhoCaptura > 0 ? 'captura' : 'positivo');

        if (ganhoCaptura > 0) {
            som.captura();
            if (cor === 'red') {
                $('pontos-red').textContent = String(pontosRed);
            } else {
                $('pontos-blue').textContent = String(pontosBlue);
            }
        }

        atualizarPlacar();
        atualizarVisualGrid();

        // Verifica fim de jogo
        if (contarVazias() === 0) {
            jogoAtivo = false;
            setTimeout(function() { fimDeJogo(); }, 500);
            return;
        }

        // Troca de turno
        jogadorAtual = (jogadorAtual === 'red') ? 'blue' : 'red';
        atualizarBadge();
        atualizarVisualGrid();

        // Se é modo IA e agora é a vez dela
        if (modoIA && jogadorAtual === 'blue' && jogoAtivo) {
            iaPensando = true;
            setTimeout(function() { jogadaIA(); }, 700);
        }
    }

    // ==========================================================
    // IA
    // ==========================================================
    function jogadaIA() {
        if (!jogoAtivo || jogadorAtual !== 'blue') {
            iaPensando = false;
            return;
        }

        var vazias = [];
        for (var r = 0; r < TAMANHO; r++) {
            for (var c = 0; c < TAMANHO; c++) {
                if (tabuleiro[r][c] === null) vazias.push({ r: r, c: c });
            }
        }

        if (vazias.length === 0) {
            iaPensando = false;
            return;
        }

        var escolha;

        if (modoAtual === 'facil') {
            // Aleatório
            escolha = vazias[Math.floor(Math.random() * vazias.length)];
        } else if (modoAtual === 'medio') {
            // Prefere células adjacentes ao seu território
            escolha = escolherMelhor(vazias, 'blue', false);
        } else {
            // Difícil: avalia agressivamente (próprio território + bloqueio do jogador)
            escolha = escolherMelhor(vazias, 'blue', true);
        }

        pintarCelula(escolha.r, escolha.c, 'blue');
        iaPensando = false;
    }

    function escolherMelhor(vazias, cor, agressivo) {
        var melhor = vazias[0];
        var melhorScore = -Infinity;

        for (var i = 0; i < vazias.length; i++) {
            var v = vazias[i];
            var score = 0;

            // Bónus por adjacência própria
            score += contarVizinhosCor(v.r, v.c, cor) * 10;

            // Bloqueio do adversário (adjacência à cor oposta)
            if (agressivo) {
                var oposta = (cor === 'red') ? 'blue' : 'red';
                score += contarVizinhosCor(v.r, v.c, oposta) * 4;
            }

            // Pequeno ruído para variação
            score += Math.random() * 2;

            if (score > melhorScore) {
                melhorScore = score;
                melhor = v;
            }
        }

        return melhor;
    }

    // ==========================================================
    // FEEDBACK FLUTUANTE
    // ==========================================================
    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        $('grid-wrapper').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 900);
    }

    // ==========================================================
    // INÍCIO / FIM DE JOGO
    // ==========================================================
    function iniciarJogo() {
        tabuleiro = criarTabuleiroVazio();
        pontosRed = 0;
        pontosBlue = 0;
        territoriosRed = 0;
        territoriosBlue = 0;
        jogadorAtual = 'red';
        jogoAtivo = true;
        iaPensando = false;
        modoIA = (modoAtual !== '2p');

        esconderOverlay();
        montarGrid();
        atualizarPlacar();
        atualizarBadge();

        // Ajusta nomes no placar
        if (modoIA) {
            $('nome-blue').textContent = '🤖 IA (' + (modoAtual.charAt(0).toUpperCase() + modoAtual.slice(1)) + ')';
        } else {
            $('nome-blue').textContent = '🔵 Jogador 2';
        }
        $('nome-red').textContent = '🔴 Jogador 1';

        if (modoAtual === '2p') {
            $('info-instrucao').textContent = '👆 Toque numa célula para pintá-la com a sua cor. Territórios adjacentes valem bónus!';
        } else {
            $('info-instrucao').textContent = '👆 Você joga de 🔴 Vermelho. A IA joga de 🔵 Azul. Boa sorte!';
        }
    }

    function fimDeJogo() {
        jogoAtivo = false;
        atualizarVisualGrid();
        atualizarBadge();
        som.vitoria();

        var vencedor;
        var grandeClasse;
        var titulo;
        var subtitulo;

        if (pontosRed > pontosBlue) {
            vencedor = 'red';
            grandeClasse = 'red';
            titulo = '🔴 Jogador 1 venceu!';
            subtitulo = 'Território conquistado com ' + pontosRed + ' pontos.';
        } else if (pontosBlue > pontosRed) {
            vencedor = 'blue';
            grandeClasse = 'blue';
            if (modoIA) {
                titulo = '🤖 IA venceu!';
                subtitulo = 'A máquina dominou com ' + pontosBlue + ' pontos. Tente novamente!';
            } else {
                titulo = '🔵 Jogador 2 venceu!';
                subtitulo = 'Território conquistado com ' + pontosBlue + ' pontos.';
            }
        } else {
            vencedor = null;
            grandeClasse = 'empate';
            titulo = '🤝 Empate!';
            subtitulo = 'Ambos os jogadores com ' + pontosRed + ' pontos.';
        }

        // Se modo IA, verifica recorde de vitórias
        var chaveRec = 'brain_territorio_recorde_' + modoAtual;
        var recorde = parseInt(localStorage.getItem(chaveRec) || '0', 10);
        if (modoIA && vencedor === 'red') {
            // Vitória contra IA = máximo de pontos do jogador
            if (pontosRed > recorde) {
                localStorage.setItem(chaveRec, String(pontosRed));
            }
        }

        var htmlExtra =
            '<div class="trofeu">' + (vencedor ? (vencedor === 'red' ? '🏆' : (modoIA ? '🤖' : '🏆')) : '🤝') + '</div>' +
            '<div style="display:flex; gap:14px; justify-content:center; margin-top:8px;">' +
                '<div>' +
                    '<div style="font-size:11px; color:#fca5a5; font-weight:700; text-transform:uppercase;">🔴 Jogador 1</div>' +
                    '<div class="grande red" style="font-size:32px;">' + pontosRed + '</div>' +
                    '<div style="font-size:11px; color:#94a3b8;">' + territoriosRed + ' células</div>' +
                '</div>' +
                '<div style="align-self:center; font-size:20px; color:#94a3b8;">×</div>' +
                '<div>' +
                    '<div style="font-size:11px; color:#93c5fd; font-weight:700; text-transform:uppercase;">' + (modoIA ? '🤖 IA' : '🔵 Jogador 2') + '</div>' +
                    '<div class="grande blue" style="font-size:32px;">' + pontosBlue + '</div>' +
                    '<div style="font-size:11px; color:#94a3b8;">' + territoriosBlue + ' células</div>' +
                '</div>' +
            '</div>';

        mostrarOverlay({
            titulo: titulo,
            htmlExtra: htmlExtra,
            subtitulo: subtitulo,
            botao: { texto: '🔄 Jogar Novamente', acao: function() { iniciarJogo(); } }
        });
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var ov = $('overlay');
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;

        jogoAtivo = false;
        iaPensando = false;

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        esconderOverlay();
        tabuleiro = criarTabuleiroVazio();
        pontosRed = 0;
        pontosBlue = 0;
        jogadorAtual = 'red';

        montarGrid();
        atualizarPlacar();
        atualizarBadge();
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', iniciarJogo);
    $('btn-reiniciar').addEventListener('click', iniciarJogo);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    tabuleiro = criarTabuleiroVazio();
    montarGrid();
    atualizarPlacar();
    atualizarBadge();
    console.log('[brain-territorio] Pronto! Modo:', modoAtual);
})();
</script>
</body>
</html>
