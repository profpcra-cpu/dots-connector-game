<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simon Says — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 8px 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-nivel { color: var(--c-cyan); }
#display-sequencia { color: var(--c-amber); }
#display-recorde { color: var(--c-green); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

/* ==========================================================
   TABULEIRO SIMON — CORRIGIDO
   ========================================================== */
#grid-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    background: #050914;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}
#grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    width: 100%;
    height: 100%;
}

.quad {
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    transition: transform 0.12s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    border: none;
    padding: 0;
    font-family: inherit;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    /* Estado "apagado" — cor visível mas suave */
    opacity: 0.72;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.25);
}
.quad:hover:not(:disabled) {
    opacity: 0.88;
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.15), 0 0 12px rgba(255, 255, 255, 0.15);
}
.quad:disabled {
    cursor: default;
}
.quad.brilhando {
    opacity: 1;
    transform: scale(0.96);
    box-shadow:
        0 0 40px 6px currentColor,
        inset 0 0 30px rgba(255, 255, 255, 0.5);
}
.quad.errado {
    animation: piscar-erro 0.5s ease;
}
@keyframes piscar-erro {
    0%, 100% { opacity: 0.72; }
    25%, 75% { opacity: 0.15; }
}

.quad-num {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}

/* ==========================================================
   OVERLAY / CENTRO
   ========================================================== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 22px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 52px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay button {
    max-width: 260px;
}

/* ==========================================================
   CONTROLES
   ========================================================== */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

/* Indicador de fase */
.fase-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.fase-badge.jogador {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.fase-badge.simon {
    background: rgba(251, 191, 36, 0.15);
    color: var(--c-amber);
    border-color: rgba(251, 191, 36, 0.3);
}
.fase-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="classico">🎯 Clássico</button>
        <button class="mode-btn" data-mode="reverso">🔄 Reverso</button>
        <button class="mode-btn" data-mode="vidas">❤️ Vidas</button>
    </div>

    <div class="score-board">
        <div id="label-bloco1">Nível<br><strong id="display-nivel">1</strong></div>
        <div id="label-bloco2">Sequência<br><strong id="display-sequencia">0</strong></div>
        <div id="label-bloco3">Recorde<br><strong id="display-recorde">0</strong></div>
    </div>

    <div style="text-align:center;">
        <span class="fase-badge" id="fase-badge">Pronto</span>
    </div>

    <p class="instructions" id="info-instrucao">
        🎵 Repita a sequência de cores e sons na ordem correta. Cada nível adiciona uma cor nova!
    </p>

    <div id="grid-wrapper">
        <div id="grid-container"></div>
        <div id="overlay" class="overlay hidden"></div>
    </div>

    <div class="controls-grid">
        <button id="btn-iniciar">▶️ Iniciar Jogo</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-simon] Inicializando...');

    // ==========================================================
    // CONFIGURAÇÃO DOS 4 QUADRANTES
    // ==========================================================
    var QUADRANTES = [
        { id: 0, cor: '#4ade80', freq: 261.63, nome: 'Verde'  },   // Dó
        { id: 1, cor: '#ef4444', freq: 329.63, nome: 'Vermelho' }, // Mi
        { id: 2, cor: '#fbbf24', freq: 392.00, nome: 'Amarelo' },  // Sol
        { id: 3, cor: '#38bdf8', freq: 523.25, nome: 'Azul' }      // Dó agudo
    ];

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = 'classico';
    var sequencia = [];
    var passoAtual = 0;
    var nivel = 1;
    var vidas = 3;
    var jogoAtivo = false;
    var aceitandoInput = false;
    var recorde = parseInt(localStorage.getItem('brain_simon_recorde') || '0', 10);
    var velocidade = 600;
    var intervalosAtivos = [];

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        tocarNota: function(freq, duracao) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = 'sine';
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(0.15, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duracao);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duracao + 0.02);
            } catch (e) {}
        },
        erro: function() {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = 'sawtooth';
                o.frequency.value = 150;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0.12, agora);
                g.gain.exponentialRampToValueAtTime(0.001, agora + 0.5);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + 0.55);
            } catch (e) {}
        },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.tocarNota(f, 0.25); }, i * 120);
            });
        }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function limparIntervalos() {
        for (var i = 0; i < intervalosAtivos.length; i++) {
            clearTimeout(intervalosAtivos[i]);
        }
        intervalosAtivos = [];
    }

    function atualizarBadge(texto, classe) {
        var badge = $('fase-badge');
        badge.textContent = texto;
        badge.className = 'fase-badge' + (classe ? ' ' + classe : '');
    }

    function atualizarPlacar() {
        $('display-nivel').textContent = String(nivel);
        $('display-sequencia').textContent = String(passoAtual) + '/' + String(sequencia.length);
        $('display-recorde').textContent = String(recorde);
    }

    // ==========================================================
    // MONTAGEM DOS QUADRANTES — CORRIGIDA
    // ==========================================================
    function montarQuadrantes() {
        var gridContainer = $('grid-container');
        gridContainer.innerHTML = '';

        for (var i = 0; i < QUADRANTES.length; i++) {
            (function(q) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'quad';
                btn.dataset.id = q.id;
                btn.dataset.cor = q.cor;

                // Força a cor de forma bruta e com prioridade máxima
                btn.style.setProperty('background', q.cor, 'important');
                btn.style.setProperty('background-color', q.cor, 'important');
                btn.style.setProperty('background-image', 'none', 'important');
                btn.style.setProperty('color', q.cor, 'important');

                btn.setAttribute('aria-label', q.nome);
                btn.disabled = true;

                var num = document.createElement('span');
                num.className = 'quad-num';
                num.textContent = String(q.id + 1);
                btn.appendChild(num);

                btn.addEventListener('click', function() {
                    if (!aceitandoInput) return;
                    clicarQuadrante(q.id);
                });

                gridContainer.appendChild(btn);
            })(QUADRANTES[i]);
        }
    }

    function brilharQuadrante(id, duracao) {
        var gridContainer = $('grid-container');
        var btn = gridContainer.querySelector('.quad[data-id="' + id + '"]');
        if (!btn) return;

        btn.classList.add('brilhando');
        som.tocarNota(QUADRANTES[id].freq, duracao / 1000);

        setTimeout(function() {
            btn.classList.remove('brilhando');
        }, duracao);
    }

    // ==========================================================
    // GERAÇÃO DA SEQUÊNCIA
    // ==========================================================
    function gerarNovaCor() {
        return Math.floor(Math.random() * QUADRANTES.length);
    }

    // ==========================================================
    // REPRODUÇÃO DA SEQUÊNCIA
    // ==========================================================
    function reproduzirSequencia() {
        aceitandoInput = false;
        bloquearQuadrantes(true);
        atualizarBadge('👀 Observe...', 'simon');
        $('info-instrucao').textContent = '👀 Observe a sequência...';

        var tempo = velocidade;
        var atrasoInicial = 600;

        for (var i = 0; i < sequencia.length; i++) {
            (function(idx) {
                var t = setTimeout(function() {
                    brilharQuadrante(sequencia[idx], tempo * 0.85);
                }, atrasoInicial + idx * tempo);
                intervalosAtivos.push(t);
            })(i);
        }

        var tempoFinal = atrasoInicial + sequencia.length * tempo + 200;
        var tFim = setTimeout(function() {
            iniciarVezDoJogador();
        }, tempoFinal);
        intervalosAtivos.push(tFim);
    }

    // ==========================================================
    // VEZ DO JOGADOR
    // ==========================================================
    function iniciarVezDoJogador() {
        passoAtual = 0;
        aceitandoInput = true;
        bloquearQuadrantes(false);
        atualizarBadge('👉 Sua vez!', 'jogador');
        $('info-instrucao').textContent = '👉 Repita a sequência na ordem correta!';
        atualizarPlacar();
    }

    function bloquearQuadrantes(bloquear) {
        var botoes = document.querySelectorAll('.quad');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = bloquear;
        }
    }

    // ==========================================================
    // CLIQUE DO JOGADOR
    // ==========================================================
    function clicarQuadrante(id) {
        if (!aceitandoInput) return;

        brilharQuadrante(id, Math.min(200, velocidade * 0.5));

        var esperado;
        if (modoAtual === 'reverso') {
            var indiceReverso = sequencia.length - 1 - passoAtual;
            esperado = sequencia[indiceReverso];
        } else {
            esperado = sequencia[passoAtual];
        }

        if (id !== esperado) {
            aceitandoInput = false;
            bloquearQuadrantes(true);
            som.erro();

            var gridContainer = $('grid-container');
            var btn = gridContainer.querySelector('.quad[data-id="' + id + '"]');
            if (btn) {
                btn.classList.add('errado');
                setTimeout(function() { btn.classList.remove('errado'); }, 500);
            }

            if (modoAtual === 'vidas') {
                vidas--;
                atualizarBadge('❌ Errou! Vidas: ' + vidas, 'erro');
                $('info-instrucao').textContent = '❌ Errou! Vidas restantes: ' + vidas;

                if (vidas <= 0) {
                    setTimeout(function() { fimDeJogo(); }, 800);
                } else {
                    setTimeout(function() {
                        passoAtual = 0;
                        reproduzirSequencia();
                    }, 1200);
                }
            } else {
                atualizarBadge('❌ Errou!', 'erro');
                $('info-instrucao').textContent = '❌ Você errou a sequência.';
                setTimeout(function() { fimDeJogo(); }, 800);
            }
            return;
        }

        passoAtual++;
        atualizarPlacar();

        if (passoAtual === sequencia.length) {
            aceitandoInput = false;
            bloquearQuadrantes(true);
            atualizarBadge('✅ Perfeito!', 'jogador');
            $('info-instrucao').textContent = '✅ Muito bem! Preparando próximo nível...';

            if (nivel > recorde) {
                recorde = nivel;
                localStorage.setItem('brain_simon_recorde', String(recorde));
                $('display-recorde').textContent = String(recorde);
            }

            var t = setTimeout(function() {
                proximoNivel();
            }, 1100);
            intervalosAtivos.push(t);
        }
    }

    // ==========================================================
    // PRÓXIMO NÍVEL
    // ==========================================================
    function proximoNivel() {
        nivel++;
        velocidade = Math.max(280, 600 - (nivel - 1) * 25);
        sequencia.push(gerarNovaCor());
        atualizarPlacar();
        reproduzirSequencia();
    }

    // ==========================================================
    // NOVO JOGO
    // ==========================================================
    function novoJogo() {
        limparIntervalos();
        sequencia = [gerarNovaCor()];
        nivel = 1;
        vidas = 3;
        passoAtual = 0;
        velocidade = 600;
        jogoAtivo = true;
        aceitandoInput = false;

        esconderOverlay();
        bloquearQuadrantes(true);
        atualizarPlacar();

        var t = setTimeout(function() {
            reproduzirSequencia();
        }, 700);
        intervalosAtivos.push(t);
    }

    // ==========================================================
    // FIM DE JOGO
    // ==========================================================
    function fimDeJogo() {
        jogoAtivo = false;
        aceitandoInput = false;
        limparIntervalos();
        bloquearQuadrantes(true);

        if (nivel > recorde) {
            recorde = nivel;
            localStorage.setItem('brain_simon_recorde', String(recorde));
        }

        var nivelAlcancado = (modoAtual === 'vidas') ? nivel : (nivel - 1);
        var mensagem;
        var medalha;

        if (nivelAlcancado >= 15) {
            medalha = '🏆';
            mensagem = 'Genial! Memória de elefante!';
        } else if (nivelAlcancado >= 10) {
            medalha = '🥇';
            mensagem = 'Excelente! Você tem uma memória afiada.';
        } else if (nivelAlcancado >= 5) {
            medalha = '🥈';
            mensagem = 'Bom trabalho! Continue treinando.';
        } else {
            medalha = '🥉';
            mensagem = 'Bom começo! Tente novamente.';
        }

        som.erro();
        setTimeout(function() { som.vitoria(); }, 400);

        mostrarOverlay({
            titulo: medalha + ' Fim de Jogo!',
            htmlExtra: '<div class="grande">Nível ' + nivelAlcancado + '</div>' +
                       '<div style="font-size:13px; color:var(--text-muted); margin-top:6px;">Recorde: ' + recorde + '</div>',
            subtitulo: mensagem,
            botao: { texto: '🔄 Jogar Novamente', acao: function() { novoJogo(); } }
        });

        atualizarBadge('🏁 Fim de jogo', 'erro');
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var overlay = $('overlay');
        overlay.classList.add('hidden');
        overlay.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var overlay = $('overlay');
        overlay.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            overlay.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            overlay.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            overlay.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            overlay.appendChild(btn);
        }
        if (cfg.botaoSecundario) {
            var btn2 = document.createElement('button');
            btn2.textContent = cfg.botaoSecundario.texto;
            btn2.className = 'btn-secondary';
            btn2.addEventListener('click', cfg.botaoSecundario.acao);
            overlay.appendChild(btn2);
        }

        overlay.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;
        limparIntervalos();

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        if (novoModo === 'classico') {
            $('info-instrucao').textContent = '🎵 Repita a sequência de cores e sons na ordem correta. Cada nível adiciona uma cor nova!';
        } else if (novoModo === 'reverso') {
            $('info-instrucao').textContent = '🔄 DESAFIO: repita a sequência AO CONTRÁRIO! Comece pela última cor que apareceu.';
        } else if (novoModo === 'vidas') {
            $('info-instrucao').textContent = '❤️ Você tem 3 vidas. Cada erro custa uma vida. Errar não reinicia — só perde vida!';
        }

        jogoAtivo = false;
        aceitandoInput = false;
        bloquearQuadrantes(true);
        esconderOverlay();
        atualizarBadge('Pronto para jogar', '');
        nivel = 1;
        sequencia = [];
        passoAtual = 0;
        vidas = 3;
        atualizarPlacar();
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', function() {
        novoJogo();
    });

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    montarQuadrantes();
    atualizarPlacar();
    atualizarBadge('Pronto para jogar', '');
    console.log('[brain-simon] Pronto! Modo:', modoAtual);
})();
</script>
</body>
</html>
