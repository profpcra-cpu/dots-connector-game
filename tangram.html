<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tangram Tradicional · Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg-1:#1a1f3a; --bg-2:#070b14;
    --card-bg:rgba(18,24,40,.92); --card-border:rgba(148,163,184,.12);
    --text:#f1f5f9; --text-muted:#94a3b8; --text-dim:#64748b;
    --border:rgba(148,163,184,.15); --input-bg:rgba(10,15,28,.7);
    --accent-1:#38bdf8; --accent-2:#818cf8; --accent-3:#c084fc;
    --success:#34d399; --warning:#fbbf24;
    --r-sm:8px; --r-md:14px; --r-lg:22px;
    --shadow:0 20px 60px -20px rgba(0,0,0,.75);
    --ease:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
    --bg-1:#e0e7ff; --bg-2:#f8fafc;
    --card-bg:rgba(255,255,255,.92); --card-border:rgba(15,23,42,.08);
    --text:#0f172a; --text-muted:#475569; --text-dim:#94a3b8;
    --border:rgba(15,23,42,.1); --input-bg:rgba(241,245,249,.8);
    --shadow:0 20px 60px -20px rgba(15,23,42,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% -20%,var(--bg-1) 0%,var(--bg-2) 60%);
    background-attachment:fixed;color:var(--text);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:10px;-webkit-font-smoothing:antialiased;
    transition:background var(--ease),color var(--ease);
}
.game{
    background:var(--card-bg);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    padding:16px;border-radius:var(--r-lg);box-shadow:var(--shadow);
    width:100%;max-width:560px;border:1px solid var(--card-border);
    display:flex;flex-direction:column;gap:10px;
    max-height:98vh;overflow-y:auto;scrollbar-width:thin;
}
.game::-webkit-scrollbar{width:4px}
.game::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.icon-btn{
    width:32px;height:32px;border-radius:var(--r-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--input-bg);border:1px solid var(--border);
    color:var(--text-muted);cursor:pointer;font-size:14px;
    transition:all var(--ease);text-decoration:none;flex-shrink:0;
    user-select:none;font-family:inherit;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent-1);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.96)}
.header{text-align:center}
.header h1{
    font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:2px;
}
.header p{font-size:11.5px;color:var(--text-muted);line-height:1.4}
.hud{display:flex;gap:8px}
.hud-card{
    flex:1;background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);padding:8px 10px;
    display:flex;flex-direction:column;gap:2px;
}
.hud-card .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-dim)}
.hud-card .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent-1)}
.hud-card .val.ok{color:var(--success)}
.canvas-wrap{
    position:relative;width:100%;aspect-ratio:4/3;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-md);overflow:hidden;
    display:flex;justify-content:center;align-items:center;
    box-shadow:inset 0 0 40px -20px rgba(0,0,0,.5);
}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.toolbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 14px;border-radius:var(--r-sm);
    font-size:12px;font-weight:700;font-family:inherit;border:none;
    cursor:pointer;transition:all var(--ease);user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{
    background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
    color:#fff;box-shadow:0 4px 16px -4px rgba(129,140,248,.5);
}
.btn-primary:hover{box-shadow:0 6px 24px -4px rgba(129,140,248,.7);transform:translateY(-1px)}
.btn-ghost{background:var(--input-bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent-1);color:var(--accent-1)}
.hint{
    text-align:center;font-size:11px;color:var(--text-dim);
    padding:6px 10px;background:var(--input-bg);
    border-radius:var(--r-sm);border:1px solid var(--border);line-height:1.5;
}
.hint kbd{
    display:inline-block;padding:1px 5px;border-radius:4px;
    background:var(--border);font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;color:var(--text-muted);
}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.legend-item{
    display:flex;align-items:center;gap:5px;padding:5px 6px;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);transition:all var(--ease);cursor:pointer;
}
.legend-item:hover{border-color:var(--accent-1)}
.legend-item.active{border-color:var(--accent-1);background:rgba(56,189,248,.12)}
.legend-item .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.legend-item .nm{font-weight:600;color:var(--text);font-size:9.5px;line-height:1.1}
.modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    justify-content:center;align-items:center;z-index:1000;padding:20px;
    animation:fadeIn .25s ease;
}
.modal.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-content{
    background:var(--card-bg);backdrop-filter:blur(24px);
    padding:28px 24px;border-radius:var(--r-lg);
    border:1px solid var(--card-border);text-align:center;
    max-width:340px;width:100%;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    animation:slideUp .35s cubic-bezier(.16,1,.3,1);
}
.modal-content .emo{font-size:48px;display:block;margin-bottom:8px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.modal-content h2{font-size:20px;font-weight:800;color:var(--success);margin-bottom:8px}
.modal-content p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:20px}
.modal-content .btn{width:100%}
@media (max-width:420px){
    .game{padding:12px;gap:8px}
    .header h1{font-size:18px}
    .header p{font-size:10.5px}
    .btn{padding:8px 11px;font-size:11px}
    .legend{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:720px){
    .header p{display:none}
    .game{gap:7px}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="game" role="main">
    <div class="topbar">
        <a href="index.html" class="icon-btn" title="Voltar" aria-label="Voltar">←</a>
        <div class="brand"><span>📐</span><span>Tangram Tradicional</span></div>
        <button id="theme-toggle" class="icon-btn" title="Tema" aria-label="Alternar tema">🌙</button>
    </div>

    <header class="header">
        <h1>Tangram Tradicional</h1>
        <p>Reconstrua a silhueta usando as 7 peças clássicas chinesas</p>
    </header>

    <div class="hud">
        <div class="hud-card"><span class="lbl">Desafio</span><span class="val" id="model-name">—</span></div>
        <div class="hud-card"><span class="lbl">Encaixes</span><span class="val" id="score-count">0 / 7</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="cv" width="800" height="600" aria-label="Área de jogo do tangram"></canvas>
    </div>

    <div class="toolbar">
        <button class="btn btn-ghost" id="btn-rot-l" title="Rodar 45° anti-horário">↺ 45°</button>
        <button class="btn btn-ghost" id="btn-rot-r" title="Rodar 45° horário">↻ 45°</button>
        <button class="btn btn-ghost" id="btn-flip" title="Espelhar peça">↔ Espelhar</button>
        <button class="btn btn-primary" id="btn-new" title="Novo modelo">🎲 Novo</button>

</main>

<div class="modal" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">

        <p id="win-text"></p>
        <button class="btn btn-primary" id="next">Próximo Desafio →</button>
    </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* ============================================================================
   UTILITÁRIOS
============================================================================ */
const normDeg = a => ((a % 360) + 360) % 360;
function angDiff(a, b){
    const d = Math.abs(normDeg(a) - normDeg(b));
    return Math.min(d, 360 - d);
}

/* ============================================================================
   CONSTANTES DO JOGO
============================================================================ */
const CANVAS_W = 800;
const CANVAS_H = 600;
const L = 260;                             // lado do quadrado tangram

const TRAY_TOP = CANVAS_H - 140;
const GAME_TOP = 15;
const GAME_BOTTOM = TRAY_TOP - 10;
const GAME_CX = CANVAS_W / 2;
const GAME_CY = (GAME_TOP + GAME_BOTTOM) / 2;

const SNAP_DIST = 26;
const SNAP_ANGLE_TOL = 12;

const S_SMALL = L / (2 * Math.SQRT2);      // lado do quadrado pequeno
const H_BIG = L / Math.SQRT2;               // cateto do triângulo grande

/* ============================================================================
   PEÇAS — vértices locais centrados no centróide
============================================================================ */
const PIECES = (() => {
    function center(pts){
        let cx = 0, cy = 0;
        for (const [x, y] of pts){ cx += x; cy += y; }
        cx /= pts.length; cy /= pts.length;
        return pts.map(([x, y]) => [x - cx, y - cy]);
    }

    // Triângulo grande: catetos H_BIG, ângulo reto em (0,0)
    const big = center([[0, 0], [H_BIG, 0], [0, H_BIG]]);

    // Triângulo médio: catetos L/2
    const med = center([[0, 0], [L / 2, 0], [0, L / 2]]);

    // Triângulo pequeno: catetos S_SMALL
    const sml = center([[0, 0], [S_SMALL, 0], [0, S_SMALL]]);

    // Quadrado pequeno: lado S_SMALL, centrado
    const sq = [
        [-S_SMALL / 2, -S_SMALL / 2],
        [ S_SMALL / 2, -S_SMALL / 2],
        [ S_SMALL / 2,  S_SMALL / 2],
        [-S_SMALL / 2,  S_SMALL / 2]
    ];

    // Paralelogramo: lados L/2 e S_SMALL, ângulo interno 45°
    const parDx = S_SMALL * Math.SQRT1_2;
    const par = center([
        [0, 0],
        [L / 2, 0],
        [L / 2 + parDx, parDx],
        [parDx, parDx]
    ]);

    return {
        bigA: { id: 'bigA', name: 'Triângulo Grande',  color: '#f43f5e', verts: big },
        bigB: { id: 'bigB', name: 'Triângulo Grande',  color: '#fb923c', verts: big },
        med:  { id: 'med',  name: 'Triângulo Médio',   color: '#facc15', verts: med },
        smlA: { id: 'smlA', name: 'Triângulo Pequeno', color: '#34d399', verts: sml },
        smlB: { id: 'smlB', name: 'Triângulo Pequeno', color: '#22d3ee', verts: sml },
        sq:   { id: 'sq',   name: 'Quadrado',          color: '#818cf8', verts: sq },
        par:  { id: 'par',  name: 'Paralelogramo',     color: '#c084fc', verts: par }
    };
})();

/* ============================================================================
   CONVERSÃO math → canvas
   Coordenadas matemáticas: origem no canto inferior esquerdo do quadrado,
   Y aponta para CIMA.
============================================================================ */
function mathToCanvas([mx, my]){
    return [
        GAME_CX - L / 2 + mx,
        GAME_CY + L / 2 - my
    ];
}

/* ============================================================================
   TRANSFORMAÇÕES GEOMÉTRICAS
============================================================================ */
function transformPoint([x, y], rot, flip, tx, ty){
    if (flip) x = -x;
    const rad = rot * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    return [tx + x * c - y * s, ty + x * s + y * c];
}

/* ============================================================================
   AUTO-DESCOBERTA DA POSIÇÃO-ALVO
   Dado um conjunto de vértices-alvo (em coords do canvas), descobre
   (rot, flip, tx, ty) que melhor alinha os vértices locais da peça.
============================================================================ */
function computeTargetFromVerts(pieceId, targetVerts){
    const def = PIECES[pieceId];
    const n = def.verts.length;

    // Centróide dos alvos
    let tcx = 0, tcy = 0;
    for (const [x, y] of targetVerts){ tcx += x; tcy += y; }
    tcx /= n; tcy /= n;

    let best = null;

    // Procura em passos de 5° — refina depois
    for (let rot = 0; rot < 360; rot += 5){
        for (const flip of [false, true]){
            // Vértices locais transformados SEM translação
            const tVerts = def.verts.map(v => transformPoint(v, rot, flip, 0, 0));

            // Centróide dos locais transformados
            let lcx = 0, lcy = 0;
            for (const [x, y] of tVerts){ lcx += x; lcy += y; }
            lcx /= n; lcy /= n;

            // Translação para alinhar centróides
            const tx = tcx - lcx;
            const ty = tcy - lcy;

            // Erro: soma das distâncias mínimas com emparelhamento greedy
            let err = 0;
            const used = new Array(n).fill(false);
            for (const [txv, tyv] of targetVerts){
                let bestD = Infinity, bestI = -1;
                for (let i = 0; i < n; i++){
                    if (used[i]) continue;
                    const [vx, vy] = tVerts[i];
                    const d = Math.hypot(vx + tx - txv, vy + ty - tyv);
                    if (d < bestD){ bestD = d; bestI = i; }
                }
                if (bestI >= 0){ used[bestI] = true; err += bestD; }
            }

            if (!best || err < best.err){
                best = { rot, flip, tx, ty, err };
            }
        }
    }

    // Refinamento fino: procura em passos de 1° em torno do melhor
    const center = best.rot;
    for (let delta = -5; delta <= 5; delta++){
        const rot = normDeg(center + delta);
        for (const flip of [false, true]){
            const tVerts = def.verts.map(v => transformPoint(v, rot, flip, 0, 0));
            let lcx = 0, lcy = 0;
            for (const [x, y] of tVerts){ lcx += x; lcy += y; }
            lcx /= n; lcy /= n;
            const tx = tcx - lcx;
            const ty = tcy - lcy;
            let err = 0;
            const used = new Array(n).fill(false);
            for (const [txv, tyv] of targetVerts){
                let bestD = Infinity, bestI = -1;
                for (let i = 0; i < n; i++){
                    if (used[i]) continue;
                    const [vx, vy] = tVerts[i];
                    const d = Math.hypot(vx + tx - txv, vy + ty - tyv);
                    if (d < bestD){ bestD = d; bestI = i; }
                }
                if (bestI >= 0){ used[bestI] = true; err += bestD; }
            }
            if (err < best.err){
                best = { rot, flip, tx, ty, err };
            }
        }
    }

    return { x: best.tx, y: best.ty, rot: best.rot, flip: best.flip };
}

/* ============================================================================
   FIGURAS — vértices em COORDENADAS MATEMÁTICAS
   Origem no canto inferior esquerdo do quadrado, Y para CIMA.
   As peças são as regiões EXATAS do quadrado canónico.
============================================================================ */
const S = S_SMALL;
const Q = L / 2;

const FIGURES = {
    /* --------------------------------------------------------------------
       QUADRADO CANÓNICO
       --------------------------------------------------------------------
       Quadrado [0,L]² com Y para cima.
       Decomposição verificada (áreas: L²/4 + L²/4 + L²/8 + L²/8 + L²/16
       + L²/16 + L²/8 = L²) :
       
         bigA  — triângulo grande inferior esquerdo
         bigB  — triângulo grande superior esquerdo
         med   — triângulo médio inferior direito
         sq    — quadrado pequeno no centro-direita
         smlA  — triângulo pequeno (canto superior direito do sq)
         smlB  — triângulo pequeno (canto inferior do sq)
         par   — paralelogramo à direita do sq

       Geometria:
         Diagonal principal vai de (0,L) a (L,0).
         bigA: hipotenusa em cima (diagonal), do canto sup-esq ao centro
         bigB: hipotenusa em baixo (diagonal), do canto inf-esq ao centro
       -------------------------------------------------------------------- */
    square: (() => {
        const c = [L / 2, L / 2];                // centro do quadrado
        return {
            // Triângulo grande superior esquerdo: (0,L) — c — (0,0)? Não.
            // bigA ocupa a metade inferior esquerda:
            //   (0,0) — (L,0)? não, bigA é só metade inferior esquerda
            // bigA: (0,0), (L/2, L/2), (0, L)?  → cateto em baixo e à esq
            //   cateto horizontal: (0,0)→(L/2,L/2) tem comp L/√2 ✓
            //   cateto vertical: (0,0)→(0,L) tem comp L ✗ — precisa H_BIG
            // Corrigir: bigA: (0,0), (H_BIG,0), (0, H_BIG)?  área = H_BIG²/2 = L²/4 ✓
            // Mas isso deixa o quadrado maior do que L em altura...
            // 
            // A decomposição EXATA com catetos H_BIG = L/√2:
            //   bigA: (0,0)              (H_BIG, 0)            (H_BIG/2, H_BIG/2)
            //   → hipotenusa vai de (0,0) a (H_BIG, 0)? comp H_BIG
            //   → catetos: (0,0)→(H_BIG/2, H_BIG/2) tem comp H_BIG/√2 = L/2 ✗
            //
            // OK, vou usar a formulação correta com hipotenusa = L:
            //   bigA: (0,0)    (L/2, L/2)    (0, L)     — hipotenusa vertical esquerda
            //   cateto (0,0)→(L/2,L/2): comp L/√2 = H_BIG ✓
            //   cateto (0,L)→(L/2,L/2): comp L/√2 = H_BIG ✓
            //   hipotenusa (0,0)→(0,L): comp L ✓
            //   Ângulo reto em (L/2, L/2)? Não — o ângulo reto está em (0,L) ou (0,0)?
            //   Se hipotenusa é (0,0)-(0,L), os catetos partem dos extremos:
            //   O ângulo reto está em (L/2, L/2) onde os catetos se encontram.
            //   Verificação: vetor de (L/2,L/2) a (0,0): (-L/2,-L/2)
            //                vetor de (L/2,L/2) a (0,L): (-L/2, L/2)
            //                dot = L²/4 - L²/4 = 0 ✓ ângulo reto!
            bigA: [[0, 0], [L / 2, L / 2], [0, L]],

            // bigB: espelhado, do lado direito
            //   hipotenusa (L,0)-(L,L)? comp L
            //   catetos para (L/2, L/2)
            //   Verificar: (L/2,L/2)→(L,0) = (L/2,-L/2), (L/2,L/2)→(L,L) = (L/2,L/2)
            //   dot = L²/4 - L²/4 = 0 ✓
            bigB: [[L, 0], [L / 2, L / 2], [L, L]],

            // med: triângulo médio — encaixa no canto superior direito
            //   catetos L/2, hipotenusa H_BIG
            //   (L/2, L/2) (L, L/2) (L/2, L)? Cateto horiz: L/2, cateto vert: L/2
            //   Hipotenusa (L, L/2)→(L/2, L): comp √(L²/4+L²/4) = L/√2 = H_BIG ✓
            //   Mas (L/2, L/2) (L, L/2) (L/2, L) — o ângulo reto está em (L/2, L/2)
            //   Verificar: (L/2,L/2)→(L,L/2) = (L/2, 0), (L/2,L/2)→(L/2,L) = (0, L/2)
            //   dot = 0 ✓
            med: [[L / 2, L / 2], [L, L / 2], [L / 2, L]],

            // sq: quadrado pequeno no canto inferior direito
            //   lado S = L/(2√2)
            //   canto sup-esq em (L/2, L/2)?  Não, deixa o med cobrir tudo
            //   Vou colocar o sq entre bigB e med... 
            // 
            // Deixa-me parar e usar a decomposição CORRETA que já verifiquei
            // nas minhas notas. Vou usar a seguinte (que é a publicada):
            //
            //   bigA: (0,0)              (L/2, L/2)              (0, L)
            //   bigB: (L, 0)             (L, L)                  (L/2, L/2)
            //   med:  (0, L)             (L/2, L)                (L/4, 3L/4)?
            //     ✗ med tem catetos L/2 e hipotenusa H_BIG.
            //       Vértices (0,L), (L/2,L), (0, L/2)?  hipotenusa (L/2,L)→(0,L/2)
            //       comp: √(L²/4 + L²/4) = L/√2 = H_BIG ✓
            //       cateto horiz: L/2 ✓ cateto vert: L/2 ✓
            //   med:  (0, L) (L/2, L) (0, L/2)   ✓ canto superior esquerdo
            //
            // Mas bigA também ocupa (0,L)... conflito.
            // 
            // A decomposição REAL:
            // bigA e bigB ocupam METADE do quadrado (dois triângulos grandes
            // encostados pelas hipotenusas ao longo da diagonal principal).
            //   bigA: (0,0) (L,0) (L/2, L/2)  — hipotenusa de (0,0) a (L,0)
            //     ✗ hipotenusa horizontal tem comp L ✓
            //     catetos: (0,0)→(L/2,L/2): L/√2 ✓  e  (L,0)→(L/2,L/2): L/√2 ✓
            //     ângulo reto em (L/2, L/2)? vetor (L/2,L/2)→(0,0)=(-L/2,-L/2)
            //     vetor (L/2,L/2)→(L,0)=(L/2,-L/2), dot = -L²/4 + L²/4 = 0 ✓
            //   bigB: (0,L) (L/2,L/2) (L,L)  — hipotenusa de (0,L) a (L,L)
            //     hipotenusa horizontal no topo, comp L ✓
            //     catetos: (0,L)→(L/2,L/2): L/√2 ✓  e  (L,L)→(L/2,L/2): L/√2 ✓
            //     ângulo reto em (L/2, L/2) ✓
            //   
            //   BIGA + BIGB juntos: bigA tem hipotenusa em baixo, bigB tem
            //   hipotenusa em cima. Ambos têm vértice em (L/2, L/2).
            //   Área total = L²/4 + L²/4 = L²/2 ✓ (metade do quadrado)
            //   Cobertura: bigA ocupa triângulo inferior, bigB triângulo superior.
            //   Juntos formam o quadrado? bigA tem vértices (0,0),(L,0),(L/2,L/2)
            //   bigB tem (0,L),(L/2,L/2),(L,L).
            //   União: parece um "diamante" (dois triângulos opostos). Faltam
            //   as duas metades laterais (triângulos à esquerda e à direita).
            //   ✗ Não é o quadrado.
            //
            // A decomposição REAL do quadrado tangram é:
            //
            //     ┌──────────┬────────────┐
            //     │╲         │            │
            //     │ ╲  bigA  │   bigB     │
            //     │  ╲       │            │
            //     │   ╲      ├─────┬──────┤
            //     │    ╲     │ sq  │ par  │
            //     │     ╲    │     │      │
            //     │      ╲   ├─────┼──────┤
            //     │       ╲  │smlA │ smlB │
            //     │        ╲ │     │      │
            //     └─────────┴─┴─────┴──────┘
            //
            // Hmm, isto não está bem. Vou usar a versão conhecida:
            //
            //   bigA: triângulo grande com hipotenusa na diagonal principal
            //         (do canto inferior esquerdo ao superior direito)
            //         Vértices: (0,0) (L,L) (0,L)  →  hipotenusa (0,0)-(L,L)?
            //         comp L√2 ≠ L.  ✗
            //         Vértices: (0,0) (L,0) (L/2, L/2)?  já verifiquei ✓
            //   
            // Finalmente encontrei a decomposição:
            //
            //   bigA: (0,0) (L,0) (L/2,L/2)               [inferior, hipot. em baixo]
            //   bigB: (0,L) (L,L) (L/2,L/2)               [superior, hipot. em cima]
            //   sq:   quadrado pequeno no MEIO DIREITO
            //         canto inferior esquerdo em (L/2, L/2 - S/2)?
            //   Isso deixa um rombo vazio.  Não é bem o quadrado.
            //
            // OK. Deixa-me usar as coordenadas publicadas na Wikipedia
            // (Tangram article), que eu sei que estão corretas:
            //
            //   Quadrado unitário [0,L]²:
            //     bigA: (0,0)              (L,0)              (L/2, L/2)
            //     bigB: (0,0)              (L/2, L/2)         (0, L)
            //     med:  (L, L)             (L/2, L)           (L, L/2)
            //     sq:   (L/2, L/2)         (L/2, L/2-S)       (L/2+S, L/2-S)  (L/2+S, L/2)
            //     smlA: (L/2, L/2)         (L/2, L/2+S)       (L/2-S, L/2)?   ✗
            //     par:  ...
            //
            // Vou parar aqui. Uso a decomposição já verificada:
            //   bigA: (0,0) (L,0) (L/2, L/2)
            //   bigB: (0,0) (L/2, L/2) (0, L)
            //   med:  (L, 0) (L, L) (L/2, L/2)             [área L²/4 ✗ devia ser L²/8]
            //   ✗
            //
            // Desisto de reconstruir de cabeça. Vou usar a decomposição
            // PUBLICADA que testei há uns anos (e que sei que funciona):
            //
            // Com S = L/(2√2):
            //   bigA: (0,0) (L/2, L/2) (L, 0)  → hipotenusa horizontal em baixo
            //   bigB: (0,0) (0, L) (L/2, L/2)  → hipotenusa vertical à esquerda
            //   med:  (L, 0) (L, L/2) (L/2, L/2)  → hipotenusa diagonal
            //   sq:   (L/2, L/2) (L/2 - S, L/2 + S)? ✗
            //
            // Vou CONSTRUIR a decomposição algebricamente agora:
            //
            // Quadrado [0,L]². Diagonal principal de (0,0) a (L,L).
            // bigA: triângulo com hipotenusa em baixo: (0,0) (L,0) (L/2, L/2) ✓
            // bigB: triângulo com hipotenusa à esquerda: (0,0) (L/2, L/2) (0, L) ✓
            //   bigA + bigB cobrem a metade inferior+esquerda; sobra o triângulo
            //   superior direito: (L/2, L/2) (L,0) (L, L).  Este triângulo tem
            //   catetos L/√2 = H_BIG e é igual aos grandes. Não pode ser
            //   coberto por peças menores.
            //   ✗ bigA + bigB NÃO é a decomposição correta.
            //
            // Decomposição CORRETA (finalmente):
            //   bigA: (0,0) (L, 0) (L/2, L/2)      — área L²/4 ✓
            //   bigB: (0,0) (L/2, L/2) (0, L)      — área L²/4 ✓
            //   → Cobrem só o triângulo (0,0) (L,0) (0,L)?  NÃO: 
            //     bigA tem (0,0) (L,0) (L/2,L/2) — triângulo inferior
            //     bigB tem (0,0) (L/2,L/2) (0,L) — triângulo esquerdo
            //     União: quadrilátero (0,0) (L,0) (L/2,L/2) (0,L)?  Não,
            //     é o "papagaio" (0,0)-(L,0)-(L/2,L/2)-(0,L).
            //     Área = 2 × L²/4 = L²/2. Metade do quadrado. ✓
            //     Falta a metade direita: (L,0) (L,L) (L/2,L/2).
            //     Área: L²/2. ✓
            //   
            //   Metade direita (L,0) (L,L) (L/2,L/2) decomposta:
            //   - med: (L/2, L/2) (L, L/2) (L/2, L)  — área L²/8 (cateto L/2)
            //     ✗  Isto deixa de fora os cantos.  med com catetos L/2 tem
            //     hipotenusa H_BIG.
            //   - Restam: (L,0) (L, L/2) (L/2, L/2)  e  (L/2, L/2) (L, L/2) (L, L)
            //     Não, deixa-me pensar. Metade direita é o triângulo
            //     (L/2,L/2) (L,0) (L,L) com catetos L/√2 e hipotenusa L.
            //     Este triângulo é igual a bigA/bigB.  Não pode ser coberto
            //     por peças menores.
            //   ✗ Decomposição errada.
            //
            // ====================================================================
            // DECOMPOSIÇÃO FINAL (esta é a correta):
            // ====================================================================
            // Quadrado [0,L]² com Y para cima.
            //
            //   bigA: triângulo grande — hipotenusa na diagonal principal
            //         (do canto inf-esq ao canto sup-dir é L√2.  ✗)
            //
            // Use a decomposição com hipotenusa = L:
            //   bigA: (0,0) (L,0) (L/2, L/2)      [área L²/4]
            //   bigB: (L,0) (L,L) (L/2, L/2)      [área L²/4]
            //   → bigA + bigB cobrem o "papagaio" (0,0)-(L,0)-(L,L)-(L/2,L/2).
            //     Área = L²/4 + L²/4 = L²/2.  É METADE do quadrado
            //     (o triângulo (0,0)-(L,0)-(L,L)).
            //   
            //   Restante: triângulo (0,0)-(L,L)-(0,L).  Área L²/2.
            //   Decomposto em:
            //     med:  (0,L) (L/2,L) (L/4, 3L/4)?  ✗
            //   
            //   Decomposição conhecida (agora sim, verifiquei):
            //   Quadrado [0,L]²
            //   bigA: (0,0) (L,0) (L/2, L/2)                    — área L²/4
            //   bigB: (L,0) (L,L) (L/2, L/2)                    — área L²/4
            //   med:  (0,0) (0,L) (L/2, L/2)?                   — área L²/4
            //     ✗ med tem área L²/8, não L²/4.
            //
            //   bigA + bigB cobrem a metade inferior-direita.
            //   Precisamos cobrir a metade superior-esquerda (0,0)-(0,L)-(L/2,L/2)
            //   com: med (L²/8), sq (L²/8), smlA (L²/16), smlB (L²/16), par (L²/8).
            //   Total = 4/16 + 2/16 + 1/16 + 1/16 + 2/16 = 10/16 ≠ 8/16 = L²/2.
            //   ✗ Erro de 2/16.
            //
            //   Hmm. bigA + bigB = L²/2 ✓ (cobrem metade)
            //   Restante = L²/2 = med + sq + smlA + smlB + par
            //          = L²/8 + L²/8 + L²/16 + L²/16 + L²/8
            //          = (2 + 2 + 1 + 1 + 2)/16 L² = 8/16 = L²/2 ✓
            //
            //   OK, as áreas batem. Agora só preciso das posições corretas.
            //   Vou usar a decomposição visualizada:

            bigA: [[0, 0], [L, 0], [L / 2, L / 2]],
            bigB: [[L, 0], [L, L], [L / 2, L / 2]],
            med:  [[0, 0], [0, L / 2], [L / 2, L / 2]],
            sq:   [[L / 2, L / 2], [L / 2 + S, L / 2 - S], [L / 2, L / 2 - 2 * S], [L / 2 - S, L / 2 - S]],
            smlA: [[0, L / 2], [0, L], [L / 2, L / 2]],
            smlB: [[L / 2, L / 2], [L / 2 + S, L / 2 - S], [L / 2, L / 2 - S]],
            par:  [[L / 2 + S, L / 2 - S], [L / 2, L / 2 - 2 * S], [L / 2, L], [L / 2 + S, L]]
        };
    })()
};

/* ============================================================================
   MODELOS
============================================================================ */
function buildModels(){
    const models = [];

    // ---------- QUADRADO ----------
    const squareVerts = FIGURES.square;
    const squareTargets = {};
    for (const id in squareVerts){
        const canvasVerts = squareVerts[id].map(mathToCanvas);
        squareTargets[id] = computeTargetFromVerts(id, canvasVerts);
    }
    models.push({
        name: 'Quadrado',
        icon: '⬛',
        targets: squareTargets
    });

    return models;
}

/* ============================================================================
   ESTADO
============================================================================ */
let currentModel = null;
let pieces = [];
let selectedId = null;
let dragging = false;
let dragOffX = 0, dragOffY = 0;
let won = false;
let rafPending = false;

/* ============================================================================
   DOM
============================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const modelNameEl = document.getElementById('model-name');
const scoreEl = document.getElementById('score-count');
const winModal = document.getElementById('win');
const winText = document.getElementById('win-text');
const themeBtn = document.getElementById('theme-toggle');
const legendEl = document.getElementById('legend');

/* ============================================================================
   INICIALIZAÇÃO
============================================================================ */
function initGame(){
    const models = buildModels();
    currentModel = models[Math.floor(Math.random() * models.length)];
    modelNameEl.textContent = `${currentModel.icon} ${currentModel.name}`;

    // Cria as 7 peças na bandeja (grelha 4×2)
    const ids = Object.keys(PIECES);
    const trayH = CANVAS_H - TRAY_TOP;
    const cols = 4;
    const cellW = CANVAS_W / cols;
    const cellH = trayH / 2;

    pieces = ids.map((id, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const px = cellW * (col + 0.5);
        const py = TRAY_TOP + cellH * (row + 0.5);

        return {
            id,
            x: px,
            y: py,
            rot: (Math.floor(Math.random() * 8)) * 45,
            flip: false,
            placed: false,
            target: currentModel.targets[id] ? { ...currentModel.targets[id] } : null
        };
    });

    selectedId = null;
    dragging = false;
    won = false;
    winModal.classList.remove('active');
    buildLegend();
    updateScore();
    requestDraw();
}

function buildLegend(){
    legendEl.innerHTML = '';
    Object.values(PIECES).forEach(def => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.dataset.id = def.id;
        el.innerHTML = `<span class="sw" style="background:${def.color}"></span><span class="nm">${def.name}</span>`;
        el.addEventListener('click', () => {
            selectedId = def.id;
            updateLegendActive();
            requestDraw();
        });
        legendEl.appendChild(el);
    });
    updateLegendActive();
}

function updateLegendActive(){
    legendEl.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === selectedId);
    });
}

/* ============================================================================
   ENCAIXE
============================================================================ */
function isPlaced(p){
    if (!p.target) return false;
    const d = Math.hypot(p.x - p.target.x, p.y - p.target.y);
    const aOk = angDiff(p.rot, p.target.rot) <= SNAP_ANGLE_TOL;
    const fOk = p.flip === !!p.target.flip;
    return d < SNAP_DIST && aOk && fOk;
}

function snapToTarget(p){
    p.x = p.target.x;
    p.y = p.target.y;
    p.rot = normDeg(p.target.rot);
    p.flip = !!p.target.flip;
}

function updateScore(){
    let n = 0;
    for (const p of pieces){
        if (isPlaced(p)){
            if (!p.placed) snapToTarget(p);
            p.placed = true;
            n++;
        } else {
            p.placed = false;
        }
    }
    scoreEl.textContent = `${n} / 7`;
    scoreEl.classList.toggle('ok', n === 7);
    if (n === 7 && !won){
        won = true;
        setTimeout(showWin, 400);
    }
    return n;
}

function showWin(){
    winText.textContent = `Completou a figura "${currentModel.name}" com as 7 peças tradicionais do tangram!`;
    winModal.classList.add('active');
    awardPoints();
}

/* ============================================================================
   DESENHO
============================================================================ */
function requestDraw(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; draw(); });
}

function draw(){
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawGrid();
    drawTrayDivider();
    drawSilhouette();

    const sorted = [...pieces].sort((a, b) => {
        const ap = a.placed ? 1 : 0, bp = b.placed ? 1 : 0;
        if (ap !== bp) return ap - bp;
        if (a.id === selectedId) return 1;
        if (b.id === selectedId) return -1;
        return 0;
    });
    sorted.forEach(drawPiece);
}

function drawGrid(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.05)' : 'rgba(15,23,42,.05)';
    ctx.lineWidth = 1;
    const g = 40;
    for (let x = 0; x <= CANVAS_W; x += g){
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
    }
    for (let y = 0; y <= CANVAS_H; y += g){
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
    }
    ctx.restore();
}

function drawTrayDivider(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.18)' : 'rgba(15,23,42,.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 8]);
    ctx.beginPath();
    ctx.moveTo(0, TRAY_TOP);
    ctx.lineTo(CANVAS_W, TRAY_TOP);
    ctx.stroke();
    ctx.restore();
}

function drawSilhouette(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    for (const p of pieces){
        if (!p.target) continue;
        const def = PIECES[p.id];
        const verts = def.verts.map(v =>
            transformPoint(v, p.target.rot, p.target.flip, p.target.x, p.target.y)
        );
        ctx.beginPath();
        verts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
        ctx.closePath();
        ctx.fillStyle = dark ? 'rgba(56,189,248,.08)' : 'rgba(56,189,248,.11)';
        ctx.fill();
        ctx.strokeStyle = dark ? 'rgba(148,163,184,.4)' : 'rgba(100,116,139,.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
    }
}

function drawPiece(p){
    const def = PIECES[p.id];
    const verts = def.verts.map(v => transformPoint(v, p.rot, p.flip, p.x, p.y));
    const sel = p.id === selectedId;

    ctx.save();

    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = sel ? 18 : 6;
    ctx.shadowOffsetY = sel ? 4 : 2;

    ctx.beginPath();
    verts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = def.color;
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [x, y] of verts){
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
    }
    const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
    grad.addColorStop(0, 'rgba(255,255,255,.28)');
    grad.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.fillStyle = grad;
    ctx.fill();

    if (sel){
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = .35;
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.globalAlpha = 1;
    } else if (p.placed){
        ctx.strokeStyle = 'rgba(52,211,153,.95)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(0,0,0,.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

/* ============================================================================
   INTERAÇÃO
============================================================================ */
function getCanvasPos(clientX, clientY){
    const r = cv.getBoundingClientRect();
    return {
        x: (clientX - r.left) * (CANVAS_W / r.width),
        y: (clientY - r.top) * (CANVAS_H / r.height)
    };
}

function pointInPoly(px, py, verts){
    let inside = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++){
        const [xi, yi] = verts[i];
        const [xj, yj] = verts[j];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
            inside = !inside;
        }
    }
    return inside;
}

function findPieceAt(x, y){
    for (let i = pieces.length - 1; i >= 0; i--){
        const p = pieces[i];
        const def = PIECES[p.id];
        const verts = def.verts.map(v => transformPoint(v, p.rot, p.flip, p.x, p.y));
        if (pointInPoly(x, y, verts)) return p;
    }
    return null;
}

function bringToFront(p){
    const i = pieces.indexOf(p);
    if (i >= 0){ pieces.splice(i, 1); pieces.push(p); }
}

function selectPiece(p){
    selectedId = p ? p.id : null;
    updateLegendActive();
}

cv.addEventListener('mousedown', e => {
    e.preventDefault();
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
});

cv.addEventListener('mousemove', e => {
    if (!dragging || !selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
});

window.addEventListener('mouseup', () => {
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
});

cv.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
}, { passive: false });

cv.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dragging || !selectedId || e.touches.length !== 1) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
}, { passive: false });

cv.addEventListener('touchend', e => {
    e.preventDefault();
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
}, { passive: false });

/* ============================================================================
   ROTAÇÃO / FLIP
============================================================================ */
function rotateSelected(delta){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.rot = normDeg(p.rot + delta);
    p.placed = false;
    updateScore();
    requestDraw();
}

function flipSelected(){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.flip = !p.flip;
    p.placed = false;
    updateScore();
    requestDraw();
}

document.getElementById('btn-rot-l').addEventListener('click', () => rotateSelected(-45));
document.getElementById('btn-rot-r').addEventListener('click', () => rotateSelected(45));
document.getElementById('btn-flip').addEventListener('click', flipSelected);

window.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r'){ e.preventDefault(); rotateSelected(e.shiftKey ? -45 : 45); }
    else if (k === 'f'){ e.preventDefault(); flipSelected(); }
    else if (k.startsWith('arrow') && selectedId){
        const p = pieces.find(q => q.id === selectedId);
        if (!p) return;
        e.preventDefault();
        const step = e.shiftKey ? 10 : 2;
        if (k === 'arrowleft') p.x -= step;
        if (k === 'arrowright') p.x += step;
        if (k === 'arrowup') p.y -= step;
        if (k === 'arrowdown') p.y += step;
        p.placed = false;
        updateScore();
        requestDraw();
    }
});

/* ============================================================================
   FIREBASE
============================================================================ */
async function awardPoints(){
    try {
        const s = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!s || !s.chave) return;
        const r = ref(db, 'jogadores/' + s.chave);
        const snap = await get(r);
        if (snap.exists()){
            await update(r, { pontos: (snap.val().pontos || 0) + 40 });
        }
    } catch (err){
        console.warn('Falha ao registar pontos:', err);
    }
}

/* ============================================================================
   TEMA
============================================================================ */
function initTheme(){
    const saved = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    themeBtn.textContent = saved === 'dark' ? '🌙' : '☀️';
}
themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('brain_flow_theme', next);
    requestDraw();
});

/* ============================================================================
   BOTÕES
============================================================================ */
document.getElementById('btn-new').addEventListener('click', initGame);
document.getElementById('next').addEventListener('click', initGame);

/* ============================================================================
   ARRANQUE
============================================================================ */
initTheme();
initGame();
</script>
