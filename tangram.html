<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tangram Geométrico · Brain Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== DESIGN TOKENS ===== */
        :root {
            --bg-color: #070b14;
            --bg-gradient-1: #1a1f3a;
            --bg-gradient-2: #070b14;
            --card-bg: rgba(18, 24, 40, 0.92);
            --card-border: rgba(148, 163, 184, 0.12);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-color: rgba(148, 163, 184, 0.15);
            --input-bg: rgba(10, 15, 28, 0.7);
            --accent-1: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #c084fc;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f43f5e;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.75);
            --shadow-glow: 0 0 40px -10px rgba(56, 189, 248, 0.3);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --text-muted: #475569;
            --text-dim: #94a3b8;
            --border-color: rgba(15, 23, 42, 0.1);
            --input-bg: rgba(241, 245, 249, 0.8);
            --shadow-card: 0 20px 60px -20px rgba(15, 23, 42, 0.15);
        }
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: radial-gradient(ellipse at 50% -20%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 60%);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition-smooth), color var(--transition-smooth);
        }
        /* ===== LAYOUT ===== */
        .game-container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            padding: 16px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 520px;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 98vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }
        .game-container::-webkit-scrollbar { width: 4px; }
        .game-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .top-bar .title-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-color);
        }
        .top-bar .title-group .icon {
            font-size: 16px;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: all var(--transition-smooth);
            text-decoration: none;
            flex-shrink: 0;
            user-select: none;
        }
        .btn-icon:hover {
            color: var(--text-color);
            border-color: var(--accent-1);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -4px rgba(56, 189, 248, 0.2);
        }
        .btn-icon:active { transform: translateY(0) scale(0.96); }
        /* ===== HEADER ===== */
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }
        .header .subtitle {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        /* ===== HUD ===== */
        .hud {
            display: flex;
            gap: 8px;
        }
        .hud-card {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hud-card .label {
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--text-dim);
        }
        .hud-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-1);
        }
        .hud-card .value.success { color: var(--success); }
        /* ===== CANVAS ===== */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 40px -20px rgba(0, 0, 0, 0.5);
        }
        .canvas-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-md);
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }
        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all var(--transition-smooth);
            user-select: none;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
            color: white;
            box-shadow: 0 4px 16px -4px rgba(129, 140, 248, 0.5);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px -4px rgba(129, 140, 248, 0.7);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            border-color: var(--accent-1);
            color: var(--accent-1);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        /* ===== HINT ===== */
        .hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            padding: 6px 10px;
            background: var(--input-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }
        .hint kbd {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 4px;
            background: var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
        }
        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            padding: 28px 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--card-border);
            text-align: center;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-content .emoji {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            animation: bounce 0.6s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .modal-content h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 8px;
        }
        .modal-content p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-content .btn { width: 100%; }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .game-container { padding: 12px; gap: 8px; }
            .header h1 { font-size: 18px; }
            .header .subtitle { font-size: 10.5px; }
            .btn { padding: 8px 12px; font-size: 11.5px; }
            .hud-card .value { font-size: 12px; }
        }
        @media (max-height: 700px) {
            .header .subtitle { display: none; }
            .game-container { gap: 7px; }
        }
        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="game-container" role="main">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="index.html" class="btn-icon" title="Voltar ao início" aria-label="Voltar">←</a>
            <div class="title-group">
                <span class="icon">📐</span>
                <span>Tangram Geométrico</span>
            </div>
            <button id="theme-toggle" class="btn-icon" title="Alternar tema" aria-label="Alternar tema">🌙</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1>Tangram Geométrico</h1>
            <p class="subtitle">Arraste e rotacione as peças para preencher a silhueta pontilhada</p>
        </header>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-card">
                <span class="label">Desafio</span>
                <span class="value" id="model-name">—</span>
            </div>
            <div class="hud-card">
                <span class="label">Encaixes</span>
                <span class="value" id="score-count">0 / 7</span>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="tangramCanvas" width="800" height="600" aria-label="Área de jogo do tangram"></canvas>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn btn-secondary" id="btn-rotate" title="Rodar peça 90°">
                🔄 Rodar 90°
            </button>
            <button class="btn btn-primary" id="btn-novo" title="Novo modelo">
                🎲 Novo Modelo
            </button>
        </div>

        <!-- Hint -->
        <div class="hint">
            💡 Clique para selecionar · Arraste para mover · <kbd>R</kbd> para rodar
        </div>
    </main>

    <!-- Modal de Vitória -->
    <div class="modal" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div class="modal-content">
            <span class="emoji">🎉</span>
            <h2 id="win-title">Excelente!</h2>
            <p id="win-text"></p>
            <button class="btn btn-primary" id="next-game-btn">Próximo Desafio →</button>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ============================================================
           CONSTANTES E ESTADO
           ============================================================ */
        const PIECE_SIZE = 56;
        const SNAP_DISTANCE = 30;
        const SNAP_ANGLE_TOLERANCE = 15;
        const TOTAL_PIECES = 7;
        const CANVAS_W = 800;
        const CANVAS_H = 600;

        const COLORS = ['#f43f5e', '#fb923c', '#facc15', '#34d399', '#38bdf8', '#818cf8', '#c084fc'];

        const MODELS = [
            {
                name: "Casa Estilizada",
                icon: "🏠",
                targets: [
                    { x: 400, y: 300, rot: 0 },
                    { x: 300, y: 360, rot: 90 },
                    { x: 500, y: 360, rot: 180 },
                    { x: 400, y: 440, rot: 270 },
                    { x: 340, y: 240, rot: 45 },
                    { x: 460, y: 240, rot: 135 },
                    { x: 400, y: 180, rot: 0 }
                ]
            },
            {
                name: "Pinheiro Clássico",
                icon: "🌲",
                targets: [
                    { x: 400, y: 480, rot: 0 },
                    { x: 400, y: 380, rot: 90 },
                    { x: 400, y: 280, rot: 0 },
                    { x: 340, y: 420, rot: 180 },
                    { x: 460, y: 420, rot: 270 },
                    { x: 340, y: 320, rot: 45 },
                    { x: 460, y: 320, rot: 135 }
                ]
            },
            {
                name: "Barco à Vela",
                icon: "⛵",
                targets: [
                    { x: 400, y: 420, rot: 0 },
                    { x: 280, y: 420, rot: 90 },
                    { x: 520, y: 420, rot: 180 },
                    { x: 400, y: 280, rot: 0 },
                    { x: 360, y: 340, rot: 90 },
                    { x: 440, y: 340, rot: 270 },
                    { x: 400, y: 200, rot: 45 }
                ]
            },
            {
                name: "Estrela Geométrica",
                icon: "⭐",
                targets: [
                    { x: 400, y: 300, rot: 0 },
                    { x: 300, y: 300, rot: 45 },
                    { x: 500, y: 300, rot: 135 },
                    { x: 400, y: 200, rot: 90 },
                    { x: 400, y: 400, rot: 270 },
                    { x: 330, y: 370, rot: 180 },
                    { x: 470, y: 230, rot: 0 }
                ]
            },
            {
                name: "Peixe Tropical",
                icon: "🐟",
                targets: [
                    { x: 400, y: 300, rot: 0 },
                    { x: 300, y: 300, rot: 90 },
                    { x: 500, y: 300, rot: 270 },
                    { x: 400, y: 220, rot: 45 },
                    { x: 400, y: 380, rot: 135 },
                    { x: 330, y: 240, rot: 180 },
                    { x: 470, y: 360, rot: 0 }
                ]
            }
        ];

        /* ============================================================
           ESTADO
           ============================================================ */
        let currentModel = null;
        let pieces = [];
        let selectedPieceId = null;
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let gameWon = false;
        let rafPending = false;

        /* ============================================================
           DOM REFS
           ============================================================ */
        const canvas = document.getElementById('tangramCanvas');
        const ctx = canvas.getContext('2d');
        const modelNameEl = document.getElementById('model-name');
        const scoreCountEl = document.getElementById('score-count');
        const winModal = document.getElementById('win-modal');
        const winText = document.getElementById('win-text');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const btnRotate = document.getElementById('btn-rotate');
        const btnNovo = document.getElementById('btn-novo');
        const nextGameBtn = document.getElementById('next-game-btn');

        /* ============================================================
           UTILITÁRIOS
           ============================================================ */
        const normalizeAngle = (a) => ((a % 360) + 360) % 360;

        const angleDiff = (a, b) => {
            const d = Math.abs(normalizeAngle(a) - normalizeAngle(b));
            return Math.min(d, 360 - d);
        };

        const getPieceById = (id) => pieces.find(p => p.id === id);

        const getCanvasCoords = (clientX, clientY) => {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        };

        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */
        function initTheme() {
            const saved = localStorage.getItem('brain_flow_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            themeToggleBtn.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggleBtn.textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('brain_flow_theme', next);
        });

        function initGame() {
            const model = MODELS[Math.floor(Math.random() * MODELS.length)];
            currentModel = model;
            modelNameEl.textContent = `${model.icon} ${model.name}`;

            // Posiciona peças fora da silhueta, numa zona de "banco de peças"
            const shuffledColors = shuffle(COLORS);
            pieces = model.targets.map((target, idx) => {
                // Distribui as peças em leque na parte inferior
                const cols = 4;
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const spacingX = CANVAS_W / (cols + 1);
                const startX = spacingX;
                const startY = CANVAS_H - 120 + row * 70;

                return {
                    id: idx,
                    x: startX + col * spacingX,
                    y: startY,
                    rot: Math.floor(Math.random() * 4) * 90,
                    color: shuffledColors[idx],
                    targetX: target.x,
                    targetY: target.y,
                    targetRot: target.rot,
                    size: PIECE_SIZE,
                    placed: false
                };
            });

            selectedPieceId = null;
            isDragging = false;
            gameWon = false;
            winModal.classList.remove('active');
            updateScore();
            requestDraw();
        }

        /* ============================================================
           LÓGICA DE ENCAIXE
           ============================================================ */
        function checkPiecePlacement(piece) {
            const dist = Math.hypot(piece.x - piece.targetX, piece.y - piece.targetY);
            const angleOk = angleDiff(piece.rot, piece.targetRot) <= SNAP_ANGLE_TOLERANCE;
            return dist < SNAP_DISTANCE && angleOk;
        }

        function snapPiece(piece) {
            piece.x = piece.targetX;
            piece.y = piece.targetY;
            piece.rot = piece.targetRot;
        }

        function updateScore() {
            let placed = 0;
            pieces.forEach(p => {
                if (checkPiecePlacement(p)) placed++;
            });
            scoreCountEl.textContent = `${placed} / ${TOTAL_PIECES}`;
            scoreCountEl.classList.toggle('success', placed === TOTAL_PIECES);
            return placed;
        }

        function verificarEncaixes() {
            // Aplica snap em peças que estão próximas e com ângulo correto
            let changed = false;
            pieces.forEach(p => {
                if (!p.placed && checkPiecePlacement(p)) {
                    snapPiece(p);
                    p.placed = true;
                    changed = true;
                } else if (p.placed && !checkPiecePlacement(p)) {
                    p.placed = false;
                    changed = true;
                }
            });

            const placed = updateScore();
            if (placed === TOTAL_PIECES && !gameWon) {
                gameWon = true;
                setTimeout(() => mostrarVitoria(), 400);
            }
            return changed;
        }

        function mostrarVitoria() {
            winText.textContent = `Completou o modelo "${currentModel.name}" com precisão geométrica perfeita!`;
            winModal.classList.add('active');
            atribuirPontos();
        }

        /* ============================================================
           RENDERIZAÇÃO
           ============================================================ */
        function requestDraw() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                rafPending = false;
                desenhar();
            });
        }

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenha fundo subtil com grid
            drawBackground();

            // Desenha silhueta alvo
            drawTargetSilhouette();

            // Desenha peças (não colocadas primeiro, depois as colocadas, depois a selecionada)
            const sorted = [...pieces].sort((a, b) => {
                if (a.placed !== b.placed) return a.placed ? -1 : 1;
                if (selectedPieceId === a.id) return 1;
                if (selectedPieceId === b.id) return -1;
                return 0;
            });

            sorted.forEach(p => drawPiece(p));
        }

        function drawBackground() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            ctx.save();
            ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.04)' : 'rgba(15, 23, 42, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawTargetSilhouette() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            ctx.save();
            currentModel.targets.forEach(target => {
                ctx.save();
                ctx.translate(target.x, target.y);
                ctx.rotate((target.rot * Math.PI) / 180);

                // Preenchimento muito subtil
                ctx.fillStyle = isDark ? 'rgba(56, 189, 248, 0.04)' : 'rgba(56, 189, 248, 0.06)';
                ctx.fillRect(-PIECE_SIZE / 2, -PIECE_SIZE / 2, PIECE_SIZE, PIECE_SIZE);

                // Borda pontilhada
                ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.3)' : 'rgba(100, 116, 139, 0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.strokeRect(-PIECE_SIZE / 2, -PIECE_SIZE / 2, PIECE_SIZE, PIECE_SIZE);

                ctx.restore();
            });
            ctx.restore();
        }

        function drawPiece(piece) {
            const isSelected = selectedPieceId === piece.id;
            const isPlaced = piece.placed;

            ctx.save();
            ctx.translate(piece.x, piece.y);
            ctx.rotate((piece.rot * Math.PI) / 180);

            // Sombra
            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = isSelected ? 16 : 8;
            ctx.shadowOffsetY = isSelected ? 4 : 2;

            // Corpo
            ctx.fillStyle = piece.color;
            ctx.beginPath();
            roundRect(ctx, -piece.size / 2, -piece.size / 2, piece.size, piece.size, 6);
            ctx.fill();

            // Reset shadow para detalhes
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // Gradiente interno subtil
            const grad = ctx.createLinearGradient(-piece.size / 2, -piece.size / 2, piece.size / 2, piece.size / 2);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            roundRect(ctx, -piece.size / 2, -piece.size / 2, piece.size, piece.size, 6);
            ctx.fill();

            // Borda
            if (isSelected) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                roundRect(ctx, -piece.size / 2, -piece.size / 2, piece.size, piece.size, 6);
                ctx.stroke();

                // Glow externo
                ctx.strokeStyle = piece.color;
                ctx.lineWidth = 6;
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                roundRect(ctx, -piece.size / 2 - 2, -piece.size / 2 - 2, piece.size + 4, piece.size + 4, 8);
                ctx.stroke();
                ctx.globalAlpha = 1;
            } else if (isPlaced) {
                ctx.strokeStyle = 'rgba(52, 211, 153, 0.9)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                roundRect(ctx, -piece.size / 2, -piece.size / 2, piece.size, piece.size, 6);
                ctx.stroke();
            } else {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                roundRect(ctx, -piece.size / 2, -piece.size / 2, piece.size, piece.size, 6);
                ctx.stroke();
            }

            ctx.restore();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
        }

        /* ============================================================
           INTERAÇÃO — MOUSE
           ============================================================ */
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const { x, y } = getCanvasCoords(e.clientX, e.clientY);

            // Procura peça clicada (de cima para baixo)
            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (p.placed && p.id !== selectedPieceId) continue;
                const half = p.size / 2 + 4;
                if (Math.abs(x - p.x) < half && Math.abs(y - p.y) < half) {
                    selectedPieceId = p.id;
                    isDragging = true;
                    dragOffsetX = x - p.x;
                    dragOffsetY = y - p.y;
                    // Traz para frente
                    pieces.splice(i, 1);
                    pieces.push(p);
                    requestDraw();
                    return;
                }
            }
            // Clicou no vazio — desseleciona
            selectedPieceId = null;
            requestDraw();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || selectedPieceId === null) return;
            const piece = getPieceById(selectedPieceId);
            if (!piece) return;

            const { x, y } = getCanvasCoords(e.clientX, e.clientY);
            piece.x = x - dragOffsetX;
            piece.y = y - dragOffsetY;

            // Se estava colocada e saiu do lugar, desmarca
            if (piece.placed && !checkPiecePlacement(piece)) {
                piece.placed = false;
                updateScore();
            }

            requestDraw();
        });
