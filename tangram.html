<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tangram Tradicional · Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg-1:#1a1f3a; --bg-2:#070b14;
    --card-bg:rgba(18,24,40,.92); --card-border:rgba(148,163,184,.12);
    --text:#f1f5f9; --text-muted:#94a3b8; --text-dim:#64748b;
    --border:rgba(148,163,184,.15); --input-bg:rgba(10,15,28,.7);
    --accent-1:#38bdf8; --accent-2:#818cf8; --accent-3:#c084fc;
    --success:#34d399; --warning:#fbbf24;
    --r-sm:8px; --r-md:14px; --r-lg:22px;
    --shadow:0 20px 60px -20px rgba(0,0,0,.75);
    --ease:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
    --bg-1:#e0e7ff; --bg-2:#f8fafc;
    --card-bg:rgba(255,255,255,.92); --card-border:rgba(15,23,42,.08);
    --text:#0f172a; --text-muted:#475569; --text-dim:#94a3b8;
    --border:rgba(15,23,42,.1); --input-bg:rgba(241,245,249,.8);
    --shadow:0 20px 60px -20px rgba(15,23,42,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% -20%,var(--bg-1) 0%,var(--bg-2) 60%);
    background-attachment:fixed;color:var(--text);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:10px;-webkit-font-smoothing:antialiased;
    transition:background var(--ease),color var(--ease);
}
.game{
    background:var(--card-bg);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    padding:16px;border-radius:var(--r-lg);box-shadow:var(--shadow);
    width:100%;max-width:560px;border:1px solid var(--card-border);
    display:flex;flex-direction:column;gap:10px;
    max-height:98vh;overflow-y:auto;scrollbar-width:thin;
}
.game::-webkit-scrollbar{width:4px}
.game::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.icon-btn{
    width:32px;height:32px;border-radius:var(--r-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--input-bg);border:1px solid var(--border);
    color:var(--text-muted);cursor:pointer;font-size:14px;
    transition:all var(--ease);text-decoration:none;flex-shrink:0;
    user-select:none;font-family:inherit;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent-1);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.96)}
.header{text-align:center}
.header h1{
    font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:2px;
}
.header p{font-size:11.5px;color:var(--text-muted);line-height:1.4}
.hud{display:flex;gap:8px}
.hud-card{
    flex:1;background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);padding:8px 10px;
    display:flex;flex-direction:column;gap:2px;
}
.hud-card .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-dim)}
.hud-card .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent-1)}
.hud-card .val.ok{color:var(--success)}
.canvas-wrap{
    position:relative;width:100%;aspect-ratio:4/3;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-md);overflow:hidden;
    display:flex;justify-content:center;align-items:center;
    box-shadow:inset 0 0 40px -20px rgba(0,0,0,.5);
}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.toolbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 14px;border-radius:var(--r-sm);
    font-size:12px;font-weight:700;font-family:inherit;border:none;
    cursor:pointer;transition:all var(--ease);user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{
    background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
    color:#fff;box-shadow:0 4px 16px -4px rgba(129,140,248,.5);
}
.btn-primary:hover{box-shadow:0 6px 24px -4px rgba(129,140,248,.7);transform:translateY(-1px)}
.btn-ghost{background:var(--input-bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent-1);color:var(--accent-1)}
.hint{
    text-align:center;font-size:11px;color:var(--text-dim);
    padding:6px 10px;background:var(--input-bg);
    border-radius:var(--r-sm);border:1px solid var(--border);line-height:1.5;
}
.hint kbd{
    display:inline-block;padding:1px 5px;border-radius:4px;
    background:var(--border);font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;color:var(--text-muted);
}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.legend-item{
    display:flex;align-items:center;gap:5px;padding:5px 6px;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);transition:all var(--ease);cursor:pointer;
}
.legend-item:hover{border-color:var(--accent-1)}
.legend-item.active{border-color:var(--accent-1);background:rgba(56,189,248,.12)}
.legend-item .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.legend-item .nm{font-weight:600;color:var(--text);font-size:9.5px;line-height:1.1}
.modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    justify-content:center;align-items:center;z-index:1000;padding:20px;
    animation:fadeIn .25s ease;
}
.modal.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-content{
    background:var(--card-bg);backdrop-filter:blur(24px);
    padding:28px 24px;border-radius:var(--r-lg);
    border:1px solid var(--card-border);text-align:center;
    max-width:340px;width:100%;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    animation:slideUp .35s cubic-bezier(.16,1,.3,1);
}
.modal-content .emo{font-size:48px;display:block;margin-bottom:8px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.modal-content h2{font-size:20px;font-weight:800;color:var(--success);margin-bottom:8px}
.modal-content p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:20px}
.modal-content .btn{width:100%}
@media (max-width:420px){
    .game{padding:12px;gap:8px}
    .header h1{font-size:18px}
    .header p{font-size:10.5px}
    .btn{padding:8px 11px;font-size:11px}
    .legend{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:720px){
    .header p{display:none}
    .game{gap:7px}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="game" role="main">
    <div class="topbar">
        <a href="index.html" class="icon-btn" title="Voltar" aria-label="Voltar">←</a>
        <div class="brand"><span>📐</span><span>Tangram Tradicional</span></div>
        <button id="theme-toggle" class="icon-btn" title="Tema" aria-label="Alternar tema">🌙</button>
    </div>

    <header class="header">
        <h1>Tangram Tradicional</h1>
        <p>Reconstrua a silhueta usando as 7 peças clássicas chinesas</p>
    </header>

    <div class="hud">
        <div class="hud-card"><span class="lbl">Desafio</span><span class="val" id="model-name">—</span></div>

    </div>

    <div class="canvas-wrap">
        <canvas id="cv" width="800" height="600" aria-label="Área de jogo do tangram"></canvas>
    </div>

    <div class="toolbar">
        <button class="btn btn-ghost" id="btn-rot-l" title="Rodar 15° anti-horário">↺ 15°</button>
        <button class="btn btn-ghost" id="btn-rot-r" title="Rodar 15° horário">↻ 15°</button>
        <button class="btn btn-ghost" id="btn-flip" title="Espelhar peça">↔ Espelhar</button>
        <button class="btn btn-primary" id="btn-new" title="Novo modelo">🎲 Novo</button>

        <button class="btn btn-primary" id="next">Próximo Desafio →</button>
    </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* ============================================================================
   UTILITÁRIOS — definidos ANTES de qualquer uso
============================================================================ */
const normDeg = a => ((a % 360) + 360) % 360;

function angDiff(a, b){
    const d = Math.abs(normDeg(a) - normDeg(b));
    return Math.min(d, 360 - d);
}

function centroid(pts){
    let x = 0, y = 0;
    for (const [px, py] of pts){ x += px; y += py; }
    return [x / pts.length, y / pts.length];
}

function centeredVerts(pts){
    const [cx, cy] = centroid(pts);
    return pts.map(([x, y]) => [x - cx, y - cy]);
}

function transformPoint([x, y], rot, flip, tx, ty){
    if (flip) x = -x;
    const rad = rot * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    return [tx + x * c - y * s, ty + x * s + y * c];
}

function pointInPoly(px, py, verts){
    let inside = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++){
        const [xi, yi] = verts[i];
        const [xj, yj] = verts[j];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
            inside = !inside;
        }
    }
    return inside;
}

/* ============================================================================
   GEOMETRIA DO TANGRAM
============================================================================ */
const CANVAS_W = 800;
const CANVAS_H = 600;
const L = 280;                        // lado do quadrado de referência
const H_BIG = L / Math.SQRT2;         // altura do triângulo grande
const S_SMALL = L / (2 * Math.SQRT2); // lado do quadrado pequeno

const TRAY_TOP = CANVAS_H - 110;      // fronteira da bandeja
const GAME_TOP = 20;
const GAME_BOTTOM = TRAY_TOP - 15;
const GAME_LEFT = 30;
const GAME_RIGHT = CANVAS_W - 30;
const GAME_CX = CANVAS_W / 2;
const GAME_CY = (GAME_TOP + GAME_BOTTOM) / 2;

const SNAP_DIST = 22;
const SNAP_ANGLE_TOL = 12;

/* ============================================================================
   DEFINIÇÃO DAS 7 PEÇAS
   Arestas por peça:
     big:  [0]=hipotenusa  [1]=cateto  [2]=cateto
     med:  [0]=cateto      [1]=hipotenusa  [2]=cateto
     sml:  [0]=cateto      [1]=hipotenusa  [2]=cateto
     sq:   [0]=baixo  [1]=direita  [2]=cima  [3]=esquerda
     par:  [0]=longo baixo  [1]=curto dir  [2]=longo cima  [3]=curto esq
============================================================================ */
const PIECES = (() => {
    const big = centeredVerts([[0, 0], [L, 0], [L / 2, -H_BIG]]);
    const med = centeredVerts([[0, 0], [L / 2, 0], [0, -L / 2]]);
    const sml = centeredVerts([[0, 0], [S_SMALL, 0], [0, -S_SMALL]]);

    const sq = [
        [-S_SMALL / 2, -S_SMALL / 2],
        [ S_SMALL / 2, -S_SMALL / 2],
        [ S_SMALL / 2,  S_SMALL / 2],
        [-S_SMALL / 2,  S_SMALL / 2]
    ];

    const dx = S_SMALL * Math.SQRT1_2;
    const dy = S_SMALL * Math.SQRT1_2;
    const par = centeredVerts([
        [0, 0],
        [L / 2, 0],
        [L / 2 + dx, -dy],
        [dx, -dy]
    ]);

    return {
        bigA: { id: 'bigA', name: 'Triângulo Grande',  color: '#f43f5e', verts: big },
        bigB: { id: 'bigB', name: 'Triângulo Grande',  color: '#fb923c', verts: big },
        med:  { id: 'med',  name: 'Triângulo Médio',   color: '#facc15', verts: med },
        smlA: { id: 'smlA', name: 'Triângulo Pequeno', color: '#34d399', verts: sml },
        smlB: { id: 'smlB', name: 'Triângulo Pequeno', color: '#22d3ee', verts: sml },
        sq:   { id: 'sq',   name: 'Quadrado',          color: '#818cf8', verts: sq },
        par:  { id: 'par',  name: 'Paralelogramo',     color: '#c084fc', verts: par }
    };
})();

/* ============================================================================
   CONSTRUÇÃO POR ENCAIXE DE ARESTAS
============================================================================ */

function worldVerts(piece){
    const def = PIECES[piece.id];
    return def.verts.map(v => transformPoint(v, piece.rot, piece.flip, piece.x, piece.y));
}

function worldEdge(piece, edgeIdx){
    const v = worldVerts(piece);
    return [v[edgeIdx], v[(edgeIdx + 1) % v.length]];
}

function buildFigure(instructions){
    const result = {};

    for (const ins of instructions){
        const { id } = ins;
        const def = PIECES[id];

        // Peça base: posiciona diretamente, ancorada no centro da área de jogo
        if (!ins.anchorId){
            result[id] = {
                x: GAME_CX + (ins.basePos?.[0] || 0),
                y: GAME_CY + (ins.basePos?.[1] || 0),
                rot: ins.baseRot || 0,
                flip: !!ins.baseFlip
            };
            continue;
        }

        const anchor = result[ins.anchorId];
        if (!anchor){
            console.warn(`Âncora não encontrada: ${ins.anchorId}`);
            continue;
        }

        // Aresta-âncora no mundo
        const [aA, aB] = worldEdge(anchor, ins.theirEdge);
        const anchorLen = Math.hypot(aB[0] - aA[0], aB[1] - aA[1]);
        const anchorAngle = Math.atan2(aB[1] - aA[1], aB[0] - aA[0]);

        // A minha aresta local
        const myVerts = def.verts;
        const i0 = ins.myEdge;
        const i1 = (ins.myEdge + 1) % myVerts.length;
        const mA = myVerts[i0];
        const mB = myVerts[i1];
        const myLen = Math.hypot(mB[0] - mA[0], mB[1] - mA[1]);

        // Aviso se comprimentos incompatíveis
        if (Math.abs(myLen - anchorLen) > 0.5){
            console.warn(`Aresta incompatível: ${id}[${ins.myEdge}] (${myLen.toFixed(2)}) ≠ ${ins.anchorId}[${ins.theirEdge}] (${anchorLen.toFixed(2)})`);
        }

        const wantPositive = ins.side !== 'right';
        const candidates = [];

        for (const flip of [false, true]){
            // Aplica flip localmente aos vértices e recalcula ângulo da minha aresta
            const mAf = flip ? [-mA[0], mA[1]] : mA;
            const mBf = flip ? [-mB[0], mB[1]] : mB;
            const myAngle = Math.atan2(mBf[1] - mAf[1], mBf[0] - mAf[0]);

            // Rotação que alinha a minha aresta à da âncora
            const rotRad = anchorAngle - myAngle;
            const rotDeg = rotRad * 180 / Math.PI;

            // Aplica transformação (rotação + flip) aos vértices locais sem translação
            const tVerts = myVerts.map(v =>
                transformPoint(v, rotDeg, flip, 0, 0)
            );
            const [tCx, tCy] = centroid(tVerts);

            // Ponto médio da minha aresta transformada
            const midMy = [
                (transformPoint(mA, rotDeg, flip, 0, 0)[0] + transformPoint(mB, rotDeg, flip, 0, 0)[0]) / 2,
                (transformPoint(mA, rotDeg, flip, 0, 0)[1] + transformPoint(mB, rotDeg, flip, 0, 0)[1]) / 2
            ];

            // Ponto médio da aresta-âncora
            const midAnc = [(aA[0] + aB[0]) / 2, (aA[1] + aB[1]) / 2];

            // Posição do centróide para que as arestas coincidam
            const cx = midAnc[0] + (tCx - midMy[0]);
            const cy = midAnc[1] + (tCy - midMy[1]);

            // Distância assinada do centróide à reta da aresta-âncora
            const nx = -(aB[1] - aA[1]) / anchorLen;
            const ny =  (aB[0] - aA[0]) / anchorLen;
            const side = (cx - aA[0]) * nx + (cy - aA[1]) * ny;

            candidates.push({ rot: rotDeg, flip, x: cx, y: cy, side });
        }

        // Escolhe o candidato do lado pedido
        let chosen = candidates.find(c => (c.side > 0) === wantPositive);
        if (!chosen) chosen = candidates[0];

        result[id] = {
            x: chosen.x,
            y: chosen.y,
            rot: normDeg(chosen.rot),
            flip: chosen.flip
        };
    }

    return result;
}

/* ============================================================================
   FIGURAS — construídas por encaixe de arestas
============================================================================ */
const MODELS = [
    /* ---------- QUADRADO CANÓNICO ---------- */
    {
        name: 'Quadrado', icon: '⬛',
        build: () => {
            // Construção explícita e verificada do quadrado tangram:
            // bigA (triângulo grande) no canto superior esquerdo, hipotenusa em baixo
            // bigB à direita, hipotenusa também em baixo → formam metade superior
            // med à esquerda, smlA + smlB à direita → metade inferior
            // sq no centro, par num canto
            return {
                bigA: { x: GAME_CX - L / 4, y: GAME_CY - L / 4, rot: 0, flip: false },
                bigB: { x: GAME_CX + L / 4, y: GAME_CY - L / 4, rot: 0, flip: false },
                med:  { x: GAME_CX - L / 4, y: GAME_CY + L / 4, rot: 0, flip: false },
                smlA: { x: GAME_CX, y: GAME_CY + L / 4, rot: 0, flip: false },
                smlB: { x: GAME_CX + L / 4, y: GAME_CY + L / 4, rot: 0, flip: false },
                sq:   { x: GAME_CX + L / 2 - S_SMALL / 2, y: GAME_CY + L / 2 - S_SMALL / 2, rot: 0, flip: false },
                par:  { x: GAME_CX - L / 2 + L / 8, y: GAME_CY + L / 2 - S_SMALL / 2 - L / 8, rot: 0, flip: false }
            };
        }
    },

    /* ---------- CASA ---------- */
    {
        name: 'Casa', icon: '🏠',
        build: () => buildFigure([
            { id: 'sq', basePos: [0, 40], baseRot: 0 },
            { id: 'med', anchorId: 'sq', myEdge: 0, theirEdge: 3, side: 'left' },
            { id: 'par', anchorId: 'sq', myEdge: 0, theirEdge: 1, side: 'right' },
            { id: 'bigA', anchorId: 'med', myEdge: 1, theirEdge: 1, side: 'left' },
            { id: 'bigB', anchorId: 'par', myEdge: 1, theirEdge: 2, side: 'right' },
            { id: 'smlA', anchorId: 'bigA', myEdge: 1, theirEdge: 0, side: 'left' },
            { id: 'smlB', anchorId: 'bigB', myEdge: 1, theirEdge: 0, side: 'right' }
        ])
    },

    /* ---------- PEIXE ---------- */
    {
        name: 'Peixe', icon: '🐟',
        build: () => buildFigure([
            { id: 'sq', basePos: [0, 0], baseRot: 0 },
            { id: 'med', anchorId: 'sq', myEdge: 0, theirEdge: 2, side: 'left' },
            { id: 'par', anchorId: 'sq', myEdge: 0, theirEdge: 0, side: 'right' },
            { id: 'bigA', anchorId: 'med', myEdge: 0, theirEdge: 1, side: 'left' },
            { id: 'bigB', anchorId: 'par', myEdge: 2, theirEdge: 2, side: 'right' },
            { id: 'smlA', anchorId: 'sq', myEdge: 1, theirEdge: 1, side: 'right' },
            { id: 'smlB', anchorId: 'smlA', myEdge: 1, theirEdge: 1, side: 'right' }
        ])
    },

    /* ---------- CISNE ---------- */
    {
        name: 'Cisne', icon: '🦢',
        build: () => buildFigure([
            { id: 'bigA', basePos: [-30, 40], baseRot: 0 },
            { id: 'bigB', anchorId: 'bigA', myEdge: 0, theirEdge: 0, side: 'right' },
            { id: 'par', anchorId: 'bigA', myEdge: 3, theirEdge: 2, side: 'left' },
            { id: 'med', anchorId: 'par', myEdge: 2, theirEdge: 0, side: 'left' },
            { id: 'sq', anchorId: 'med', myEdge: 0, theirEdge: 1, side: 'left' },
            { id: 'smlA', anchorId: 'bigB', myEdge: 1, theirEdge: 1, side: 'right' },
            { id: 'smlB', anchorId: 'bigB', myEdge: 2, theirEdge: 2, side: 'right' }
        ])
    },

    /* ---------- BARCO À VELA ---------- */
    {
        name: 'Barco à Vela', icon: '⛵',
        build: () => buildFigure([
            { id: 'bigA', basePos: [-40, 70], baseRot: 0 },
            { id: 'bigB', anchorId: 'bigA', myEdge: 0, theirEdge: 0, side: 'right' },
            { id: 'sq', anchorId: 'bigA', myEdge: 2, theirEdge: 1, side: 'left' },
            { id: 'par', anchorId: 'sq', myEdge: 3, theirEdge: 3, side: 'left' },
            { id: 'med', anchorId: 'par', myEdge: 1, theirEdge: 2, side: 'left' },
            { id: 'smlA', anchorId: 'med', myEdge: 2, theirEdge: 1, side: 'left' },
            { id: 'smlB', anchorId: 'sq', myEdge: 0, theirEdge: 2, side: 'right' }
        ])
    }
];

/* ============================================================================
   ESTADO
============================================================================ */
let currentModel = null;
let pieces = [];
let selectedId = null;
let dragging = false;
let dragOffX = 0, dragOffY = 0;
let won = false;
let rafPending = false;

/* ============================================================================
   DOM
============================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const modelNameEl = document.getElementById('model-name');
const scoreEl = document.getElementById('score-count');
const winModal = document.getElementById('win');
const winText = document.getElementById('win-text');
const themeBtn = document.getElementById('theme-toggle');
const legendEl = document.getElementById('legend');

/* ============================================================================
   AJUSTE — garante que a figura cabe na área de jogo
============================================================================ */
function fitTargetsToGameArea(targets){
    // Calcula bounding box de todas as peças-alvo
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const id in targets){
        const t = targets[id];
        if (!t || !PIECES[id]) continue;
        const verts = PIECES[id].verts.map(v =>
            transformPoint(v, t.rot, t.flip, t.x, t.y)
        );
        for (const [x, y] of verts){
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
        }
    }

    if (!isFinite(minX)) return; // nada a fazer

    const figCx = (minX + maxX) / 2;
    const figCy = (minY + maxY) / 2;
    const figW = maxX - minX;
    const figH = maxY - minY;

    const availW = GAME_RIGHT - GAME_LEFT;
    const availH = GAME_BOTTOM - GAME_TOP;

    const desiredCx = (GAME_LEFT + GAME_RIGHT) / 2;
    const desiredCy = (GAME_TOP + GAME_BOTTOM) / 2;

    // Tradução apenas (não escalamos para não quebrar geometria)
    // Se a figura for maior que a área, reduzimos L globalmente? Não —
    // escolhemos L para caber. Aqui só centramos.
    const dx = desiredCx - figCx;
    const dy = desiredCy - figCy;

    // Se a figura for demasiado grande, avisamos
    if (figW > availW || figH > availH){
        console.warn(`Figura demasiado grande (${figW.toFixed(0)}×${figH.toFixed(0)}) para a área (${availW}×${availH})`);
    }

    for (const id in targets){
        const t = targets[id];
        if (!t) continue;
        t.x += dx;
        t.y += dy;
    }
}

/* ============================================================================
   INICIALIZAÇÃO
============================================================================ */
function initGame(){
    currentModel = MODELS[Math.floor(Math.random() * MODELS.length)];
    modelNameEl.textContent = `${currentModel.icon} ${currentModel.name}`;

    const targets = currentModel.build();
    fitTargetsToGameArea(targets);

    // Cria peças na bandeja (parte inferior do canvas)
    const ids = Object.keys(PIECES);
    const trayY = TRAY_TOP + 40;
    const cols = 4;
    const spacing = CANVAS_W / (cols + 1);

    pieces = ids.map((id, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        return {
            id,
            x: spacing * (col + 1),
            y: trayY + row * 60,
            rot: (Math.floor(Math.random() * 8)) * 45,
            flip: false,
            placed: false,
            target: targets[id] || null
        };
    });

    selectedId = null;
    dragging = false;
    won = false;
    winModal.classList.remove('active');
    buildLegend();
    updateScore();
    requestDraw();
}

function buildLegend(){
    legendEl.innerHTML = '';
    Object.values(PIECES).forEach(def => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.dataset.id = def.id;
        el.innerHTML = `<span class="sw" style="background:${def.color}"></span><span class="nm">${def.name}</span>`;
        el.addEventListener('click', () => {
            selectedId = def.id;
            updateLegendActive();
            requestDraw();
        });
        legendEl.appendChild(el);
    });
    updateLegendActive();
}

function updateLegendActive(){
    legendEl.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === selectedId);
    });
}

/* ============================================================================
   ENCAIXE
============================================================================ */
function isPlaced(p){
    if (!p.target) return false;
    const dx = p.x - p.target.x;
    const dy = p.y - p.target.y;
    const d = Math.hypot(dx, dy);
    const aOk = angDiff(p.rot, p.target.rot) <= SNAP_ANGLE_TOL;
    const fOk = p.flip === !!p.target.flip;
    return d < SNAP_DIST && aOk && fOk;
}

function snapToTarget(p){
    p.x = p.target.x;
    p.y = p.target.y;
    p.rot = normDeg(p.target.rot);
    p.flip = !!p.target.flip;
}

function updateScore(){
    let n = 0;
    for (const p of pieces){
        if (isPlaced(p)){
            p.placed = true;
            snapToTarget(p);
            n++;
        } else {
            p.placed = false;
        }
    }
    scoreEl.textContent = `${n} / 7`;
    scoreEl.classList.toggle('ok', n === 7);
    if (n === 7 && !won){
        won = true;
        setTimeout(showWin, 400);
    }
    return n;
}

function showWin(){
    winText.textContent = `Completou a figura "${currentModel.name}" com as 7 peças tradicionais do tangram!`;
    winModal.classList.add('active');
    awardPoints();
}

/* ============================================================================
   RENDER
============================================================================ */
function requestDraw(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; draw(); });
}

function draw(){
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawGrid();
    drawTrayDivider();
    drawSilhouette();

    const sorted = [...pieces].sort((a, b) => {
        const ap = a.placed ? 1 : 0, bp = b.placed ? 1 : 0;
        if (ap !== bp) return ap - bp;
        if (a.id === selectedId) return 1;
        if (b.id === selectedId) return -1;
        return 0;
    });
    sorted.forEach(drawPiece);
}

function drawGrid(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.05)' : 'rgba(15,23,42,.05)';
    ctx.lineWidth = 1;
    const g = 40;
    for (let x = 0; x <= CANVAS_W; x += g){
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
    }
    for (let y = 0; y <= CANVAS_H; y += g){
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
    }
    ctx.restore();
}

function drawTrayDivider(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.18)' : 'rgba(15,23,42,.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 8]);
    ctx.beginPath();
    ctx.moveTo(0, TRAY_TOP);
    ctx.lineTo(CANVAS_W, TRAY_TOP);
    ctx.stroke();
    ctx.restore();
}

function drawSilhouette(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    for (const p of pieces){
        if (!p.target) continue;
        const def = PIECES[p.id];
        const verts = def.verts.map(v =>
            transformPoint(v, p.target.rot, p.target.flip, p.target.x, p.target.y)
        );

        ctx.beginPath();
        verts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
        ctx.closePath();
        ctx.fillStyle = dark ? 'rgba(56,189,248,.06)' : 'rgba(56,189,248,.09)';
        ctx.fill();
        ctx.strokeStyle = dark ? 'rgba(148,163,184,.4)' : 'rgba(100,116,139,.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
    }
}

function drawPiece(p){
    const def = PIECES[p.id];
    const verts = def.verts.map(v => transformPoint(v, p.rot, p.flip, p.x, p.y));
    const sel = p.id === selectedId;

    ctx.save();

    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = sel ? 18 : 8;
    ctx.shadowOffsetY = sel ? 4 : 2;

    ctx.beginPath();
    verts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = def.color;
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [x, y] of verts){
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
    }
    const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
    grad.addColorStop(0, 'rgba(255,255,255,.28)');
    grad.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.fillStyle = grad;
    ctx.fill();

    if (sel){
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = .4;
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.globalAlpha = 1;
    } else if (p.placed){
        ctx.strokeStyle = 'rgba(52,211,153,.95)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(0,0,0,.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

/* ============================================================================
   INTERAÇÃO
============================================================================ */
function getCanvasPos(clientX, clientY){
    const r = cv.getBoundingClientRect();
    return {
        x: (clientX - r.left) * (CANVAS_W / r.width),
        y: (clientY - r.top) * (CANVAS_H / r.height)
    };
}

function findPieceAt(x, y){
    for (let i = pieces.length - 1; i >= 0; i--){
        const p = pieces[i];
        const verts = PIECES[p.id].verts.map(v =>
            transformPoint(v, p.rot, p.flip, p.x, p.y)
        );
        if (pointInPoly(x, y, verts)) return p;
    }
    return null;
}

function bringToFront(p){
    const i = pieces.indexOf(p);
    if (i >= 0){ pieces.splice(i, 1); pieces.push(p); }
}

function selectPiece(p){
    selectedId = p ? p.id : null;
    updateLegendActive();
}

cv.addEventListener('mousedown', e => {
    e.preventDefault();
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
});

cv.addEventListener('mousemove', e => {
    if (!dragging || !selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
});

window.addEventListener('mouseup', () => {
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
});

cv.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
}, { passive: false });

cv.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dragging || !selectedId || e.touches.length !== 1) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
}, { passive: false });

cv.addEventListener('touchend', e => {
    e.preventDefault();
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
}, { passive: false });

/* ============================================================================
   ROTAÇÃO / FLIP / TECLADO
============================================================================ */
function rotateSelected(delta){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.rot = normDeg(p.rot + delta);
    p.placed = false;
    updateScore();
    requestDraw();
}

function flipSelected(){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.flip = !p.flip;
    p.placed = false;
    updateScore();
    requestDraw();
}

document.getElementById('btn-rot-l').addEventListener('click', () => rotateSelected(-15));
document.getElementById('btn-rot-r').addEventListener('click', () => rotateSelected(15));
document.getElementById('btn-flip').addEventListener('click', flipSelected);

window.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r'){ e.preventDefault(); rotateSelected(e.shiftKey ? -15 : 15); }
    else if (k === 'f'){ e.preventDefault(); flipSelected(); }
    else if (k.startsWith('arrow') && selectedId){
        const p = pieces.find(q => q.id === selectedId);
        if (!p) return;
        e.preventDefault();
        const step = e.shiftKey ? 10 : 2;
        if (k === 'arrowleft') p.x -= step;
        if (k === 'arrowright') p.x += step;
        if (k === 'arrowup') p.y -= step;
        if (k === 'arrowdown') p.y += step;
        p.placed = false;
        updateScore();
        requestDraw();
    }
});

/* ============================================================================
   FIREBASE
============================================================================ */
async function awardPoints(){
    try {
        const s = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!s || !s.chave) return;
        const r = ref(db, 'jogadores/' + s.chave);
        const snap = await get(r);
        if (snap.exists()){
            await update(r, { pontos: (snap.val().pontos || 0) + 40 });
        }
    } catch (err){
        console.warn('Falha ao registar pontos:', err);
    }
}

/* ============================================================================
   TEMA
============================================================================ */
function initTheme(){
    const saved = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    themeBtn.textContent = saved === 'dark' ? '🌙' : '☀️';
}
themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('brain_flow_theme', next);
    requestDraw();
});

/* ============================================================================
   BOTÕES
============================================================================ */
document.getElementById('btn-new').addEventListener('click', initGame);
document.getElementById('next').addEventListener('click', initGame);

/* ============================================================================
   ARRANQUE
============================================================================ */
initTheme();
initGame();
</script>
