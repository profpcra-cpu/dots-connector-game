<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tangram Tradicional · Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg-1:#1a1f3a; --bg-2:#070b14;
    --card-bg:rgba(18,24,40,.92); --card-border:rgba(148,163,184,.12);
    --text:#f1f5f9; --text-muted:#94a3b8; --text-dim:#64748b;
    --border:rgba(148,163,184,.15); --input-bg:rgba(10,15,28,.7);
    --accent-1:#38bdf8; --accent-2:#818cf8; --accent-3:#c084fc;
    --success:#34d399; --warning:#fbbf24;
    --r-sm:8px; --r-md:14px; --r-lg:22px;
    --shadow:0 20px 60px -20px rgba(0,0,0,.75);
    --ease:.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
    --bg-1:#e0e7ff; --bg-2:#f8fafc;
    --card-bg:rgba(255,255,255,.92); --card-border:rgba(15,23,42,.08);
    --text:#0f172a; --text-muted:#475569; --text-dim:#94a3b8;
    --border:rgba(15,23,42,.1); --input-bg:rgba(241,245,249,.8);
    --shadow:0 20px 60px -20px rgba(15,23,42,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse at 50% -20%,var(--bg-1) 0%,var(--bg-2) 60%);
    background-attachment:fixed;color:var(--text);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:10px;-webkit-font-smoothing:antialiased;
    transition:background var(--ease),color var(--ease);
}
.game{
    background:var(--card-bg);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    padding:16px;border-radius:var(--r-lg);box-shadow:var(--shadow);
    width:100%;max-width:560px;border:1px solid var(--card-border);
    display:flex;flex-direction:column;gap:10px;
    max-height:98vh;overflow-y:auto;scrollbar-width:thin;
}
.game::-webkit-scrollbar{width:4px}
.game::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.icon-btn{
    width:32px;height:32px;border-radius:var(--r-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--input-bg);border:1px solid var(--border);
    color:var(--text-muted);cursor:pointer;font-size:14px;
    transition:all var(--ease);text-decoration:none;flex-shrink:0;
    user-select:none;font-family:inherit;
}
.icon-btn:hover{color:var(--text);border-color:var(--accent-1);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.96)}
.header{text-align:center}
.header h1{
    font-size:22px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2),var(--accent-3));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;margin-bottom:2px;
}
.header p{font-size:11.5px;color:var(--text-muted);line-height:1.4}
.hud{display:flex;gap:8px}
.hud-card{
    flex:1;background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);padding:8px 10px;
    display:flex;flex-direction:column;gap:2px;
}
.hud-card .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-dim)}
.hud-card .val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent-1)}
.hud-card .val.ok{color:var(--success)}
.canvas-wrap{
    position:relative;width:100%;aspect-ratio:4/3;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-md);overflow:hidden;
    display:flex;justify-content:center;align-items:center;
    box-shadow:inset 0 0 40px -20px rgba(0,0,0,.5);
}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.toolbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 14px;border-radius:var(--r-sm);
    font-size:12px;font-weight:700;font-family:inherit;border:none;
    cursor:pointer;transition:all var(--ease);user-select:none;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{
    background:linear-gradient(135deg,var(--accent-2),var(--accent-3));
    color:#fff;box-shadow:0 4px 16px -4px rgba(129,140,248,.5);
}
.btn-primary:hover{box-shadow:0 6px 24px -4px rgba(129,140,248,.7);transform:translateY(-1px)}
.btn-ghost{background:var(--input-bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent-1);color:var(--accent-1)}
.hint{
    text-align:center;font-size:11px;color:var(--text-dim);
    padding:6px 10px;background:var(--input-bg);
    border-radius:var(--r-sm);border:1px solid var(--border);line-height:1.5;
}
.hint kbd{
    display:inline-block;padding:1px 5px;border-radius:4px;
    background:var(--border);font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;color:var(--text-muted);
}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.legend-item{
    display:flex;align-items:center;gap:5px;padding:5px 6px;
    background:var(--input-bg);border:1px solid var(--border);
    border-radius:var(--r-sm);transition:all var(--ease);cursor:pointer;
}
.legend-item:hover{border-color:var(--accent-1)}
.legend-item.active{border-color:var(--accent-1);background:rgba(56,189,248,.12)}
.legend-item .sw{width:10px;height:10px;border-radius:2px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.legend-item .nm{font-weight:600;color:var(--text);font-size:9.5px;line-height:1.1}
.modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    justify-content:center;align-items:center;z-index:1000;padding:20px;
    animation:fadeIn .25s ease;
}
.modal.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-content{
    background:var(--card-bg);backdrop-filter:blur(24px);
    padding:28px 24px;border-radius:var(--r-lg);
    border:1px solid var(--card-border);text-align:center;
    max-width:340px;width:100%;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    animation:slideUp .35s cubic-bezier(.16,1,.3,1);
}
.modal-content .emo{font-size:48px;display:block;margin-bottom:8px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.modal-content h2{font-size:20px;font-weight:800;color:var(--success);margin-bottom:8px}
.modal-content p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:20px}
.modal-content .btn{width:100%}
@media (max-width:420px){
    .game{padding:12px;gap:8px}
    .header h1{font-size:18px}
    .header p{font-size:10.5px}
    .btn{padding:8px 11px;font-size:11px}
    .legend{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:720px){
    .header p{display:none}
    .game{gap:7px}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="game" role="main">
    <div class="topbar">
        <a href="index.html" class="icon-btn" title="Voltar" aria-label="Voltar">←</a>
        <div class="brand"><span>📐</span><span>Tangram Tradicional</span></div>
        <button id="theme-toggle" class="icon-btn" title="Tema" aria-label="Alternar tema">🌙</button>
    </div>

    <header class="header">
        <h1>Tangram Tradicional</h1>
        <p>Reconstrua a silhueta usando as 7 peças clássicas chinesas</p>
    </header>

    <div class="hud">
        <div class="hud-card"><span class="lbl">Desafio</span><span class="val" id="model-name">—</span></div>
        <div class="hud-card"><span class="lbl">Encaixes</span><span class="val" id="score-count">0 / 7</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="cv" width="800" height="600" aria-label="Área de jogo do tangram"></canvas>
    </div>

    <div class="toolbar">
        <button class="btn btn-ghost" id="btn-rot-l" title="Rodar 15° anti-horário">↺ 15°</button>
        <button class="btn btn-ghost" id="btn-rot-r" title="Rodar 15° horário">↻ 15°</button>
        <button class="btn btn-ghost" id="btn-flip" title="Espelhar peça">↔ Espelhar</button>
        <button class="btn btn-primary" id="btn-new" title="Novo modelo">🎲 Novo</button>
    </div>

    <div class="hint">
        💡 Clique para selecionar · Arraste para mover · <kbd>R</kbd>/<kbd>Shift+R</kbd> rodar · <kbd>F</kbd> espelhar
    </div>

    <div class="legend" id="legend"></div>
</main>

<div class="modal" id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="modal-content">
        <span class="emo">🎉</span>
        <h2 id="win-title">Excelente!</h2>
        <p id="win-text"></p>
        <button class="btn btn-primary" id="next">Próximo Desafio →</button>
    </div>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* ============================================================================
   GEOMETRIA DO TANGRAM — TUDO DERIVADO DE UM QUADRADO DE LADO L
   ----------------------------------------------------------------------------
   As 7 peças do tangram têm formas e tamanhos EXATOS derivados de um
   quadrado de lado L:
     - 2 triângulos grandes  : catetos = L/√2,  hipotenusa = L
     - 1 triângulo médio     : catetos = L/2,   hipotenusa = L/√2
     - 2 triângulos pequenos : catetos = L/(2√2), hipotenusa = L/2
     - 1 quadrado            : lado = L/(2√2)
     - 1 paralelogramo       : lados = L/2 e L/(2√2), ângulo interno 45°
   ============================================================================ */
const CANVAS_W = 800;
const CANVAS_H = 600;
const L = 300;                       // lado do quadrado de referência
const H = L / Math.SQRT2;            // altura de triângulo com hipotenusa L
const S = L / (2 * Math.SQRT2);      // lado do quadrado pequeno

const CX = CANVAS_W / 2;
const CY = CANVAS_H / 2 - 40;        // centro da silhueta

const SNAP_DIST = 24;
const SNAP_ANGLE_TOL = 12;
const TRAY_TOP = CANVAS_H - 110;     // linha superior da bandeja

/* ============================================================================
   DEFINIÇÃO DAS PEÇAS — VÉRTICES LOCAIS (centrados no centróide)
============================================================================ */
function centroid(pts){
    let x=0,y=0;
    for(const [px,py] of pts){x+=px;y+=py;}
    return [x/pts.length, y/pts.length];
}
function center(pts){
    const [cx,cy]=centroid(pts);
    return pts.map(([x,y])=>[x-cx,y-cy]);
}

const PIECES = (()=>{
    // --- Triângulo Grande (hipotenusa = L) ---
    // Vértices: A=(0,0), B=(L,0), C=(L/2,-H)
    // Arestas (índices na lista de vértices após centragem):
    //   e0 = A→B  (hipotenusa, comprimento L)
    //   e1 = B→C  (cateto, comprimento H)
    //   e2 = C→A  (cateto, comprimento H)
    const big = center([[0,0],[L,0],[L/2,-H]]);

    // --- Triângulo Médio (hipotenusa = L/√2 = H) ---
    // Vértices: A=(0,0), B=(L/2,0), C=(0,-L/2)
    // e0 = A→B (cateto L/2) | e1 = B→C (hipotenusa H) | e2 = C→A (cateto L/2)
    const med = center([[0,0],[L/2,0],[0,-L/2]]);

    // --- Triângulo Pequeno (hipotenusa = L/2) ---
    // Vértices: A=(0,0), B=(S,0), C=(0,-S)  com S = L/(2√2)
    // e0 = A→B (cateto S) | e1 = B→C (hipotenusa L/2) | e2 = C→A (cateto S)
    const sml = center([[0,0],[S,0],[0,-S]]);

    // --- Quadrado (lado S) ---
    // Vértices: (-S/2,-S/2),(S/2,-S/2),(S/2,S/2),(-S/2,S/2)
    // e0 = base | e1 = direita | e2 = topo | e3 = esquerda
    const sq = [
        [-S/2,-S/2],[S/2,-S/2],[S/2,S/2],[-S/2,S/2]
    ];

    // --- Paralelogramo (lados L/2 e S, ângulo 45°) ---
    // Vértices: A=(0,0), B=(L/2,0), C=(L/2+S/√2,-S/√2), D=(S/√2,-S/√2)
    // e0 = A→B (longo, L/2)
    // e1 = B→C (curto inclinado, S)
    // e2 = C→D (longo, L/2)
    // e3 = D→A (curto inclinado, S)
    const dx = S * Math.SQRT1_2;
    const dy = S * Math.SQRT1_2;
    const par = center([[0,0],[L/2,0],[L/2+dx,-dy],[dx,-dy]]);

    return {
        bigA: { id:'bigA', name:'Triângulo Grande',  color:'#f43f5e', verts: big.map(([x,y])=>[x,y]) },
        bigB: { id:'bigB', name:'Triângulo Grande',  color:'#fb923c', verts: big.map(([x,y])=>[x,y]) },
        med:  { id:'med',  name:'Triângulo Médio',   color:'#facc15', verts: med },
        smlA: { id:'smlA', name:'Triângulo Pequeno', color:'#34d399', verts: sml },
        smlB: { id:'smlB', name:'Triângulo Pequeno', color:'#22d3ee', verts: sml },
        sq:   { id:'sq',   name:'Quadrado',          color:'#818cf8', verts: sq },
        par:  { id:'par',  name:'Paralelogramo',     color:'#c084fc', verts: par }
    };
})();

/* ============================================================================
   CONSTRUÇÃO DE FIGURAS POR "ENCAIXE DE ARESTAS"
   ----------------------------------------------------------------------------
   Em vez de definir x/y/rot à mão para cada peça, definimos cada figura
   como uma SEQUÊNCIA de encaixes:
     - A primeira peça ancora num ponto base com rotação inicial.
     - Cada peça seguinte diz: "quero encostar a minha aresta local i
       à aresta global j da peça k, com o mesmo comprimento".
   O motor calcula automaticamente posição, rotação e flip.
   Isto GARANTE que as arestas coincidem exatamente → sem sobreposição,
   sem buracos, silhueta perfeita.
============================================================================ */

// Comprimento de uma aresta da peça, dados os vértices locais
function edgeLength(pieceId, edgeIdx){
    const v = PIECES[pieceId].verts;
    const a = v[edgeIdx];
    const b = v[(edgeIdx+1) % v.length];
    return Math.hypot(b[0]-a[0], b[1]-a[1]);
}

// Todas as arestas de uma peça com comprimentos (cache)
const PIECE_EDGES = (()=>{
    const out = {};
    for (const id in PIECES){
        const v = PIECES[id].verts;
        out[id] = [];
        for (let i=0;i<v.length;i++){
            const a = v[i], b = v[(i+1)%v.length];
            out[id].push({
                idx: i,
                len: Math.hypot(b[0]-a[0], b[1]-a[1]),
                a, b
            });
        }
    }
    return out;
})();

// Aplica transformação local→mundo
function transform([x,y], rot, flip, tx, ty){
    if (flip) x = -x;
    const rad = rot * Math.PI / 180;
    const c = Math.cos(rad), s = Math.sin(rad);
    return [tx + x*c - y*s, ty + x*s + y*c];
}

// Vértices de uma peça no mundo
function worldVerts(piece){
    const def = PIECES[piece.id];
    return def.verts.map(v => transform(v, piece.rot, piece.flip, piece.x, piece.y));
}

// Aresta no mundo (retorna os dois pontos extremos, ordenados)
function worldEdge(piece, edgeIdx){
    const verts = worldVerts(piece);
    return [verts[edgeIdx], verts[(edgeIdx+1) % verts.length]];
}

/**
 * Constrói as posições de todas as peças de uma figura a partir de
 * uma lista de "instruções de encaixe".
 *
 * Cada instrução:
 *   { id,            // id da peça a colocar
 *     anchorId,      // peça já colocada à qual se encosta (null = peça base)
 *     myEdge,        // aresta local da peça nova que fica encostada (0..n-1)
 *     theirEdge,     // aresta da peça âncora que fica encostada
 *     side,          // 'left' | 'right' — de que lado da aresta âncora a peça fica
 *     basePos,       // (só para peça base) [x,y] do centróide
 *     baseRot,       // (só para peça base) rotação
 *     baseFlip }     // (só para peça base) flip
 */
function buildFigure(instructions){
    const result = {};

    for (const ins of instructions){
        const { id } = ins;

        // --- Peça base: posiciona diretamente ---
        if (!ins.anchorId){
            result[id] = {
                x: CX + (ins.basePos?.[0] || 0),
                y: CY + (ins.basePos?.[1] || 0),
                rot: ins.baseRot || 0,
                flip: !!ins.baseFlip
            };
            continue;
        }

        // --- Peça encaixada: calcular posição/rotação/flip ---
        const anchor = result[ins.anchorId];
        const myDef = PIECES[id];
        const anchorDef = PIECES[ins.anchorId];

        // 1) Obtém a aresta-âncora no mundo (após transformação)
        const anchorEdgeWorld = worldEdge(anchor, ins.theirEdge);
        const [aA, aB] = anchorEdgeWorld;
        const anchorLen = Math.hypot(aB[0]-aA[0], aB[1]-aA[1]);
        const anchorAngle = Math.atan2(aB[1]-aA[1], aB[0]-aA[0]);

        // 2) A minha aresta local precisa ter o mesmo comprimento
        const myEdge = PIECE_EDGES[id][ins.myEdge];
        if (Math.abs(myEdge.len - anchorLen) > 0.5){
            console.warn(`Aresta incompatível: ${id}[${ins.myEdge}] (${myEdge.len.toFixed(2)}) ≠ ${ins.anchorId}[${ins.theirEdge}] (${anchorLen.toFixed(2)})`);
            continue;
        }

        // 3) Calcula a rotação necessária para alinhar a minha aresta à da âncora
        //    A minha aresta local tem direção myAngle. Precisamos rodar
        //    de modo a myAngle = anchorAngle (aresta sobre aresta).
        const [mA, mB] = [myEdge.a, myEdge.b];
        const myAngle = Math.atan2(mB[1]-mA[1], mB[0]-mA[0]);

        // Duas opções de flip: normal e espelhado
        // Para cada uma, calculamos a rotação e testamos se a peça fica do lado correto.
        const candidates = [];
        for (const flip of [false, true]){
            // Com flip, a minha aresta é espelhada em X. Recalcula a direção:
            const mA2 = flip ? [-mA[0], mA[1]] : mA;
            const mB2 = flip ? [-mB[0], mB[1]] : mB;
            const myAngle2 = Math.atan2(mB2[1]-mA2[1], mB2[0]-mA2[0]);

            // Rotação que alinha a minha aresta à da âncora
            const rot = (anchorAngle - myAngle2) * 180 / Math.PI;

            // Testa: aplica rotação aos vértices locais e verifica de que lado
            // da aresta-âncora a peça cai (usando o centróide).
            const testVerts = myDef.verts.map(v => transform(v, rot, flip, 0, 0));
            const [tcx, tcy] = centroid(testVerts);

            // Vetor normal à aresta-âncora (apontando para "esquerda" do sentido A→B)
            const nx = -(aB[1]-aA[1]) / anchorLen;
            const ny =  (aB[0]-aA[0]) / anchorLen;

            // Posição do centróide se a peça tiver a aresta coincidente com a âncora:
            // O centróide local (após transformação) já está em (tcx,tcy);
            // queremos que a aresta coincida. Então o centróide mundial será
            // aA + (tcx,tcy) - (ponto médio da minha aresta transformada)
            const midMy = [
                (transform(mA, rot, flip, 0, 0)[0] + transform(mB, rot, flip, 0, 0)[0]) / 2,
                (transform(mA, rot, flip, 0, 0)[1] + transform(mB, rot, flip, 0, 0)[1]) / 2
            ];
            const midAnc = [(aA[0]+aB[0])/2, (aA[1]+aB[1])/2];
            const cx = midAnc[0] + (tcx - midMy[0]);
            const cy = midAnc[1] + (tcy - midMy[1]);

            // Distância do centróide à aresta-âncora (sinal)
            const side = (cx - aA[0]) * nx + (cy - aA[1]) * ny;

            candidates.push({ rot, flip, x: cx, y: cy, side });
        }

        // 4) Escolhe o candidato que fica do lado pedido
        //    'left'  = lado positivo da normal
        //    'right' = lado negativo da normal
        const wantPositive = ins.side !== 'right';
        let chosen = candidates.find(c => (c.side > 0) === wantPositive);
        if (!chosen) chosen = candidates[0];

        result[id] = {
            x: chosen.x,
            y: chosen.y,
            rot: normDeg(chosen.rot),
            flip: chosen.flip
        };
    }

    return result;
}

const normDeg = a => ((a % 360) + 360) % 360;

/* ============================================================================
   AS 5 FIGURAS CLÁSSICAS — construídas por encaixe de arestas
   ----------------------------------------------------------------------------
   Convenção de arestas:
     big:  [0]=hipotenusa  [1]=cateto  [2]=cateto
     med:  [0]=cateto      [1]=hipotenusa  [2]=cateto
     sml:  [0]=cateto      [1]=hipotenusa  [2]=cateto
     sq:   [0]=baixo  [1]=direita  [2]=cima  [3]=esquerda
     par:  [0]=longo baixo  [1]=curto direito  [2]=longo cima  [3]=curto esquerdo
============================================================================ */
const MODELS = [
    /* ========================================================================
       1. QUADRADO — decomposição canónica do tangram
       ======================================================================== */
    {
        name: 'Quadrado', icon: '⬛',
        build: () => buildFigure([
            // Peça base: triângulo grande no canto superior esquerdo
            { id:'bigA', basePos:[-L/4, -L/4], baseRot:0 },
            // bigB encosta a sua hipotenusa [0] à hipotenusa [0] de bigA? Não —
            // bigA com rot=0 tem hipotenusa em baixo, virada para cima.
            // Construímos o quadrado canónico:
            // Metade superior: bigA (esq) + bigB (dir) com hipotenusas a formar o topo
            { id:'bigB', anchorId:'bigA', myEdge:1, theirEdge:1, side:'right' },
            // Triângulo médio abaixo de bigA
            { id:'med', anchorId:'bigA', myEdge:1, theirEdge:2, side:'right' },
            // Quadrado pequeno ao lado do médio
            { id:'sq', anchorId:'med', myEdge:0, theirEdge:0, side:'right' },
            // Triângulos pequenos
            { id:'smlA', anchorId:'sq', myEdge:0, theirEdge:2, side:'right' },
            { id:'smlB', anchorId:'smlA', myEdge:0, theirEdge:1, side:'right' },
            // Paralelogramo
            { id:'par', anchorId:'bigB', myEdge:2, theirEdge:2, side:'right' }
        ])
    },

    /* ========================================================================
       2. CASA — telhado triangular, corpo retangular, chaminé
       ======================================================================== */
    {
        name: 'Casa', icon: '🏠',
        build: () => buildFigure([
            // Base: quadrado pequeno
            { id:'sq', basePos:[0, 0], baseRot:0 },
            // Triângulo médio à esquerda
            { id:'med', anchorId:'sq', myEdge:0, theirEdge:3, side:'left' },
            // Paralelogramo à direita
            { id:'par', anchorId:'sq', myEdge:0, theirEdge:1, side:'right' },
            // Telhado: dois triângulos grandes com hipotenusas no topo
            { id:'bigA', anchorId:'med', myEdge:1, theirEdge:1, side:'left' },
            { id:'bigB', anchorId:'par', myEdge:1, theirEdge:2, side:'right' },
            // Triângulos pequenos fecham o topo (chaminé e beiral)
            { id:'smlA', anchorId:'bigA', myEdge:0, theirEdge:0, side:'right' },
            { id:'smlB', anchorId:'bigB', myEdge:0, theirEdge:0, side:'left' }
        ])
    },

    /* ========================================================================
       3. PEIXE — corpo alongado, cauda triangular, cabeça
       ======================================================================== */
    {
        name: 'Peixe', icon: '🐟',
        build: () => buildFigure([
            // Corpo: quadrado pequeno ao centro
            { id:'sq', basePos:[0, 0], baseRot:0 },
            // Nadadeira superior: triângulo médio
            { id:'med', anchorId:'sq', myEdge:0, theirEdge:2, side:'left' },
            // Nadadeira inferior: triângulo médio espelhado — usamos paralelogramo
            { id:'par', anchorId:'sq', myEdge:2, theirEdge:0, side:'right' },
            // Cauda: dois triângulos grandes apontando para a esquerda
            { id:'bigA', anchorId:'med', myEdge:0, theirEdge:1, side:'left' },
            { id:'bigB', anchorId:'par', myEdge:2, theirEdge:1, side:'right' },
            // Cabeça: triângulos pequenos à direita
            { id:'smlA', anchorId:'sq', myEdge:1, theirEdge:1, side:'right' },
            { id:'smlB', anchorId:'smlA', myEdge:1, theirEdge:1, side:'right' }
        ])
    },

    /* ========================================================================
       4. CISNE — corpo, pescoço erguido, cabeça
       ======================================================================== */
    {
        name: 'Cisne', icon: '🦢',
        build: () => buildFigure([
            // Corpo base: triângulo grande
            { id:'bigA', basePos:[-30, 40], baseRot:0 },
            // Segundo triângulo grande ao lado (corpo alargado)
            { id:'bigB', anchorId:'bigA', myEdge:0, theirEdge:0, side:'right' },
            // Peito erguido: paralelogramo
            { id:'par', anchorId:'bigA', myEdge:3, theirEdge:2, side:'left' },
            // Pescoço: triângulo médio a subir
            { id:'med', anchorId:'par', myEdge:2, theirEdge:0, side:'left' },
            // Cabeça: quadrado pequeno no topo
            { id:'sq', anchorId:'med', myEdge:0, theirEdge:1, side:'left' },
            // Asa: triângulos pequenos sobre o corpo
            { id:'smlA', anchorId:'bigB', myEdge:1, theirEdge:1, side:'right' },
            { id:'smlB', anchorId:'bigB', myEdge:2, theirEdge:2, side:'right' }
        ])
    },

    /* ========================================================================
       5. BARCO À VELA — casco, mastro, vela
       ======================================================================== */
    {
        name: 'Barco à Vela', icon: '⛵',
        build: () => buildFigure([
            // Casco: triângulo grande deitado
            { id:'bigA', basePos:[-40, 80], baseRot:0 },
            { id:'bigB', anchorId:'bigA', myEdge:0, theirEdge:0, side:'right' },
            // Mastro central: quadrado pequeno
            { id:'sq', anchorId:'bigA', myEdge:2, theirEdge:1, side:'left' },
            // Vela principal: paralelogramo (formato de vela)
            { id:'par', anchorId:'sq', myEdge:3, theirEdge:3, side:'left' },
            // Vela secundária: triângulo médio
            { id:'med', anchorId:'par', myEdge:1, theirEdge:2, side:'left' },
            // Bandeirola: triângulos pequenos no topo
            { id:'smlA', anchorId:'med', myEdge:2, theirEdge:1, side:'left' },
            { id:'smlB', anchorId:'sq', myEdge:0, theirEdge:2, side:'right' }
        ])
    }
];

/* ============================================================================
   ESTADO
============================================================================ */
let currentModel = null;
let pieces = [];
let selectedId = null;
let dragging = false;
let dragOffX = 0, dragOffY = 0;
let won = false;
let rafPending = false;

/* ============================================================================
   DOM
============================================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const modelNameEl = document.getElementById('model-name');
const scoreEl = document.getElementById('score-count');
const winModal = document.getElementById('win');
const winText = document.getElementById('win-text');
const themeBtn = document.getElementById('theme-toggle');
const legendEl = document.getElementById('legend');

/* ============================================================================
   INICIALIZAÇÃO
============================================================================ */
function initGame(){
    currentModel = MODELS[Math.floor(Math.random() * MODELS.length)];
    modelNameEl.textContent = `${currentModel.icon} ${currentModel.name}`;

    const targets = currentModel.build();

    // Cria peças na bandeja (parte inferior do canvas)
    const ids = Object.keys(PIECES);
    const trayY = TRAY_TOP + 40;
    const cols = 4;
    const spacing = CANVAS_W / (cols + 1);

    pieces = ids.map((id, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        return {
            id,
            x: spacing * (col + 1),
            y: trayY + row * 60,
            rot: (Math.floor(Math.random() * 8)) * 45,
            flip: false,
            placed: false,
            target: targets[id] || null
        };
    });

    // Se a figura for muito grande e sair do canvas, recentra verticalmente
    recenterFigure();

    selectedId = null;
    dragging = false;
    won = false;
    winModal.classList.remove('active');
    buildLegend();
    updateScore();
    requestDraw();
}

// Ajusta as posições-alvo para caberem no canvas
function recenterFigure(){
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pieces){
        if (!p.target) continue;
        const verts = PIECES[p.id].verts.map(v => transform(v, p.target.rot, p.target.flip, p.target.x, p.target.y));
        for (const [x,y] of verts){
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
        }
    }
    const figCx = (minX + maxX) / 2;
    const figCy = (minY + maxY) / 2;
    const figW = maxX - minX;
    const figH = maxY - minY;

    // Espaço disponível: canvas acima da bandeja, com margem
    const availableH = TRAY_TOP - 20;
    const availableW = CANVAS_W - 40;

    // Escala se necessário
    const scale = Math.min(1, availableW / figW, availableH / figH);
    const desiredCx = CANVAS_W / 2;
    const desiredCy = (TRAY_TOP - 20) / 2 + 10;

    for (const p of pieces){
        if (!p.target) continue;
        p.target.x = desiredCx + (p.target.x - figCx) * scale;
        p.target.y = desiredCy + (p.target.y - figCy) * scale;
    }
    // NOTA: escalar as posições sem escalar as peças quebra a geometria.
    // Como as figuras já foram construídas em tamanho fixo, apenas
    // recentramos — a escala é assumida como 1.
}

function buildLegend(){
    legendEl.innerHTML = '';
    Object.values(PIECES).forEach(def => {
        const el = document.createElement('div');
        el.className = 'legend-item';
        el.dataset.id = def.id;
        el.innerHTML = `<span class="sw" style="background:${def.color}"></span><span class="nm">${def.name}</span>`;
        el.addEventListener('click', () => {
            selectedId = def.id;
            updateLegendActive();
            requestDraw();
        });
        legendEl.appendChild(el);
    });
    updateLegendActive();
}

function updateLegendActive(){
    legendEl.querySelectorAll('.legend-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === selectedId);
    });
}

/* ============================================================================
   ENCAIXE
============================================================================ */
function isPlaced(p){
    if (!p.target) return false;
    const dx = p.x - p.target.x;
    const dy = p.y - p.target.y;
    const d = Math.hypot(dx, dy);
    const aDiff = Math.abs(((p.rot - p.target.rot) % 360 + 540) % 360 - 180);
    const aOk = 180 - aDiff <= SNAP_ANGLE_TOL;
    const fOk = p.flip === p.target.flip;
    return d < SNAP_DIST && aOk && fOk;
}

function snapToTarget(p){
    p.x = p.target.x; p.y = p.target.y;
    p.rot = p.target.rot; p.flip = p.target.flip;
}

function updateScore(){
    let n = 0;
    for (const p of pieces){
        if (isPlaced(p)){ p.placed = true; snapToTarget(p); n++; }
        else p.placed = false;
    }
    scoreEl.textContent = `${n} / 7`;
    scoreEl.classList.toggle('ok', n === 7);
    if (n === 7 && !won){
        won = true;
        setTimeout(showWin, 400);
    }
    return n;
}

function showWin(){
    winText.textContent = `Completou a figura "${currentModel.name}" com as 7 peças tradicionais do tangram!`;
    winModal.classList.add('active');
    awardPoints();
}

/* ============================================================================
   RENDER
============================================================================ */
function requestDraw(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; draw(); });
}

function draw(){
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawGrid();
    drawTrayDivider();
    drawSilhouette();

    const sorted = [...pieces].sort((a, b) => {
        const ap = a.placed ? 1 : 0, bp = b.placed ? 1 : 0;
        if (ap !== bp) return ap - bp;
        if (a.id === selectedId) return 1;
        if (b.id === selectedId) return -1;
        return 0;
    });
    sorted.forEach(drawPiece);
}

function drawGrid(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.05)' : 'rgba(15,23,42,.05)';
    ctx.lineWidth = 1;
    const g = 40;
    for (let x = 0; x <= CANVAS_W; x += g){
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
    }
    for (let y = 0; y <= CANVAS_H; y += g){
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
    }
    ctx.restore();
}

function drawTrayDivider(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(148,163,184,.18)' : 'rgba(15,23,42,.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 8]);
    ctx.beginPath();
    ctx.moveTo(0, TRAY_TOP);
    ctx.lineTo(CANVAS_W, TRAY_TOP);
    ctx.stroke();
    ctx.restore();
}

function drawSilhouette(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    for (const p of pieces){
        if (!p.target) continue;
        const def = PIECES[p.id];
        const verts = def.verts.map(v => transform(v, p.target.rot, p.target.flip, p.target.x, p.target.y));

        ctx.beginPath();
        verts.forEach(([x,y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
        ctx.closePath();
        ctx.fillStyle = dark ? 'rgba(56,189,248,.06)' : 'rgba(56,189,248,.09)';
        ctx.fill();
        ctx.strokeStyle = dark ? 'rgba(148,163,184,.4)' : 'rgba(100,116,139,.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
    }
}

function drawPiece(p){
    const def = PIECES[p.id];
    const verts = def.verts.map(v => transform(v, p.rot, p.flip, p.x, p.y));
    const sel = p.id === selectedId;

    ctx.save();

    // Sombra
    ctx.shadowColor = 'rgba(0,0,0,.4)';
    ctx.shadowBlur = sel ? 18 : 8;
    ctx.shadowOffsetY = sel ? 4 : 2;

    // Corpo
    ctx.beginPath();
    verts.forEach(([x,y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.closePath();
    ctx.fillStyle = def.color;
    ctx.fill();

    // Reset sombra
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    // Gradiente
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const [x,y] of verts){
        if (x < minX) minX = x; if (y < minY) minY = y;
        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
    }
    const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
    grad.addColorStop(0, 'rgba(255,255,255,.28)');
    grad.addColorStop(1, 'rgba(0,0,0,.18)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Borda
    if (sel){
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = .4;
        ctx.strokeStyle = def.color;
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.globalAlpha = 1;
    } else if (p.placed){
        ctx.strokeStyle = 'rgba(52,211,153,.95)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    } else {
        ctx.strokeStyle = 'rgba(0,0,0,.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

/* ============================================================================
   INTERAÇÃO
============================================================================ */
function getCanvasPos(clientX, clientY){
    const r = cv.getBoundingClientRect();
    return {
        x: (clientX - r.left) * (CANVAS_W / r.width),
        y: (clientY - r.top) * (CANVAS_H / r.height)
    };
}

function pointInPoly(px, py, verts){
    let inside = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++){
        const [xi, yi] = verts[i];
        const [xj, yj] = verts[j];
        if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)){
            inside = !inside;
        }
    }
    return inside;
}

function findPieceAt(x, y){
    for (let i = pieces.length - 1; i >= 0; i--){
        const p = pieces[i];
        const verts = PIECES[p.id].verts.map(v => transform(v, p.rot, p.flip, p.x, p.y));
        if (pointInPoly(x, y, verts)) return p;
    }
    return null;
}

function bringToFront(p){
    const i = pieces.indexOf(p);
    if (i >= 0){ pieces.splice(i, 1); pieces.push(p); }
}

function selectPiece(p){
    selectedId = p ? p.id : null;
    updateLegendActive();
}

cv.addEventListener('mousedown', e => {
    e.preventDefault();
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
});

cv.addEventListener('mousemove', e => {
    if (!dragging || !selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const { x, y } = getCanvasPos(e.clientX, e.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
});

window.addEventListener('mouseup', () => {
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
});

cv.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    const p = findPieceAt(x, y);
    if (p){
        selectPiece(p);
        dragging = true;
        dragOffX = x - p.x;
        dragOffY = y - p.y;
        bringToFront(p);
    } else {
        selectPiece(null);
    }
    requestDraw();
}, { passive: false });

cv.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dragging || !selectedId || e.touches.length !== 1) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    const t = e.touches[0];
    const { x, y } = getCanvasPos(t.clientX, t.clientY);
    p.x = x - dragOffX;
    p.y = y - dragOffY;
    p.placed = false;
    requestDraw();
}, { passive: false });

cv.addEventListener('touchend', e => {
    e.preventDefault();
    if (dragging){ updateScore(); requestDraw(); }
    dragging = false;
}, { passive: false });

/* ============================================================================
   ROTAÇÃO / FLIP / TECLADO
============================================================================ */
function rotateSelected(delta){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.rot = normDeg(p.rot + delta);
    p.placed = false;
    updateScore();
    requestDraw();
}
function flipSelected(){
    if (!selectedId) return;
    const p = pieces.find(q => q.id === selectedId);
    if (!p) return;
    p.flip = !p.flip;
    p.placed = false;
    updateScore();
    requestDraw();
}

document.getElementById('btn-rot-l').addEventListener('click', () => rotateSelected(-15));
document.getElementById('btn-rot-r').addEventListener('click', () => rotateSelected(15));
document.getElementById('btn-flip').addEventListener('click', flipSelected);

window.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r'){ e.preventDefault(); rotateSelected(e.shiftKey ? -15 : 15); }
    else if (k === 'f'){ e.preventDefault(); flipSelected(); }
    else if (k.startsWith('arrow') && selectedId){
        const p = pieces.find(q => q.id === selectedId);
        if (!p) return;
        e.preventDefault();
        const step = e.shiftKey ? 10 : 2;
        if (k === 'arrowleft') p.x -= step;
        if (k === 'arrowright') p.x += step;
        if (k === 'arrowup') p.y -= step;
        if (k === 'arrowdown') p.y += step;
        p.placed = false;
        updateScore();
        requestDraw();
    }
});

/* ============================================================================
   FIREBASE
============================================================================ */
async function awardPoints(){
    try {
        const s = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!s || !s.chave) return;
        const r = ref(db, 'jogadores/' + s.chave);
        const snap = await get(r);
        if (snap.exists()){
            await update(r, { pontos: (snap.val().pontos || 0) + 40 });
        }
    } catch (err){
        console.warn('Falha ao registar pontos:', err);
    }
}

/* ============================================================================
   TEMA
============================================================================ */
function initTheme(){
    const saved = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    themeBtn.textContent = saved === 'dark' ? '🌙' : '☀️';
}
themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('brain_flow_theme', next);
    requestDraw();
});

/* ============================================================================
   BOTÕES
============================================================================ */
document.getElementById('btn-new').addEventListener('click', initGame);
document.getElementById('next').addEventListener('click', initGame);

/* ============================================================================
   ARRANQUE
============================================================================ */
initTheme();
initGame();
</script>
