<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tangram — Brain Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.72);
    --card-border: rgba(148, 163, 184, 0.15);
    --card-glow: rgba(99, 102, 241, 0.25);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --border-color: rgba(148, 163, 184, 0.18);
    --border-strong: rgba(148, 163, 184, 0.35);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-green: #4ade80;
    --c-blue: #38bdf8;
    --c-amber: #f59e0b;
    --board-bg: rgba(15, 23, 42, 0.55);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --t-fast: 0.15s ease;
    --t-base: 0.25s ease;
    --t-slow: 0.4s ease;
}

[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-glow: rgba(99, 102, 241, 0.15);
    --text-color: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;
    --border-color: rgba(15, 23, 42, 0.1);
    --border-strong: rgba(15, 23, 42, 0.25);
    --input-bg: rgba(255, 255, 255, 0.95);
    --board-bg: rgba(248, 250, 252, 0.9);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}

body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.3;
    z-index: -1;
    pointer-events: none;
}
body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
body::after  { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
    opacity: 0.9;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}

.btn-small {
    width: auto;
    margin: 0;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--t-base);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    text-decoration: none;
}
.btn-small:hover {
    color: var(--text-color);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.user-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    background: var(--input-bg);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
}
.user-info-left { display: flex; align-items: center; gap: 10px; }
.user-avatar-display {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    font-size: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
    border: 1px solid rgba(99, 102, 241, 0.4);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
}
#display-nome { font-size: 14px; font-weight: 700; }
.game-name {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 11px;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 2px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.02);
}
.score-board strong {
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: none;
}
#display-fase  { color: var(--c-blue); }
#display-pecas { color: var(--c-green); }
#display-tempo { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    line-height: 1.5;
    min-height: 18px;
}

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 460px;
    margin: 0 auto 12px;
    border-radius: 14px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
        var(--board-bg);
    background-image:
        linear-gradient(var(--board-bg), var(--board-bg)),
        linear-gradient(135deg,
            rgba(99, 102, 241, 0.55) 0%,
            rgba(139, 92, 246, 0.35) 30%,
            rgba(56, 189, 248, 0.30) 65%,
            rgba(99, 102, 241, 0.45) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border: 2px solid transparent;
    box-shadow:
        0 12px 40px -14px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--card-border),
        0 0 24px -6px rgba(99, 102, 241, 0.35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#tangram-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

#silhouette {
    fill: rgba(99, 102, 241, 0.14);
    stroke: rgba(99, 102, 241, 0.75);
    stroke-width: 2.5;
    stroke-dasharray: 8 6;
    stroke-linejoin: round;
    transition: fill var(--t-slow), stroke var(--t-slow);
}
#silhouette.completed {
    fill: rgba(34, 197, 94, 0.20);
    stroke: rgba(34, 197, 94, 0.9);
    stroke-dasharray: none;
}

.piece {
    cursor: grab;
    transition: filter var(--t-base);
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
    touch-action: none;
}
.piece:hover { filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5)) brightness(1.12); }
.piece.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.65)) brightness(1.18);
}
.piece.selected {
    filter: drop-shadow(0 0 6px rgba(99,102,241,1)) brightness(1.15);
}
.piece.locked {
    cursor: default;
    filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.85)) brightness(1.05);
}
.piece.solving {
    animation: solveGlow 0.7s ease;
}
@keyframes solveGlow {
    0%   { filter: drop-shadow(0 0 0 rgba(34,197,94,0)); }
    40%  { filter: drop-shadow(0 0 24px rgba(34,197,94,1)) brightness(1.3); }
    100% { filter: drop-shadow(0 0 12px rgba(34,197,94,0.85)) brightness(1.05); }
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
.controls-grid.triple {
    grid-template-columns: 1fr 1fr 1fr;
}

select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    background: var(--input-bg);
    color: var(--text-color);
    cursor: pointer;
    transition: border-color var(--t-base), box-shadow var(--t-base);
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 36px;
}
select:focus {
    outline: none;
    border-color: var(--btn-primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
}

button.action {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    box-shadow: var(--shadow-btn);
    transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
}
button.action:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
}
button.action:active { transform: translateY(0); filter: brightness(0.97); }

button.secondary {
    background: linear-gradient(135deg, #475569, #334155);
    box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.6);
}
button.secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }

button.magic {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1c1917;
    font-weight: 800;
    box-shadow: 0 6px 20px -6px rgba(245, 158, 11, 0.6);
}
button.magic:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px -8px rgba(245, 158, 11, 0.8);
}

button.auto {
    background: linear-gradient(135deg, #ec4899, #d946ef);
    color: #fff;
    box-shadow: 0 6px 20px -6px rgba(217, 70, 239, 0.6);
}
button.auto:hover {
    box-shadow: 0 10px 28px -8px rgba(217, 70, 239, 0.8);
}

.back-float {
    position: fixed;
    bottom: 84px;
    right: 20px;
    z-index: 998;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border-strong);
    color: var(--text-color);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transition: opacity var(--t-base), transform var(--t-base), border-color var(--t-base);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    text-decoration: none;
}
.back-float.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}
.back-float:hover {
    transform: translateY(-3px) scale(1.05);
    border-color: var(--btn-primary);
}
@media (min-width: 769px) { .back-float { bottom: 24px; } }

@media (max-width: 440px) {
    body { padding: 10px; }
    .container { padding: 16px 14px 18px; border-radius: 16px; max-width: 100%; }
    .score-board { font-size: 10px; }
    .score-board strong { font-size: 13px; }
    .game-name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
    }
}

:focus-visible { outline: 2px solid var(--btn-primary); outline-offset: 2px; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-small">⬅ Menu Hub</a>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>
    </div>

    <div class="user-header">
        <div class="user-info-left">
            <span id="display-avatar" class="user-avatar-display">😀</span>
            <strong id="display-nome"></strong>
        </div>
        <span class="game-name">Tangram</span>
    </div>

    <div class="score-board">
        <div>Desafio<br><strong id="display-fase">Quadrado</strong></div>
        <div>Peças<br><strong id="display-pecas">0/7</strong></div>
        <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">
        Arraste as peças para a silhueta. Toque em <b>↺ ↻</b> para rotacionar, <b>⇋</b> para virar.
    </p>

    <div class="board-wrapper" id="board-wrapper">
        <svg id="tangram-svg" viewBox="-40 -40 400 400" preserveAspectRatio="xMidYMid meet">
            <polygon id="silhouette" points=""></polygon>
            <g id="pieces-layer"></g>
        </svg>
    </div>

    <div class="controls-grid">
        <select id="select-desafio">
            <option value="square" selected>⬛ Quadrado</option>
            <option value="free">🎨 Modo Livre</option>
        </select>
        <button id="btn-shuffle" class="action secondary">🔀 Embaralhar</button>
    </div>

    <div class="controls-grid triple" style="margin-top: 8px;">
        <button id="btn-rotate-l" class="action secondary">↺ -45°</button>
        <button id="btn-rotate-r" class="action secondary">↻ +45°</button>
        <button id="btn-flip" class="action secondary">⇋ Virar</button>
    </div>

    <div class="controls-grid" style="grid-template-columns: 1fr 1fr 1fr; margin-top: 8px;">
        <button id="btn-hint" class="action magic">💡 Dica</button>
        <button id="btn-auto" class="action magic auto">✨ Auto</button>
        <button id="btn-reset" class="action">🔄 Reiniciar</button>
    </div>
</div>

<a href="index.html" id="btn-back-float" class="back-float" title="Voltar ao Menu Hub" aria-label="Voltar ao Menu Hub">⬅</a>

<script>
(function () {
    "use strict";

    const ESCALA = 40;
    function p(x, y) { return [(x - 1) * ESCALA, (y - 1) * ESCALA]; }

    const PECAS_BASE = [
        { id: 'T1', cor: '#6366f1', pontos: [p(1,1), p(5,5), p(1,9)] },
        { id: 'T2', cor: '#8b5cf6', pontos: [p(1,1), p(9,1), p(5,5)] },
        { id: 'TM', cor: '#ec4899', pontos: [p(9,1), p(9,5), p(5,5)] },
        { id: 'T3', cor: '#14b8a6', pontos: [p(5,5), p(9,5), p(7,7)] },
        { id: 'T4', cor: '#f59e0b', pontos: [p(5,5), p(7,7), p(5,9)] },
        { id: 'Q',  cor: '#06b6d4', pontos: [p(5,5), p(7,3), p(9,5), p(7,7)] },
        { id: 'P',  cor: '#d946ef', pontos: [p(1,1), p(1,5), p(3,7), p(5,3)] }
    ];

    const SOLUCOES = {
        square: PECAS_BASE.map(pc => ({ id: pc.id, dx: 0, dy: 0, rot: 0, flip: false }))
    };

    function centroide(pontos) {
        let x = 0, y = 0;
        for (const pt of pontos) { x += pt[0]; y += pt[1]; }
        return [x / pontos.length, y / pontos.length];
    }

    function rotacionarPonto(pt, cx, cy, rot) {
        const rad = rot * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const px = pt[0] - cx, py = pt[1] - cy;
        return [cos * px - sin * py + cx, sin * px + cos * py + cy];
    }

    function transformarPeca(pecaBase, dx, dy, rot, flip) {
        const [cx, cy] = centroide(pecaBase.pontos);
        return pecaBase.pontos.map(pt => {
            let q = [pt[0], pt[1]];
            if (flip) q = [2 * cx - q[0], q[1]];
            q = rotacionarPonto(q, cx, cy, rot);
            return [q[0] + dx, q[1] + dy];
        });
    }

    function pontosParaString(pontos) {
        return pontos.map(pt => `${pt[0].toFixed(2)},${pt[1].toFixed(2)}`).join(' ');
    }

    function convexHull(pontos) {
        if (pontos.length < 3) return pontos;
        const pts = pontos.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
        const lower = [];
        for (const pt of pts) {
            while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], pt) <= 0) lower.pop();
            lower.push(pt);
        }
        const upper = [];
        for (let i = pts.length - 1; i >= 0; i--) {
            const pt = pts[i];
            while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], pt) <= 0) upper.pop();
            upper.push(pt);
        }
        upper.pop(); lower.pop();
        return lower.concat(upper);
    }

    const estado = {
        pecas: [],
        selecionada: null,
        dragging: null,
        desafio: 'square',
        colocadas: 0,
        segundos: 0,
        timer: null
    };

    const svg = document.getElementById('tangram-svg');
    const piecesLayer = document.getElementById('pieces-layer');
    const silhouette = document.getElementById('silhouette');
    const boardWrapper = document.getElementById('board-wrapper');

    const displayFase = document.getElementById('display-fase');
    const displayPecas = document.getElementById('display-pecas');
    const displayTempo = document.getElementById('display-tempo');
    const infoInstrucao = document.getElementById('info-instrucao');
    const selectDesafio = document.getElementById('select-desafio');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRotateL = document.getElementById('btn-rotate-l');
    const btnRotateR = document.getElementById('btn-rotate-r');
    const btnFlip = document.getElementById('btn-flip');
    const btnReset = document.getElementById('btn-reset');
    const themeToggle = document.getElementById('theme-toggle');
    const btnBackFloat = document.getElementById('btn-back-float');

    let audioCtx = null;
    function tocarSom(tipo) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (tipo === 'encaixe') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);
            } else if (tipo === 'auto') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (tipo === 'vitoria') {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                    g.gain.setValueAtTime(0.09, audioCtx.currentTime + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.25);
                    o.start(audioCtx.currentTime + i * 0.1);
                    o.stop(audioCtx.currentTime + i * 0.1 + 0.25);
                });
            }
        } catch (_) {}
    }

    function desenharSilhueta() {
        if (estado.desafio === 'free') {
            silhouette.setAttribute('points', '');
            silhouette.style.display = 'none';
            return;
        }
        silhouette.style.display = '';

        const solucao = SOLUCOES[estado.desafio];
        if (!solucao) return;

        const todosPontos = [];
        for (const item of solucao) {
            const peca = PECAS_BASE.find(pc => pc.id === item.id);
            if (!peca) continue;
            const pts = transformarPeca(peca, item.dx, item.dy, item.rot, item.flip);
            todosPontos.push(...pts);
        }
        const hull = convexHull(todosPontos);
        silhouette.setAttribute('points', pontosParaString(hull));
    }

    function renderizarPecas() {
        piecesLayer.innerHTML = '';
        const ordenadas = [...estado.pecas].sort((a, b) => {
            const aTop = (estado.dragging && estado.dragging.id === a.id) || estado.selecionada === a.id ? 1 : 0;
            const bTop = (estado.dragging && estado.dragging.id === b.id) || estado.selecionada === b.id ? 1 : 0;
            return aTop - bTop;
        });

        for (const p of ordenadas) {
            const pts = transformarPeca(p.base, p.dx, p.dy, p.rot, p.flip);
            const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            el.setAttribute('points', pontosParaString(pts));
            el.setAttribute('fill', p.cor);
            el.setAttribute('stroke', 'rgba(255,255,255,0.6)');
            el.setAttribute('stroke-width', '1.5');
            el.setAttribute('stroke-linejoin', 'round');
            el.classList.add('piece');
            if (p.travada) el.classList.add('locked');
            if (estado.selecionada === p.id) el.classList.add('selected');
            if (estado.dragging && estado.dragging.id === p.id) el.classList.add('dragging');
            el.dataset.id = p.id;
            el.addEventListener('pointerdown', onPointerDown);
            piecesLayer.appendChild(el);
        }
    }

    const VB_MIN = -40;
    const VB_SIZE = 400;

    function getSVGPoint(evt) {
        const rect = svg.getBoundingClientRect();
        const x = VB_MIN + (evt.clientX - rect.left) / rect.width * VB_SIZE;
        const y = VB_MIN + (evt.clientY - rect.top) / rect.height * VB_SIZE;
        return [x, y];
    }

    function onPointerDown(evt) {
        const id = evt.currentTarget.dataset.id;
        const peca = estado.pecas.find(p => p.id === id);
        if (!peca || peca.travada) return;

        evt.preventDefault();
        estado.selecionada = id;

        const [px, py] = getSVGPoint(evt);
        const [cx, cy] = centroide(transformarPeca(peca.base, peca.dx, peca.dy, peca.rot, peca.flip));
        estado.dragging = { id, offsetX: cx - px, offsetY: cy - py };

        try { svg.setPointerCapture(evt.pointerId); } catch (_) {}
        svg.addEventListener('pointermove', onPointerMove);
        svg.addEventListener('pointerup', onPointerUp);
        svg.addEventListener('pointercancel', onPointerUp);

        renderizarPecas();
    }

    function onPointerMove(evt) {
        if (!estado.dragging) return;
        evt.preventDefault();
        const peca = estado.pecas.find(p => p.id === estado.dragging.id);
        if (!peca) return;

        const [px, py] = getSVGPoint(evt);
        const targetCx = px + estado.dragging.offsetX;
        const targetCy = py + estado.dragging.offsetY;

        const [cx0, cy0] = centroide(transformarPeca(peca.base, 0, 0, peca.rot, peca.flip));
        peca.dx = targetCx - cx0;
        peca.dy = targetCy - cy0;

        renderizarPecas();
    }

    function onPointerUp(evt) {
        svg.removeEventListener('pointermove', onPointerMove);
        svg.removeEventListener('pointerup', onPointerUp);
        svg.removeEventListener('pointercancel', onPointerUp);
        try { svg.releasePointerCapture(evt.pointerId); } catch (_) {}

        if (estado.dragging) {
            tentarEncaixe(estado.dragging.id);
        }
        estado.dragging = null;
        renderizarPecas();
        verificarConclusao();
    }

    function rotacionarSelecionada(delta) {
        if (!estado.selecionada) {
            infoInstrucao.textContent = '⚠️ Toque numa peça para selecioná-la primeiro.';
            return;
        }
        const peca = estado.pecas.find(p => p.id === estado.selecionada);
        if (!peca || peca.travada) return;

        const atual = transformarPeca(peca.base, peca.dx, peca.dy, peca.rot, peca.flip);
        const [cxAtual, cyAtual] = centroide(atual);

        peca.rot = (peca.rot + delta) % 360;
        if (peca.rot < 0) peca.rot += 360;

        const [cxBase, cyBase] = centroide(peca.base.pontos);
        peca.dx = cxAtual - cxBase;
        peca.dy = cyAtual - cyBase;

        renderizarPecas();
        tentarEncaixe(peca.id);
        verificarConclusao();
    }

    function flipSelecionada() {
        if (!estado.selecionada) {
            infoInstrucao.textContent = '⚠️ Toque numa peça para selecioná-la primeiro.';
            return;
        }
        const peca = estado.pecas.find(p => p.id === estado.selecionada);
        if (!peca || peca.travada) return;

        const atual = transformarPeca(peca.base, peca.dx, peca.dy, peca.rot, peca.flip);
        const [cxAtual, cyAtual] = centroide(atual);

        peca.flip = !peca.flip;

        const [cxBase, cyBase] = centroide(peca.base.pontos);
        peca.dx = cxAtual - cxBase;
        peca.dy = cyAtual - cyBase;

        renderizarPecas();
        tentarEncaixe(peca.id);
        verificarConclusao();
    }

    const TOLERANCIA_POS = 30;
    const TOLERANCIA_ROT = 22;

    function normalizarAngulo(a) {
        a = a % 360;
        if (a < 0) a += 360;
        return a;
    }

    function diferencaAngular(a, b) {
        const d = Math.abs(normalizarAngulo(a) - normalizarAngulo(b));
        return Math.min(d, 360 - d);
    }

    function rotacaoCompativel(rotAtual, rotAlvo) {
        const proximos = [0, 45, 90, 135, 180, 225, 270, 315];
        for (const r of proximos) {
            if (diferencaAngular(rotAtual, r) <= TOLERANCIA_ROT &&
                diferencaAngular(r, rotAlvo) <= TOLERANCIA_ROT) {
                return r;
            }
        }
        if (diferencaAngular(rotAtual, rotAlvo) <= TOLERANCIA_ROT) return rotAlvo;
        return null;
    }

    function verticesAlvo(pecaId) {
        const solucao = SOLUCOES[estado.desafio];
        if (!solucao) return null;
        const item = solucao.find(s => s.id === pecaId);
        if (!item) return null;
        const pecaBase = PECAS_BASE.find(p => p.id === pecaId);
        return transformarPeca(pecaBase, item.dx, item.dy, item.rot, item.flip);
    }

    function tentarEncaixe(pecaId) {
        if (estado.desafio === 'free') return;
        const peca = estado.pecas.find(p => p.id === pecaId);
        if (!peca || peca.travada) return;

        const solucao = SOLUCOES[estado.desafio];
        if (!solucao) return;
        const item = solucao.find(s => s.id === pecaId);
        if (!item) return;

        const rotCompativel = rotacaoCompativel(peca.rot, item.rot);
        if (rotCompativel === null) return;

        if (peca.id === 'P' && peca.flip !== item.flip) return;

        const alvo = verticesAlvo(pecaId);
        const atual = transformarPeca(peca.base, peca.dx, peca.dy, peca.rot, peca.flip);

        let piorDist = 0;
        for (const pt of atual) {
            let melhor = Infinity;
            for (const q of alvo) {
                const d = Math.hypot(pt[0] - q[0], pt[1] - q[1]);
                if (d < melhor) melhor = d;
            }
            if (melhor > piorDist) piorDist = melhor;
        }

        if (piorDist <= TOLERANCIA_POS) {
            peca.dx = item.dx;
            peca.dy = item.dy;
            peca.rot = item.rot;
            peca.flip = item.flip;
            peca.travada = true;
            estado.colocadas = estado.pecas.filter(p => p.travada).length;
            displayPecas.textContent = `${estado.colocadas}/7`;
            infoInstrucao.textContent = `✅ Peça encaixada! ${7 - estado.colocadas} restantes.`;

            tocarSom('encaixe');
            if (navigator.vibrate) navigator.vibrate(40);
        }
    }

    function verificarConclusao() {
        if (estado.desafio === 'free') return;
        if (estado.colocadas === 7) {
            pararTimer();
            silhouette.classList.add('completed');
            infoInstrucao.textContent = `🎉 Parabéns! Concluiu em ${formatarTempo(estado.segundos)}.`;
            tocarSom('vitoria');
            if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
        }
    }

    function formatarTempo(s) {
        const m = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        return `${m}:${ss}`;
    }

    function iniciarTimer() {
        pararTimer();
        estado.segundos = 0;
        displayTempo.textContent = '00:00';
        estado.timer = setInterval(() => {
            estado.segundos++;
            displayTempo.textContent = formatarTempo(estado.segundos);
        }, 1000);
    }

    function pararTimer() {
        if (estado.timer) clearInterval(estado.timer);
        estado.timer = null;
    }

    function posicoesIniciais() {
        const resultado = [];
        const zonas = [
            { x: -30, y: -30 },
            { x: 220, y: -30 },
            { x: -30, y: 220 },
            { x: 220, y: 220 }
        ];
        const zonaPorPeca = { T1: 0, T2: 2, TM: 1, T3: 1, T4: 2, Q: 3, P: 3 };

        PECAS_BASE.forEach((peca) => {
            const zona = zonas[zonaPorPeca[peca.id] ?? 0];
            const baseCentro = centroide(peca.pontos);
            const jitterX = (Math.random() - 0.5) * 30;
            const jitterY = (Math.random() - 0.5) * 30;

            const alvoX = zona.x + 60 + jitterX;
            const alvoY = zona.y + 60 + jitterY;

            resultado.push({
                id: peca.id,
                base: peca,
                cor: peca.cor,
                dx: alvoX - baseCentro[0],
                dy: alvoY - baseCentro[1],
                rot: (Math.floor(Math.random() * 8) * 45) % 360,
                flip: false,
                travada: false
            });
        });

        return resultado;
    }

    function resetar() {
        estado.pecas = posicoesIniciais();
        estado.selecionada = null;
        estado.colocadas = 0;
        displayPecas.textContent = '0/7';
        silhouette.classList.remove('completed');

        const nomes = { square: 'Quadrado', free: 'Livre' };
        displayFase.textContent = nomes[estado.desafio] || 'Quadrado';

        if (estado.desafio === 'free') {
            infoInstrucao.textContent = '🎨 Modo livre: arraste e rotacione as peças como quiser.';
        } else {
            infoInstrucao.textContent = 'Arraste as 7 peças para dentro da silhueta.';
        }

        desenharSilhueta();
        renderizarPecas();
        iniciarTimer();
    }

    function moverPecaParaAlvo(peca, duracaoMs, aoFinal) {
        const solucao = SOLUCOES[estado.desafio];
        if (!solucao) { if (aoFinal) aoFinal(); return; }
        const item = solucao.find(s => s.id === peca.id);
        if (!item) { if (aoFinal) aoFinal(); return; }

        const dxIni = peca.dx, dyIni = peca.dy;
        const rotIni = peca.rot;

        let rotAlvo = item.rot;
        let diff = rotAlvo - rotIni;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        rotAlvo = rotIni + diff;

        const t0 = performance.now();
        function animar(t) {
            const prog = Math.min(1, (t - t0) / duracaoMs);
            const e = 1 - Math.pow(1 - prog, 3);

            peca.dx = dxIni + (item.dx - dxIni) * e;
            peca.dy = dyIni + (item.dy - dyIni) * e;
            peca.rot = rotIni + (rotAlvo - rotIni) * e;

            renderizarPecas();

            if (prog < 1) {
                requestAnimationFrame(animar);
            } else {
                peca.dx = item.dx;
                peca.dy = item.dy;
                peca.rot = item.rot;
                peca.flip = item.flip;
                peca.travada = true;
                estado.colocadas = estado.pecas.filter(p => p.travada).length;
                displayPecas.textContent = `${estado.colocadas}/7`;
                renderizarPecas();

                const el = piecesLayer.querySelector(`[data-id="${peca.id}"]`);
                if (el) {
                    el.classList.add('solving');
                    setTimeout(() => el.classList.remove('solving'), 700);
                }

                if (aoFinal) aoFinal();
            }
        }
        requestAnimationFrame(animar);
    }

    function darDica() {
        if (estado.desafio === 'free') {
            infoInstrucao.textContent = '🎨 Modo livre não tem dica — é pura criatividade!';
            return;
        }
        const pendentes = estado.pecas.filter(p => !p.travada);
        if (pendentes.length === 0) {
            infoInstrucao.textContent = '🎉 Todas as peças já foram encaixadas!';
            return;
        }

        const solucao = SOLUCOES[estado.desafio];
        let melhor = null, melhorDist = Infinity;
        for (const p of pendentes) {
            const item = solucao.find(s => s.id === p.id);
            if (!item) continue;
            const d = Math.hypot(p.dx - item.dx, p.dy - item.dy);
            if (d < melhorDist) { melhorDist = d; melhor = p; }
        }

        if (melhor) {
            infoInstrucao.textContent = `💡 Dica: encaixando "${melhor.id}"...`;
            moverPecaParaAlvo(melhor, 600, () => {
                tocarSom('encaixe');
                if (navigator.vibrate) navigator.vibrate(30);
                infoInstrucao.textContent = `💡 "${melhor.id}" encaixada! ${7 - estado.colocadas} restantes.`;
                verificarConclusao();
            });
        }
    }

    let autoEmProgresso = false;
    function autoResolver() {
        if (estado.desafio === 'free') {
            infoInstrucao.textContent = '🎨 Modo livre não tem resolução automática.';
            return;
        }
        if (autoEmProgresso) return;
        autoEmProgresso = true;

        const pendentes = estado.pecas.filter(p => !p.travada);
        if (pendentes.length === 0) {
            infoInstrucao.textContent = '🎉 Já está resolvido!';
            autoEmProgresso = false;
            return;
        }

        infoInstrucao.textContent = '✨ A resolver...';
        tocarSom('auto');

        const solucao = SOLUCOES[estado.desafio];
        const ordenadas = pendentes
            .map(p => {
                const item = solucao.find(s => s.id === p.id);
                const dist = item ? Math.hypot(p.dx - item.dx, p.dy - item.dy) : Infinity;
                return { p, dist };
            })
            .sort((a, b) => a.dist - b.dist)
            .map(o => o.p);

        ordenadas.forEach((peca, idx) => {
            setTimeout(() => {
                moverPecaParaAlvo(peca, 500, () => {
                    tocarSom('encaixe');
                    if (navigator.vibrate) navigator.vibrate(20);
                    if (idx === ordenadas.length - 1) {
                        infoInstrucao.textContent = '✨ Puzzle resolvido automaticamente!';
                        verificarConclusao();
                        autoEmProgresso = false;
                    }
                });
            }, idx * 180);
        });
    }

    selectDesafio.addEventListener('change', () => {
        estado.desafio = selectDesafio.value;
        resetar();
    });

    btnShuffle.addEventListener('click', resetar);
    btnReset.addEventListener('click', resetar);
    btnRotateL.addEventListener('click', () => rotacionarSelecionada(-45));
    btnRotateR.addEventListener('click', () => rotacionarSelecionada(+45));
    btnFlip.addEventListener('click', flipSelecionada);
    document.getElementById('btn-hint').addEventListener('click', darDica);
    document.getElementById('btn-auto').addEventListener('click', autoResolver);

    boardWrapper.addEventListener('wheel', (e) => {
        if (!estado.selecionada) return;
        e.preventDefault();
        rotacionarSelecionada(e.deltaY > 0 ? +15 : -15);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') rotacionarSelecionada(+45);
        if (e.key === 'f' || e.key === 'F') flipSelecionada();
        if (e.key === 'ArrowLeft')  { e.preventDefault(); rotacionarSelecionada(-15); }
        if (e.key === 'ArrowRight') { e.preventDefault(); rotacionarSelecionada(+15); }
        if (e.key === 'Escape') { estado.selecionada = null; renderizarPecas(); }
    });

    const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    atualizarTextoBotaoTema(savedTheme);

    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
        atualizarTextoBotaoTema(next);
    });

    function atualizarTextoBotaoTema(theme) {
        themeToggle.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    }

    try {
        const jogador = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (jogador) {
            document.getElementById('display-nome').textContent = jogador.nome;
            document.getElementById('display-avatar').textContent = jogador.avatar;
        } else {
            document.getElementById('display-nome').textContent = 'Visitante';
        }
    } catch (_) {
        document.getElementById('display-nome').textContent = 'Visitante';
    }

    function atualizarBackFloat() {
        const scrolled = window.scrollY || document.documentElement.scrollTop || 0;
        if (scrolled > 120) btnBackFloat.classList.add('visible');
        else btnBackFloat.classList.remove('visible');
    }
    window.addEventListener('scroll', atualizarBackFloat, { passive: true });
    atualizarBackFloat();

    resetar();
})();
</script>
</body>
</html>
