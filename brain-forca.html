<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo da Forca — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 500px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

/* ==========================================================
   CONTROLES DE TEMA / DIFICULDADE
   ========================================================== */
.setup-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}
.setup-switch select {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    outline: none;
}

/* ==========================================================
   PLACAR
   ========================================================== */
.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-tema { color: var(--c-cyan); }
#display-vidas { color: var(--c-red); }
#display-recorde { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

/* ==========================================================
   ÁREA DE JOGO — FORCA + PALAVRA
   ========================================================== */
.game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
}
.forca-wrapper {
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
.forca-svg {
    width: 100%;
    height: 100%;
    stroke: var(--text-color);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.forca-svg .parte {
    opacity: 0;
    transition: opacity 0.3s ease;
}
.forca-svg .parte.visivel {
    opacity: 1;
    animation: aparecer-parte 0.4s ease;
}
@keyframes aparecer-parte {
    0% { opacity: 0; transform: scale(0.8); transform-origin: center; }
    100% { opacity: 1; transform: scale(1); }
}
.forca-svg .base {
    stroke: var(--text-muted);
    opacity: 0.6;
}

.info-jogo {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    text-align: left;
}
.dica-box {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 12px;
}
.dica-label {
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--c-cyan);
    margin-bottom: 4px;
}
.dica-texto {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-color);
    line-height: 1.3;
}
.vida-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
}
.vida-box .label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
}
.vida-box .vidas {
    display: flex;
    gap: 3px;
    font-size: 16px;
}
.vida-box .vida {
    transition: all 0.3s ease;
}
.vida-box .vida.perdida {
    opacity: 0.25;
    filter: grayscale(1);
}

/* ==========================================================
   PALAVRA ESCONDIDA
   ========================================================== */
.palavra-wrapper {
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 16px 10px;
    margin-bottom: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 64px;
}
.letra-palavra {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 36px;
    padding: 0 4px;
    border-bottom: 3px solid var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(18px, 5vmin, 26px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    transition: all 0.3s ease;
}
.letra-palavra.revelada {
    color: var(--c-green);
    border-color: var(--c-green);
    text-shadow: 0 0 12px var(--c-green);
    animation: revelar 0.4s ease;
}
@keyframes revelar {
    0% { transform: scale(0.6); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
}
.letra-palavra.espaco {
    border-bottom: none;
    min-width: 12px;
}

/* ==========================================================
   TECLADO
   ========================================================== */
.teclado {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 12px;
}
.tecla {
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.55);
    color: var(--text-color);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    -webkit-tap-highlight-color: transparent;
}
.tecla:hover:not(:disabled) {
    background: rgba(99, 102, 241, 0.35);
    border-color: var(--btn-primary);
    transform: translateY(-2px);
}
.tecla:disabled {
    cursor: default;
    opacity: 0.6;
}
.tecla.certa {
    background: rgba(74, 222, 128, 0.3);
    border-color: var(--c-green);
    color: var(--c-green);
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
}
.tecla.errada {
    background: rgba(239, 68, 68, 0.3);
    border-color: var(--c-red);
    color: var(--c-red);
    opacity: 0.5;
    text-decoration: line-through;
}

/* ==========================================================
   CONTROLES
   ========================================================== */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

/* ==========================================================
   OVERLAY
   ========================================================== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.94);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 22px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 42px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay .palavra-revelada {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: var(--c-amber);
    text-shadow: 0 0 12px var(--c-amber);
    padding: 8px 16px;
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: var(--radius-md);
}
.overlay button {
    max-width: 260px;
}
.overlay .trofeu {
    font-size: 56px;
    animation: bounce 1.4s infinite ease-in-out;
}
.overlay .caveira {
    font-size: 56px;
    animation: shake 1s infinite ease-in-out;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
@keyframes shake {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
}

/* Feedback flutuante */
.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.negativo { color: var(--c-red); text-shadow: 0 0 20px var(--c-red); }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}

/* Badge */
.fase-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.fase-badge.ok {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.fase-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}
</style>
</head>

                { p: 'TRANSFERIDOR', d: 'Mede ângulos' },
                { p: 'CALCULADORA', d: 'Faz contas rápido' }
            ]
        },
        musica: {
            nome: 'Música',
            emoji: '🎵',
            facil: [
                { p: 'PIANO', d: 'Instrumento de teclas pretas e brancas' },
                { p: 'TAMBOR', d: 'Instrumento de percussão' },
                { p: 'HARPA', d: 'Instrumento com muitas cordas' },
                { p: 'FLAUTA', d: 'Instrumento de sopro' }
            ],
            medio: [
                { p: 'VIOLINO', d: 'Instrumento de cordas com arco' },
                { p: 'TROMPETE', d: 'Instrumento de metal' },
                { p: 'GUITARRA', d: 'Instrumento de rock' },
                { p: 'SAXOFONE', d: 'Instrumento do jazz' }
            ],
            dificil: [
                { p: 'XILOFONE', d: 'Instrumento de lâminas de madeira' },
                { p: 'ACORDEON', d: 'Instrumento de fole' },
                { p: 'CLARINETE', d: 'Instrumento de sopro de madeira' },
                { p: 'TROMBONE', d: 'Instrumento com vara deslizante' }
            ]
        }
    };

    // Mapeamento do alfabeto para teclado
    var ALFABETO = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    // Ordem das partes da forca
    var PARTES = ['cabeca', 'corpo', 'braco-esq', 'braco-dir', 'perna-esq', 'perna-dir'];

    // ==========================================================
    // ESTADO
    // ==========================================================
    var temaAtual = 'animais';
    var dificuldadeAtual = 'medio';
    var jogoAtivo = false;
    var palavraAtual = '';
    var dicaAtual = '';
    var letrasReveladas = [];        // letras acertadas
    var letrasErradas = [];          // letras erradas
    var erros = 0;
    var maxErros = 6;
    var pontos = 0;
    var acertosConsecutivos = 0;

    // Recordes por tema+dificuldade
    var recordes = {};

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        play: function(freq, type, duration, vol) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(vol || 0.08, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duration + 0.02);
            } catch (e) {}
        },
        clique:  function() { this.play(600, 'triangle', 0.06); },
        acerto:  function() { this.play(880, 'sine', 0.15); },
        erro:    function() {
            this.play(220, 'sawtooth', 0.15);
            var self = this;
            setTimeout(function() { self.play(180, 'sawtooth', 0.2); }, 100);
        },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.22); }, i * 100);
            });
        },
        derrota: function() {
            var self = this;
            [300, 250, 200, 150].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sawtooth', 0.3); }, i * 150);
            });
        }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function normalizar(str) {
        // Remove acentos para comparação simples
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
    }

    function atualizarBadge(texto, classe) {
        var b = $('fase-badge');
        b.textContent = texto;
        b.className = 'fase-badge' + (classe ? ' ' + classe : '');
    }

    function getChaveRecorde() {
        return 'brain_forca_recorde_' + temaAtual + '_' + dificuldadeAtual;
    }

    function carregarRecorde() {
        var chave = getChaveRecorde();
        return parseInt(localStorage.getItem(chave) || '0', 10);
    }

    function salvarRecorde(valor) {
        var chave = getChaveRecorde();
        localStorage.setItem(chave, String(valor));
    }

    function atualizarPlacar() {
        $('display-tema').textContent = BANCO[temaAtual].nome;
        $('display-vidas').textContent = (maxErros - erros) + '/' + maxErros;
        $('display-recorde').textContent = String(carregarRecorde());
    }

    function atualizarVidasVisual() {
        var vidas = maxErros - erros;
        var el = $('vidas-visual');
        var html = '';
        for (var i = 0; i < maxErros; i++) {
            html += '<span class="vida' + (i >= vidas ? ' perdida' : '') + '">❤️</span>';
        }
        el.innerHTML = html;
    }

    // ==========================================================
    // TECLADO
    // ==========================================================
    function montarTeclado() {
        var teclado = $('teclado');
        teclado.innerHTML = '';

        ALFABETO.forEach(function(letra) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'tecla';
            btn.dataset.letra = letra;
            btn.textContent = letra;
            btn.disabled = true;
            btn.addEventListener('click', function() {
                tentarLetra(letra, btn);
            });
            teclado.appendChild(btn);
        });
    }

    function resetarTeclado() {
        var botoes = document.querySelectorAll('.tecla');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = false;
            botoes[i].classList.remove('certa', 'errada');
        }
    }

    function bloquearTeclado(bloquear) {
        var botoes = document.querySelectorAll('.tecla');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = bloquear;
        }
    }

    // ==========================================================
    // PALAVRA ESCONDIDA
    // ==========================================================
    function renderizarPalavra() {
        var wrapper = $('palavra-wrapper');
        wrapper.innerHTML = '';

        for (var i = 0; i < palavraAtual.length; i++) {
            var letra = palavraAtual[i];
            var span = document.createElement('span');
            span.className = 'letra-palavra';

            if (letra === ' ' || letra === '-') {
                span.classList.add('espaco');
                span.textContent = letra === ' ' ? '\u00A0' : '-';
            } else if (letrasReveladas.indexOf(letra) !== -1) {
                span.classList.add('revelada');
                span.textContent = letra;
            } else {
                span.textContent = '\u00A0';
            }

            wrapper.appendChild(span);
        }
    }

    // ==========================================================
    // FORCA
    // ==========================================================
    function atualizarForca() {
        for (var i = 0; i < PARTES.length; i++) {
            var el = $('parte-' + PARTES[i]);
            if (el) {
                if (i < erros) {
                    el.classList.add('visivel');
                } else {
                    el.classList.remove('visivel');
                }
            }
        }
    }

    function limparForca() {
        for (var i = 0; i < PARTES.length; i++) {
            var el = $('parte-' + PARTES[i]);
            if (el) el.classList.remove('visivel');
        }
    }

    // ==========================================================
    // JOGO
    // ==========================================================
    function iniciarJogo() {
        var banco = BANCO[temaAtual][dificuldadeAtual];
        var escolha = banco[Math.floor(Math.random() * banco.length)];

        palavraAtual = escolha.p;
        dicaAtual = escolha.d;

        letrasReveladas = [];
        letrasErradas = [];
        erros = 0;
        jogoAtivo = true;

        $('dica-texto').textContent = dicaAtual;

        limparForca();
        atualizarForca();
        atualizarVidasVisual();
        atualizarPlacar();
        resetarTeclado();
        renderizarPalavra();

        atualizarBadge('👉 Adivinhe a palavra!', '');
        esconderOverlay();

        // Revela letras automáticas (hífens, espaços)
        for (var i = 0; i < palavraAtual.length; i++) {
            var c = palavraAtual[i];
            if (c === '-' || c === ' ') {
                if (letrasReveladas.indexOf(c) === -1) letrasReveladas.push(c);
            }
        }
    }

    function tentarLetra(letra, btn) {
        if (!jogoAtivo) return;
        if (letrasReveladas.indexOf(letra) !== -1) return;
        if (letrasErradas.indexOf(letra) !== -1) return;

        som.clique();

        // Verifica se a letra está na palavra (ignorando acentos)
        var palavraNorm = normalizar(palavraAtual);
        var acertou = false;

        // Verifica cada caractere da palavra
        for (var i = 0; i < palavraAtual.length; i++) {
            if (normalizar(palavraAtual[i]) === letra) {
                acertou = true;
                if (letrasReveladas.indexOf(palavraAtual[i]) === -1) {
                    letrasReveladas.push(palavraAtual[i]);
                }
            }
        }

        if (acertou) {
            btn.classList.add('certa');
            btn.disabled = true;
            som.acerto();
            renderizarPalavra();

            // Verifica se ganhou
            var todasReveladas = true;
            for (var j = 0; j < palavraAtual.length; j++) {
                var c = palavraAtual[j];
                if (c === '-' || c === ' ') continue;
                if (letrasReveladas.indexOf(c) === -1) {
                    todasReveladas = false;
                    break;
                }
            }

            if (todasReveladas) {
                setTimeout(function() { vitoria(); }, 400);
            }
        } else {
            btn.classList.add('errada');
            btn.disabled = true;
            erros++;
            som.erro();
            atualizarForca();
            atualizarVidasVisual();
            atualizarPlacar();
            mostrarFeedbackFloat('✗', 'negativo');

            if (erros >= maxErros) {
                setTimeout(function() { derrota(); }, 500);
            }
        }
    }

    // ==========================================================
    // VITÓRIA / DERROTA
    // ==========================================================
    function vitoria() {
        jogoAtivo = false;
        bloquearTeclado(true);

        // Pontuação: base 100 + bónus por vidas restantes + bónus por acertos consecutivos
        var vidasRestantes = maxErros - erros;
        var bonusVidas = vidasRestantes * 10;
        var bonusConsec = acertosConsecutivos * 20;
        var ganho = 100 + bonusVidas + bonusConsec;
        pontos = ganho;

        acertosConsecutivos++;

        // Salva recorde
        var recordeAntigo = carregarRecorde();
        if (ganho > recordeAntigo) {
            salvarRecorde(ganho);
        }

        som.vitoria();

        mostrarOverlay({
            titulo: '🎉 Parabéns!',
            htmlExtra:
                '<div class="trofeu">🏆</div>' +
                '<div class="palavra-revelada">' + palavraAtual + '</div>' +
                '<div class="grande">+' + ganho + ' pts</div>' +
                '<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">' +
                    '✅ ' + vidasRestantes + ' vidas restantes • 🔥 Combo: ' + acertosConsecutivos +
                '</div>',
            subtitulo: 'Você acertou a palavra! ' + dicaAtual,
            botao: { texto: '➡️ Próxima Palavra', acao: function() { iniciarJogo(); } }
        });

        atualizarBadge('✅ Acertou!', 'ok');
        atualizarPlacar();
    }

    function derrota() {
        jogoAtivo = false;
        bloquearTeclado(true);
        acertosConsecutivos = 0;

        // Revela a palavra
        for (var i = 0; i < palavraAtual.length; i++) {
            if (letrasReveladas.indexOf(palavraAtual[i]) === -1) {
                letrasReveladas.push(palavraAtual[i]);
            }
        }
        renderizarPalavra();

        som.derrota();

        mostrarOverlay({
            titulo: '💀 Enforcado!',
            htmlExtra:
                '<div class="caveira">💀</div>' +
                '<div class="palavra-revelada">' + palavraAtual + '</div>' +
                '<div style="font-size:13px; color:var(--text-muted); margin-top:8px;">' +
                    'A palavra era: ' + dicaAtual +
                '</div>',
            subtitulo: 'Não desanime! Tente outra palavra.',
            botao: { texto: '🔄 Jogar Novamente', acao: function() { iniciarJogo(); } }
        });

        atualizarBadge('💀 Fim de jogo', 'erro');
        atualizarPlacar();
    }

    // ==========================================================
    // FEEDBACK FLUTUANTE
    // ==========================================================
    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        $('palavra-wrapper').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 900);
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        if (!ov) return;
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var ov = $('overlay');
        if (!ov) {
            ov = document.createElement('div');
            ov.id = 'overlay';
            ov.className = 'overlay';
            document.querySelector('.container').appendChild(ov);
        }
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE TEMA / DIFICULDADE
    // ==========================================================
    function trocarConfig() {
        jogoAtivo = false;
        erros = 0;
        acertosConsecutivos = 0;
        pontos = 0;

        atualizarPlacar();
        limparForca();
        atualizarVidasVisual();
        $('palavra-wrapper').innerHTML = '';
        $('dica-texto').textContent = '—';
        esconderOverlay();
        resetarTeclado();
        bloquearTeclado(true);
        atualizarBadge('Pronto', '');
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    $('select-tema').addEventListener('change', function(e) {
        temaAtual = e.target.value;
        trocarConfig();
    });

    $('select-dificuldade').addEventListener('change', function(e) {
        dificuldadeAtual = e.target.value;
        trocarConfig();
    });

    $('btn-iniciar').addEventListener('click', iniciarJogo);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    montarTeclado();
    bloquearTeclado(true);
    atualizarPlacar();
    atualizarVidasVisual();
    atualizarBadge('Pronto', '');
    console.log('[brain-forca] Pronto! Tema:', temaAtual, 'Dificuldade:', dificuldadeAtual);
})();
</script>
</body>
