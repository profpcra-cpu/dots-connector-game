<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detetive Lógico v2 — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 9px 6px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-caso { color: var(--c-cyan); }
#display-tempo { color: #60a5fa; }
#display-recorde { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

.timer-bar {
    height: 6px;
    background: rgba(148, 163, 184, 0.2);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 0 12px;
}
.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c-green), var(--c-amber), var(--c-red));
    border-radius: 99px;
    transition: width 0.3s linear;
    width: 100%;
}

.caso-wrapper {
    padding: 14px;
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    text-align: left;
}
.caso-titulo {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--c-cyan);
    margin-bottom: 6px;
}
.caso-texto {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-color);
    font-weight: 500;
}

.pistas-wrapper {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 12px;
    text-align: left;
    max-height: 160px;
    overflow-y: auto;
}
.pistas-titulo {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--c-amber);
    margin-bottom: 8px;
}
.pista {
    font-size: 12.5px;
    line-height: 1.4;
    padding: 6px 10px;
    background: rgba(251, 191, 36, 0.08);
    border-left: 3px solid var(--c-amber);
    border-radius: 6px;
    margin-bottom: 6px;
    color: var(--text-color);
    font-weight: 500;
}
.pista:last-child { margin-bottom: 0; }
.pista strong { color: var(--c-amber); font-weight: 700; }

.grid-wrapper {
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 12px;
    overflow-x: auto;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
}
.grid-tabela {
    display: grid;
    gap: 4px;
    margin: 0 auto;
    width: 100%;
}
.grid-cabecalho {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
    background: rgba(148, 163, 184, 0.1);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-color);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    min-height: 40px;
}
.grid-cabecalho.grupo-titulo {
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    font-size: 10px;
}
.grid-cabecalho.linha-titulo {
    justify-content: flex-start;
    padding-left: 8px;
    background: rgba(99, 102, 241, 0.15);
    color: #818cf8;
}
.celula-ded {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    background: rgba(30, 41, 59, 0.55);
    border: 2px solid rgba(148, 163, 184, 0.15);
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 18px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 34px;
    font-weight: 900;
}
.celula-ded:hover:not(.bloqueada) {
    border-color: var(--btn-primary);
    background: rgba(99, 102, 241, 0.2);
    transform: scale(1.05);
}
.celula-ded.marcada-certo {
    background: rgba(74, 222, 128, 0.3);
    border-color: var(--c-green);
    color: var(--c-green);
}
.celula-ded.marcada-errado {
    background: rgba(239, 68, 68, 0.25);
    border-color: var(--c-red);
    color: var(--c-red);
}
.celula-ded.automatica {
    animation: auto-marcar 0.5s ease;
}
@keyframes auto-marcar {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
}

.acoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}
.acoes button {
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    border: none;
}
.btn-verificar {
    background: linear-gradient(135deg, #16a34a, #22c55e);
    color: #fff;
    box-shadow: 0 6px 20px -6px rgba(34, 197, 94, 0.55);
}
.btn-verificar:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
.btn-verificar:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-limpar {
    background: linear-gradient(135deg, #475569, #334155);
    color: #fff;
    box-shadow: 0 6px 20px -6px rgba(71, 85, 105, 0.55);
}
.btn-limpar:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }

.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.hidden { display: none !important; }

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.94);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 22px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 48px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay button { max-width: 260px; }
.overlay .trofeu {
    font-size: 56px;
    animation: bounce 1.4s infinite ease-in-out;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.negativo { color: var(--c-red); text-shadow: 0 0 20px var(--c-red); }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}

.fase-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.fase-badge.ok {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.fase-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}

/* Loader */
.loader-overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 15;
    border-radius: 14px;
}
.loader-spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(148, 163, 184, 0.2);
    border-top-color: var(--btn-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.loader-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--c-cyan);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
.loader-sub {
    font-size: 11px;
    color: var(--text-muted);
}
</style>
</head>
<body>
<div class="container" id="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="facil">🟢 Fácil</button>
        <button class="mode-btn" data-mode="medio">🟡 Médio</button>
        <button class="mode-btn" data-mode="dificil">🔴 Difícil</button>
    </div>

    <div class="score-board">
        <div id="label-bloco1">Caso<br><strong id="display-caso">#1</strong></div>
        <div id="label-bloco2">Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div id="display-recorde-wrap" style="display:none"></div>
        <div id="label-bloco3">Recorde<br><strong id="display-recorde">—</strong></div>
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div style="text-align:center;">
        <span class="fase-badge" id="fase-badge">Pronto</span>
    </div>

    <p class="instructions" id="info-instrucao">
        🕵️ Leia as pistas e use o grid para deduzir a solução. Clique nas células para marcar ✓ ou ✗.
    </p>

    <div class="caso-wrapper">
        <div class="caso-titulo">🔍 Caso</div>
        <div class="caso-texto" id="caso-texto">Clique em "Gerar Novo Caso" para começar.</div>
    </div>

    <div class="pistas-wrapper">
        <div class="pistas-titulo">🧩 Pistas</div>
        <div id="pistas-lista"></div>
    </div>

    <div class="grid-wrapper">
        <div class="grid-tabela" id="grid-tabela"></div>
    </div>

    <div class="acoes">
        <button id="btn-limpar" class="btn-limpar">🗑️ Limpar</button>
        <button id="btn-verificar" class="btn-verificar" disabled>✅ Verificar</button>
    </div>

    <div class="controls-grid">
        <button id="btn-iniciar">🎲 Gerar Novo Caso</button>
    </div>

    <!-- Loader overlay (para geração) -->
    <div id="loader" class="loader-overlay hidden">
        <div class="loader-spinner"></div>
        <div class="loader-text">🔍 Gerando caso...</div>
        <div class="loader-sub" id="loader-sub">Calculando solução única</div>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-logica-v2] Inicializando...');

    // ==========================================================
    // BANCOS DE DADOS PARA GERAÇÃO
    // ==========================================================
    var BANCOS = {
        pessoas: ['Ana', 'Beto', 'Carla', 'Duda', 'Eva', 'Fábio', 'Gabi', 'Hugo'],
        cores: ['Vermelha', 'Azul', 'Verde', 'Amarela', 'Roxa', 'Rosa', 'Ciano', 'Laranja'],
        animais: ['Gato', 'Cão', 'Peixe', 'Pássaro', 'Coelho', 'Tartaruga', 'Hamster', 'Cobra'],
        esportes: ['Futebol', 'Natação', 'Tênis', 'Basquete', 'Vôlei', 'Corrida', 'Ciclismo', 'Judô'],
        comidas: ['Pizza', 'Sushi', 'Lasanha', 'Hambúrguer', 'Salada', 'Feijoada', 'Tacos', 'Ramen'],
        profissoes: ['Médico', 'Professor', 'Engenheiro', 'Artista', 'Advogado', 'Chef', 'Piloto', 'Dentista']
    };

    // ==========================================================
    // CONFIGURAÇÃO POR DIFICULDADE
    // ==========================================================
    var CONFIG = {
        facil: {
            numPessoas: 3,
            numCategorias: 2, // pessoas + 1 categoria
            numPistas: 5,
            tempoMax: 300
        },
        medio: {
            numPessoas: 4,
            numCategorias: 2,
            numPistas: 6,
            tempoMax: 400
        },
        dificil: {
            numPessoas: 4,
            numCategorias: 3,
            numPistas: 8,
            tempoMax: 500
        }
    };

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = 'facil';
    var casoAtual = null;
    var estadoGrid = [];
    var jogoAtivo = false;
    var tempoDecorrido = 0;
    var timerInterval = null;
    var totalCelulas = 0;
    var celulasMarcadas = 0;
    var casoNumero = 1;

    var recordes = {
        facil:   parseInt(localStorage.getItem('brain_logica_v2_recorde_facil')   || '999999', 10),
        medio:   parseInt(localStorage.getItem('brain_logica_v2_recorde_medio')   || '999999', 10),
        dificil: parseInt(localStorage.getItem('brain_logica_v2_recorde_dificil') || '999999', 10)
    };

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        play: function(freq, type, duration, vol) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(vol || 0.07, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duration + 0.02);
            } catch (e) {}
        },
        click:   function() { this.play(650, 'triangle', 0.06); },
        acerto:  function() {
            var self = this;
            [523, 659, 783].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.18); }, i * 70);
            });
        },
        erro:    function() { this.play(200, 'sawtooth', 0.2); },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.22); }, i * 100);
            });
        }
    };

    // ==========================================================
    // UTILITÁRIOS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function embaralhar(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function formatarTempo(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function atualizarBadge(texto, classe) {
        var b = $('fase-badge');
        b.textContent = texto;
        b.className = 'fase-badge' + (classe ? ' ' + classe : '');
    }

    function atualizarPlacar() {
        $('display-caso').textContent = '#' + casoNumero;
        $('display-tempo').textContent = formatarTempo(tempoDecorrido);
        var rec = recordes[modoAtual];
        $('display-recorde').textContent = rec >= 999999 ? '—' : formatarTempo(rec);
    }

    function mostrarLoader(mostrar, subtexto) {
        var l = $('loader');
        if (mostrar) {
            l.classList.remove('hidden');
            if (subtexto) $('loader-sub').textContent = subtexto;
        } else {
            l.classList.add('hidden');
        }
    }

    // ==========================================================
    // GERAÇÃO PROCEDURAL DO CASO
    // ==========================================================
    function gerarCaso() {
        var cfg = CONFIG[modoAtual];
        var numPessoas = cfg.numPessoas;
        var numCategorias = cfg.numCategorias;

        // 1. Sorteia pessoas
        var pessoas = embaralhar(BANCOS.pessoas).slice(0, numPessoas);

        // 2. Sorteia categorias (sem repetir)
        var catDisponiveis = ['cores', 'animais', 'esportes', 'comidas', 'profissoes'];
        var catSorteadas = embaralhar(catDisponiveis).slice(0, numCategorias);

        // 3. Cria grupos
        var grupos = [{ nome: 'Pessoa', itens: pessoas.slice() }];
        catSorteadas.forEach(function(cat) {
            var nomeCat = {
                cores: 'Cor', animais: 'Animal', esportes: 'Esporte',
                comidas: 'Comida', profissoes: 'Profissão'
            }[cat];
            grupos.push({
                nome: nomeCat,
                itens: embaralhar(BANCOS[cat]).slice(0, numPessoas),
                banco: cat
            });
        });

        // 4. Gera solução: cada pessoa recebe 1 item de cada categoria (permutação)
        var solucao = {};
        for (var p = 0; p < numPessoas; p++) {
            solucao[p] = {};
            for (var g = 1; g < grupos.length; g++) {
                solucao[p][g] = p; // inicialmente identidade
            }
        }
        // Embaralha cada categoria independentemente
        for (var g2 = 1; g2 < grupos.length; g2++) {
            var perm = embaralhar(Array.from({length: numPessoas}, function(_, i) { return i; }));
            for (var p2 = 0; p2 < numPessoas; p2++) {
                solucao[p2][g2] = perm[p2];
            }
        }

        // 5. Gera pistas
        var pistas = gerarPistas(pessoas, grupos, solucao, cfg.numPistas);

        // 6. Valida unicidade (via backtracking)
        var valido = validarSolucaoUnica(pessoas, grupos, solucao, pistas);
        var tentativas = 0;
        while (!valido && tentativas < 30) {
            tentativas++;
            pistas = gerarPistas(pessoas, grupos, solucao, cfg.numPistas);
            valido = validarSolucaoUnica(pessoas, grupos, solucao, pistas);
        }

        // Se não conseguiu validar em 30 tentativas, aceita (raro)
        // Título descritivo
        var titulo = 'Descubra a combinação única de ' + numPessoas + ' pessoas com ' + numCategorias + ' característica' + (numCategorias > 1 ? 's' : '') + '.';

        return {
            titulo: titulo,
            grupos: grupos,
            solucao: solucao,
            pistas: pistas,
            valido: valido
        };
    }

    // ==========================================================
    // GERADOR DE PISTAS
    // ==========================================================
    function gerarPistas(pessoas, grupos, solucao, numPistas) {
        var pistas = [];
        var pistasUsadas = {}; // evita repetições
        var tentativas = 0;

        while (pistas.length < numPistas && tentativas < 100) {
            tentativas++;
            var tipoPista = randInt(0, 3);
            var pistaObj = null;

            if (tipoPista === 0) {
                // Pista positiva: "X tem Y"
                var p = randInt(0, pessoas.length - 1);
                var g = randInt(1, grupos.length - 1);
                var itemIdx = solucao[p][g];
                var chave = 'pos-' + p + '-' + g;
                if (pistasUsadas[chave]) continue;
                pistasUsadas[chave] = true;
                pistaObj = {
                    texto: '<strong>' + pessoas[p] + '</strong> tem <strong>' + grupos[g].itens[itemIdx] + '</strong>',
                    tipo: 'direta',
                    p: p, g: g, item: itemIdx
                };
            } else if (tipoPista === 1) {
                // Pista negativa: "X não tem Y" (Y é diferente do correto)
                var p2 = randInt(0, pessoas.length - 1);
                var g3 = randInt(1, grupos.length - 1);
                var correto = solucao[p2][g3];
                var errado = correto;
                while (errado === correto) {
                    errado = randInt(0, grupos[g3].itens.length - 1);
                }
                var chave2 = 'neg-' + p2 + '-' + g3 + '-' + errado;
                if (pistasUsadas[chave2]) continue;
                pistasUsadas[chave2] = true;
                pistaObj = {
                    texto: '<strong>' + pessoas[p2] + '</strong> não tem <strong>' + grupos[g3].itens[errado] + '</strong>',
                    tipo: 'negativa',
                    p: p2, g: g3, item: errado
                };
            } else if (tipoPista === 2 && grupos.length >= 3) {
                // Pista cruzada: "quem tem X também tem Y"
                var gA = randInt(1, grupos.length - 1);
                var gB = gA;
                while (gB === gA) gB = randInt(1, grupos.length - 1);
                var itemA = randInt(0, grupos[gA].itens.length - 1);
                // Descobre qual pessoa tem esse item
                var pessoaAlvo = -1;
                for (var pi = 0; pi < pessoas.length; pi++) {
                    if (solucao[pi][gA] === itemA) { pessoaAlvo = pi; break; }
                }
                if (pessoaAlvo === -1) continue;
                var itemB = solucao[pessoaAlvo][gB];
                var chave3 = 'cruz-' + gA + '-' + itemA + '-' + gB;
                if (pistasUsadas[chave3]) continue;
                pistasUsadas[chave3] = true;
                pistaObj = {
                    texto: 'Quem tem <strong>' + grupos[gA].itens[itemA] + '</strong> também tem <strong>' + grupos[gB].itens[itemB] + '</strong>',
                    tipo: 'cruzada'
                };
            } else {
                // Pista de exclusão: "X não é Y" (pessoa não tem o item)
                var p3 = randInt(0, pessoas.length - 1);
                var g4 = randInt(1, grupos.length - 1);
                var correto2 = solucao[p3][g4];
                var errado2 = correto2;
                var tentativas2 = 0;
                while (errado2 === correto2 && tentativas2 < 20) {
                    errado2 = randInt(0, grupos[g4].itens.length - 1);
                    tentativas2++;
                }
                if (errado2 === correto2) continue;
                var chave4 = 'exc-' + p3 + '-' + g4 + '-' + errado2;
                if (pistasUsadas[chave4]) continue;
                pistasUsadas[chave4] = true;
                pistaObj = {
                    texto: '<strong>' + pessoas[p3] + '</strong> não mora com <strong>' + grupos[g4].itens[errado2] + '</strong>',
                    tipo: 'exclusao',
                    p: p3, g: g4, item: errado2
                };
            }

            if (pistaObj) pistas.push(pistaObj);
        }

        return pistas;
    }

    // ==========================================================
    // VALIDAÇÃO DE SOLUÇÃO ÚNICA (BACKTRACKING)
    // ==========================================================
    function validarSolucaoUnica(pessoas, grupos, solucao, pistas) {
        var numPessoas = pessoas.length;
        var numGrupos = grupos.length - 1; // descontando "Pessoa"
        var numSolucoes = 0;
        var LIMITE = 2; // Só precisamos saber se há mais de 1

        // Estado: para cada pessoa, array de índices por grupo
        var tentativa = [];
        for (var i = 0; i < numPessoas; i++) {
            tentativa.push(new Array(numGrupos).fill(-1));
        }

        // Verifica se uma pista é satisfeita pelas atribuições atuais
        function pistaSatisfeita(pista) {
            // Como as pistas são estruturais (não guardam índices), 
            // verificamos com base no texto. Vamos usar tipo + parâmetros salvos.
            // Como as pistas foram geradas com referências explícitas, checamos assim:
            if (pista.tipo === 'direta') {
                return tentativa[pista.p] && tentativa[pista.p][pista.g - 1] === pista.item;
            } else if (pista.tipo === 'negativa') {
                return tentativa[pista.p] && tentativa[pista.p][pista.g - 1] !== pista.item;
            } else if (pista.tipo === 'exclusao') {
                return tentativa[pista.p] && tentativa[pista.p][pista.g - 1] !== pista.item;
            } else if (pista.tipo === 'cruzada') {
                // Cruzada é mais complexa — simplificamos apenas exigindo que todas estejam preenchidas
                return true;
            }
            return true;
        }

        // Backtracking: atribui índice para (pessoa, grupo)
        function backtrack(pos) {
            if (numSolucoes >= LIMITE) return;
            var totalPos = numPessoas * numGrupos;
            if (pos === totalPos) {
                // Verifica todas as pistas
                for (var i = 0; i < pistas.length; i++) {
                    if (!pistaSatisfeita(pistas[i])) return;
                }
                numSolucoes++;
                return;
            }

            var p = Math.floor(pos / numGrupos);
            var g = pos % numGrupos;

            for (var item = 0; item < numPessoas; item++) {
                // Verifica se já foi usado por outra pessoa neste grupo
                var usado = false;
                for (var pp = 0; pp < numPessoas; pp++) {
                    if (pp !== p && tentativa[pp][g] === item) { usado = true; break; }
                }
                if (usado) continue;

                tentativa[p][g] = item;
                backtrack(pos + 1);
                tentativa[p][g] = -1;

                if (numSolucoes >= LIMITE) return;
            }
        }

        backtrack(0);
        return numSolucoes === 1;
    }

    // ==========================================================
    // CARREGAR E RENDERIZAR CASO
    // ==========================================================
    function carregarNovoCaso() {
        mostrarLoader(true, 'Gerando puzzle único...');
        atualizarBadge('⏳ Gerando caso...', '');

        // Usa setTimeout para não bloquear UI durante geração
        setTimeout(function() {
            var tentativas = 0;
            var caso = null;
            while (tentativas < 50) {
                tentativas++;
                mostrarLoader(true, 'Tentativa ' + tentativas + '...');
                caso = gerarCaso();
                if (caso.valido) break;
            }

            casoAtual = caso;
            mostrarLoader(false);
            iniciarCaso();
        }, 50);
    }

    function iniciarCaso() {
        var numPessoas = casoAtual.grupos[0].itens.length;

        // Inicializa estado do grid (0=vazio, 1=✓, -1=✗)
        estadoGrid = [];
        var numColunas = 0;
        for (var g = 1; g < casoAtual.grupos.length; g++) {
            numColunas += casoAtual.grupos[g].itens.length;
        }

        for (var l = 0; l < numPessoas; l++) {
            var linha = [];
            for (var c = 0; c < numColunas; c++) linha.push(0);
            estadoGrid.push(linha);
        }

        totalCelulas = 0;
        for (var g2 = 1; g2 < casoAtual.grupos.length; g2++) {
            totalCelulas += numPessoas;
        }

        celulasMarcadas = 0;
        tempoDecorrido = 0;
        jogoAtivo = true;

        $('caso-texto').innerHTML = casoAtual.titulo;
        renderizarPistas();
        renderizarGrid();
        atualizarPlacar();

        esconderOverlay();
        iniciarTimer();
        atualizarBadge('🕵️ Investigue!', '');
    }

    function renderizarPistas() {
        var lista = $('pistas-lista');
        lista.innerHTML = '';
        casoAtual.pistas.forEach(function(p) {
            var div = document.createElement('div');
            div.className = 'pista';
            div.innerHTML = '🧩 ' + p.texto;
            lista.appendChild(div);
        });
    }

    function renderizarGrid() {
        var tabela = $('grid-tabela');
        tabela.innerHTML = '';

        var numLinhas = casoAtual.grupos[0].itens.length;
        var colunas = [];
        for (var g = 1; g < casoAtual.grupos.length; g++) {
            for (var i = 0; i < casoAtual.grupos[g].itens.length; i++) {
                colunas.push({ grupoIdx: g, itemIdx: i });
            }
        }

        tabela.style.gridTemplateColumns = '90px repeat(' + colunas.length + ', minmax(38px, 1fr))';

        // Cabeçalho linha 1
        var canto = document.createElement('div');
        canto.className = 'grid-cabecalho grupo-titulo';
        canto.textContent = '→';
        tabela.appendChild(canto);

        var gruposCols = {};
        for (var g2 = 1; g2 < casoAtual.grupos.length; g2++) {
            gruposCols[g2] = casoAtual.grupos[g2].itens.length;
        }
        for (var g3 = 1; g3 < casoAtual.grupos.length; g3++) {
            var cab = document.createElement('div');
            cab.className = 'grid-cabecalho grupo-titulo';
            cab.textContent = casoAtual.grupos[g3].nome;
            cab.style.gridColumn = 'span ' + gruposCols[g3];
            tabela.appendChild(cab);
        }

        // Cabeçalho linha 2
        var canto2 = document.createElement('div');
        canto2.className = 'grid-cabecalho linha-titulo';
        canto2.textContent = casoAtual.grupos[0].nome;
        tabela.appendChild(canto2);

        colunas.forEach(function(col) {
            var cab = document.createElement('div');
            cab.className = 'grid-cabecalho';
            cab.textContent = casoAtual.grupos[col.grupoIdx].itens[col.itemIdx];
            cab.style.fontSize = '10px';
            cab.style.padding = '4px 2px';
            tabela.appendChild(cab);
        });

        // Linhas
        for (var l = 0; l < numLinhas; l++) {
            var linhaTitulo = document.createElement('div');
            linhaTitulo.className = 'grid-cabecalho linha-titulo';
            linhaTitulo.textContent = casoAtual.grupos[0].itens[l];
            tabela.appendChild(linhaTitulo);

            for (var c = 0; c < colunas.length; c++) {
                (function(linhaIdx, colIdx) {
                    var cel = document.createElement('div');
                    cel.className = 'celula-ded';
                    cel.dataset.linha = linhaIdx;
                    cel.dataset.col = colIdx;

                    cel.addEventListener('click', function() {
                        if (!jogoAtivo) return;
                        clicarCelula(linhaIdx, colIdx);
                    });

                    tabela.appendChild(cel);
                })(l, c);
            }
        }

        atualizarGridVisual();
    }

    function atualizarGridVisual() {
        var celulas = document.querySelectorAll('.celula-ded');
        for (var i = 0; i < celulas.length; i++) {
            var cel = celulas[i];
            var l = parseInt(cel.dataset.linha, 10);
            var c = parseInt(cel.dataset.col, 10);
            var est = estadoGrid[l][c];

            cel.classList.remove('marcada-certo', 'marcada-errado');
            cel.textContent = '';

            if (est === 1) {
                cel.classList.add('marcada-certo');
                cel.textContent = '✓';
            } else if (est === -1) {
                cel.classList.add('marcada-errado');
                cel.textContent = '✗';
            }
        }
    }

    // ==========================================================
    // INTERAÇÃO
    // ==========================================================
    function clicarCelula(linha, col) {
        var est = estadoGrid[linha][col];
        var novo;
        if (est === 0) novo = 1;
        else if (est === 1) novo = -1;
        else novo = 0;

        estadoGrid[linha][col] = novo;
        som.click();
        atualizarGridVisual();
        contarCelulasMarcadas();
    }

    function contarCelulasMarcadas() {
        celulasMarcadas = 0;
        for (var l = 0; l < estadoGrid.length; l++) {
            for (var c = 0; c < estadoGrid[l].length; c++) {
                if (estadoGrid[l][c] !== 0) celulasMarcadas++;
            }
        }
        $('btn-verificar').disabled = celulasMarcadas === 0;
    }

    function limparGrid() {
        for (var l = 0; l < estadoGrid.length; l++) {
            for (var c = 0; c < estadoGrid[l].length; c++) {
                estadoGrid[l][c] = 0;
            }
        }
        atualizarGridVisual();
        contarCelulasMarcadas();
        som.click();
    }

    // ==========================================================
    // VERIFICAR SOLUÇÃO
    // ==========================================================
    function verificarSolucao() {
        if (!jogoAtivo) return;

        var correto = true;
        var celulasCorretas = 0;
        var totalEsperado = 0;

        // Monta colunas (mesma ordem de renderizarGrid)
        var colunas = [];
        for (var g = 1; g < casoAtual.grupos.length; g++) {
            for (var i = 0; i < casoAtual.grupos[g].itens.length; i++) {
                colunas.push({ grupoIdx: g, itemIdx: i });
            }
        }

        for (var l = 0; l < estadoGrid.length; l++) {
            for (var c = 0; c < estadoGrid[l].length; c++) {
                var est = estadoGrid[l][c];
                var col = colunas[c];

                // É a resposta correta?
                var deveMarcarCerto = (casoAtual.solucao[l][col.grupoIdx] === col.itemIdx);

                if (deveMarcarCerto) {
                    totalEsperado += 1;
                    if (est === 1) celulasCorretas++;
                    else correto = false;
                } else {
                    // Deve ser ✗ (ou vazio)
                    totalEsperado += 1;
                    if (est === -1) celulasCorretas++;
                    else if (est === 1) correto = false;
                    // Se estiver vazio (0), consideramos incompleto
                    else if (est === 0) correto = false;
                }
            }
        }

        if (correto) {
            vitoria();
        } else {
            som.erro();
            atualizarBadge('❌ Ainda não está correto!', 'erro');
            mostrarFeedbackFloat('✗', 'negativo');
        }
    }

    // ==========================================================
    // VITÓRIA
    // ==========================================================
    function vitoria() {
        jogoAtivo = false;
        pararTimer();
        som.vitoria();

        var tempoFinal = tempoDecorrido;
        var recAtual = recordes[modoAtual];
        var novoRecorde = tempoFinal < recAtual;

        if (novoRecorde) {
            recordes[modoAtual] = tempoFinal;
            localStorage.setItem('brain_logica_v2_recorde_' + modoAtual, String(tempoFinal));
        }

        var pontos = Math.max(100, 1500 - tempoFinal * 3);

        var medalha, mensagem;
        if (tempoFinal <= 45) { medalha = '🏆'; mensagem = 'Sherlock Holmes! Dedução relâmpago.'; }
        else if (tempoFinal <= 120) { medalha = '🥇'; mensagem = 'Excelente raciocínio lógico!'; }
        else if (tempoFinal <= 240) { medalha = '🥈'; mensagem = 'Boa dedução! Continue treinando.'; }
        else { medalha = '🥉'; mensagem = 'Caso resolvido! A prática leva à perfeição.'; }

        mostrarOverlay({
            titulo: medalha + ' Caso Resolvido!',
            htmlExtra:
                '<div class="trofeu">' + medalha + '</div>' +
                '<div class="grande">' + pontos + ' pts</div>' +
                '<div style="display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:13px;">' +
                    '<span style="color:var(--c-cyan)">⏱️ ' + formatarTempo(tempoFinal) + '</span>' +
                    (novoRecorde ? '<span style="color:var(--c-amber)">🏆 NOVO RECORDE!</span>' : '') +
                '</div>',
            subtitulo: mensagem,
            botao: { texto: '🎲 Próximo Caso', acao: function() { proximoCaso(); } }
        });

        atualizarBadge('🏆 Resolvido!', 'ok');
        atualizarPlacar();
    }

    function proximoCaso() {
        casoNumero++;
        carregarNovoCaso();
    }

    // ==========================================================
    // TIMER
    // ==========================================================
    function iniciarTimer() {
        pararTimer();
        tempoDecorrido = 0;
        $('timer-fill').style.width = '100%';
        timerInterval = setInterval(function() {
            if (!jogoAtivo) return;
            tempoDecorrido++;
            $('display-tempo').textContent = formatarTempo(tempoDecorrido);
            var cfg = CONFIG[modoAtual];
            var pct = Math.max(0, 100 - (tempoDecorrido / cfg.tempoMax) * 100);
            $('timer-fill').style.width = pct + '%';
        }, 1000);
    }

    function pararTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    // ==========================================================
    // FEEDBACK FLUTUANTE
    // ==========================================================
    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        $('grid-wrapper').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 900);
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        if (!ov) return;
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var ov = $('overlay');
        if (!ov) {
            ov = document.createElement('div');
            ov.id = 'overlay';
            ov.className = 'overlay';
            $('container').appendChild(ov);
        }
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;

        jogoAtivo = false;
        pararTimer();
        esconderOverlay();

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        casoNumero = 1;
        atualizarPlacar();
        atualizarBadge('Pronto', '');
        $('caso-texto').textContent = 'Clique em "Gerar Novo Caso" para começar.';
        $('pistas-lista').innerHTML = '';
        $('grid-tabela').innerHTML = '';
        $('btn-verificar').disabled = true;
        $('timer-fill').style.width = '0%';
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', carregarNovoCaso);
    $('btn-verificar').addEventListener('click', verificarSolucao);
    $('btn-limpar').addEventListener('click', limparGrid);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    atualizarPlacar();
    atualizarBadge('Pronto para gerar', '');
    console.log('[brain-logica-v2] Pronto! Modo:', modoAtual);
})();
</script>
