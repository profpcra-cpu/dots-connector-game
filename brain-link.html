<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Link - Formas e Conexões</title>

    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;

            --board-bg: rgba(15, 23, 42, 0.55);

            --node-size: 42px;

            --c-green: #4ade80;
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-red: #ef4444;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);

            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.25);
            --input-bg: rgba(255, 255, 255, 0.95);

            --board-bg: rgba(248, 250, 252, 0.9);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
        body::after  { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 20px 20px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
            opacity: 0.9;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-small {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .user-info-left { display: flex; align-items: center; gap: 10px; }

        .user-avatar-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px; height: 38px;
            font-size: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
        }

        #display-nome { font-size: 14px; font-weight: 700; }

        .game-name {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            font-size: 11px;
            border: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }
        .score-board > div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            transition: background var(--t-base), transform var(--t-base);
        }
        .score-board > div:hover {
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-1px);
        }
        .score-board strong {
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: none;
        }
        #display-nivel  { color: var(--c-blue); }
        #display-pontos { color: var(--c-green); }
        #display-tempo  { color: #60a5fa; }
        #display-recorde{ color: var(--c-amber); }

        .instructions {
            font-size: 12.5px;
            color: var(--text-muted);
            margin: 4px 0 12px;
            line-height: 1.5;
            min-height: 18px;
        }

        /* ==========================================================
           TABULEIRO
           ========================================================== */
        #game-board {
            position: relative;
            width: 100%;
            height: 340px;
            background:
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
                var(--board-bg);
            border: 2px solid transparent;
            border-radius: 14px;
            margin-top: 8px;
            overflow: hidden;
            cursor: crosshair;

            background-image:
                linear-gradient(var(--board-bg), var(--board-bg)),
                linear-gradient(135deg,
                    rgba(99, 102, 241, 0.55) 0%,
                    rgba(139, 92, 246, 0.35) 30%,
                    rgba(56, 189, 248, 0.30) 65%,
                    rgba(99, 102, 241, 0.45) 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;

            box-shadow:
                0 12px 40px -14px rgba(0, 0, 0, 0.55),
                0 0 0 1px var(--card-border),
                0 0 24px -6px rgba(99, 102, 241, 0.35);
            animation: gridIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #game-board::before {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 18px;
            background: radial-gradient(ellipse at 50% 0%, rgba(99,102,241,0.28), transparent 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(6px);
        }

        @keyframes gridIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================
           NÓS
           ========================================================== */
        .node {
            position: absolute;
            width: var(--node-size);
            height: var(--node-size);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow:
                0 6px 14px -4px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: transform var(--t-fast), filter var(--t-base), box-shadow var(--t-base);
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.75);
            animation: nodeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        @keyframes nodeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.18);
            filter: brightness(1.22);
            box-shadow:
                0 10px 20px -6px rgba(0, 0, 0, 0.65),
                0 0 0 4px rgba(255, 255, 255, 0.15);
            z-index: 5;
        }

        .node.circle   { border-radius: 50%; }
        .node.square   { border-radius: 8px; }
        .node.star     { border-radius: 12px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .node.pentagon { border-radius: 10px; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }

        /* Nó já ligado */
        .node.completed {
            background: #22c55e !important;
            border-color: #ffffff;
            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.25),
                0 0 20px rgba(34, 197, 94, 0.65),
                0 6px 14px -4px rgba(0, 0, 0, 0.55);
        }

        /* Próximo nó esperado — pulsa para indicar */
        .node.next-target {
            animation: nextTargetPulse 1.6s ease-in-out infinite;
            border-color: #38bdf8;
            z-index: 6;
        }
        @keyframes nextTargetPulse {
            0%, 100% {
                box-shadow:
                    0 0 0 0 rgba(56, 189, 248, 0.55),
                    0 6px 14px -4px rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
            }
            50% {
                box-shadow:
                    0 0 0 10px rgba(56, 189, 248, 0),
                    0 6px 14px -4px rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.35);
            }
        }

        /* Nó errado — shake */
        .node.error {
            animation: shake 0.4s ease;
            box-shadow:
                0 0 0 4px rgba(239, 68, 68, 0.55),
                0 6px 14px -4px rgba(0, 0, 0, 0.55);
        }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%); }
            25%      { transform: translate(calc(-50% - 4px), -50%); }
            75%      { transform: translate(calc(-50% + 4px), -50%); }
        }

        /* ==========================================================
           SVG DE LINHAS
           ========================================================== */
        #canvas-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #canvas-lines line {
            filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.7));
            animation: lineDraw 0.35s ease-out;
        }

        @keyframes lineDraw {
            from { opacity: 0; stroke-width: 0; }
            to   { opacity: 1; }
        }

        /* ==========================================================
           CONTROLES
           ========================================================== */
        input, select {
            width: 100%;
            padding: 11px 12px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-color);
            transition: border-color var(--t-base), box-shadow var(--t-base);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }

        button {
            width: 100%;
            padding: 13px 18px;
            margin-top: 10px;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            box-shadow: var(--shadow-btn);
            transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
        }
        button:active { transform: translateY(0); filter: brightness(0.97); }

        .btn-secondary {
            background: linear-gradient(135deg, #475569, #334155);
        }
        .btn-secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }

        #btn-avancar {
            background: linear-gradient(135deg, #10b981, #14b8a6);
        }
        #btn-avancar:hover { box-shadow: 0 10px 28px -8px rgba(16, 185, 129, 0.7); }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .controls-grid select, .controls-grid button { margin-top: 0; }

        .hidden { display: none !important; }

        @media (max-width: 440px) {
            body { padding: 10px; }
            .container { padding: 16px 14px 18px; border-radius: 16px; max-width: 100%; }
            #game-board { height: 300px; }
            .score-board { font-size: 10px; }
            .score-board strong { font-size: 13px; }
            .game-name { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <div id="game-screen">
            <div class="user-header">
                <div class="user-info-left">
                    <span id="display-avatar" class="user-avatar-display">😀</span>
                    <strong id="display-nome"></strong>
                </div>
                <span class="game-name">Brain Link</span>
            </div>

            <div class="score-board">
                <div>Nível<br><strong id="display-nivel">1</strong></div>
                <div>Pontos<br><strong id="display-pontos">0</strong></div>
                <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
                <div>Recorde<br><strong id="display-recorde">--:--</strong></div>
            </div>
            <p class="instructions" id="info-instrucao">Clique nos nós em ordem crescente sem cruzar linhas.</p>

            <div id="game-board">
                <svg id="canvas-lines"></svg>
            </div>

            <div class="controls-grid">
                <select id="select-tipo-numeracao">
                    <option value="arabicos">Arábicos (1, 2, 3)</option>
                    <option value="romanos">Romanos (I, II, III)</option>
                    <option value="ambos">Misto (Arábicos & Romanos)</option>
                </select>
                <select id="select-mudar-nivel">
                    <option value="" disabled selected>Nível...</option>
                    <option value="1">Nível 1</option>
                    <option value="2">Nível 2</option>
                    <option value="3">Nível 3</option>
                    <option value="4">Nível 4</option>
                    <option value="5">Nível 5</option>
                    <option value="6">Nível 6</option>
                </select>
            </div>

            <div class="controls-grid">
                <button id="btn-reiniciar-nivel" class="btn-secondary">🔄 Reiniciar</button>
                <button id="btn-avancar" class="hidden">Avançar 🚀</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ==========================================================
           SESSÃO E ESTADO
           ========================================================== */
        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        let pontuacaoAcumulada = 0;
        let nivelAtual = 1;
        let totalPontosNivel = 5;
        let proximoNumeroEsperado = 1;
        let coordenadasNodes = [];
        let ligacoesFeitas = [];
        let segundos = 0;
        let timerInterval = null;
        let recordesNivel = {};
        let nivelConcluido = false;

        const paletaCores = ['#3b82f6', '#ec4899', '#8b5cf6', '#14b8a6', '#f59e0b', '#6366f1', '#06b6d4', '#d946ef'];
        const formasGeometricas = ['circle', 'square', 'star', 'pentagon'];

        const NODE_DIAMETER = 42;
        const NODE_PADDING = 10;
        const BORDER_PADDING = 6;

        /* ==========================================================
           DOM
           ========================================================== */
        const displayNome = document.getElementById('display-nome');
        const displayAvatar = document.getElementById('display-avatar');
        const displayNivel = document.getElementById('display-nivel');
        const displayPontos = document.getElementById('display-pontos');
        const displayTempo = document.getElementById('display-tempo');
        const displayRecorde = document.getElementById('display-recorde');
        const infoInstrucao = document.getElementById('info-instrucao');
        const gameBoard = document.getElementById('game-board');
        const canvasLines = document.getElementById('canvas-lines');
        const btnAvancar = document.getElementById('btn-avancar');
        const btnReiniciarNivel = document.getElementById('btn-reiniciar-nivel');
        const selectMudarNivel = document.getElementById('select-mudar-nivel');
        const selectTipoNumeracao = document.getElementById('select-tipo-numeracao');
        const themeToggleBtn = document.getElementById('theme-toggle');

        /* ==========================================================
           TEMA
           ========================================================== */
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarTextoBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('brain_flow_theme', next);
            atualizarTextoBotaoTema(next);
        });

        function atualizarTextoBotaoTema(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }

        /* ==========================================================
           UTILITÁRIOS
           ========================================================== */
        function formatarTempo(seg) {
            if (!seg || seg === 0) return "--:--";
            const m = String(Math.floor(seg / 60)).padStart(2, '0');
            const s = String(seg % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function atualizarDisplayRecorde() {
            displayRecorde.textContent = formatarTempo(recordesNivel[nivelAtual] || 0);
        }

        function converterParaRomano(num) {
            const lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
            let roman = "";
            for (let i in lookup) {
                while (num >= lookup[i]) { roman += i; num -= lookup[i]; }
            }
            return roman;
        }

        function obterTextoRotulo(id, modo, total) {
            if (modo === 'arabicos') return id;
            if (modo === 'romanos') return converterParaRomano(id);
            return id <= Math.ceil(total / 2) ? id : converterParaRomano(id);
        }

        /* ==========================================================
           GEOMETRIA — interseção de segmentos
           ==========================================================
           Dois segmentos AB e CD se cruzam se as orientações dos
           triângulos ABC e ABD forem opostas E as de CDA e CDB
           também.
           ========================================================== */
        function orientacao(a, b, c) {
            const v = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
            if (Math.abs(v) < 1e-9) return 0;
            return v > 0 ? 1 : -1;
        }

        function onSegmento(a, b, c) {
            return Math.min(a.x, b.x) <= c.x && c.x <= Math.max(a.x, b.x) &&
                   Math.min(a.y, b.y) <= c.y && c.y <= Math.max(a.y, b.y);
        }

        function segmentosSeCruzam(p1, p2, p3, p4) {
            const o1 = orientacao(p1, p2, p3);
            const o2 = orientacao(p1, p2, p4);
            const o3 = orientacao(p3, p4, p1);
            const o4 = orientacao(p3, p4, p2);

            if (o1 !== o2 && o3 !== o4) return true;
            if (o1 === 0 && onSegmento(p1, p2, p3)) return true;
            if (o2 === 0 && onSegmento(p1, p2, p4)) return true;
            if (o3 === 0 && onSegmento(p3, p4, p1)) return true;
            if (o4 === 0 && onSegmento(p3, p4, p2)) return true;
            return false;
        }

        /* Verifica se um novo segmento cruzaria algum já existente */
        function cruzariaAlgum(novoP1, novoP2) {
            for (const seg of ligacoesFeitas) {
                // Ignora segmentos que compartilham extremidade com o novo
                // (conexões consecutivas partilham um nó)
                const compartilhaExtremidade =
                    (Math.hypot(seg.p1.x - novoP1.x, seg.p1.y - novoP1.y) < 1) ||
                    (Math.hypot(seg.p2.x - novoP2.x, seg.p2.y - novoP2.y) < 1) ||
                    (Math.hypot(seg.p1.x - novoP2.x, seg.p1.y - novoP2.y) < 1) ||
                    (Math.hypot(seg.p2.x - novoP1.x, seg.p2.y - novoP1.y) < 1);
                if (compartilhaExtremidade) continue;

                if (segmentosSeCruzam(novoP1, novoP2, seg.p1, seg.p2)) return true;
            }
            return false;
        }

        /* ==========================================================
           POSICIONAMENTO — Poisson Disk + validação de rota
           ==========================================================
           Gera posições sem sobreposição e, em seguida, verifica se
           existe uma rota 1→2→...→N sem cruzamentos. Se não existir,
           regenera (até 20 tentativas).
           ========================================================== */
        function gerarPosicoesSemSobreposicao(total, boardWidth, boardHeight) {
            const nodeRadius = NODE_DIAMETER / 2;
            const minDistBase = NODE_DIAMETER + NODE_PADDING;

            const usableW = boardWidth - 2 * (nodeRadius + BORDER_PADDING);
            const usableH = boardHeight - 2 * (nodeRadius + BORDER_PADDING);
            const offsetX = nodeRadius + BORDER_PADDING;
            const offsetY = nodeRadius + BORDER_PADDING;

            const areaPerNode = (usableW * usableH) / total;
            const minDistTeorico = Math.sqrt(areaPerNode) * 0.62;
            let minDist = Math.max(minDistTeorico, minDistBase * 0.85);

            const passo = Math.max(14, Math.floor(minDist / 2.2));
            const candidatas = [];
            for (let y = 0; y <= usableH; y += passo) {
                for (let x = 0; x <= usableW; x += passo) {
                    candidatas.push({ x: x + offsetX, y: y + offsetY });
                }
            }

            for (let i = candidatas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidatas[i], candidatas[j]] = [candidatas[j], candidatas[i]];
            }

            const aceitas = [];
            let tentativa = 0;
            const MAX_TENTATIVAS = 30;

            while (aceitas.length < total && tentativa < MAX_TENTATIVAS) {
                tentativa++;
                for (const c of candidatas) {
                    if (aceitas.length >= total) break;
                    let ok = true;
                    for (const a of aceitas) {
                        const dx = a.x - c.x, dy = a.y - c.y;
                        if (dx * dx + dy * dy < minDist * minDist) { ok = false; break; }
                    }
                    if (ok) aceitas.push(c);
                }
                if (aceitas.length < total) {
                    minDist *= 0.9;
                    for (let i = candidatas.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [candidatas[i], candidatas[j]] = [candidatas[j], candidatas[i]];
                    }
                }
            }

            while (aceitas.length < total) {
                aceitas.push({
                    x: offsetX + Math.random() * usableW,
                    y: offsetY + Math.random() * usableH
                });
            }

            return aceitas.slice(0, total);
        }

        /* Verifica se existe uma rota sem cruzamento entre os nós 1..N */
        function existeRotaSemCruzamento(posicoes) {
            const segmentos = [];
            for (let i = 0; i < posicoes.length - 1; i++) {
                const seg = { p1: posicoes[i], p2: posicoes[i + 1] };
                for (const anterior of segmentos) {
                    const compartilha = anterior.p1 === seg.p1 || anterior.p1 === seg.p2 ||
                                       anterior.p2 === seg.p1 || anterior.p2 === seg.p2;
                    if (compartilha) continue;
                    if (segmentosSeCruzam(seg.p1, seg.p2, anterior.p1, anterior.p2)) return false;
                }
                segmentos.push(seg);
            }
            return true;
        }

        /* ==========================================================
           GERAÇÃO DO NÍVEL
           ========================================================== */
        async function iniciarNovoJogoRonda() {
            pararTimer();
            segundos = 0;
            displayTempo.textContent = "00:00";
            nivelConcluido = false;
            atualizarDisplayRecorde();

            totalPontosNivel = 4 + (nivelAtual * 2);
            proximoNumeroEsperado = 1;

            const modoNumeracao = selectTipoNumeracao.value;
            ligacoesFeitas = [];
            btnAvancar.classList.add('hidden');
            infoInstrucao.textContent = `Nível ${nivelAtual}: Clique nos nós em ordem crescente.`;

            document.querySelectorAll('.node').forEach(el => el.remove());
            canvasLines.innerHTML = '';

            coordenadasNodes = [];

            const boardWidth = gameBoard.clientWidth;
            const boardHeight = gameBoard.clientHeight;

            // Tenta gerar uma configuração com rota válida (até 25 tentativas)
            let posicoes = null;
            for (let tentativa = 0; tentativa < 25; tentativa++) {
                const candidatas = gerarPosicoesSemSobreposicao(totalPontosNivel, boardWidth, boardHeight);
                if (existeRotaSemCruzamento(candidatas)) {
                    posicoes = candidatas;
                    break;
                }
            }
            // Fallback: aceita a última mesmo com cruzamento
            if (!posicoes) {
                posicoes = gerarPosicoesSemSobreposicao(totalPontosNivel, boardWidth, boardHeight);
            }

            for (let i = 1; i <= totalPontosNivel; i++) {
                const pos = posicoes[i - 1];
                const corAleatoria = paletaCores[Math.floor(Math.random() * paletaCores.length)];
                const formaAleatoria = formasGeometricas[Math.floor(Math.random() * formasGeometricas.length)];
                const rotuloPonto = obterTextoRotulo(i, modoNumeracao, totalPontosNivel);

                coordenadasNodes.push({
                    id: i,
                    x: pos.x,
                    y: pos.y,
                    cor: corAleatoria,
                    forma: formaAleatoria,
                    rotulo: rotuloPonto
                });
            }

            coordenadasNodes.forEach((p, idx) => {
                const node = document.createElement('div');
                node.className = `node ${p.forma}`;
                node.textContent = p.rotulo;
                node.style.left = `${p.x}px`;
                node.style.top = `${p.y}px`;
                node.style.backgroundColor = p.cor;
                node.dataset.id = p.id;
                node.style.animationDelay = `${idx * 40}ms`;

                node.addEventListener('click', () => lidarComCliqueNode(p, node, modoNumeracao));
                gameBoard.appendChild(node);
            });

            // Marca o nó 1 como próximo esperado
            marcarProximoAlvo();
            iniciarTimer();
        }

        function marcarProximoAlvo() {
            document.querySelectorAll('.node').forEach(el => el.classList.remove('next-target'));
            const alvo = document.querySelector(`.node[data-id="${proximoNumeroEsperado}"]`);
            if (alvo) alvo.classList.add('next-target');
        }

        /* ==========================================================
           INTERAÇÃO DO JOGADOR
           ========================================================== */
        function lidarComCliqueNode(nodeObj, elementoNode, modoNumeracao) {
            if (nivelConcluido) return;

            // Clique correto
            if (nodeObj.id === proximoNumeroEsperado) {
                // Verifica se a nova linha cruzaria alguma existente
                if (ligacoesFeitas.length > 0) {
                    const anterior = ligacoesFeitas[ligacoesFeitas.length - 1];
                    if (cruzariaAlgum({ x: anterior.x, y: anterior.y }, { x: nodeObj.x, y: nodeObj.y })) {
                        // Erro: cruzamento
                        elementoNode.classList.add('error');
                        setTimeout(() => elementoNode.classList.remove('error'), 400);
                        infoInstrucao.textContent = `⚠️ Esta ligação cruzaria uma linha já feita.`;
                        return;
                    }
                }

                elementoNode.classList.add('completed');
                elementoNode.classList.remove('next-target');
                ligacoesFeitas.push(nodeObj);

                if (proximoNumeroEsperado > 1) {
                    const anterior = ligacoesFeitas[ligacoesFeitas.length - 2];
                    desenharLinha(anterior, nodeObj);
                }

                proximoNumeroEsperado++;

                if (proximoNumeroEsperado <= totalPontosNivel) {
                    infoInstrucao.textContent = `✨ Ótimo! Próximo: ${obterTextoRotulo(proximoNumeroEsperado, modoNumeracao, totalPontosNivel)}`;
                    marcarProximoAlvo();
                } else {
                    concluirNivelComSucesso();
                }
            }
            // Clique fora de ordem
            else if (nodeObj.id > proximoNumeroEsperado) {
                elementoNode.classList.add('error');
                setTimeout(() => elementoNode.classList.remove('error'), 400);
                infoInstrucao.textContent = `⚠️ Siga a ordem! Próximo: ${obterTextoRotulo(proximoNumeroEsperado, modoNumeracao, totalPontosNivel)}`;
            }
            // Clique em nó já feito — ignora silenciosamente
        }

        function desenharLinha(p1, p2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', '#22c55e');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            canvasLines.appendChild(line);
        }

        /* ==========================================================
           TIMER
           ========================================================== */
        function iniciarTimer() {
            pararTimer();
            timerInterval = setInterval(() => {
                segundos++;
                displayTempo.textContent = formatarTempo(segundos);
            }, 1000);
        }
        function pararTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        /* ==========================================================
           CONCLUSÃO DO NÍVEL
           ========================================================== */
        async function concluirNivelComSucesso() {
            nivelConcluido = true;
            pararTimer();
            infoInstrucao.textContent = `🎉 Nível ${nivelAtual} concluído em ${formatarTempo(segundos)}!`;

            const pontosGanhos = nivelAtual * 10 + Math.max(0, 100 - segundos);
            pontuacaoAcumulada += pontosGanhos;

            let novoRecorde = false;
            if (!recordesNivel[nivelAtual] || segundos < recordesNivel[nivelAtual]) {
                recordesNivel[nivelAtual] = segundos;
                novoRecorde = true;
            }

            // Avança o nível (na próxima ronda)
            const nivelParaSalvar = nivelAtual + 1;

            try {
                await update(ref(db, 'jogadores/' + jogadorSessao.chave), {
                    pontos: pontuacaoAcumulada,
                    nivel: nivelParaSalvar,
                    recordesFlow: recordesNivel,
                    ultimaAtualizacao: new Date().toISOString()
                });
            } catch (error) {
                console.error("Erro Firebase:", error);
            }

            displayPontos.textContent = pontuacaoAcumulada;
            displayNivel.textContent = nivelParaSalvar;
            atualizarDisplayRecorde();

            let msg = `🏆 Nível ${nivelAtual} concluído!\n+${pontosGanhos} pontos.`;
            if (novoRecorde) msg += `\n🌟 Novo recorde pessoal: ${formatarTempo(segundos)}!`;
            alert(msg);

            enviarEmailResumo(jogadorSessao.nome, jogadorSessao.email, nivelParaSalvar, pontuacaoAcumulada, jogadorSessao.avatar);

            // Atualiza o estado interno para a próxima ronda
            nivelAtual = nivelParaSalvar;

            btnAvancar.textContent = `Avançar para Nível ${nivelAtual} 🚀`;
            btnAvancar.classList.remove('hidden');
        }

        function enviarEmailResumo(nome, email, nivel, pontos, avatar) {
            const templateParams = {
                to_name: nome,
                to_email: email,
                avatar: avatar,
                nivel: nivel,
                pontos: pontos,
                mensagem: `Parabéns! O seu nível atual é ${nivel} e acumulou ${pontos} pontos no Brain Link.`
            };

            emailjs.send('SEU_SERVICE_ID', 'SEU_TEMPLATE_ID', templateParams)
                .then(() => console.log('E-mail enviado.'))
                .catch((error) => console.error('Erro ao enviar e-mail:', error));
        }

        /* ==========================================================
           CARREGAMENTO INICIAL
           ========================================================== */
        async function carregarDadosJogador() {
            displayNome.textContent = jogadorSessao.nome;
            displayAvatar.textContent = jogadorSessao.avatar;

            try {
                const snap = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
                if (snap.exists()) {
                    const dados = snap.val();
                    pontuacaoAcumulada = dados.pontos || 0;
                    nivelAtual = dados.nivel || 1;
                    recordesNivel = dados.recordesFlow || {};
                }
            } catch (error) {
                console.warn("Modo offline:", error);
            }

            displayPontos.textContent = pontuacaoAcumulada;
            displayNivel.textContent = nivelAtual;
            iniciarNovoJogoRonda();
        }

        carregarDadosJogador();

        /* ==========================================================
           EVENTOS DE UI
           ========================================================== */
        btnReiniciarNivel.addEventListener('click', () => {
            iniciarNovoJogoRonda();
        });

        selectMudarNivel.addEventListener('change', (e) => {
            const novoNivel = parseInt(e.target.value);
            if (novoNivel) {
                nivelAtual = novoNivel;
                selectMudarNivel.value = "";
                iniciarNovoJogoRonda();
            }
        });

        selectTipoNumeracao.addEventListener('change', () => {
            iniciarNovoJogoRonda();
        });

        btnAvancar.addEventListener('click', () => {
            iniciarNovoJogoRonda();
        });
    </script>
</body>
</html>
