<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sequência Matemática — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 8px 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-nivel { color: var(--c-cyan); }
#display-tempo { color: #60a5fa; }
#display-pontos { color: var(--c-green); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

/* ==========================================================
   TIMER BAR
   ========================================================== */
.timer-bar {
    height: 8px;
    background: rgba(148, 163, 184, 0.2);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 0 14px;
    position: relative;
}
.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c-green), var(--c-amber), var(--c-red));
    border-radius: 99px;
    transition: width 0.15s linear;
    width: 100%;
}

/* ==========================================================
   QUESTÃO / EXPRESSÃO
   ========================================================== */
#question-wrapper {
    position: relative;
    width: 100%;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 24px 16px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.expressao {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(32px, 8vmin, 52px);
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.02em;
    text-shadow:
        0 0 12px rgba(99, 102, 241, 0.6),
        0 4px 8px rgba(0, 0, 0, 0.9);
    line-height: 1.1;
    user-select: none;
    -webkit-user-select: none;
}
.expressao .operador {
    color: var(--c-cyan);
    margin: 0 6px;
}
.expressao .interrogacao {
    color: var(--c-amber);
    animation: pulse-q 1.2s infinite;
}
@keyframes pulse-q {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.08); }
}

/* ==========================================================
   OPÇÕES DE RESPOSTA
   ========================================================== */
.opcoes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.opcao {
    padding: 18px 12px;
    border-radius: 14px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.55);
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(20px, 5vmin, 26px);
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s ease;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.opcao:hover:not(:disabled) {
    border-color: var(--btn-primary);
    background: rgba(99, 102, 241, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.4);
}
.opcao:disabled {
    cursor: default;
}
.opcao.correta {
    background: rgba(74, 222, 128, 0.3) !important;
    border-color: var(--c-green) !important;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.5);
    animation: acerto-pop 0.4s ease;
}
.opcao.incorreta {
    background: rgba(239, 68, 68, 0.3) !important;
    border-color: var(--c-red) !important;
    animation: erro-shake 0.4s ease;
}
@keyframes acerto-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}
@keyframes erro-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

/* ==========================================================
   CONTROLES
   ========================================================== */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

/* ==========================================================
   OVERLAY
   ========================================================== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 24px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 52px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay button {
    max-width: 260px;
}

/* Feedback flutuante +1 / -1 */
.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 48px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.negativo { color: var(--c-red); text-shadow: 0 0 20px var(--c-red); }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
}

/* Badge de feedback */
.feedback-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.feedback-badge.ok {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.feedback-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}

/* Recorde */
.recorde-info {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
}
.recorde-info strong {
    color: var(--c-amber);
    font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="classico">⏱️ Clássico</button>
        <button class="mode-btn" data-mode="sobrevivencia">💀 Sobrevivência</button>
        <button class="mode-btn" data-mode="nivel">🎯 Níveis</button>
    </div>

    <div class="score-board">
        <div id="label-bloco1">Nível<br><strong id="display-nivel">1</strong></div>
        <div id="label-bloco2">Tempo<br><strong id="display-tempo">60s</strong></div>
        <div id="label-bloco3">Pontos<br><strong id="display-pontos">0</strong></div>
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div style="text-align:center;">
        <span class="feedback-badge" id="feedback-badge">Pronto</span>
    </div>

    <p class="instructions" id="info-instrucao">
        🧮 Escolha a resposta correta antes que o tempo acabe!
    </p>

    <div id="question-wrapper">
        <div class="expressao" id="expressao">
            <span class="interrogacao">?</span>
        </div>
        <div id="overlay" class="overlay hidden"></div>
    </div>

    <div class="opcoes-grid" id="opcoes-grid"></div>

    <div class="controls-grid">
        <button id="btn-iniciar">▶️ Iniciar Jogo</button>
    </div>

    <div class="recorde-info">
        <span>🏆 Recorde: <strong id="display-recorde">0</strong></span>
        <span>🎯 Precisão: <strong id="display-precisao">0%</strong></span>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-calculo] Inicializando...');

    // ==========================================================
    // CONFIGURAÇÃO DOS NÍVEIS
    // ==========================================================
    // Cada nível tem: tipo de operação, faixa de números, tempo em segundos
    var NIVEIS = [
        // Nível 1-5: soma simples
        { op: '+', max: 10, tempo: 10, desc: 'Soma até 10' },
        { op: '+', max: 20, tempo: 10, desc: 'Soma até 20' },
        { op: '+', max: 50, tempo: 10, desc: 'Soma até 50' },
        { op: '+', max: 100, tempo: 9, desc: 'Soma até 100' },
        { op: '+', max: 100, tempo: 8, desc: 'Soma até 100 (rápido)' },
        // Nível 6-10: subtração
        { op: '-', max: 20, tempo: 10, desc: 'Subtração até 20' },
        { op: '-', max: 50, tempo: 10, desc: 'Subtração até 50' },
        { op: '-', max: 100, tempo: 9, desc: 'Subtração até 100' },
        { op: '-', max: 100, tempo: 8, desc: 'Subtração até 100 (rápido)' },
        { op: '-', max: 100, tempo: 7, desc: 'Subtração rápida' },
        // Nível 11-15: multiplicação
        { op: '×', max: 5,  tempo: 10, desc: 'Tabuada do 1-5' },
        { op: '×', max: 5,  tempo: 8,  desc: 'Tabuada do 1-5 (rápido)' },
        { op: '×', max: 10, tempo: 10, desc: 'Tabuada do 1-10' },
        { op: '×', max: 10, tempo: 8,  desc: 'Tabuada do 1-10 (rápido)' },
        { op: '×', max: 10, tempo: 6,  desc: 'Tabuada relâmpago' },
        // Nível 16-20: divisão
        { op: '÷', max: 10, tempo: 10, desc: 'Divisão simples' },
        { op: '÷', max: 10, tempo: 8,  desc: 'Divisão rápida' },
        { op: '÷', max: 12, tempo: 8,  desc: 'Divisão até 12' },
        { op: '÷', max: 12, tempo: 7,  desc: 'Divisão até 12 (rápido)' },
        { op: '÷', max: 12, tempo: 6,  desc: 'Divisão relâmpago' },
        // Nível 21+: mistos
        { op: 'mix', max: 12, tempo: 8, desc: 'Operações mistas' }
    ];

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = 'classico';        // classico | sobrevivencia | nivel
    var nivel = 1;
    var pontos = 0;
    var acertos = 0;
    var erros = 0;
    var jogoAtivo = false;
    var aceitandoResposta = false;
    var questaoAtual = null;            // { texto, resposta, opcoes, operador }
    var tempoRestante = 0;
    var timerContagem = null;
    var timerProxima = null;
    var dificuldadeMax = 10;            // Nível máximo para modo Níveis

    // Recordes
    var recordePontos = parseInt(localStorage.getItem('brain_calculo_recorde') || '0', 10);
    var recordeNivel = parseInt(localStorage.getItem('brain_calculo_nivel') || '1', 10);

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        play: function(freq, type, duration) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(0.08, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duration + 0.02);
            } catch (e) {}
        },
        acerto: function() {
            var self = this;
            [523, 659, 783].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.18); }, i * 70);
            });
        },
        erro: function() {
            this.play(180, 'sawtooth', 0.35);
        },
        tique: function() {
            this.play(880, 'square', 0.04);
        },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.22); }, i * 110);
            });
        }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function embaralhar(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function atualizarBadge(texto, classe) {
        var b = $('feedback-badge');
        b.textContent = texto;
        b.className = 'feedback-badge' + (classe ? ' ' + classe : '');
    }

    function atualizarPlacar() {
        $('display-nivel').textContent = String(nivel);
        $('display-pontos').textContent = String(pontos);
        $('display-recorde').textContent = String(recordePontos);
        var total = acertos + erros;
        var precisao = total > 0 ? Math.round((acertos / total) * 100) : 0;
        $('display-precisao').textContent = precisao + '%';
    }

    // ==========================================================
    // GERADOR DE QUESTÕES
    // ==========================================================
    function gerarQuestao() {
        var cfg = NIVEIS[Math.min(nivel - 1, NIVEIS.length - 1)];
        var operador = cfg.op;
        if (operador === 'mix') {
            var ops = ['+', '-', '×', '÷'];
            operador = ops[randInt(0, 3)];
        }

        var a, b, resposta, texto;

        if (operador === '+') {
            a = randInt(1, cfg.max);
            b = randInt(1, cfg.max);
            resposta = a + b;
            texto = a + ' + ' + b;
        } else if (operador === '-') {
            a = randInt(Math.floor(cfg.max / 2), cfg.max);
            b = randInt(1, a);
            resposta = a - b;
            texto = a + ' − ' + b;
        } else if (operador === '×') {
            a = randInt(2, cfg.max);
            b = randInt(2, cfg.max);
            resposta = a * b;
            texto = a + ' × ' + b;
        } else if (operador === '÷') {
            // Gera divisão exata
            b = randInt(2, cfg.max);
            resposta = randInt(2, cfg.max);
            a = b * resposta;
            texto = a + ' ÷ ' + b;
        }

        // Gera opções erradas plausíveis
        var opcoes = [resposta];
        var variacoes = [
            resposta + 1,
            resposta - 1,
            resposta + 2,
            resposta - 2,
            resposta + 10,
            resposta - 10,
            resposta + randInt(3, 5),
            resposta - randInt(3, 5)
        ];

        for (var i = 0; i < variacoes.length && opcoes.length < 4; i++) {
            var v = variacoes[i];
            if (v > 0 && opcoes.indexOf(v) === -1) {
                opcoes.push(v);
            }
        }

        // Se por acaso não chegou a 4, completa aleatoriamente
        while (opcoes.length < 4) {
            var extra = resposta + randInt(-20, 20);
            if (extra > 0 && opcoes.indexOf(extra) === -1) {
                opcoes.push(extra);
            }
        }

        opcoes = embaralhar(opcoes);

        return {
            texto: texto,
            operador: operador,
            resposta: resposta,
            opcoes: opcoes,
            tempo: cfg.tempo
        };
    }

    // ==========================================================
    // RENDERIZAÇÃO
    // ==========================================================
    function renderizarQuestao(q) {
        var exp = $('expressao');
        exp.innerHTML = '';

        // Quebra o texto em partes para destacar o operador
        var partes = q.texto.split(' ');
        partes.forEach(function(p, i) {
            if (p === '+' || p === '−' || p === '×' || p === '÷') {
                var span = document.createElement('span');
                span.className = 'operador';
                span.textContent = ' ' + p + ' ';
                exp.appendChild(span);
            } else {
                exp.appendChild(document.createTextNode(p));
            }
        });

        var qmark = document.createElement('span');
        qmark.className = 'interrogacao';
        qmark.textContent = ' = ?';
        exp.appendChild(qmark);

        // Renderiza opções
        var grid = $('opcoes-grid');
        grid.innerHTML = '';

        q.opcoes.forEach(function(valor) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opcao';
            btn.textContent = String(valor);
            btn.dataset.valor = valor;
            btn.addEventListener('click', function() {
                responder(valor, btn);
            });
            grid.appendChild(btn);
        });
    }

    function bloquearOpcoes(bloquear) {
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = bloquear;
        }
    }

    // ==========================================================
    // TIMER
    // ==========================================================
    function iniciarTimerQuestao(segundos) {
        tempoRestante = segundos;
        atualizarTimerBar();
        $('display-tempo').textContent = Math.ceil(tempoRestante) + 's';

        if (timerContagem) clearInterval(timerContagem);
        var tiqueAnterior = Math.ceil(tempoRestante);

        timerContagem = setInterval(function() {
            tempoRestante -= 0.1;
            if (tempoRestante <= 0) {
                tempoRestante = 0;
                atualizarTimerBar();
                clearInterval(timerContagem);
                timerContagem = null;
                tempoEsgotado();
                return;
            }
            atualizarTimerBar();
            var seg = Math.ceil(tempoRestante);
            if (seg !== tiqueAnterior) {
                tiqueAnterior = seg;
                $('display-tempo').textContent = seg + 's';
                if (seg <= 3) som.tique();
            }
        }, 100);
    }

    function atualizarTimerBar() {
        var cfg = NIVEIS[Math.min(nivel - 1, NIVEIS.length - 1)];
        var tempoMax = cfg.tempo;
        var pct = (tempoRestante / tempoMax) * 100;
        $('timer-fill').style.width = pct + '%';
    }

    function pararTimer() {
        if (timerContagem) {
            clearInterval(timerContagem);
            timerContagem = null;
        }
    }

    // ==========================================================
    // FLUXO DO JOGO
    // ==========================================================
    function proximaQuestao() {
        if (!jogoAtivo) return;
        questaoAtual = gerarQuestao();
        renderizarQuestao(questaoAtual);
        bloquearOpcoes(false);
        aceitandoResposta = true;
        iniciarTimerQuestao(questaoAtual.tempo);
        atualizarBadge('👉 Responda!', '');
    }

    function responder(valor, btn) {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        pararTimer();

        var correta = (valor === questaoAtual.resposta);

        // Marca todas as opções
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            var b = botoes[i];
            b.disabled = true;
            var v = parseInt(b.dataset.valor, 10);
            if (v === questaoAtual.resposta) {
                b.classList.add('correta');
            } else if (b === btn && !correta) {
                b.classList.add('incorreta');
            }
        }

        if (correta) {
            som.acerto();
            var pontosGanhos = 10 + Math.max(0, Math.floor(tempoRestante));
            pontos += pontosGanhos;
            acertos++;
            atualizarBadge('✅ Correto!', 'ok');
            mostrarFeedbackFloat('+' + pontosGanhos, 'positivo');
        } else {
            som.erro();
            erros++;
            atualizarBadge('❌ Errado!', 'erro');
            mostrarFeedbackFloat('✗', 'negativo');

            // No modo sobrevivência, fim imediato
            if (modoAtual === 'sobrevivencia') {
                atualizarPlacar();
                setTimeout(function() { fimDeJogo(); }, 1200);
                return;
            }
        }

        // Atualiza recorde
        if (pontos > recordePontos) {
            recordePontos = pontos;
            localStorage.setItem('brain_calculo_recorde', String(recordePontos));
        }
        if (nivel > recordeNivel) {
            recordeNivel = nivel;
            localStorage.setItem('brain_calculo_nivel', String(recordeNivel));
        }

        atualizarPlacar();

        // No modo classico/nivel, avança
        if (modoAtual === 'classico' || modoAtual === 'nivel') {
            // Avança nível a cada 5 acertos
            if (acertos > 0 && acertos % 5 === 0 && correta) {
                if (modoAtual === 'nivel' && nivel >= dificuldadeMax) {
                    setTimeout(function() { fimDeJogo(); }, 1200);
                    return;
                }
                nivel++;
                atualizarPlacar();
                atualizarBadge('⬆️ Nível ' + nivel + '!', 'ok');
            }

            timerProxima = setTimeout(function() {
                proximaQuestao();
            }, correta ? 900 : 1400);
        }
    }

    function tempoEsgotado() {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        erros++;

        // Marca todas como bloqueadas e mostra a correta
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = true;
            var v = parseInt(botoes[i].dataset.valor, 10);
            if (v === questaoAtual.resposta) {
                botoes[i].classList.add('correta');
            }
        }

        som.erro();
        atualizarBadge('⏰ Tempo esgotado!', 'erro');
        mostrarFeedbackFloat('⏰', 'negativo');
        atualizarPlacar();

        if (modoAtual === 'sobrevivencia') {
            setTimeout(function() { fimDeJogo(); }, 1400);
            return;
        }

        timerProxima = setTimeout(function() {
            proximaQuestao();
        }, 1400);
    }

    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        $('question-wrapper').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 950);
    }

    // ==========================================================
    // INÍCIO / FIM
    // ==========================================================
    function iniciarJogo() {
        jogoAtivo = true;
        nivel = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        aceitandoResposta = false;

        esconderOverlay();
        atualizarPlacar();

        if (modoAtual === 'classico') {
            $('display-tempo').textContent = '60s';
            tempoRestante = 60;
            atualizarTimerBar();
            // Timer global de 60 segundos
            if (timerContagem) clearInterval(timerContagem);
            timerContagem = setInterval(function() {
                tempoRestante -= 0.1;
                if (tempoRestante <= 0) {
                    tempoRestante = 0;
                    clearInterval(timerContagem);
                    timerContagem = null;
                    fimDeJogo();
                    return;
                }
                atualizarTimerBar();
                $('display-tempo').textContent = Math.ceil(tempoRestante) + 's';
            }, 100);
        }

        setTimeout(function() {
            proximaQuestao();
        }, 400);

        atualizarBadge('▶️ Jogo iniciado!', 'ok');
    }

    function fimDeJogo() {
        jogoAtivo = false;
        aceitandoResposta = false;
        pararTimer();
        if (timerProxima) {
            clearTimeout(timerProxima);
            timerProxima = null;
        }

        var total = acertos + erros;
        var precisao = total > 0 ? Math.round((acertos / total) * 100) : 0;

        // Atualiza recordes
        if (pontos > recordePontos) {
            recordePontos = pontos;
            localStorage.setItem('brain_calculo_recorde', String(recordePontos));
        }
        if (nivel > recordeNivel) {
            recordeNivel = nivel;
            localStorage.setItem('brain_calculo_nivel', String(recordeNivel));
        }

        var medalha, titulo, mensagem;
        if (precisao >= 90 && acertos >= 15) {
            medalha = '🏆'; titulo = 'Gênio Matemático!';
            mensagem = 'Impressionante! Cálculo mental de elite.';
        } else if (precisao >= 75 && acertos >= 10) {
            medalha = '🥇'; titulo = 'Mestre dos Números!';
            mensagem = 'Excelente! Sua matemática está afiada.';
        } else if (precisao >= 50 && acertos >= 5) {
            medalha = '🥈'; titulo = 'Bom Trabalho!';
            mensagem = 'Continue treinando — vai longe!';
        } else {
            medalha = '🥉'; titulo = 'Continue Tentando!';
            mensagem = 'A prática leva à perfeição. Tente novamente!';
        }

        som.vitoria();

        mostrarOverlay({
            titulo: medalha + ' ' + titulo,
            htmlExtra:
                '<div class="grande">' + pontos + ' pts</div>' +
                '<div style="display:flex; gap:16px; justify-content:center; margin-top:12px; font-size:13px;">' +
                    '<span style="color:var(--c-green)">✅ ' + acertos + '</span>' +
                    '<span style="color:var(--c-red)">❌ ' + erros + '</span>' +
                    '<span style="color:var(--c-cyan)">🎯 ' + precisao + '%</span>' +
                '</div>' +
                '<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">' +
                    'Recorde: <strong style="color:var(--c-amber)">' + recordePontos + ' pts</strong>' +
                '</div>',
            subtitulo: mensagem,
            botao: { texto: '🔄 Jogar Novamente', acao: function() { iniciarJogo(); } }
        });

        atualizarBadge('🏁 Fim de jogo', 'erro');
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var ov = $('overlay');
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;

        jogoAtivo = false;
        aceitandoResposta = false;
        pararTimer();
        if (timerProxima) { clearTimeout(timerProxima); timerProxima = null; }

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        esconderOverlay();
        nivel = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        atualizarPlacar();
        $('display-tempo').textContent = (novoModo === 'classico') ? '60s' : '—';
        $('opcoes-grid').innerHTML = '';
        $('expressao').innerHTML = '<span class="interrogacao">?</span>';

        if (novoModo === 'classico') {
            $('info-instrucao').textContent = '⏱️ 60 segundos. Responda o máximo de questões corretas!';
        } else if (novoModo === 'sobrevivencia') {
            $('info-instrucao').textContent = '💀 Um único erro encerra o jogo. Cuidado!';
        } else if (novoModo === 'nivel') {
            $('info-instrucao').textContent = '🎯 Progressão por 20 níveis, do fácil ao difícil!';
        }

        atualizarBadge('Pronto', '');
        $('timer-fill').style.width = '0%';
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', iniciarJogo);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    atualizarPlacar();
    $('expressao').innerHTML = '<span class="interrogacao">?</span>';
    atualizarBadge('Pronto para jogar', '');
    console.log('[brain-calculo] Pronto! Modo:', modoAtual);
})();
</script>
</body>
</html>
