<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adivinha o Som — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --c-purple: #a855f7;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

/* ==========================================================
   SELETOR DE CATEGORIA
   ========================================================== */
.categoria-switch {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.cat-btn {
    padding: 9px 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
}
.cat-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

/* ==========================================================
   PLACAR
   ========================================================== */
.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-rodada { color: var(--c-cyan); }
#display-pontos { color: var(--c-green); }
#display-recorde { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

/* ==========================================================
   TIMER BAR
   ========================================================== */
.timer-bar {
    height: 6px;
    background: rgba(148, 163, 184, 0.2);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 0 12px;
}
.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c-green), var(--c-amber), var(--c-red));
    border-radius: 99px;
    transition: width 0.15s linear;
    width: 100%;
}

/* ==========================================================
   BOTÃO DE SOM / PLAYER
   ========================================================== */
.sound-player {
    position: relative;
    margin: 0 auto 12px;
    padding: 24px 16px;
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    overflow: hidden;
}
.sound-visualizer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 60px;
}
.bar-visualizer {
    width: 5px;
    height: 20%;
    background: linear-gradient(180deg, var(--c-cyan), var(--btn-primary));
    border-radius: 4px;
    transition: height 0.1s ease;
}
.sound-player.tocando .bar-visualizer {
    animation: bar-anim 0.6s infinite ease-in-out;
}
.bar-visualizer:nth-child(1) { animation-delay: 0s; }
.bar-visualizer:nth-child(2) { animation-delay: 0.1s; }
.bar-visualizer:nth-child(3) { animation-delay: 0.2s; }
.bar-visualizer:nth-child(4) { animation-delay: 0.3s; }
.bar-visualizer:nth-child(5) { animation-delay: 0.15s; }
.bar-visualizer:nth-child(6) { animation-delay: 0.25s; }
.bar-visualizer:nth-child(7) { animation-delay: 0.05s; }
.bar-visualizer:nth-child(8) { animation-delay: 0.3s; }
.bar-visualizer:nth-child(9) { animation-delay: 0.2s; }
@keyframes bar-anim {
    0%, 100% { height: 20%; }
    50% { height: 90%; }
}

.btn-play {
    width: auto;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: var(--shadow-btn);
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.btn-play:hover:not(:disabled) {
    filter: brightness(1.1);
    transform: translateY(-2px);
}
.btn-play:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.btn-play.tocando {
    background: linear-gradient(135deg, #16a34a, #22c55e);
}

/* ==========================================================
   OPÇÕES
   ========================================================== */
.opcoes-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.opcao {
    padding: 16px 10px;
    border-radius: 14px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.55);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-height: 80px;
    justify-content: center;
}
.opcao .emoji {
    font-size: 28px;
    line-height: 1;
}
.opcao .texto {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.02em;
}
.opcao:hover:not(:disabled) {
    border-color: var(--btn-primary);
    background: rgba(99, 102, 241, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.4);
}
.opcao:disabled {
    cursor: default;
}
.opcao.correta {
    background: rgba(74, 222, 128, 0.3) !important;
    border-color: var(--c-green) !important;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.5);
    animation: acerto-pop 0.4s ease;
}
.opcao.incorreta {
    background: rgba(239, 68, 68, 0.3) !important;
    border-color: var(--c-red) !important;
    animation: erro-shake 0.4s ease;
}
.opcao.correta .emoji { animation: bounce 0.5s ease; }
@keyframes acerto-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}
@keyframes erro-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* ==========================================================
   CONTROLES
   ========================================================== */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

/* ==========================================================
   OVERLAY
   ========================================================== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.94);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 22px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 48px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay button {
    max-width: 260px;
}

/* Feedback flutuante */
.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.negativo { color: var(--c-red); text-shadow: 0 0 20px var(--c-red); }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}

/* Badge */
.fase-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.fase-badge.ok {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.fase-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>
    </div>

    <div class="categoria-switch">
        <button class="cat-btn active" data-cat="animais">🐾 Animais</button>
        <button class="cat-btn" data-cat="instrumentos">🎼 Instrumentos</button>
        <button class="cat-btn" data-cat="notas">🎵 Notas</button>
    </div>

    <div class="score-board">
        <div id="label-bloco1">Rodada<br><strong id="display-rodada">1</strong></div>
        <div id="label-bloco2">Pontos<br><strong id="display-pontos">0</strong></div>
        <div id="label-bloco3">Recorde<br><strong id="display-recorde">0</strong></div>
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div style="text-align:center;">
        <span class="fase-badge" id="fase-badge">Pronto</span>
    </div>

    <p class="instructions" id="info-instrucao">
        🔊 Ouça o som e escolha a opção correta. Toque em 🔁 para ouvir de novo!
    </p>

    <div class="sound-player" id="sound-player">
        <div class="sound-visualizer">
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
            <div class="bar-visualizer"></div>
        </div>
        <button id="btn-play" class="btn-play" disabled>▶️ Ouvir Som</button>
    </div>

    <div class="opcoes-grid" id="opcoes-grid"></div>

    <div class="controls-grid">
        <button id="btn-iniciar">▶️ Iniciar Jogo</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-som] Inicializando...');

    // ==========================================================
    // BANCO DE SONS POR CATEGORIA
    // ==========================================================
    // Cada som tem: emoji, nome, e uma função de síntese
    var CATEGORIAS = {
        animais: {
            nome: 'Animais',
            emoji: '🐾',
            sons: [
                { id: 'vaca',      emoji: '🐮', nome: 'Vaca',      sintese: sinteseVaca },
                { id: 'gato',      emoji: '🐱', nome: 'Gato',      sintese: sinteseGato },
                { id: 'cao',       emoji: '🐶', nome: 'Cão',       sintese: sinteseCao },
                { id: 'passaro',   emoji: '🐦', nome: 'Pássaro',   sintese: sintesePassaro },
                { id: 'lobo',      emoji: '🐺', nome: 'Lobo',      sintese: sinteseLobo },
                { id: 'sapo',      emoji: '🐸', nome: 'Sapo',      sintese: sinteseSapo },
                { id: 'galinha',   emoji: '🐔', nome: 'Galinha',   sintese: sinteseGalinha },
                { id: 'abelha',    emoji: '🐝', nome: 'Abelha',    sintese: sinteseAbelha }
            ]
        },
        instrumentos: {
            nome: 'Instrumentos',
            emoji: '🎼',
            sons: [
                { id: 'piano',     emoji: '🎹', nome: 'Piano',     sintese: sintesePiano },
                { id: 'violino',   emoji: '🎻', nome: 'Violino',   sintese: sinteseViolino },
                { id: 'tambor',    emoji: '🥁', nome: 'Tambor',    sintese: sinteseTambor },
                { id: 'flauta',    emoji: '🎺', nome: 'Trompete',  sintese: sinteseTrompete },
                { id: 'guitarra',  emoji: '🎸', nome: 'Guitarra',  sintese: sinteseGuitarra },
                { id: 'sino',      emoji: '🔔', nome: 'Sino',      sintese: sinteseSino },
                { id: 'xilofone',  emoji: '🎶', nome: 'Xilofone',  sintese: sinteseXilofone },
                { id: 'apito',     emoji: '📯', nome: 'Apito',     sintese: sinteseApito }
            ]
        },
        notas: {
            nome: 'Notas Musicais',
            emoji: '🎵',
            sons: [
                { id: 'do',   emoji: '🎵', nome: 'Dó',  sintese: function(ctx, t) { sinteseNota(ctx, t, 261.63); } },
                { id: 're',   emoji: '🎵', nome: 'Ré',  sintese: function(ctx, t) { sinteseNota(ctx, t, 293.66); } },
                { id: 'mi',   emoji: '🎵', nome: 'Mi',  sintese: function(ctx, t) { sinteseNota(ctx, t, 329.63); } },
                { id: 'fa',   emoji: '🎵', nome: 'Fá',  sintese: function(ctx, t) { sinteseNota(ctx, t, 349.23); } },
                { id: 'sol',  emoji: '🎵', nome: 'Sol', sintese: function(ctx, t) { sinteseNota(ctx, t, 392.00); } },
                { id: 'la',   emoji: '🎵', nome: 'Lá',  sintese: function(ctx, t) { sinteseNota(ctx, t, 440.00); } },
                { id: 'si',   emoji: '🎵', nome: 'Si',  sintese: function(ctx, t) { sinteseNota(ctx, t, 493.88); } },
                { id: 'do2',  emoji: '🎵', nome: 'Dó agudo', sintese: function(ctx, t) { sinteseNota(ctx, t, 523.25); } }
            ]
        }
    };

    // ==========================================================
    // SÍNTESE DE SONS
    // ==========================================================
    // Funções auxiliares de síntese sonora

    function tocarOscilador(ctx, freq, tipo, inicio, duracao, volume, freqFinal) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = tipo || 'sine';
        osc.frequency.setValueAtTime(freq, inicio);
        if (freqFinal) {
            osc.frequency.linearRampToValueAtTime(freqFinal, inicio + duracao);
        }
        gain.gain.setValueAtTime(0, inicio);
        gain.gain.linearRampToValueAtTime(volume || 0.15, inicio + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracao);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(inicio);
        osc.stop(inicio + duracao + 0.02);
    }

    function tocarRuido(ctx, inicio, duracao, volume, filtroFreq) {
        var bufferSize = ctx.sampleRate * duracao;
        var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.5;
        }
        var src = ctx.createBufferSource();
        src.buffer = buffer;
        var filtro = ctx.createBiquadFilter();
        filtro.type = 'lowpass';
        filtro.frequency.value = filtroFreq || 1000;
        var gain = ctx.createGain();
        gain.gain.setValueAtTime(volume || 0.15, inicio);
        gain.gain.exponentialRampToValueAtTime(0.001, inicio + duracao);
        src.connect(filtro);
        filtro.connect(gain);
        gain.connect(ctx.destination);
        src.start(inicio);
        src.stop(inicio + duracao);
    }

    // ==========================================================
    // DEFINIÇÃO DOS SONS
    // ==========================================================
    // Animais
    function sinteseVaca(ctx, t) {
        tocarOscilador(ctx, 130, 'sawtooth', t, 0.8, 0.18, 90);
    }
    function sinteseGato(ctx, t) {
        tocarOscilador(ctx, 700, 'sine', t, 0.15, 0.12, 900);
        tocarOscilador(ctx, 900, 'sine', t + 0.2, 0.4, 0.12, 600);
    }
    function sinteseCao(ctx, t) {
        tocarOscilador(ctx, 400, 'square', t, 0.12, 0.15, 250);
        tocarOscilador(ctx, 400, 'square', t + 0.2, 0.12, 0.15, 250);
    }
    function sintesePassaro(ctx, t) {
        for (var i = 0; i < 3; i++) {
            tocarOscilador(ctx, 1800, 'sine', t + i * 0.15, 0.08, 0.1, 2400);
        }
    }
    function sinteseLobo(ctx, t) {
        tocarOscilador(ctx, 300, 'sine', t, 0.4, 0.15, 500);
        tocarOscilador(ctx, 500, 'sine', t + 0.4, 0.8, 0.15, 350);
    }
    function sinteseSapo(ctx, t) {
        for (var i = 0; i < 3; i++) {
            tocarOscilador(ctx, 200, 'square', t + i * 0.18, 0.1, 0.15);
        }
    }
    function sinteseGalinha(ctx, t) {
        tocarOscilador(ctx, 800, 'sawtooth', t, 0.1, 0.12, 1200);
        tocarOscilador(ctx, 1000, 'sawtooth', t + 0.15, 0.15, 0.12, 600);
    }
    function sinteseAbelha(ctx, t) {
        tocarOscilador(ctx, 220, 'sawtooth', t, 1.0, 0.1);
    }

    // Instrumentos
    function sintesePiano(ctx, t) {
        tocarOscilador(ctx, 261.63, 'triangle', t, 0.5, 0.15);
        tocarOscilador(ctx, 523.25, 'triangle', t, 0.4, 0.08);
        tocarOscilador(ctx, 784.88, 'sine', t, 0.3, 0.05);
    }
    function sinteseViolino(ctx, t) {
        tocarOscilador(ctx, 440, 'sawtooth', t, 0.6, 0.08, 442);
    }
    function sinteseTambor(ctx, t) {
        tocarRuido(ctx, t, 0.2, 0.25, 400);
        tocarOscilador(ctx, 80, 'sine', t, 0.15, 0.2, 40);
    }
    function sinteseTrompete(ctx, t) {
        tocarOscilador(ctx, 349.23, 'square', t, 0.5, 0.12);
        tocarOscilador(ctx, 698.46, 'square', t, 0.5, 0.06);
    }
    function sinteseGuitarra(ctx, t) {
        tocarOscilador(ctx, 196, 'triangle', t, 0.7, 0.15);
        tocarOscilador(ctx, 392, 'sine', t, 0.6, 0.06);
    }
    function sinteseSino(ctx, t) {
        [880, 1760, 2640].forEach(function(f, i) {
            tocarOscilador(ctx, f, 'sine', t, 0.8 - i * 0.15, 0.1);
        });
    }
    function sinteseXilofone(ctx, t) {
        [523.25, 659.25, 783.99].forEach(function(f, i) {
            tocarOscilador(ctx, f, 'triangle', t + i * 0.15, 0.2, 0.15);
        });
    }
    function sinteseApito(ctx, t) {
        tocarOscilador(ctx, 2200, 'sine', t, 0.3, 0.1, 2400);
    }

    // Notas musicais
    function sinteseNota(ctx, t, freq) {
        tocarOscilador(ctx, freq, 'sine', t, 0.8, 0.18);
        tocarOscilador(ctx, freq * 2, 'sine', t, 0.6, 0.05);
    }

    // ==========================================================
    // ESTADO
    // ==========================================================
    var categoriaAtual = 'animais';
    var rodada = 1;
    var pontos = 0;
    var acertos = 0;
    var erros = 0;
    var comboAtual = 0;
    var jogoAtivo = false;
    var aceitandoResposta = false;
    var somAtual = null;
    var opcoesAtuais = [];
    var audioCtx = null;
    var somTocando = false;
    var timerRodada = null;
    var tempoRestante = 0;

    // Recordes por categoria
    var recordes = {
        animais: parseInt(localStorage.getItem('brain_som_recorde_animais') || '0', 10),
        instrumentos: parseInt(localStorage.getItem('brain_som_recorde_instrumentos') || '0', 10),
        notas: parseInt(localStorage.getItem('brain_som_recorde_notas') || '0', 10)
    };

    // ==========================================================
    // AUDIO CONTEXT
    // ==========================================================
    function getAudioCtx() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                audioCtx = null;
            }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(function(){});
        }
        return audioCtx;
    }

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function embaralhar(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function atualizarBadge(texto, classe) {
        var b = $('fase-badge');
        b.textContent = texto;
        b.className = 'fase-badge' + (classe ? ' ' + classe : '');
    }

    function atualizarPlacar() {
        $('display-rodada').textContent = String(rodada);
        $('display-pontos').textContent = String(pontos);
        $('display-recorde').textContent = String(recordes[categoriaAtual]);
    }

    // ==========================================================
    // TOCAR SOM
    // ==========================================================
    function tocarSomAtual() {
        if (!somAtual || somTocando) return;

        var ctx = getAudioCtx();
        if (!ctx) {
            atualizarBadge('❌ Áudio não suportado', 'erro');
            return;
        }

        somTocando = true;
        var player = $('sound-player');
        player.classList.add('tocando');
        $('btn-play').classList.add('tocando');
        $('btn-play').innerHTML = '🔊 Tocando...';

        var t = ctx.currentTime + 0.05;
        try {
            somAtual.sintese(ctx, t);
        } catch (e) {
            console.error('Erro ao tocar som:', e);
        }

        setTimeout(function() {
            somTocando = false;
            player.classList.remove('tocando');
            $('btn-play').classList.remove('tocando');
            $('btn-play').innerHTML = '🔁 Ouvir Novamente';
            $('btn-play').disabled = false;
        }, 1000);
    }

    // ==========================================================
    // GERAR RODADA
    // ==========================================================
    function gerarRodada() {
        var cat = CATEGORIAS[categoriaAtual];
        var todosSons = cat.sons;

        // Escolhe o som correto
        var indiceCorreto = Math.floor(Math.random() * todosSons.length);
        var somCorreto = todosSons[indiceCorreto];

        // Gera 3 distratores diferentes
        var distratores = [];
        var tentativas = 0;
        while (distratores.length < 3 && tentativas < 100) {
            tentativas++;
            var idx = Math.floor(Math.random() * todosSons.length);
            var s = todosSons[idx];
            if (s.id === somCorreto.id) continue;
            if (distratores.some(function(d) { return d.id === s.id; })) continue;
            distratores.push(s);
        }

        opcoesAtuais = embaralhar([somCorreto].concat(distratores));
        somAtual = somCorreto;

        renderizarOpcoes();

        // Reseta botão de play
        $('btn-play').innerHTML = '▶️ Ouvir Som';
        $('btn-play').disabled = false;

        // Toca automaticamente após pequeno delay
        aceitandoResposta = true;
        setTimeout(function() { tocarSomAtual(); }, 400);

        // Inicia timer da rodada
        iniciarTimerRodada(15);
    }

    function renderizarOpcoes() {
        var grid = $('opcoes-grid');
        grid.innerHTML = '';

        opcoesAtuais.forEach(function(s) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opcao';
            btn.dataset.id = s.id;
            btn.innerHTML =
                '<span class="emoji">' + s.emoji + '</span>' +
                '<span class="texto">' + s.nome + '</span>';
            btn.addEventListener('click', function() {
                responder(s, btn);
            });
            grid.appendChild(btn);
        });
    }

    function bloquearOpcoes(bloquear) {
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = bloquear;
        }
    }

    // ==========================================================
    // RESPONDER
    // ==========================================================
    function responder(somEscolhido, btn) {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        pararTimerRodada();

        var acertou = (somEscolhido.id === somAtual.id);

        // Marca todas as opções
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            var b = botoes[i];
            b.disabled = true;
            if (b.dataset.id === somAtual.id) {
                b.classList.add('correta');
            } else if (b === btn && !acertou) {
                b.classList.add('incorreta');
            }
        }

        if (acertou) {
            acertos++;
            comboAtual++;
            var bonus = Math.min(comboAtual, 5);
            var ganho = 10 + bonus * 2;
            pontos += ganho;

            tocarSomAcerto();
            atualizarBadge('✅ Correto! +' + ganho, 'ok');
            mostrarFeedbackFloat('+' + ganho, 'positivo');

            // Atualiza recorde
            if (pontos > recordes[categoriaAtual]) {
                recordes[categoriaAtual] = pontos;
                localStorage.setItem('brain_som_recorde_' + categoriaAtual, String(pontos));
            }
        } else {
            erros++;
            comboAtual = 0;
            tocarSomErro();
            atualizarBadge('❌ Errado! Era ' + somAtual.nome, 'erro');
            mostrarFeedbackFloat('✗', 'negativo');
        }

        atualizarPlacar();

        // Próxima rodada
        rodada++;
        setTimeout(function() {
            gerarRodada();
        }, acertou ? 1400 : 2000);
    }

    // ==========================================================
    // TIMER DA RODADA
    // ==========================================================
    function iniciarTimerRodada(segundos) {
        tempoRestante = segundos;
        atualizarTimerBar();
        if (timerRodada) clearInterval(timerRodada);
        timerRodada = setInterval(function() {
            tempoRestante -= 0.1;
            if (tempoRestante <= 0) {
                tempoRestante = 0;
                atualizarTimerBar();
                clearInterval(timerRodada);
                timerRodada = null;
                tempoEsgotado();
                return;
            }
            atualizarTimerBar();
        }, 100);
    }

    function atualizarTimerBar() {
        var pct = (tempoRestante / 15) * 100;
        $('timer-fill').style.width = pct + '%';
    }

    function pararTimerRodada() {
        if (timerRodada) {
            clearInterval(timerRodada);
            timerRodada = null;
        }
    }

    function tempoEsgotado() {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        comboAtual = 0;
        erros++;

        // Mostra a resposta correta
        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = true;
            if (botoes[i].dataset.id === somAtual.id) {
                botoes[i].classList.add('correta');
            }
        }

        tocarSomErro();
        atualizarBadge('⏰ Tempo esgotado! Era ' + somAtual.nome, 'erro');
        atualizarPlacar();

        rodada++;
        setTimeout(function() {
            gerarRodada();
        }, 2000);
    }

    // ==========================================================
    // SONS DE FEEDBACK (acerto/erro)
    // ==========================================================
    function tocarSomAcerto() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var t = ctx.currentTime;
        [523.25, 659.25, 783.99].forEach(function(f, i) {
            tocarOscilador(ctx, f, 'sine', t + i * 0.07, 0.18, 0.1);
        });
    }

    function tocarSomErro() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var t = ctx.currentTime;
        tocarOscilador(ctx, 220, 'sawtooth', t, 0.2, 0.1, 160);
    }

    // ==========================================================
    // FEEDBACK FLUTUANTE
    // ==========================================================
    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        $('sound-player').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 900);
    }

    // ==========================================================
    // INÍCIO / FIM
    // ==========================================================
    function iniciarJogo() {
        getAudioCtx();
        jogoAtivo = true;
        rodada = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        comboAtual = 0;
        aceitandoResposta = false;

        esconderOverlay();
        atualizarPlacar();
        atualizarBadge('🔊 Prepare os ouvidos...', 'ok');
        $('info-instrucao').textContent = '🔊 Ouça o som e escolha a opção correta.';

        setTimeout(function() {
            gerarRodada();
        }, 500);
    }

    function fimDeJogo() {
        jogoAtivo = false;
        aceitandoResposta = false;
        pararTimerRodada();

        var total = acertos + erros;
        var precisao = total > 0 ? Math.round((acertos / total) * 100) : 0;

        var medalha, titulo, mensagem;
        if (precisao >= 90 && acertos >= 10) {
            medalha = '🏆'; titulo = 'Ouvido Absoluto!';
            mensagem = 'Impressionante! Você reconhece qualquer som.';
        } else if (precisao >= 75 && acertos >= 7) {
            medalha = '🥇'; titulo = 'Ouvido de Músico!';
            mensagem = 'Excelente perceção auditiva!';
        } else if (precisao >= 50 && acertos >= 4) {
            medalha = '🥈'; titulo = 'Bom Ouvinte!';
            mensagem = 'Bom trabalho! Continue praticando.';
        } else {
            medalha = '🥉'; titulo = 'Aprendiz!';
            mensagem = 'Bom começo! Tente novamente.';
        }

        // Atualiza recorde
        if (pontos > recordes[categoriaAtual]) {
            recordes[categoriaAtual] = pontos;
            localStorage.setItem('brain_som_recorde_' + categoriaAtual, String(pontos));
        }

        tocarSomVitoria();

        mostrarOverlay({
            titulo: medalha + ' ' + titulo,
            htmlExtra:
                '<div class="grande">' + pontos + ' pts</div>' +
                '<div style="display:flex; gap:14px; justify-content:center; margin-top:12px; font-size:13px;">' +
                    '<span style="color:var(--c-green)">✅ ' + acertos + '</span>' +
                    '<span style="color:var(--c-red)">❌ ' + erros + '</span>' +
                    '<span style="color:var(--c-cyan)">🎯 ' + precisao + '%</span>' +
                '</div>' +
                '<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">' +
                    'Recorde: <strong style="color:var(--c-amber)">' + recordes[categoriaAtual] + ' pts</strong>' +
                '</div>',
            subtitulo: mensagem,
            botao: { texto: '🔄 Jogar Novamente', acao: function() { iniciarJogo(); } }
        });

        atualizarBadge('🏁 Fim de jogo', 'erro');
    }

    function tocarSomVitoria() {
        var ctx = getAudioCtx();
        if (!ctx) return;
        var t = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach(function(f, i) {
            tocarOscilador(ctx, f, 'sine', t + i * 0.12, 0.25, 0.12);
        });
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        if (!ov) return;
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        // Cria overlay dinamicamente se não existir
        var ov = $('overlay');
        if (!ov) {
            ov = document.createElement('div');
            ov.id = 'overlay';
            ov.className = 'overlay';
            document.querySelector('.container').appendChild(ov);
        }
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE CATEGORIA
    // ==========================================================
    function trocarCategoria(novaCat) {
        if (novaCat === categoriaAtual) return;
        categoriaAtual = novaCat;

        // Cancela jogo
        jogoAtivo = false;
        aceitandoResposta = false;
        pararTimerRodada();
        esconderOverlay();

        var botoes = document.querySelectorAll('.cat-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.cat === novaCat);
        }

        // Reseta
        rodada = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        comboAtual = 0;

        atualizarPlacar();
        atualizarBadge('Pronto', '');
        $('opcoes-grid').innerHTML = '';
        $('timer-fill').style.width = '0%';
        $('btn-play').innerHTML = '▶️ Ouvir Som';
        $('btn-play').disabled = true;

        var cat = CATEGORIAS[novaCat];
        $('info-instrucao').textContent = '🔊 Categoria: ' + cat.emoji + ' ' + cat.nome + '. Clique em Iniciar!';
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var catBtns = document.querySelectorAll('.cat-btn');
    for (var i = 0; i < catBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarCategoria(btn.dataset.cat); });
        })(catBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', iniciarJogo);
    $('btn-play').addEventListener('click', tocarSomAtual);

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    atualizarPlacar();
    atualizarBadge('Pronto para jogar', '');
    $('timer-fill').style.width = '0%';
    console.log('[brain-som] Pronto! Categoria:', categoriaAtual);
})();
</script>
</body>
</html>
