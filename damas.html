<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Damas - Duelo Multiplayer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. DESIGN TOKENS (Padrão do Hub)
           ========================================================== */
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;
            --btn-whatsapp: #22c55e;

            --board-light: #e2e8f0;
            --board-dark: #334155;
            --board-border: rgba(148, 163, 184, 0.45);

            --c-green: #4ade80;
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-red: #ef4444;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);

            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.25);
            --input-bg: rgba(255, 255, 255, 0.95);

            --board-light: #cbd5e1;
            --board-dark: #64748b;
            --board-border: rgba(15, 23, 42, 0.25);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
        }

        /* ==========================================================
           2. RESET E BASE
           ========================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
        body::after { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-small {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            background: var(--card-bg);
        }

        /* LOBBY */
        .lobby-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
        }
        .lobby-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: var(--c-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lobby-box p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .user-info-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            font-size: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        #display-nome { font-size: 13.5px; font-weight: 700; }

        /* STATUS DA PARTIDA DE DAMAS */
        .match-info-bar {
            display: flex;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }
        #turno-status { color: var(--c-amber); }

        /* TABULEIRO 8x8 DE DAMAS */
        .checkers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            border: 3px solid var(--board-border);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 12px;
            box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: rgba(99, 102, 241, 0.4) !important; }
        .square.highlight { background-color: rgba(74, 222, 128, 0.4) !important; }

        /* PEÇAS */
        .piece {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            transition: transform var(--t-fast);
        }
        .piece.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
            color: #0f172a;
        }
        .piece.red {
            background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c);
            border: 2px solid #7f1d1d;
            color: #fff;
        }
        .piece.king::after {
            content: "👑";
            font-size: 14px;
            position: absolute;
        }

        .instructions {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 10px;
            min-height: 18px;
        }

        button, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all var(--t-base);
        }
        button {
            border: none;
            color: #fff;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            box-shadow: var(--shadow-btn);
        }
        button:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-whatsapp { background: linear-gradient(135deg, #16a34a, #22c55e); display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="user-header" style="justify-content: center;">
                <div class="user-info-left">
                    <span id="lobby-avatar" class="user-avatar-display">😀</span>
                    <strong id="lobby-nome">Carregando...</strong>
                </div>
            </div>

            <div class="lobby-box">
                <h3>♟️ Jogo de Damas Multiplayer</h3>
                <p>Jogue uma partida clássica de Damas 8x8 em turnos com um colega em tempo real. Crie sua sala e envie o convite pelo WhatsApp!</p>
                <button id="btn-criar-sala">🚀 Criar Sala de Damas</button>
            </div>

            <div class="lobby-box" style="margin-bottom: 0;">
                <h3>🔗 Entrar com Código</h3>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-codigo-sala" placeholder="Ex: DAMAS-7812" style="font-family: monospace;">
                    <button id="btn-entrar-sala" style="width: 120px;">Entrar</button>
                </div>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <div class="user-header">
                <div class="user-info-left">
                    <span id="display-avatar" class="user-avatar-display">😀</span>
                    <strong id="display-nome"></strong>
                </div>
                <span id="display-sala-tag" style="font-size: 11px; background: rgba(99,102,241,0.15); padding: 4px 8px; border-radius: 6px; color: var(--c-blue);">Sala</span>
            </div>

            <div class="match-info-bar">
                <span>Sua Peça: <strong id="info-minha-cor" style="color: var(--c-blue);">--</strong></span>
                <span id="turno-status">Aguardando...</span>
            </div>

            <p class="instructions" id="info-instrucao">Toque em sua peça e depois na casa de destino válida.</p>

            <!-- TABULEIRO 8x8 -->
            <div class="checkers-grid" id="checkers-board"></div>

            <div id="div-whatsapp" class="hidden">
                <button id="btn-whatsapp" class="btn-whatsapp">💬 Convidar Colega pelo WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Lógica de Damas com Firebase -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        document.getElementById('lobby-nome').textContent = jogadorSessao.nome;
        document.getElementById('lobby-avatar').textContent = jogadorSessao.avatar;

        let idSalaAtual = null;
        let minhaCor = null; // 'white' (Host) ou 'red' (Convidado)
        let tabuleiro = [];
        let celulaSelecionada = null;
        let movimentosValidos = [];
        let turnoAtual = 'white';

        const themeToggleBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarTextoBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
            atualizarTextoBotaoTema(newTheme);
        });

        function atualizarTextoBotaoTema(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }

        async function inicializarPerfil() {
            document.getElementById('display-nome').textContent = jogadorSessao.nome;
            document.getElementById('display-avatar').textContent = jogadorSessao.avatar;

            const urlParams = new URLSearchParams(window.location.search);
            const salaUrl = urlParams.get('sala');
            if (salaUrl) {
                document.getElementById('input-codigo-sala').value = salaUrl;
                entrarNaSala(salaUrl);
            }
        }
        inicializarPerfil();

        // Gerar tabuleiro inicial padrão de Damas (8x8)
        // 0: Vazio, 'white': Peça branca, 'red': Peça vermelha, 'white-king'/'red-king': Damas
        function criarTabuleiroInicial() {
            let t = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'red'; // Peças vermelhas em cima
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'white'; // Peças brancas embaixo
                }
            }
            return t;
        }

        // Criar Sala
        document.getElementById('btn-criar-sala').addEventListener('click', async () => {
            idSalaAtual = 'DAMAS-' + Math.floor(1000 + Math.random() * 9000);
            minhaCor = 'white';
            tabuleiro = criarTabuleiroInicial();

            const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
            await set(salaRef, {
                status: 'jogando',
                turno: 'white',
                tabuleiro: tabuleiro,
                jogadores: {
                    [jogadorSessao.chave]: { nome: jogadorSessao.nome, cor: 'white' }
                }
            });

            entrarInterfaceJogo();
            document.getElementById('div-whatsapp').classList.remove('hidden');
            escutarFirebase();
        });

        // Entrar em Sala
        document.getElementById('btn-entrar-sala').addEventListener('click', () => {
            const codigo = document.getElementById('input-codigo-sala').value.trim().toUpperCase();
            if (!codigo) { alert('Digite o código da sala.'); return; }
            entrarNaSala(codigo);
        });

        async function entrarNaSala(codigo) {
            const salaRef = ref(db, 'salas_damas/' + codigo);
            const snapshot = await get(salaRef);
            if (!snapshot.exists()) { alert('Sala não encontrada!'); return; }

            const dados = snapshot.val();
            idSalaAtual = codigo;
            minhaCor = 'red';
            tabuleiro = dados.tabuleiro;
            turnoAtual = dados.turno;

            await update(ref(db, `salas_damas/${codigo}/jogadores/${jogadorSessao.chave}`), {
                nome: jogadorSessao.nome,
                cor: 'red'
            });

            entrarInterfaceJogo();
            escutarFirebase();
        }

        function entrarInterfaceJogo() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-sala-tag').textContent = `Sala: ${idSalaAtual}`;
            document.getElementById('info-minha-cor').textContent = minhaCor === 'white' ? '⚪ Brancas (Você começa)' : '🔴 Vermelhas';
            renderizarTabuleiro();
        }

        // WhatsApp
        document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const link = `${window.location.origin}${window.location.pathname}?sala=${idSalaAtual}`;
            const msg = encodeURIComponent(`♟️ Vamos disputar uma partida de Damas no Brain Hub?\n\nEntre na sala pelo link: ${link}\nCódigo: ${idSalaAtual}`);
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        });

        function renderizarTabuleiro() {
            const grid = document.getElementById('checkers-board');
            grid.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;

                    // Destacar seleções e movimentos
                    if (celulaSelecionada && celulaSelecionada.r === r && celulaSelecionada.c === c) {
                        square.classList.add('selected');
                    }
                    if (movimentosValidos.some(m => m.r === r && m.c === c)) {
                        square.classList.add('highlight');
                    }

                    const peca = tabuleiro[r][c];
                    if (peca) {
                        const pieceEl = document.createElement('div');
                        let corClasse = peca.includes('white') ? 'white' : 'red';
                        let isDama = peca.includes('king') ? ' king' : '';
                        pieceEl.className = `piece ${corClasse}${isDama}`;
                        square.appendChild(pieceEl);
                    }

                    if (isDark) {
                        square.addEventListener('click', () => clicarCasa(r, c));
                    }

                    grid.appendChild(square);
                }
            }

            document.getElementById('turno-status').textContent = turnoAtual === minhaCor ? "Sua vez de jogar!" : "Vez do oponente...";
        }

        function clicarCasa(r, c) {
            if (turnoAtual !== minhaCor) {
                alert("Aguarde a sua vez!");
                return;
            }

            const peca = tabuleiro[r][c];

            // Se clicar em uma peça própria, seleciona
            if (peca && peca.startsWith(minhaCor)) {
                celulaSelecionada = { r, c };
                movimentosValidos = calcularMovimentos(r, c);
                renderizarTabuleiro();
                return;
            }

            // Se clicou em uma casa de destino válida
            if (celulaSelecionada && movimentosValidos.some(m => m.r === r && m.c === c)) {
                executarMovimento(celulaSelecionada.r, celulaSelecionada.c, r, c);
            }
        }

        function calcularMovimentos(r, c) {
            let validos = [];
            let peca = tabuleiro[r][c];
            let direcoes = [];

            if (peca === 'white' || peca.includes('king')) direcoes.push(-1); // Para cima
            if (peca === 'red' || peca.includes('king')) direcoes.push(1);   // Para baixo

            let passos = peca.includes('king') ? 7 : 1; // Damas movem-se várias casas

            for (let dr of direcoes) {
                for (let dc of [-1, 1]) {
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        if (!tabuleiro[nr][nc]) {
                            validos.push({ r: nr, c: nc });
                        } else if (!tabuleiro[nr][nc].startsWith(minhaCor)) {
                            // Possível captura
                            let jumpR = nr + dr;
                            let jumpC = nc + dc;
                            if (jumpR >= 0 && jumpR < 8 && jumpC >= 0 && jumpC < 8 && !tabuleiro[jumpR][jumpC]) {
                                validos.push({ r: jumpR, c: jumpC, captura: { r: nr, c: nc } });
                            }
                        }
                    }
                }
            }
            return validos;
        }

        async function executarMovimento(deR, deC, paraR, paraC) {
            let mov = movimentosValidos.find(m => m.r === paraR && m.c === paraC);
            
            tabuleiro[paraR][paraC] = tabuleiro[deR][deC];
            tabuleiro[deR][deC] = null;

            // Se capturou peça
            if (mov && mov.captura) {
                tabuleiro[mov.captura.r][mov.captura.c] = null;
            }

            // Promoção a Dama
            if (minhaCor === 'white' && paraR === 0) tabuleiro[paraR][paraC] = 'white-king';
            if (minhaCor === 'red' && paraR === 7) tabuleiro[paraR][paraC] = 'red-king';

            celulaSelecionada = null;
            movimentosValidos = [];
            turnoAtual = turnoAtual === 'white' ? 'red' : 'white';

            renderizarTabuleiro();

            // Atualizar no Firebase
            await update(ref(db, `salas_damas/${idSalaAtual}`), {
                tabuleiro: tabuleiro,
                turno: turnoAtual
            });
        }

        function escutarFirebase() {
            const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
            onValue(salaRef, (snapshot) => {
                if (!snapshot.exists()) return;
                const dados = snapshot.val();
                tabuleiro = dados.tabuleiro;
                turnoAtual = dados.turno;
                renderizarTabuleiro();
            });
        }
    </script>
</body>
</html>
