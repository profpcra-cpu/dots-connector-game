<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Damas - Duelo Multiplayer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;
            --btn-whatsapp: #22c55e;

            --board-light: #e2e8f0;
            --board-dark: #334155;
            --board-border: rgba(148, 163, 184, 0.45);

            --c-green: #4ade80;
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-red: #ef4444;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);

            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.25);
            --input-bg: rgba(255, 255, 255, 0.95);

            --board-light: #cbd5e1;
            --board-dark: #64748b;
            --board-border: rgba(15, 23, 42, 0.25);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
        body::after { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-small {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            background: var(--card-bg);
        }

        .lobby-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
        }
        .lobby-box h3 {
            margin-top: 0;
            font-size: 15px;
            color: var(--c-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lobby-box p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .user-info-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            font-size: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        #display-nome { font-size: 13.5px; font-weight: 700; }

        .match-info-bar {
            display: flex;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }
        #turno-status { color: var(--c-amber); }

        .checkers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            border: 3px solid var(--board-border);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 12px;
            box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: rgba(99, 102, 241, 0.55) !important; }
        .square.highlight { background-color: rgba(74, 222, 128, 0.5) !important; }
        .square.capture-target { background-color: rgba(239, 68, 68, 0.55) !important; }

        .piece {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            transition: transform var(--t-fast);
            position: relative;
        }
        .piece.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
            color: #0f172a;
        }
        .piece.red {
            background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c);
            border: 2px solid #7f1d1d;
            color: #fff;
        }
        .piece.king::after {
            content: "👑";
            font-size: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .instructions {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 10px;
            min-height: 18px;
        }

        button, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all var(--t-base);
        }
        button {
            border: none;
            color: #fff;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            box-shadow: var(--shadow-btn);
        }
        button:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-whatsapp {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="user-header" style="justify-content: center;">
                <div class="user-info-left">
                    <span id="lobby-avatar" class="user-avatar-display">😀</span>
                    <strong id="lobby-nome">Carregando...</strong>
                </div>
            </div>

            <div class="lobby-box">
                <h3>♟️ Jogo de Damas Multiplayer</h3>
                <p>Jogue uma partida clássica de Damas 8x8 em turnos com um colega em tempo real. Crie sua sala e envie o convite pelo WhatsApp!</p>
                <button id="btn-criar-sala">🚀 Criar Sala de Damas</button>
            </div>

            <div class="lobby-box" style="margin-bottom: 0;">
                <h3>🔗 Entrar com Código</h3>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-codigo-sala" placeholder="Ex: DAMAS-7812" style="font-family: monospace;">
                    <button id="btn-entrar-sala" style="width: 120px;">Entrar</button>
                </div>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <div class="user-header">
                <div class="user-info-left">
                    <span id="display-avatar" class="user-avatar-display">😀</span>
                    <strong id="display-nome"></strong>
                </div>
                <span id="display-sala-tag" style="font-size: 11px; background: rgba(99,102,241,0.15); padding: 4px 8px; border-radius: 6px; color: var(--c-blue);">Sala</span>
            </div>

            <div class="match-info-bar">
                <span>Sua Peça: <strong id="info-minha-cor" style="color: var(--c-blue);">--</strong></span>
                <span id="turno-status">Aguardando...</span>
            </div>

            <p class="instructions" id="info-instrucao">Toque em sua peça e depois na casa de destino válida.</p>

            <div class="checkers-grid" id="checkers-board"></div>

            <div id="div-whatsapp" class="hidden">
                <button id="btn-whatsapp" class="btn-whatsapp">💬 Convidar Colega pelo WhatsApp</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        /* ==========================================================
           HELPERS DE SERIALIZAÇÃO
           ========================================================== */
        function tabuleiroParaFirebase(t) {
            return t.map(row => row.slice());
        }

        function firebaseParaTabuleiro(raw) {
            if (!raw) return criarTabuleiroInicial();
            if (Array.isArray(raw)) {
                return raw.map(row => Array.isArray(row) ? row.slice() : Object.values(row || {}));
            }
            const t = [];
            for (let r = 0; r < 8; r++) {
                const linhaRaw = raw[r] || raw[String(r)] || {};
                const linha = Array.isArray(linhaRaw) ? linhaRaw.slice() : Object.values(linhaRaw);
                while (linha.length < 8) linha.push(null);
                t.push(linha.slice(0, 8));
            }
            return t;
        }

        /* ==========================================================
           SESSÃO DO JOGADOR
           ========================================================== */
        const jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        document.getElementById('lobby-nome').textContent = jogadorSessao.nome;
        document.getElementById('lobby-avatar').textContent = jogadorSessao.avatar;

        /* ==========================================================
           ESTADO
           ========================================================== */
        let idSalaAtual = null;
        let minhaCor = null;            // 'white' | 'red'
        let tabuleiro = [];
        let celulaSelecionada = null;
        let movimentosValidos = [];
        let turnoAtual = 'white';
        let jogoEncerrado = false;
        let unsubscribeFirebase = null;
        let capturaObrigatoriaGlobal = false; // Controla se há captura obrigatória no tabuleiro

        /* ==========================================================
           TEMA
           ========================================================== */
        const themeToggleBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarTextoBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
            atualizarTextoBotaoTema(newTheme);
        });

        function atualizarTextoBotaoTema(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }

        /* ==========================================================
           TABULEIRO INICIAL
           ========================================================== */
        function criarTabuleiroInicial() {
            const t = Array.from({ length: 8 }, () => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'red';
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'white';
                }
            }
            return t;
        }

        /* ==========================================================
           PERSISTÊNCIA DE SESSÃO
           ========================================================== */
        function salvarSessao() {
            if (!idSalaAtual || !minhaCor) return;
            const dados = { sala: idSalaAtual, cor: minhaCor };
            localStorage.setItem('brain_damas_sessao', JSON.stringify(dados));

            const url = new URL(window.location.href);
            url.searchParams.set('sala', idSalaAtual);
            url.searchParams.set('cor', minhaCor);
            window.history.replaceState({}, '', url.toString());
        }

        function limparSessao() {
            localStorage.removeItem('brain_damas_sessao');
            const url = new URL(window.location.href);
            url.searchParams.delete('sala');
            url.searchParams.delete('cor');
            window.history.replaceState({}, '', url.toString());
        }

        /* ==========================================================
           INICIALIZAÇÃO
           ========================================================== */
        async function inicializarPerfil() {
            document.getElementById('display-nome').textContent = jogadorSessao.nome;
            document.getElementById('display-avatar').textContent = jogadorSessao.avatar;

            const urlParams = new URLSearchParams(window.location.search);
            const salaUrl = urlParams.get('sala');
            const corUrl = urlParams.get('cor');

            let sessaoSalva = null;
            try {
                sessaoSalva = JSON.parse(localStorage.getItem('brain_damas_sessao'));
            } catch (_) {}

            const sala = salaUrl || (sessaoSalva && sessaoSalva.sala);
            const cor  = corUrl  || (sessaoSalva && sessaoSalva.cor);

            if (sala && cor) {
                document.getElementById('input-codigo-sala').value = sala;
                await reentrarNaSala(sala, cor);
            }
        }

        async function reentrarNaSala(codigo, cor) {
            const salaRef = ref(db, 'salas_damas/' + codigo);
            const snapshot = await get(salaRef);
            if (!snapshot.exists()) {
                limparSessao();
                return;
            }

            const dados = snapshot.val();
            const jogadores = dados.jogadores || {};

            const jaEsta = jogadores[jogadorSessao.chave];
            if (!jaEsta) {
                const corOcupada = Object.values(jogadores).some(j => j.cor === cor);
                if (corOcupada) {
                    limparSessao();
                    return;
                }
                await update(ref(db, `salas_damas/${codigo}/jogadores/${jogadorSessao.chave}`), {
                    nome: jogadorSessao.nome,
                    cor: cor
                });
            }

            idSalaAtual = codigo;
            minhaCor = cor;
            tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
            turnoAtual = dados.turno || 'white';
            jogoEncerrado = false;

            entrarInterfaceJogo();
            escutarFirebase();

            if (cor === 'white') {
                document.getElementById('div-whatsapp').classList.remove('hidden');
            }
        }

        inicializarPerfil();

        /* ==========================================================
           LOBBY — CRIAR / ENTRAR
           ========================================================== */
        document.getElementById('btn-criar-sala').addEventListener('click', async () => {
            idSalaAtual = 'DAMAS-' + Math.floor(1000 + Math.random() * 9000);
            minhaCor = 'white';
            tabuleiro = criarTabuleiroInicial();
            turnoAtual = 'white';
            jogoEncerrado = false;

            const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
            await set(salaRef, {
                status: 'jogando',
                turno: 'white',
                tabuleiro: tabuleiroParaFirebase(tabuleiro),
                jogadores: {
                    [jogadorSessao.chave]: { nome: jogadorSessao.nome, cor: 'white' }
                },
                criadaEm: new Date().toISOString()
            });

            salvarSessao();
            entrarInterfaceJogo();
            document.getElementById('div-whatsapp').classList.remove('hidden');
            escutarFirebase();
        });

        document.getElementById('btn-entrar-sala').addEventListener('click', () => {
            const codigo = document.getElementById('input-codigo-sala').value.trim().toUpperCase();
            if (!codigo) { alert('Digite o código da sala.'); return; }
            entrarNaSala(codigo);
        });

        async function entrarNaSala(codigo) {
            try {
                const salaRef = ref(db, 'salas_damas/' + codigo);
                const snapshot = await get(salaRef);
                if (!snapshot.exists()) { alert('Sala não encontrada!'); return; }

                const dados = snapshot.val();
                const jogadores = dados.jogadores || {};

                const jaEsta = jogadores[jogadorSessao.chave];
                if (jaEsta) {
                    idSalaAtual = codigo;
                    minhaCor = jaEsta.cor;
                    tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                    turnoAtual = dados.turno || 'white';
                    salvarSessao();
                    entrarInterfaceJogo();
                    escutarFirebase();
                    return;
                }

                const totalJogadores = Object.keys(jogadores).length;
                if (totalJogadores >= 2) {
                    alert('Sala já cheia! Peça ao host para criar uma nova.');
                    return;
                }

                idSalaAtual = codigo;
                minhaCor = 'red';
                tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                turnoAtual = dados.turno || 'white';

                await update(ref(db, `salas_damas/${codigo}/jogadores/${jogadorSessao.chave}`), {
                    nome: jogadorSessao.nome,
                    cor: 'red'
                });

                salvarSessao();
                entrarInterfaceJogo();
                escutarFirebase();
            } catch (error) {
                console.error("Erro ao entrar na sala:", error);
                alert("Erro de conexão. Tente novamente.");
            }
        }

        function entrarInterfaceJogo() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-sala-tag').textContent = `Sala: ${idSalaAtual}`;
            document.getElementById('info-minha-cor').textContent =
                minhaCor === 'white' ? '⚪ Brancas' : '🔴 Vermelhas';
            renderizarTabuleiro();
        }

        /* ==========================================================
           WHATSAPP
           ========================================================== */
        document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const url = new URL(window.location.href);
            url.searchParams.set('sala', idSalaAtual);
            url.searchParams.delete('cor');
            const link = url.toString();
            const msg = encodeURIComponent(
                `♟️ Vamos disputar uma partida de Damas no Brain Hub?\n\n` +
                `Entre na sala pelo link: ${link}\n` +
                `Código: ${idSalaAtual}`
            );
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        });

        /* ==========================================================
           RENDERIZAÇÃO
           ========================================================== */
        function renderizarTabuleiro() {
            const grid = document.getElementById('checkers-board');
            grid.innerHTML = '';

            // Verifica se há captura obrigatória global para a cor atual
            capturaObrigatoriaGlobal = verificarCapturaObrigatoria(turnoAtual);

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;

                    if (celulaSelecionada && celulaSelecionada.r === r && celulaSelecionada.c === c) {
                        square.classList.add('selected');
                    }
                    const mov = movimentosValidos.find(m => m.r === r && m.c === c);
                    if (mov) {
                        square.classList.add(mov.captura ? 'capture-target' : 'highlight');
                    }

                    const peca = tabuleiro[r]?.[c];
                    if (peca) {
                        const pieceEl = document.createElement('div');
                        const corClasse = peca.startsWith('white') ? 'white' : 'red';
                        const isDama = peca.includes('king') ? ' king' : '';
                        pieceEl.className = `piece ${corClasse}${isDama}`;
                        square.appendChild(pieceEl);
                    }

                    if (isDark) {
                        square.addEventListener('click', () => clicarCasa(r, c));
                    }

                    grid.appendChild(square);
                }
            }

            // ---- Status ----
            const statusEl = document.getElementById('turno-status');
            if (jogoEncerrado) {
                statusEl.textContent = '🏁 Jogo encerrado';
            } else if (turnoAtual === minhaCor) {
                statusEl.textContent = 'Sua vez de jogar!';
            } else {
                statusEl.textContent = 'Vez do oponente...';
            }
        }

        /* ==========================================================
           CLIQUE E VALIDAÇÃO DE MOVIMENTOS
           ========================================================== */
        function clicarCasa(r, c) {
            if (jogoEncerrado) return;

            if (turnoAtual !== minhaCor) {
                document.getElementById('info-instrucao').textContent = '⏳ Aguarde a sua vez!';
                return;
            }

            const peca = tabuleiro[r][c];

            // Seleciona peça própria
            if (peca && peca.startsWith(minhaCor)) {
                // Se houver captura obrigatória global, só permite selecionar peças que podem capturar
                if (capturaObrigatoriaGlobal) {
                    const movsPossiveis = calcularMovimentos(r, c);
                    const temCaptura = movsPossiveis.some(m => m.captura);
                    if (!temCaptura) {
                        document.getElementById('info-instrucao').textContent = '⚠️ Captura obrigatória! Escolha outra peça.';
                        return;
                    }
                }

                celulaSelecionada = { r, c };
                movimentosValidos = calcularMovimentos(r, c);
                renderizarTabuleiro();
                return;
            }

            // Executa movimento
            if (celulaSelecionada && movimentosValidos.some(m => m.r === r && m.c === c)) {
                executarMovimento(celulaSelecionada.r, celulaSelecionada.c, r, c);
                return;
            }

            // Clique vazio → limpa seleção
            celulaSelecionada = null;
            movimentosValidos = [];
            renderizarTabuleiro();
        }

        /* ==========================================================
           LÓGICA DE MOVIMENTOS (CORRIGIDA)
           ========================================================== */
        function calcularMovimentos(r, c) {
            const peca = tabuleiro[r][c];
            if (!peca) return [];

            const isDama = peca.includes('king');
            const cor = peca.startsWith('white') ? 'white' : 'red';
            const movimentos = [];

            // Direções de movimento simples (frente)
            const direcoesFrente = cor === 'white' ? [-1] : [+1];
            // Direções de captura (qualquer diagonal)
            const direcoesCaptura = [-1, +1];

            // 1. Movimentos Simples (apenas se não for dama, ou se for dama deslizante)
            if (isDama) {
                for (const dr of direcoesCaptura) {
                    for (const dc of [-1, +1]) {
                        let nr = r + dr, nc = c + dc;
                        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            if (!tabuleiro[nr][nc]) {
                                movimentos.push({ r: nr, c: nc });
                            } else {
                                break; // Bloqueado
                            }
                            nr += dr; nc += dc;
                        }
                    }
                }
            } else {
                for (const dr of direcoesFrente) {
                    for (const dc of [-1, +1]) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !tabuleiro[nr][nc]) {
                            movimentos.push({ r: nr, c: nc });
                        }
                    }
                }
            }

            // 2. Capturas (Sempre verificadas)
            // Para peças comuns: salto de 2 casas. Para Damas: salto a distância.
            if (isDama) {
                for (const dr of direcoesCaptura) {
                    for (const dc of [-1, +1]) {
                        let nr = r + dr, nc = c + dc;
                        let pecaInimiga = null;
                        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const alvo = tabuleiro[nr][nc];
                            if (!alvo) {
                                if (pecaInimiga) {
                                    // Casa vazia após inimigo: captura válida
                                    movimentos.push({ r: nr, c: nc, captura: pecaInimiga });
                                }
                            } else if (alvo.startsWith(cor)) {
                                break; // Peça própria bloqueia
                            } else {
                                if (pecaInimiga) break; // Duas inimigas seguidas: bloqueia
                                pecaInimiga = { r: nr, c: nc };
                            }
                            nr += dr; nc += dc;
                        }
                    }
                }
            } else {
                for (const dr of direcoesCaptura) {
                    for (const dc of direcoesCaptura) {
                        const mr = r + dr, mc = c + dc;
                        const jr = r + 2 * dr, jc = c + 2 * dc;
                        if (jr < 0 || jr >= 8 || jc < 0 || jc >= 8) continue;
                        const meio = tabuleiro[mr][mc];
                        const destino = tabuleiro[jr][jc];
                        if (meio && !meio.startsWith(cor) && !destino) {
                            movimentos.push({ r: jr, c: jc, captura: { r: mr, c: mc } });
                        }
                    }
                }
            }

            // Retorna priorizando capturas (Regra da obrigatoriedade local)
            const capturas = movimentos.filter(m => m.captura);
            if (capturas.length > 0) return capturas;
            return movimentos;
        }

        // Verifica se QUALQUER peça da cor tem captura disponível (Regra Global)
        function verificarCapturaObrigatoria(cor) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = tabuleiro[r][c];
                    if (p && p.startsWith(cor)) {
                        const movs = calcularMovimentos(r, c);
                        if (movs.some(m => m.captura)) return true;
                    }
                }
            }
            return false;
        }

        /* ==========================================================
           EXECUTAR MOVIMENTO (COM LÓGICA DE CAPTURA MÚLTIPLA)
           ========================================================== */
        async function executarMovimento(deR, deC, paraR, paraC) {
            const mov = movimentosValidos.find(m => m.r === paraR && m.c === paraC);
            if (!mov) return;

            let pecaMovida = tabuleiro[deR][deC];
            tabuleiro[paraR][paraC] = pecaMovida;
            tabuleiro[deR][deC] = null;

            let fezCaptura = false;
            if (mov.captura) {
                tabuleiro[mov.captura.r][mov.captura.c] = null;
                fezCaptura = true;
            }

            // Promoção a dama
            if (pecaMovida === 'white' && paraR === 0) tabuleiro[paraR][paraC] = 'white-king';
            if (pecaMovida === 'red'   && paraR === 7) tabuleiro[paraR][paraC] = 'red-king';

            celulaSelecionada = null;
            movimentosValidos = [];

            // Verifica se há mais capturas disponíveis para esta peça (Turno Extra)
            let continuarCaptura = false;
            if (fezCaptura) {
                const proximosMovs = calcularMovimentos(paraR, paraC);
                if (proximosMovs.some(m => m.captura)) {
                    continuarCaptura = true;
                }
            }

            if (continuarCaptura) {
                // Mantém o turno e seleciona a peça automaticamente para a próxima captura
                celulaSelecionada = { r: paraR, c: paraC };
                movimentosValidos = calcularMovimentos(paraR, paraC);
                document.getElementById('info-instrucao').textContent = '🔥 Captura múltipla disponível! Continue jogando.';
            } else {
                // Alterna turno
                turnoAtual = turnoAtual === 'white' ? 'red' : 'white';
                document.getElementById('info-instrucao').textContent = 'Toque em sua peça e depois na casa de destino válida.';
            }

            renderizarTabuleiro();

            // Verifica fim de jogo (apenas se o turno mudou ou se a peça não pode mais capturar)
            if (!continuarCaptura) {
                const oponente = turnoAtual;
                if (!temPecas(oponente)) {
                    jogoEncerrado = true;
                    const vencedor = oponente === 'white' ? 'red' : 'white';
                    document.getElementById('info-instrucao').textContent =
                        `🏁 Fim de jogo! Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}.`;
                    setTimeout(() => alert(`🏆 Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}!`), 100);
                } else if (!temMovimentos(oponente)) {
                    jogoEncerrado = true;
                    document.getElementById('info-instrucao').textContent =
                        `🏁 Oponente sem movimentos. Vitória das ${minhaCor === 'white' ? 'brancas' : 'vermelhas'}.`;
                }
            }

            // Sincroniza com Firebase
            try {
                await update(ref(db, `salas_damas/${idSalaAtual}`), {
                    tabuleiro: tabuleiroParaFirebase(tabuleiro),
                    turno: turnoAtual,
                    status: jogoEncerrado ? 'encerrado' : 'jogando'
                });
            } catch (e) {
                console.error('Erro ao sincronizar:', e);
                document.getElementById('info-instrucao').textContent =
                    '⚠️ Falha ao sincronizar. A tentar novamente...';
            }
        }

        function temPecas(cor) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = tabuleiro[r][c];
                    if (p && p.startsWith(cor)) return true;
                }
            }
            return false;
        }

        function temMovimentos(cor) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = tabuleiro[r][c];
                    if (p && p.startsWith(cor)) {
                        const movs = calcularMovimentosPara(r, c, cor);
                        if (movs.length > 0) return true;
                    }
                }
            }
            return false;
        }

        function calcularMovimentosPara(r, c, cor) {
            const peca = tabuleiro[r][c];
            if (!peca || !peca.startsWith(cor)) return [];
            const backup = minhaCor;
            minhaCor = cor; // Simula a cor para o cálculo
            const movs = calcularMovimentos(r, c);
            minhaCor = backup;
            return movs;
        }

        /* ==========================================================
           FIREBASE LISTENER
           ========================================================== */
        function escutarFirebase() {
            if (unsubscribeFirebase) unsubscribeFirebase();

            const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
            unsubscribeFirebase = onValue(salaRef, (snapshot) => {
                if (!snapshot.exists()) return;
                const dados = snapshot.val();

                tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                turnoAtual = dados.turno || 'white';
                jogoEncerrado = dados.status === 'encerrado';

                const jogadores = dados.jogadores || {};
                if (Object.keys(jogadores).length === 2) {
                    // Atualiza instrução apenas se não houver captura múltipla em andamento
                    if (!celulaSelecionada) {
                        document.getElementById('info-instrucao').textContent =
                            '✅ Oponente conectado! ' +
                            (turnoAtual === minhaCor ? 'Sua vez.' : 'Aguarde a jogada dele.');
                    }
                } else if (minhaCor === 'white') {
                    document.getElementById('info-instrucao').textContent =
                        '⏳ Aguardando o oponente entrar na sala...';
                }

                renderizarTabuleiro();
            });
        }
    </script>
