<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Damas - Duelo Multiplayer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.18);
            --input-bg: rgba(15, 23, 42, 0.7);
            --btn-primary: #6366f1;
            --btn-accent: #8b5cf6;
            --board-light: #e2e8f0;
            --board-dark: #334155;
            --board-border: rgba(148, 163, 184, 0.45);
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-green: #4ade80;
            --c-red: #ef4444;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --text-color: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(15, 23, 42, 0.1);
            --input-bg: rgba(255, 255, 255, 0.95);
            --board-light: #cbd5e1;
            --board-dark: #64748b;
            --board-border: rgba(15, 23, 42, 0.25);
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            color: var(--text-color);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            padding: 20px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%; max-width: 480px;
            border: 1px solid var(--card-border);
        }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .btn-small {
            padding: 8px 14px; border-radius: 999px; font-size: 13px;
            background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-muted); cursor: pointer;
        }
        .lobby-box {
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px;
            text-align: left;
        }
        .lobby-box h3 { margin-top: 0; font-size: 15px; color: var(--c-blue); }
        .lobby-box p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
        .user-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px; background: var(--input-bg); padding: 8px 12px;
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
        }
        .user-avatar-display {
            width: 32px; height: 32px; font-size: 16px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            display: inline-flex; align-items: center; justify-content: center;
        }
        .match-info-bar {
            display: flex; justify-content: space-between;
            background: var(--input-bg); padding: 8px 12px;
            border-radius: var(--radius-md); margin-bottom: 10px;
            font-size: 12px; font-weight: 600;
        }
        .checkers-grid {
            display: grid; grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid var(--board-border);
            border-radius: 10px; overflow: hidden;
            width: 100%; aspect-ratio: 1 / 1; margin-bottom: 12px;
        }
        .square {
            display: flex; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
        }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: rgba(99, 102, 241, 0.55) !important; box-shadow: inset 0 0 0 3px #fff; }
        .square.highlight { background-color: rgba(74, 222, 128, 0.4) !important; }
        .square.highlight::after {
            content: ""; width: 30%; height: 30%; border-radius: 50%;
            background-color: rgba(74, 222, 128, 0.9); position: absolute;
            animation: pulse 1.5s infinite;
        }
        .square.capture-target { background-color: rgba(239, 68, 68, 0.4) !important; box-shadow: inset 0 0 0 3px rgba(239, 68, 68, 0.8); }
        .square.capture-target::after {
            content: "X"; color: rgba(239, 68, 68, 0.9); font-weight: 900;
            font-size: 20px; position: absolute; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }
        .piece {
            width: 76%; height: 76%; border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            z-index: 2; position: relative;
        }
        .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #cbd5e1); border: 2px solid #94a3b8; }
        .piece.red { background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); border: 2px solid #7f1d1d; }
        .piece.king::after { content: "👑"; font-size: 14px; position: absolute; }
        .square.selected .piece { transform: scale(1.1); box-shadow: 0 0 15px #fff; }
        .hidden { display: none !important; }
        button, input {
            width: 100%; padding: 10px 12px; border-radius: var(--radius-md);
            font-size: 13.5px; font-weight: 600; font-family: inherit;
            background: var(--input-bg); color: var(--text-color);
            border: 1px solid var(--border-color); cursor: pointer;
        }
        button { border: none; color: #fff; background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent)); }
        .btn-whatsapp { background: linear-gradient(135deg, #16a34a, #22c55e); margin-top: 6px; }
        #info-instrucao { font-size: 12px; color: var(--text-muted); margin: 4px 0 10px; min-height: 18px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <!-- LOBBY -->
        <div id="lobby-screen">
            <div class="user-header" style="justify-content: center;">
                <span id="lobby-avatar" class="user-avatar-display">😀</span>
                <strong id="lobby-nome" style="margin-left: 8px;">Carregando...</strong>
            </div>
            <div class="lobby-box">
                <h3>♟️ Jogo de Damas Multiplayer</h3>
                <p>Jogue uma partida clássica de Damas 8x8 em turnos com um colega em tempo real.</p>
                <button id="btn-criar-sala">🚀 Criar Sala de Damas</button>
            </div>
            <div class="lobby-box">
                <h3>🔗 Entrar com Código</h3>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-codigo-sala" placeholder="Ex: DAMAS-7812" style="font-family: monospace;">
                    <button id="btn-entrar-sala" style="width: 120px;">Entrar</button>
                </div>
            </div>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <div class="user-header">
                <span id="display-avatar" class="user-avatar-display">😀</span>
                <strong id="display-nome" style="margin-left: 8px;"></strong>
                <span id="display-sala-tag" style="font-size: 11px; background: rgba(99,102,241,0.15); padding: 4px 8px; border-radius: 6px; color: var(--c-blue);">Sala</span>
            </div>
            <div class="match-info-bar">
                <span>Sua Peça: <strong id="info-minha-cor" style="color: var(--c-blue);">--</strong></span>
                <span id="turno-status">Aguardando...</span>
            </div>
            <p id="info-instrucao">Toque em sua peça e depois na casa de destino válida.</p>
            <div class="checkers-grid" id="checkers-board"></div>
            <div id="div-whatsapp" class="hidden">
                <button id="btn-whatsapp" class="btn-whatsapp">💬 Convidar Colega pelo WhatsApp</button>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. IMPORTAÇÃO DO FIREBASE
        import { db } from "./firebase-config.js";
        import { ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        console.log("🔥 Script do jogo carregado. A iniciar...");

        // 2. VERIFICAÇÃO DE SESSÃO
        const jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) {
            console.warn("⚠️ Nenhum jogador na sessão. Redirecionando para index.html");
            window.location.href = 'index.html';
        } else {
            console.log("👤 Jogador logado:", jogadorSessao.nome);
            document.getElementById('lobby-nome').textContent = jogadorSessao.nome;
            document.getElementById('lobby-avatar').textContent = jogadorSessao.avatar;
        }

        // 3. ESTADO
        let idSalaAtual = null;
        let minhaCor = null;
        let tabuleiro = [];
        let celulaSelecionada = null;
        let movimentosValidos = [];
        let turnoAtual = 'white';
        let jogoEncerrado = false;
        let unsubscribeFirebase = null;
        let capturaObrigatoriaGlobal = false;

        // 4. FUNÇÕES AUXILIARES
        function criarTabuleiroInicial() {
            const t = Array.from({ length: 8 }, () => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'red';
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'white';
                }
            }
            return t;
        }

        function tabuleiroParaFirebase(t) {
            if (!Array.isArray(t)) return criarTabuleiroInicial();
            return t.map(row => Array.isArray(row) ? row.slice() : []);
        }

        function firebaseParaTabuleiro(raw) {
            if (!raw) return criarTabuleiroInicial();
            if (Array.isArray(raw)) return raw.map(row => Array.isArray(row) ? row.slice() : Object.values(row || {}));
            const t = [];
            for (let r = 0; r < 8; r++) {
                const linhaRaw = raw[r] || raw[String(r)] || {};
                const linha = Array.isArray(linhaRaw) ? linhaRaw.slice() : Object.values(linhaRaw);
                while (linha.length < 8) linha.push(null);
                t.push(linha.slice(0, 8));
            }
            return t;
        }

        // 5. RENDERIZAÇÃO
        function renderizarTabuleiro() {
            console.log("🎨 A renderizar tabuleiro...");
            const grid = document.getElementById('checkers-board');
            if (!grid) return;
            grid.innerHTML = '';

            if (!tabuleiro || tabuleiro.length === 0) {
                console.warn("⚠️ Tabuleiro vazio. A recriar...");
                tabuleiro = criarTabuleiroInicial();
            }

            capturaObrigatoriaGlobal = verificarCapturaObrigatoria(turnoAtual);

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;

                    if (celulaSelecionada && celulaSelecionada.r === r && celulaSelecionada.c === c) square.classList.add('selected');
                    const mov = movimentosValidos.find(m => m.r === r && m.c === c);
                    if (mov) square.classList.add(mov.captura ? 'capture-target' : 'highlight');

                    const peca = tabuleiro[r]?.[c];
                    if (peca) {
                        const pieceEl = document.createElement('div');
                        const corClasse = peca.startsWith('white') ? 'white' : 'red';
                        const isDama = peca.includes('king') ? ' king' : '';
                        pieceEl.className = `piece ${corClasse}${isDama}`;
                        square.appendChild(pieceEl);
                    }

                    if (isDark) square.addEventListener('click', () => clicarCasa(r, c));
                    grid.appendChild(square);
                }
            }

            const statusEl = document.getElementById('turno-status');
            if (jogoEncerrado) statusEl.textContent = '🏁 Jogo encerrado';
            else if (turnoAtual === minhaCor) statusEl.textContent = 'Sua vez de jogar!';
            else statusEl.textContent = 'Vez do oponente...';
        }

        // 6. LÓGICA DE MOVIMENTOS (Simplificada para teste)
        function calcularMovimentos(r, c) {
            const peca = tabuleiro[r][c];
            if (!peca) return [];
            const isDama = peca.includes('king');
            const cor = peca.startsWith('white') ? 'white' : 'red';
            const movimentos = [];
            const direcoesFrente = cor === 'white' ? [-1] : [+1];
            const direcoesCaptura = [-1, +1];

            // Movimentos simples
            if (isDama) {
                for (const dr of direcoesCaptura) for (const dc of [-1, +1]) {
                    let nr = r + dr, nc = c + dc;
                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        if (!tabuleiro[nr][nc]) movimentos.push({ r: nr, c: nc });
                        else break;
                        nr += dr; nc += dc;
                    }
                }
            } else {
                for (const dr of direcoesFrente) for (const dc of [-1, +1]) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !tabuleiro[nr][nc]) movimentos.push({ r: nr, c: nc });
                }
            }

            // Capturas
            if (isDama) {
                for (const dr of direcoesCaptura) for (const dc of [-1, +1]) {
                    let nr = r + dr, nc = c + dc; let pecaInimiga = null;
                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        const alvo = tabuleiro[nr][nc];
                        if (!alvo) { if (pecaInimiga) movimentos.push({ r: nr, c: nc, captura: pecaInimiga }); }
                        else if (alvo.startsWith(cor)) break;
                        else { if (pecaInimiga) break; pecaInimiga = { r: nr, c: nc }; }
                        nr += dr; nc += dc;
                    }
                }
            } else {
                for (const dr of direcoesCaptura) for (const dc of direcoesCaptura) {
                    const mr = r + dr, mc = c + dc; const jr = r + 2 * dr, jc = c + 2 * dc;
                    if (jr < 0 || jr >= 8 || jc < 0 || jc >= 8) continue;
                    const meio = tabuleiro[mr][mc]; const destino = tabuleiro[jr][jc];
                    if (meio && !meio.startsWith(cor) && !destino) movimentos.push({ r: jr, c: jc, captura: { r: mr, c: mc } });
                }
            }

            const capturas = movimentos.filter(m => m.captura);
            return capturas.length > 0 ? capturas : movimentos;
        }

        function verificarCapturaObrigatoria(cor) {
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = tabuleiro[r][c];
                if (p && p.startsWith(cor)) {
                    const movs = calcularMovimentos(r, c);
                    if (movs.some(m => m.captura)) return true;
                }
            }
            return false;
        }

        // 7. INTERAÇÃO
        function clicarCasa(r, c) {
            if (jogoEncerrado) return;
            if (turnoAtual !== minhaCor) { document.getElementById('info-instrucao').textContent = '⏳ Aguarde a sua vez!'; return; }
            const peca = tabuleiro[r][c];

            if (peca && peca.startsWith(minhaCor)) {
                if (capturaObrigatoriaGlobal) {
                    const movsPossiveis = calcularMovimentos(r, c);
                    if (!movsPossiveis.some(m => m.captura)) {
                        document.getElementById('info-instrucao').textContent = '⚠️ Captura obrigatória! Escolha outra peça.';
                        return;
                    }
                }
                celulaSelecionada = { r, c };
                movimentosValidos = calcularMovimentos(r, c);
                renderizarTabuleiro();
                return;
            }

            if (celulaSelecionada && movimentosValidos.some(m => m.r === r && m.c === c)) {
                executarMovimento(celulaSelecionada.r, celulaSelecionada.c, r, c);
                return;
            }

            celulaSelecionada = null; movimentosValidos = []; renderizarTabuleiro();
        }

        async function executarMovimento(deR, deC, paraR, paraC) {
            const mov = movimentosValidos.find(m => m.r === paraR && m.c === paraC);
            if (!mov) return;

            let pecaMovida = tabuleiro[deR][deC];
            tabuleiro[paraR][paraC] = pecaMovida;
            tabuleiro[deR][deC] = null;

            let fezCaptura = false;
            if (mov.captura) { tabuleiro[mov.captura.r][mov.captura.c] = null; fezCaptura = true; }

            if (pecaMovida === 'white' && paraR === 0) tabuleiro[paraR][paraC] = 'white-king';
            if (pecaMovida === 'red' && paraR === 7) tabuleiro[paraR][paraC] = 'red-king';

            celulaSelecionada = null; movimentosValidos = [];

            let continuarCaptura = false;
            if (fezCaptura) {
                const proximosMovs = calcularMovimentos(paraR, paraC);
                if (proximosMovs.some(m => m.captura)) continuarCaptura = true;
            }

            if (continuarCaptura) {
                celulaSelecionada = { r: paraR, c: paraC };
                movimentosValidos = calcularMovimentos(paraR, paraC);
                document.getElementById('info-instrucao').textContent = '🔥 Captura múltipla disponível! Continue jogando.';
            } else {
                turnoAtual = turnoAtual === 'white' ? 'red' : 'white';
                document.getElementById('info-instrucao').textContent = 'Toque em sua peça e depois na casa de destino válida.';
            }

            renderizarTabuleiro();

            if (!continuarCaptura) {
                const oponente = turnoAtual;
                if (!temPecas(oponente)) {
                    jogoEncerrado = true;
                    const vencedor = oponente === 'white' ? 'red' : 'white';
                    document.getElementById('info-instrucao').textContent = `🏁 Fim de jogo! Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}.`;
                    setTimeout(() => alert(`🏆 Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}!`), 100);
                } else if (!temMovimentos(oponente)) {
                    jogoEncerrado = true;
                    document.getElementById('info-instrucao').textContent = `🏁 Oponente sem movimentos. Vitória das ${minhaCor === 'white' ? 'brancas' : 'vermelhas'}.`;
                }
            }

            try {
                await update(ref(db, `salas_damas/${idSalaAtual}`), {
                    tabuleiro: tabuleiroParaFirebase(tabuleiro),
                    turno: turnoAtual,
                    status: jogoEncerrado ? 'encerrado' : 'jogando'
                });
            } catch (e) {
                console.error('Erro ao sincronizar:', e);
                document.getElementById('info-instrucao').textContent = '⚠️ Falha ao sincronizar.';
            }
        }

        function temPecas(cor) {
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = tabuleiro[r][c];
                if (p && p.startsWith(cor)) return true;
            }
            return false;
        }

        function temMovimentos(cor) {
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = tabuleiro[r][c];
                if (p && p.startsWith(cor)) {
                    const backup = minhaCor; minhaCor = cor;
                    const movs = calcularMovimentos(r, c);
                    minhaCor = backup;
                    if (movs.length > 0) return true;
                }
            }
            return false;
        }

        // 8. FIREBASE
        function escutarFirebase() {
            if (unsubscribeFirebase) unsubscribeFirebase();
            const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
            unsubscribeFirebase = onValue(salaRef, (snapshot) => {
                if (!snapshot.exists()) return;
                const dados = snapshot.val();
                let novoTabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                if ((!novoTabuleiro || novoTabuleiro.length === 0) && tabuleiro.length > 0) novoTabuleiro = tabuleiro;

                const turnoMudou = dados.turno !== turnoAtual;
                const tabuleiroMudou = JSON.stringify(novoTabuleiro) !== JSON.stringify(tabuleiro);
                if (turnoMudou || tabuleiroMudou) { celulaSelecionada = null; movimentosValidos = []; }

                tabuleiro = novoTabuleiro;
                turnoAtual = dados.turno || 'white';
                jogoEncerrado = dados.status === 'encerrado';

                const jogadores = dados.jogadores || {};
                if (Object.keys(jogadores).length === 2) {
                    if (!celulaSelecionada) document.getElementById('info-instrucao').textContent = '✅ Oponente conectado! ' + (turnoAtual === minhaCor ? 'Sua vez.' : 'Aguarde a jogada dele.');
                } else if (minhaCor === 'white') {
                    document.getElementById('info-instrucao').textContent = '⏳ Aguardando o oponente entrar na sala...';
                }
                renderizarTabuleiro();
            });
        }

        // 9. INICIALIZAÇÃO E EVENTOS
        document.getElementById('btn-criar-sala').addEventListener('click', async () => {
            console.log("🚀 A criar sala...");
            idSalaAtual = 'DAMAS-' + Math.floor(1000 + Math.random() * 9000);
            minhaCor = 'white';
            tabuleiro = criarTabuleiroInicial();
            turnoAtual = 'white';
            jogoEncerrado = false;

            try {
                const salaRef = ref(db, 'salas_damas/' + idSalaAtual);
                await set(salaRef, {
                    status: 'jogando', turno: 'white',
                    tabuleiro: tabuleiroParaFirebase(tabuleiro),
                    jogadores: { [jogadorSessao.chave]: { nome: jogadorSessao.nome, cor: 'white' } },
                    criadaEm: new Date().toISOString()
                });
                console.log("✅ Sala criada no Firebase:", idSalaAtual);
                document.getElementById('lobby-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('display-nome').textContent = jogadorSessao.nome;
                document.getElementById('display-avatar').textContent = jogadorSessao.avatar;
                document.getElementById('display-sala-tag').textContent = `Sala: ${idSalaAtual}`;
                document.getElementById('info-minha-cor').textContent = '⚪ Brancas';
                document.getElementById('div-whatsapp').classList.remove('hidden');
                renderizarTabuleiro();
                escutarFirebase();
            } catch (e) {
                console.error("❌ Erro ao criar sala:", e);
                alert("Erro ao criar sala. Verifique a consola.");
            }
        });

        document.getElementById('btn-entrar-sala').addEventListener('click', async () => {
            const codigo = document.getElementById('input-codigo-sala').value.trim().toUpperCase();
            if (!codigo) { alert('Digite o código da sala.'); return; }
            console.log("🔗 A entrar na sala:", codigo);
            try {
                const salaRef = ref(db, 'salas_damas/' + codigo);
                const snapshot = await get(salaRef);
                if (!snapshot.exists()) { alert('Sala não encontrada!'); return; }
                const dados = snapshot.val();
                const jogadores = dados.jogadores || {};
                const jaEsta = jogadores[jogadorSessao.chave];
                if (jaEsta) {
                    idSalaAtual = codigo; minhaCor = jaEsta.cor;
                    tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                    turnoAtual = dados.turno || 'white';
                } else {
                    if (Object.keys(jogadores).length >= 2) { alert('Sala já cheia!'); return; }
                    idSalaAtual = codigo; minhaCor = 'red';
                    tabuleiro = firebaseParaTabuleiro(dados.tabuleiro);
                    turnoAtual = dados.turno || 'white';
                    await update(ref(db, `salas_damas/${codigo}/jogadores/${jogadorSessao.chave}`), { nome: jogadorSessao.nome, cor: 'red' });
                }
                document.getElementById('lobby-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('display-nome').textContent = jogadorSessao.nome;
                document.getElementById('display-avatar').textContent = jogadorSessao.avatar;
                document.getElementById('display-sala-tag').textContent = `Sala: ${idSalaAtual}`;
                document.getElementById('info-minha-cor').textContent = '🔴 Vermelhas';
                renderizarTabuleiro();
                escutarFirebase();
            } catch (e) {
                console.error("❌ Erro ao entrar:", e);
                alert("Erro de conexão.");
            }
        });

        document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const url = new URL(window.location.href);
            url.searchParams.set('sala', idSalaAtual);
            url.searchParams.delete('cor');
            const msg = encodeURIComponent(`♟️ Vamos jogar Damas no Brain Hub?\n\nLink: ${url.toString()}\nCódigo: ${idSalaAtual}`);
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        });

        // Tema
        const themeToggleBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
            themeToggleBtn.textContent = newTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        });

        // Auto-entrar se houver URL
        const urlParams = new URLSearchParams(window.location.search);
        const salaUrl = urlParams.get('sala');
        const corUrl = urlParams.get('cor');
        if (salaUrl && corUrl) {
            console.log("🔗 Detetado link de convite. A entrar automaticamente...");
            document.getElementById('input-codigo-sala').value = salaUrl;
            // Simula clique no botão de entrar após um pequeno delay para garantir que o DOM carregou
            setTimeout(() => document.getElementById('btn-entrar-sala').click(), 500);
        }

    </script>
</body>
</html>
