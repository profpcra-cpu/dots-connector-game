<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Damas Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #status-container {
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #info-instrucao {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }

        #checkers-board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #444;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.selected {
            background-color: #7b61ff !important;
        }

        .square.highlight::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: rgba(0, 255, 0, 0.6);
            border-radius: 50%;
            position: absolute;
        }

        .square.capture-target::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            position: absolute;
        }

        .piece {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .piece.white {
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cccccc 100%);
            border: 2px solid #999;
        }

        .piece.red {
            background: radial-gradient(circle at 30% 30%, #ff5252 0%, #c62828 100%);
            border: 2px solid #8e0000;
        }

        .piece.king::after {
            content: '👑';
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .piece.movel {
            box-shadow: 0 0 10px 3px #4CAF50;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="status-container">
        <div id="turno-status">Carregando jogo...</div>
    </div>
    <div id="info-instrucao">Apenas as peças destacadas podem ser movimentadas.</div>

    <div id="checkers-board"></div>

    <script>
        let tabuleiro = criarTabuleiroInicial();
        let turnoAtual = 'white'; 
        let minhaCor = 'white';   // Defina 'white' para o jogador 1 e 'red' para o jogador 2
        let celulaSelecionada = null;
        let movimentosValidos = [];
        let jogoEncerrado = false;

        function criarTabuleiroInicial() {
            const t = Array.from({ length: 8 }, () => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'red';
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'white';
                }
            }
            return t;
        }

        function calcularMovimentos(r, c) {
            const peca = tabuleiro[r]?.[c];
            if (!peca) return [];

            const movimentos = [];
            const isDama = peca.includes('king');
            const cor = peca.startsWith('white') ? 'white' : 'red';
            
            const direcoes = [];
            if (cor === 'white' || isDama) direcoes.push(-1); 
            if (cor === 'red' || isDama) direcoes.push(1);   

            const colunasOffset = [-1, 1];

            direcoes.forEach(dr => {
                colunasOffset.forEach(dc => {
                    const nextR = r + dr;
                    const nextC = c + dc;

                    if (nextR >= 0 && nextR < 8 && nextC >= 0 && nextC < 8) {
                        const destino = tabuleiro[nextR][nextC];
                        if (!destino) {
                            movimentos.push({ r: nextR, c: nextC, captura: false });
                        } else if (!destino.startsWith(cor)) {
                            const jumpR = nextR + dr;
                            const jumpC = nextC + dc;
                            if (jumpR >= 0 && jumpR < 8 && jumpC >= 0 && jumpC < 8 && !tabuleiro[jumpR][jumpC]) {
                                movimentos.push({ r: jumpR, c: jumpC, captura: true, pecaCapturada: { r: nextR, c: nextC } });
                            }
                        }
                    }
                });
            });

            return movimentos;
        }

        function pecaTemMovimentos(r, c) {
            const movimentos = calcularMovimentos(r, c);
            return movimentos && movimentos.length > 0;
        }

        function clicarCasa(rVisual, cVisual) {
            if (jogoEncerrado) return;

            // Converte as coordenadas visuais da tela para as coordenadas reais da matriz
            const inverter = (minhaCor === 'red');
            const r = inverter ? 7 - rVisual : rVisual;
            const c = inverter ? 7 - cVisual : cVisual;

            if (turnoAtual !== minhaCor) {
                document.getElementById('info-instrucao').textContent = '⏳ Aguarde o turno do oponente!';
                return;
            }

            const peca = tabuleiro[r]?.[c];

            if (peca && peca.startsWith(minhaCor)) {
                if (!pecaTemMovimentos(r, c)) {
                    document.getElementById('info-instrucao').textContent = '⚠️️ Esta peça está bloqueada!';
                    return; 
                }

                celulaSelecionada = { r, c };
                movimentosValidos = calcularMovimentos(r, c);
                document.getElementById('info-instrucao').textContent = 'Peça selecionada. Escolha o destino.';
                renderizarTabuleiro();
                return;
            }

            if (celulaSelecionada && movimentosValidos.some(m => m.r === r && m.c === c)) {
                executarMovimento(celulaSelecionada.r, celulaSelecionada.c, r, c);
                return;
            }

            celulaSelecionada = null;
            movimentosValidos = [];
            renderizarTabuleiro();
        }

        function executarMovimento(origemR, origemC, destinoR, destinoC) {
            const movimento = movimentosValidos.find(m => m.r === destinoR && m.c === destinoC);
            if (!movimento) return;

            tabuleiro[destinoR][destinoC] = tabuleiro[origemR][origemC];
            tabuleiro[origemR][origemC] = null;

            if (movimento.captura) {
                tabuleiro[movimento.pecaCapturada.r][movimento.pecaCapturada.c] = null;
            }

            if (tabuleiro[destinoR][destinoC] === 'white' && destinoR === 0) {
                tabuleiro[destinoR][destinoC] = 'white_king';
            } else if (tabuleiro[destinoR][destinoC] === 'red' && destinoR === 7) {
                tabuleiro[destinoR][destinoC] = 'red_king';
            }

            celulaSelecionada = null;
            movimentosValidos = [];
            turnoAtual = (turnoAtual === 'white') ? 'red' : 'white';

            renderizarTabuleiro();
        }

        function renderizarTabuleiro() {
            const grid = document.getElementById('checkers-board');
            grid.innerHTML = '';

            // Se o jogador for 'red', o tabuleiro é invertido visualmente para ele ver as peças dele embaixo
            const inverter = (minhaCor === 'red');

            for (let rVis = 0; rVis < 8; rVis++) {
                for (let cVis = 0; cVis < 8; cVis++) {
                    const r = inverter ? 7 - rVis : rVis;
                    const c = inverter ? 7 - cVis : cVis;

                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    square.dataset.row = rVis;
                    square.dataset.col = cVis;

                    if (celulaSelecionada && celulaSelecionada.r === r && celulaSelecionada.c === c) {
                        square.classList.add('selected');
                    }

                    const mov = movimentosValidos.find(m => m.r === r && m.c === c);
                    if (mov) {
                        square.classList.add(mov.captura ? 'capture-target' : 'highlight');
                    }

                    const peca = tabuleiro[r]?.[c];
                    if (peca) {
                        const pieceEl = document.createElement('div');
                        const corClasse = peca.startsWith('white') ? 'white' : 'red';
                        const isDama = peca.includes('king') ? ' king' : '';
                        pieceEl.className = `piece ${corClasse}${isDama}`;

                        if (turnoAtual === minhaCor && peca.startsWith(minhaCor)) {
                            if (pecaTemMovimentos(r, c)) {
                                pieceEl.classList.add('movel');
                            }
                        }

                        square.appendChild(pieceEl);
                    }

                    square.addEventListener('click', () => clicarCasa(rVis, cVis));
                    grid.appendChild(square);
                }
            }

            const statusEl = document.getElementById('turno-status');
            if (jogoEncerrado) {
                statusEl.textContent = '🏁 Fim de Jogo';
            } else if (turnoAtual === minhaCor) {
                statusEl.textContent = `🟢 Sua vez (${minhaCor === 'white' ? 'Brancas' : 'Vermelhas'})!`;
            } else {
                statusEl.textContent = '⏳ Turno do oponente...';
            }
        }

        renderizarTabuleiro();
    </script>
</body>
</html>
