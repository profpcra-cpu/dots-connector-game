<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Damas - Modo Teste Local (Giro Automático)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;

            --board-light: #e2e8f0;
            --board-dark: #334155;
            --board-border: rgba(148, 163, 184, 0.45);

            --c-green: #4ade80;
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-red: #ef4444;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);

            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.25);
            --input-bg: rgba(255, 255, 255, 0.95);

            --board-light: #cbd5e1;
            --board-dark: #64748b;
            --board-border: rgba(15, 23, 42, 0.25);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
        body::after { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-small {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            background: var(--card-bg);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .user-info-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            font-size: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        #display-nome { font-size: 13.5px; font-weight: 700; }

        .match-info-bar {
            display: flex;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }
        #turno-status { color: var(--c-amber); }

        .checkers-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            border: 3px solid var(--board-border);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 12px;
            box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
            transition: transform 0.4s ease;
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        .square.selected { background-color: rgba(99, 102, 241, 0.55) !important; }
        .square.highlight { background-color: rgba(74, 222, 128, 0.5) !important; }
        .square.capture-target { background-color: rgba(239, 68, 68, 0.55) !important; }

        .piece {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            transition: transform var(--t-fast);
            position: relative;
        }
        .piece.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
            color: #0f172a;
        }
        .piece.red {
            background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c);
            border: 2px solid #7f1d1d;
            color: #fff;
        }
        .piece.king::after {
            content: "👑";
            font-size: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Efeito Hover/Pulsante para as peças móveis do turno atual */
        .piece.movel {
            cursor: pointer;
            box-shadow: 0 0 12px 3px rgba(74, 222, 128, 0.8);
            animation: pulse-movel 1.5s infinite;
        }
        .piece.movel:hover {
            transform: scale(1.1);
        }

        @keyframes pulse-movel {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button class="btn-small" onclick="window.location.reload()">🔄 Reiniciar</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <!-- TELA DO JOGO (Modo Teste Local / Hotseat) -->
        <div id="game-screen">
            <div class="user-header">
                <div class="user-info-left">
                    <span id="display-avatar" class="user-avatar-display">🎮</span>
                    <strong id="display-nome">Modo Teste (Local)</strong>
                </div>
                <span id="display-sala-tag" style="font-size: 11px; background: rgba(99,102,241,0.15); padding: 4px 8px; border-radius: 6px; color: var(--c-blue);">Hotseat</span>
            </div>

            <div class="match-info-bar">
                <span>Vez de: <strong id="info-minha-cor" style="color: var(--c-blue);">⚪ Brancas</strong></span>
                <span id="turno-status">Sua vez!</span>
            </div>

            <p class="instructions" id="info-instrucao">Toque na sua peça e depois na casa de destino. O tabuleiro girará automaticamente a cada turno.</p>

            <div class="checkers-grid" id="checkers-board"></div>
        </div>
    </div>

    <script>
        /* ==========================================================
           ESTADO DO JOGO LOCAL (TESTE)
           ========================================================== */
        let tabuleiro = criarTabuleiroInicial();
        let turnoAtual = 'white'; // 'white' ou 'red'
        let celulaSelecionada = null;
        let movimentosValidos = [];
        let jogoEncerrado = false;

        /* ==========================================================
           TEMA
           ========================================================== */
        const themeToggleBtn = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarTextoBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
            atualizarTextoBotaoTema(newTheme);
        });

        function atualizarTextoBotaoTema(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }

        /* ==========================================================
           TABULEIRO INICIAL
           ========================================================== */
        function criarTabuleiroInicial() {
            const t = Array.from({ length: 8 }, () => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'red';
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) t[r][c] = 'white';
                }
            }
            return t;
        }

        /* ==========================================================
           RENDERIZAÇÃO COM ROTAÇÃO AUTOMÁTICA DE 180 GRAUS
           ========================================================== */
        function renderizarTabuleiro() {
            const grid = document.getElementById('checkers-board');
            grid.innerHTML = '';

            // Se for a vez das vermelhas, o tabuleiro roda 180 graus (inverte a matriz visual)
            const invertido = (turnoAtual === 'red');

            for (let visualR = 0; visualR < 8; visualR++) {
                for (let visualC = 0; visualC < 8; visualC++) {
                    
                    const r = invertido ? (7 - visualR) : visualR;
                    const c = invertido ? (7 - visualC) : visualC;

                    const square = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    square.className = `square ${isDark ? 'dark' : 'light'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;

                    if (celulaSelecionada && celulaSelecionada.r === r && celulaSelecionada.c === c) {
                        square.classList.add('selected');
                    }
                    const mov = movimentosValidos.find(m => m.r === r && m.c === c);
                    if (mov) {
                        square.classList.add(mov.captura ? 'capture-target' : 'highlight');
                    }

                    const peca = tabuleiro[r]?.[c];
                    if (peca) {
                        const pieceEl = document.createElement('div');
                        const corClasse = peca.startsWith('white') ? 'white' : 'red';
                        const isDama = peca.includes('king') ? ' king' : '';
                        
                        let classeExtra = '';
                        // Destaca com efeito pulsante (hover) as peças do jogador ativo da vez
                        if (!jogoEncerrado && peca.startsWith(turnoAtual)) {
                            const movsPeca = calcularMovimentosPara(r, c, turnoAtual);
                            if (movsPeca.length > 0) {
                                classeExtra = ' movel';
                            }
                        }

                        pieceEl.className = `piece ${corClasse}${isDama}${classeExtra}`;
                        square.appendChild(pieceEl);
                    }

                    if (isDark) {
                        square.addEventListener('click', () => clicarCasa(r, c));
                    }

                    grid.appendChild(square);
                }
            }

            // Atualiza informações no topo
            document.getElementById('info-minha-cor').textContent =
                turnoAtual === 'white' ? '⚪ Brancas' : '🔴 Vermelhas';
            
            const statusEl = document.getElementById('turno-status');
            if (jogoEncerrado) {
                statusEl.textContent = '🏁 Fim de Jogo';
            } else {
                statusEl.textContent = turnoAtual === 'white' ? 'Vez das Brancas' : 'Vez das Vermelhas (Girado)';
            }
        }

        /* ==========================================================
           CLIQUE NAS CASAS
           ========================================================== */
        function clicarCasa(r, c) {
            if (jogoEncerrado) return;

            const peca = tabuleiro[r][c];

            // Selecionar peça própria do turno atual
            if (peca && peca.startsWith(turnoAtual)) {
                celulaSelecionada = { r, c };
                movimentosValidos = calcularMovimentos(r, c);
                renderizarTabuleiro();
                return;
            }

            // Mover para casa de destino válida
            if (celulaSelecionada && movimentosValidos.some(m => m.r === r && m.c === c)) {
                executarMovimento(celulaSelecionada.r, celulaSelecionada.c, r, c);
                return;
            }

            // Desselecionar
            celulaSelecionada = null;
            movimentosValidos = [];
            renderizarTabuleiro();
        }

        /* ==========================================================
           CÁLCULO DE MOVIMENTOS
           ========================================================== */
        function calcularMovimentos(r, c) {
            const peca = tabuleiro[r][c];
            if (!peca) return [];

            const isDama = peca.includes('king');
            const cor = peca.startsWith('white') ? 'white' : 'red';

            const movimentos = [];
            const direcoesFrente = cor === 'white' ? [-1] : [+1];
            const direcoesDama = [-1, +1];

            if (isDama) {
                for (const dr of direcoesDama) {
                    for (const dc of [-1, +1]) {
                        let nr = r + dr, nc = c + dc;
                        let capturada = null;
                        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const alvo = tabuleiro[nr][nc];
                            if (!alvo) {
                                if (!capturada) {
                                    movimentos.push({ r: nr, c: nc });
                                } else {
                                    movimentos.push({ r: nr, c: nc, captura: capturada });
                                    break; 
                                }
                            } else if (alvo.startsWith(cor)) {
                                break; 
                            } else {
                                if (capturada) break; 
                                capturada = { r: nr, c: nc };
                            }
                            nr += dr; nc += dc;
                        }
                    }
                }
            } else {
                for (const dr of direcoesFrente) {
                    for (const dc of [-1, +1]) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !tabuleiro[nr][nc]) {
                            movimentos.push({ r: nr, c: nc });
                        }
                    }
                }
                for (const dr of [-1, +1]) {
                    for (const dc of [-1, +1]) {
                        const mr = r + dr, mc = c + dc;
                        const jr = r + 2 * dr, jc = c + 2 * dc;
                        if (jr < 0 || jr >= 8 || jc < 0 || jc >= 8) continue;
                        const meio = tabuleiro[mr][mc];
                        const destino = tabuleiro[jr][jc];
                        if (meio && !meio.startsWith(cor) && !destino) {
                            movimentos.push({ r: jr, c: jc, captura: { r: mr, c: mc } });
                        }
                    }
                }
            }

            const capturas = movimentos.filter(m => m.captura);
            if (capturas.length > 0) return capturas;
            return movimentos;
        }

        function calcularMovimentosPara(r, c, cor) {
            const peca = tabuleiro[r][c];
            if (!peca || !peca.startsWith(cor)) return [];
            return calcularMovimentos(r, c);
        }

        /* ==========================================================
           EXECUTAR MOVIMENTO E GIRAR TABULEIRO
           ========================================================== */
        function executarMovimento(deR, deC, paraR, paraC) {
            const mov = movimentosValidos.find(m => m.r === paraR && m.c === paraC);
            if (!mov) return;

            let pecaMovida = tabuleiro[deR][deC];
            tabuleiro[paraR][paraC] = pecaMovida;
            tabuleiro[deR][deC] = null;

            if (mov.captura) {
                tabuleiro[mov.captura.r][mov.captura.c] = null;
            }

            // Promoção a Dama
            if (pecaMovida === 'white' && paraR === 0) tabuleiro[paraR][paraC] = 'white-king';
            if (pecaMovida === 'red'   && paraR === 7) tabuleiro[paraR][paraC] = 'red-king';

            celulaSelecionada = null;
            movimentosValidos = [];

            // Alterna o turno (o que aciona o giro automático de 180° no próximo render)
            turnoAtual = turnoAtual === 'white' ? 'red' : 'white';

            const oponente = turnoAtual;
            if (!temPecas(oponente)) {
                jogoEncerrado = true;
                const vencedor = oponente === 'white' ? 'red' : 'white';
                document.getElementById('info-instrucao').textContent =
                    `🏁 Fim de jogo! Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}.`;
                setTimeout(() => alert(`🏆 Vitória das ${vencedor === 'white' ? 'brancas' : 'vermelhas'}!`), 100);
            } else if (!temMovimentos(oponente)) {
                jogoEncerrado = true;
                const vencedor = turnoAtual === 'white' ? 'vermelhas' : 'brancas';
                document.getElementById('info-instrucao').textContent =
                    `🏁 Oponente sem movimentos. Vitória das ${vencedor}.`;
                setTimeout(() => alert(`🏆 Vitória das ${vencedor}!`), 100);
            }

            renderizarTabuleiro();
        }

        function temPecas(cor) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = tabuleiro[r][c];
                    if (p && p.startsWith(cor)) return true;
                }
            }
            return false;
        }

        function temMovimentos(cor) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = tabuleiro[r][c];
                    if (p && p.startsWith(cor)) {
                        const movs = calcularMovimentosPara(r, c, cor);
                        if (movs.length > 0) return true;
                    }
                }
            }
            return false;
        }

        // Inicializa o jogo ao carregar
        renderizarTabuleiro();
    </script>
</body>
</html>
