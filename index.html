<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Master: Link the Dots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== TEMAS ===== */
        body.theme-cyber {
            background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%);
            color: #cdd6f4;
        }
        body.theme-cyber .glass-panel {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.theme-cyber .board-frame {
            background: #2b1d12;
            border: 10px solid #5c3d2e;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
        }
        body.theme-cyber .grid-line { stroke: #3d281a; }

        body.theme-neon {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
        }
        body.theme-neon .glass-panel {
            background: rgba(15, 12, 41, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }
        body.theme-neon .board-frame {
            background: #090514;
            border: 8px solid #00f3ff;
            box-shadow: inset 0 0 20px rgba(0,243,255,0.5), 0 0 25px rgba(0,243,255,0.4);
        }
        body.theme-neon .grid-line { stroke: #1e2a5a; }

        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
        }
        body.theme-light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        body.theme-light .board-frame {
            background: #cbd5e1;
            border: 8px solid #94a3b8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.1);
        }
        body.theme-light .grid-line { stroke: #94a3b8; }
        body.theme-light .text-white { color: #0f172a !important; }
        body.theme-light .text-gray-300 { color: #334155 !important; }
        body.theme-light .text-gray-400 { color: #64748b !important; }

        body.theme-sunset {
            background: linear-gradient(135deg, #2d1b3d 0%, #6b2d5c 50%, #c44569 100%);
            color: #ffe4e6;
        }
        body.theme-sunset .glass-panel {
            background: rgba(45, 27, 61, 0.7);
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 0 20px rgba(255, 100, 150, 0.2);
        }
        body.theme-sunset .board-frame {
            background: #1a0f24;
            border: 8px solid #ff6b9d;
            box-shadow: inset 0 0 20px rgba(255,107,157,0.4), 0 0 30px rgba(255,107,157,0.3);
        }
        body.theme-sunset .grid-line { stroke: #4a2540; }

        body.theme-forest {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #d1fae5;
        }
        body.theme-forest .glass-panel {
            background: rgba(15, 32, 39, 0.8);
            border: 1px solid rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.15);
        }
        body.theme-forest .board-frame {
            background: #051015;
            border: 8px solid #10b981;
            box-shadow: inset 0 0 20px rgba(16,185,129,0.4), 0 0 25px rgba(16,185,129,0.3);
        }
        body.theme-forest .grid-line { stroke: #1e3a3a; }

        .glass-panel {
            backdrop-filter: blur(12px);
            border-radius: 20px;
        }
        .board-frame {
            border-radius: 20px;
            transition: all 0.4s ease;
        }
        .iq-progress {
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px currentColor); }
            50% { filter: drop-shadow(0 0 18px currentColor); }
        }
        .glow-effect { animation: pulse-glow 2s infinite; }
        .modal-bg {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
        .float-up { animation: float-up 1s ease-out forwards; }

        .level-btn {
            transition: all 0.2s ease;
            position: relative;
        }
        .level-btn:hover { transform: translateY(-2px); }
        .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
        .level-btn.completed::after {
            content: '✓';
            position: absolute;
            top: -6px;
            right: -6px;
            background: #10b981;
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .level-btn.current {
            box-shadow: 0 0 0 3px #6366f1, 0 0 15px #6366f1;
        }
    </style>
</head>
<body class="theme-cyber flex flex-col items-center justify-between h-screen p-3 md:p-6 select-none overflow-hidden">

    <!-- Toast de feedback -->

    <!-- Win Modal -->

    <!-- Levels Modal -->

    <script>
        // ===== CONFIGURAÇÃO DE TEMAS =====
        const themes = [
            { class: 'theme-cyber', name: 'Cyber', icon: 'fa-robot' },
            { class: 'theme-neon', name: 'Neon', icon: 'fa-bolt' },
            { class: 'theme-sunset', name: 'Sunset', icon: 'fa-sun' },
            { class: 'theme-forest', name: 'Forest', icon: 'fa-tree' },
            { class: 'theme-light', name: 'Clean', icon: 'fa-sun' }
        ];
        let currentThemeIdx = 0;

        // ===== ÁUDIO =====
        class SoundEngine {
            constructor() { 
                this.ctx = null; 
                this.enabled = true;
            }
            init() { 
                if (!this.ctx) {
                    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } 
                    catch(e) { this.enabled = false; }
                }
            }
            playTone(freq, duration = 0.08, type = 'sine', volume = 0.15) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); 
                    gain.connect(this.ctx.destination);
                    osc.start(); 
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPop(freq = 440) { this.playTone(freq, 0.08, 'sine', 0.15); }
            playConnect() { this.playTone(600, 0.1, 'triangle', 0.12); }
            playError() { this.playTone(200, 0.15, 'sawtooth', 0.1); }
            playHint() { 
                [523, 659, 784].forEach((f, i) => setTimeout(() => this.playTone(f, 0.12, 'sine', 0.12), i * 80));
            }
            playWin() {
                [523, 659, 784, 1046, 1318].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 0.15, 'triangle', 0.15), idx * 100);
                });
            }
            playUndo() { this.playTone(300, 0.1, 'sine', 0.1); }
            playLevelUp() {
                [440, 554, 659, 880, 1108, 1318].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 0.12, 'sine', 0.14), idx * 70);
                });
            }
        }
        const audio = new SoundEngine();

        // ===== PALETA DE CORES =====
        const COLOR_PALETTE = {
            red:     { hex: '#ef4444', glow: '#dc2626' },
            blue:    { hex: '#3b82f6', glow: '#2563eb' },
            green:   { hex: '#22c55e', glow: '#16a34a' },
            yellow:  { hex: '#eab308', glow: '#ca8a04' },
            purple:  { hex: '#a855f7', glow: '#9333ea' },
            orange:  { hex: '#f97316', glow: '#ea580c' },
            cyan:    { hex: '#06b6d4', glow: '#0891b2' },
            pink:    { hex: '#ec4899', glow: '#db2777' },
            lime:    { hex: '#84cc16', glow: '#65a30d' },
            teal:    { hex: '#14b8a6', glow: '#0d9488' }
        };

        // ===== NÍVEIS (12 fases, dificuldade progressiva) =====
        const LEVELS = [
            // Fácil (1-4)
            { size: 4, difficulty: 'easy', title: "Aquecimento", dots: [
                {x:0,y:0,color:'green'},{x:3,y:3,color:'green'},
                {x:3,y:0,color:'red'},{x:2,y:2,color:'red'},
                {x:0,y:3,color:'blue'},{x:2,y:1,color:'blue'}
            ]},
            { size: 4, difficulty: 'easy', title: "Primeiros Passos", dots: [
                {x:0,y:0,color:'red'},{x:2,y:3,color:'red'},
                {x:1,y:0,color:'yellow'},{x:3,y:2,color:'yellow'},
                {x:0,y:2,color:'blue'},{x:3,y:3,color:'blue'}
            ]},
            { size: 4, difficulty: 'easy', title: "Três Cores", dots: [
                {x:0,y:0,color:'orange'},{x:0,y:3,color:'orange'},
                {x:3,y:0,color:'purple'},{x:3,y:3,color:'purple'},
                {x:1,y:1,color:'cyan'},{x:2,y:2,color:'cyan'}
            ]},
            { size: 4, difficulty: 'easy', title: "Cruzado", dots: [
                {x:0,y:1,color:'pink'},{x:3,y:2,color:'pink'},
                {x:1,y:0,color:'lime'},{x:2,y:3,color:'lime'},
                {x:0,y:3,color:'red'},{x:3,y:0,color:'red'},
                {x:1,y:2,color:'blue'},{x:2,y:1,color:'blue'}
            ]},
            
            // Médio (5-8)
            { size: 5, difficulty: 'medium', title: "Grid 5x5", dots: [
                {x:0,y:1,color:'red'},{x:4,y:1,color:'red'},
                {x:1,y:0,color:'blue'},{x:3,y:4,color:'blue'},
                {x:0,y:4,color:'green'},{x:4,y:3,color:'green'},
                {x:2,y:2,color:'purple'},{x:4,y:4,color:'purple'}
            ]},
            { size: 5, difficulty: 'medium', title: "Caminhos Cruzados", dots: [
                {x:0,y:0,color:'orange'},{x:4,y:4,color:'orange'},
                {x:4,y:0,color:'cyan'},{x:0,y:4,color:'cyan'},
                {x:2,y:1,color:'pink'},{x:2,y:3,color:'pink'},
                {x:1,y:2,color:'lime'},{x:3,y:2,color:'lime'}
            ]},
            { size: 5, difficulty: 'medium', title: "Espiral", dots: [
                {x:0,y:0,color:'red'},{x:4,y:0,color:'red'},
                {x:4,y:4,color:'blue'},{x:0,y:4,color:'blue'},
                {x:2,y:2,color:'yellow'},{x:3,y:2,color:'yellow'},
                {x:1,y:3,color:'teal'},{x:3,y:3,color:'teal'}
            ]},
            { size: 5, difficulty: 'medium', title: "Desafio Cinco", dots: [
                {x:0,y:2,color:'purple'},{x:4,y:2,color:'purple'},
                {x:2,y:0,color:'orange'},{x:2,y:4,color:'orange'},
                {x:0,y:0,color:'green'},{x:4,y:4,color:'green'},
                {x:4,y:0,color:'red'},{x:0,y:4,color:'red'},
                {x:3,y:1,color:'cyan'},{x:1,y:3,color:'cyan'}
            ]},

            // Difícil (9-12)
            { size: 6, difficulty: 'hard', title: "Grid 6x6", dots: [
                {x:0,y:0,color:'red'},{x:5,y:5,color:'red'},
                {x:5,y:0,color:'blue'},{x:0,y:5,color:'blue'},
                {x:2,y:2,color:'green'},{x:3,y:3,color:'green'},
                {x:1,y:4,color:'yellow'},{x:4,y:1,color:'yellow'}
            ]},
            { size: 6, difficulty: 'hard', title: "Labirinto", dots: [
                {x:0,y:1,color:'purple'},{x:5,y:4,color:'purple'},
                {x:1,y:0,color:'orange'},{x:4,y:5,color:'orange'},
                {x:0,y:4,color:'cyan'},{x:5,y:1,color:'cyan'},
                {x:2,y:3,color:'pink'},{x:3,y:2,color:'pink'},
                {x:3,y:0,color:'lime'},{x:2,y:5,color:'lime'}
            ]},
            { size: 6, difficulty: 'hard', title: "Complexo", dots: [
                {x:0,y:0,color:'red'},{x:5,y:0,color:'red'},
                {x:0,y:5,color:'blue'},{x:5,y:5,color:'blue'},
                {x:2,y:2,color:'green'},{x:3,y:2,color:'green'},
                {x:2,y:3,color:'yellow'},{x:3,y:3,color:'yellow'},
                {x:1,y:1,color:'purple'},{x:4,y:4,color:'purple'},
                {x:4,y:1,color:'teal'},{x:1,y:4,color:'teal'}

        function saveProgress() {

                    unlockedLevels,
                    completedLevels,
                    IQ,
                    hintsLeft,
                    currentLevelIdx,
                    currentThemeIdx,
                    bestMoves: getBestMoves()
                };
                localStorage.setItem('brainMaster_save', JSON.stringify(data));
            } catch(e) {}
        }

        function loadProgress() {
            try {
                const raw = localStorage.getItem('brainMaster_save');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.unlockedLevels) unlockedLevels = Math.min(data.unlockedLevels, LEVELS.length);
                if (data.completedLevels) completedLevels = data.completedLevels;
                if (data.IQ) IQ = data.IQ;
                if (data.hintsLeft !== undefined) hintsLeft = data.hintsLeft;
                if (data.currentLevelIdx !== undefined) currentLevelIdx = data.currentLevelIdx;
                if (data.currentThemeIdx !== undefined) currentThemeIdx = data.currentThemeIdx;
                if (data.bestMoves) localStorage.setItem('brainMaster_bestMoves', JSON.stringify(data.bestMoves));
                updateThemeUI();
            } catch(e) {}
        }

        function getBestMoves() {
            try {
                return JSON.parse(localStorage.getItem('brainMaster_bestMoves') || '{}');
            } catch(e) { return {}; }
        }

        function saveBestMoves(idx, moves) {
            const best = getBestMoves();
            if (!best[idx] || moves < best[idx]) {
                best[idx] = moves;
                localStorage.setItem('brainMaster_bestMoves', JSON.stringify(best));
            }
        }

            if (!confirm('Tem certeza que deseja resetar todo o progresso?')) return;
            localStorage.removeItem('brainMaster_save');

                error: 'bg-red-600 text-white',
                warning: 'bg-amber-500 text-white'
            };
            toast.className = `fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl font-semibold text-sm shadow-2xl transition-all duration-300 pointer-events-none z-[60] ${colors[type] || colors.info}`;
            toast.innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px)';
            }, 1800);
        }
