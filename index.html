<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Flow Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; overflow: hidden; }
        .glass-panel-dark { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel-light { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); }
        canvas { touch-action: none; }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-between p-1.5 sm:p-3 overflow-hidden bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300" id="app-body">

    <!-- MODAL DE AUTENTICAÇÃO / NOME -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity duration-300">
        <div id="auth-panel" class="glass-panel-dark p-5 rounded-2xl w-11/12 max-w-sm text-center shadow-2xl border border-indigo-500/30">
            <h2 class="text-lg font-bold mb-1 text-indigo-400">Brain Flow Master</h2>
            <p class="text-[11px] text-gray-400 mb-3">Insira o seu nome de jogador para iniciar o desafio.</p>
            <input type="text" id="player-nickname" value="Paulo" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 mb-3 text-center text-white font-bold text-sm focus:outline-none focus:border-indigo-500" placeholder="Seu Nome">
            <button onclick="registerPlayer()" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-indigo-600/30">Entrar no Jogo</button>
        </div>
    </div>

    <!-- MODAL DE RANKING -->
    <div id="rank-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div id="rank-panel" class="glass-panel-dark p-5 rounded-2xl w-11/12 max-w-md text-center shadow-2xl border border-amber-500/30">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-amber-400">🏆 Classificação (Ranking)</h2>
                <button onclick="toggleModal('rank-modal')" class="text-gray-400 hover:text-white font-bold px-2">✕</button>
            </div>
            <div id="ranking-list" class="space-y-2 max-h-48 overflow-y-auto mb-3 text-left text-xs">
                <p class="text-center text-gray-400">A carregar dados...</p>
            </div>
            <button onclick="toggleModal('rank-modal')" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold text-xs rounded-xl transition">Fechar</button>
        </div>
    </div>

    <!-- MODAL DE PERSONALIZAÇÃO (TEMAS & CORES) -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div id="custom-panel" class="glass-panel-dark p-5 rounded-2xl w-11/12 max-w-sm text-center shadow-2xl border border-indigo-500/30">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-indigo-400">🎨 Personalização</h2>
                <button onclick="toggleModal('custom-modal')" class="text-gray-400 hover:text-white font-bold px-2">✕</button>
            </div>
            
            <div class="space-y-3 text-left text-xs">
                <div>
                    <label class-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Modo de Exibição</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTheme('dark')" id="btn-theme-dark" class="py-1.5 px-3 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-300 font-bold transition flex items-center justify-center gap-1">🌙 Escuro</button>
                        <button onclick="setTheme('light')" id="btn-theme-light" class="py-1.5 px-3 rounded-xl border border-slate-700 bg-slate-800/50 text-gray-300 font-bold transition flex items-center justify-center gap-1">☀️ Claro</button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Paleta de Cores</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setPalette('vibrant')" id="btn-pal-vibrant" class="py-1.5 px-1 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-400 font-bold transition text-center">Vibrante</button>
                        <button onclick="setPalette('pastel')" id="btn-pal-pastel" class="py-1.5 px-1 rounded-xl border border-slate-700 bg-slate-800/50 text-gray-300 font-bold transition text-center">Pastel</button>
                        <button onclick="setPalette('neon')" id="btn-pal-neon" class="py-1.5 px-1 rounded-xl border border-slate-700 bg-slate-800/50 text-gray-300 font-bold transition text-center">Neon</button>
                    </div>
                </div>
            </div>

            <button onclick="toggleModal('custom-modal')" class="w-full mt-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-indigo-600/30">Aplicar & Fechar</button>
        </div>
    </div>

    <!-- MODAL DE VITÓRIA -->
    <div id="win-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div id="win-panel" class="glass-panel-dark p-5 rounded-2xl w-11/12 max-w-sm text-center shadow-2xl border border-green-500/30">
            <div class="text-3xl mb-1">🎉</div>
            <h2 class="text-lg font-bold mb-1 text-green-400">Partida Concluída!</h2>
            <p class="text-[11px] text-gray-300 mb-3">Pontuação e QI atualizados com sucesso.</p>
            <div class="bg-slate-900/80 rounded-xl p-2.5 mb-3 border border-slate-800">
                <span class="text-[10px] text-gray-400">Pontos Ganhos:</span>
                <div id="win-score-display" class="text-xl font-black text-amber-400">120</div>
            </div>
            <button id="btn-next-random" class="w-full py-2 bg-green-600 hover:bg-green-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-green-600/30">Próximo Desafio</button>
        </div>
    </div>

    <!-- CABEÇALHO / PLACAR -->
    <header id="main-header" class="glass-panel-dark w-full max-w-md rounded-xl px-2.5 py-1.5 flex items-center justify-between shadow-md shrink-0 transition-colors duration-300">
        <div class="flex items-center gap-1.5">
            <div class="w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-sm">🧠</div>
            <div>
                <h1 class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">Brain Flow Master</h1>
                <span id="player-display" class="text-[11px] font-extrabold text-amber-400">Paulo</span>
            </div>
        </div>
        <div class="flex items-center gap-1">
            <button onclick="toggleModal('custom-modal')" class="p-1 rounded-lg bg-slate-800/80 border border-slate-700 hover:border-indigo-500 transition text-indigo-400 text-xs" title="Personalização">🎨</button>
            <button onclick="openRanking()" class="p-1 rounded-lg bg-slate-800/80 border border-slate-700 hover:border-amber-500 transition text-amber-400 text-xs" title="Ver Ranking">🏆</button>
            <div class="px-2 py-0.5 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center gap-1">
                <span class="text-[9px] font-bold text-amber-400">QI</span>
                <span id="iq-value" class="text-[11px] font-black text-amber-300">75</span>
            </div>
        </div>
    </header>

    <!-- SELETOR DE PARES -->
    <div id="pairs-selector" class="w-full max-w-md flex gap-1.5 bg-slate-900/60 p-0.5 rounded-lg border border-slate-800 shrink-0 transition-colors duration-300">
        <button id="btn-pairs-3" onclick="setPairsCount(3)" class="flex-1 py-1 text-[10px] font-bold rounded-md transition text-gray-400 hover:text-white">3 Pares</button>
        <button id="btn-pairs-4" onclick="setPairsCount(4)" class="flex-1 py-1 text-[10px] font-bold rounded-md transition bg-indigo-600 text-white shadow">4 Pares</button>
        <button id="btn-pairs-5" onclick="setPairsCount(5)" class="flex-1 py-1 text-[10px] font-bold rounded-md transition text-gray-400 hover:text-white">5 Pares</button>
    </div>

    <!-- ÁREA DO JOGO (CANVAS RESPONSIVO FLEXÍVEL) -->
    <main id="game-container" class="relative w-full max-w-[min(85dvh,340px)] aspect-square glass-panel-dark rounded-xl p-1.5 shadow-xl flex items-center justify-center my-auto shrink transition-colors duration-300">
        <canvas id="gameCanvas" class="w-full h-full rounded-lg cursor-crosshair"></canvas>
        <canvas id="effectCanvas" class="absolute inset-1.5 w-[calc(100%-0.75rem)] h-[calc(100%-0.75rem)] rounded-lg pointer-events-none"></canvas>
    </main>

    <!-- BOTÃO DE ATALHO PARA CONCLUSÃO -->
    <div class="w-full max-w-md shrink-0">
        <button onclick="triggerDirectWin()" class="w-full py-1 bg-emerald-600/20 border border-emerald-500/40 hover:bg-emerald-600/30 text-emerald-300 text-[10px] font-bold rounded-lg transition flex items-center justify-center gap-1">
            ⚡ [Atalho] Concluir Partida & Salvar no Firebase
        </button>
    </div>

    <!-- BARRA DE FERRAMENTAS / BOTÕES -->
    <footer class="w-full max-w-md grid grid-cols-4 gap-1.5 shrink-0">
        <button id="btn-reset" class="flex flex-col items-center justify-center py-1.5 rounded-lg glass-panel-dark hover:bg-slate-800 transition border border-slate-700/50 text-[10px] font-bold text-gray-300">
            <span class="text-xs mb-0.5">🔄</span> Reiniciar
        </button>
        <button id="btn-undo" class="flex flex-col items-center justify-center py-1.5 rounded-lg glass-panel-dark hover:bg-slate-800 transition border border-slate-700/50 text-[10px] font-bold text-gray-300">
            <span class="text-xs mb-0.5">↩️</span> Desfazer
        </button>
        <button id="btn-hint" class="relative flex flex-col items-center justify-center py-1.5 rounded-lg glass-panel-dark hover:bg-slate-800 transition border border-slate-700/50 text-[10px] font-bold text-gray-300">
            <span class="text-xs mb-0.5">💡</span> Dica
            <span id="hint-badge" class="absolute top-0.5 right-1.5 bg-amber-500 text-slate-950 text-[8px] font-black w-3 h-3 rounded-full flex items-center justify-center">3</span>
        </button>
        <button id="btn-new-random" class="flex flex-col items-center justify-center py-1.5 rounded-lg glass-panel-dark hover:bg-slate-800 transition border border-slate-700/50 text-[10px] font-bold text-indigo-400">
            <span class="text-xs mb-0.5">🔀</span> Novo Jogo
        </button>
    </footer>

    <!-- SCRIPT DA LÓGICA DO JOGO -->
    <script>
        class SoundEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() { 
                if (!this.ctx) {
                    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } 
                    catch(e) { this.enabled = false; }
                }
            }
            playTone(freq, duration = 0.08, type = 'sine', volume = 0.15) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPop(freq = 440) { this.playTone(freq, 0.08, 'sine', 0.15); }
            playConnect() { this.playTone(600, 0.1, 'triangle', 0.12); }
            playError() { this.playTone(200, 0.15, 'sawtooth', 0.1); }
            playHint() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.playTone(f, 0.12, 'sine', 0.12), i * 80)); }
            playWin() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.playTone(f, 0.15, 'triangle', 0.15), i * 100)); }
            playUndo() { this.playTone(300, 0.1, 'sine', 0.1); }
        }
        const audio = new SoundEngine();

        const PALETTES = {
            vibrant: {
                red:     { hex: '#ef4444' },
                blue:    { hex: '#3b82f6' },
                green:   { hex: '#22c55e' },
                yellow:  { hex: '#eab308' },
                purple:  { hex: '#a855f7' },
                orange:  { hex: '#f97316' },
                cyan:    { hex: '#06b6d4' },
                pink:    { hex: '#ec4899' }
            },
            pastel: {
                red:     { hex: '#f87171' },
                blue:    { hex: '#60a5fa' },
                green:   { hex: '#4ade80' },
                yellow:  { hex: '#facc15' },
                purple:  { hex: '#c084fc' },
                orange:  { hex: '#fb923c' },
                cyan:    { hex: '#22d3ee' },
                pink:    { hex: '#f472b6' }
            },
            neon: {
                red:     { hex: '#ff1744' },
                blue:    { hex: '#00e5ff' },
                green:   { hex: '#00e676' },
                yellow:  { hex: '#ffea00' },
                purple:  { hex: '#d500f9' },
                orange:  { hex: '#ff9100' },
                cyan:    { hex: '#18ffff' },
                pink:    { hex: '#ff4081' }
            }
        };

        let currentPaletteKey = 'vibrant';
        let currentTheme = 'dark';
        let COLOR_PALETTE = PALETTES[currentPaletteKey];
        let ALL_COLORS = Object.keys(COLOR_PALETTE);

        const gridCount = 6;
        let pairsCount = 4;
        let cellSize = 0;
        let canvasSize = 0;
        let activeColor = null;
        let isDrawing = false;
        let paths = {};
        let currentPath = [];
        let pathHistory = [];
        let hintsLeft = 3;
        let IQ = 75;
        let playerName = "Paulo";
        let playerScore = 0;
        let currentDots = [];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const effectCanvas = document.getElementById('effectCanvas');
        const effectCtx = effectCanvas.getContext('2d');

        function setTheme(theme) {
            currentTheme = theme;
            const body = document.getElementById('app-body');
            const panels = [
                document.getElementById('auth-panel'),
                document.getElementById('rank-panel'),
                document.getElementById('custom-panel'),
                document.getElementById('win-panel'),
                document.getElementById('main-header'),
                document.getElementById('game-container'),
                ...document.querySelectorAll('footer button'),
                document.getElementById('pairs-selector')
            ];

            if (theme === 'light') {
                body.className = "h-[100dvh] w-screen flex flex-col items-center justify-between p-1.5 sm:p-3 overflow-hidden bg-slate-100 text-slate-900 transition-colors duration-300";
                document.getElementById('btn-theme-light').className = "py-1.5 px-3 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-700 font-bold transition flex items-center justify-center gap-1";
                document.getElementById('btn-theme-dark').className = "py-1.5 px-3 rounded-xl border border-slate-300 bg-slate-200 text-gray-700 font-bold transition flex items-center justify-center gap-1";
                
                panels.forEach(p => {
                    if(p) {
                        p.classList.remove('glass-panel-dark', 'bg-slate-900/60', 'bg-slate-800/80');
                        p.classList.add('glass-panel-light');
                    }
                });
            } else {
                body.className = "h-[100dvh] w-screen flex flex-col items-center justify-between p-1.5 sm:p-3 overflow-hidden bg-slate-950 text-slate-100 transition-colors duration-300";
                document.getElementById('btn-theme-dark').className = "py-1.5 px-3 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-300 font-bold transition flex items-center justify-center gap-1";
                document.getElementById('btn-theme-light').className = "py-1.5 px-3 rounded-xl border border-slate-700 bg-slate-800/50 text-gray-300 font-bold transition flex items-center justify-center gap-1";
                
                panels.forEach(p => {
                    if(p) {
                        p.classList.remove('glass-panel-light');
                        p.classList.add('glass-panel-dark');
                    }
                });
            }
            render();
        }

        function setPalette(palKey) {
            currentPaletteKey = palKey;
            COLOR_PALETTE = PALETTES[palKey];
            ALL_COLORS = Object.keys(COLOR_PALETTE);

            ['vibrant', 'pastel', 'neon'].forEach(k => {
                const btn = document.getElementById(`btn-pal-${k}`);
                if (k === palKey) {
                    btn.className = "py-1.5 px-1 rounded-xl border border-indigo-500 bg-indigo-600/20 text-indigo-400 font-bold transition text-center shadow";
                } else {
                    btn.className = "py-1.5 px-1 rounded-xl border border-slate-700 bg-slate-800/50 text-gray-300 font-bold transition text-center";
                }
            });

            currentDots.forEach((dot, index) => {
                const colorKeys = ALL_COLORS.slice(0, pairsCount);
                dot.color = colorKeys[Math.floor(index / 2) % colorKeys.length];
            });
            render();
        }

        async function registerPlayer() {
            const input = document.getElementById('player-nickname').value.trim();
            if (!input) return;

            playerName = input;
            document.getElementById('player-display').innerText = playerName;

            try {
                if (window.fsMethods && window.db) {
                    const { doc, getDoc, setDoc } = window.fsMethods;
                    const playerRef = doc(window.db, "players", playerName);
                    const playerSnap = await getDoc(playerRef);

                    if (playerSnap.exists()) {
                        const data = playerSnap.data();
                        IQ = data.iq || 75;
                        playerScore = data.score || 0;
                    } else {
                        await setDoc(playerRef, { name: playerName, score: 0, iq: 75, updatedAt: new Date() });
                        IQ = 75; playerScore = 0;
                    }
                }
                document.getElementById('iq-value').innerText = IQ;
            } catch (err) { console.error("Erro Firebase:", err); }

            const modal = document.getElementById('auth-modal');
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 300);
            resizeCanvas();
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.style.opacity = '1', 10);
            } else {
                modal.style.opacity = '0';
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        async function openRanking() {
            toggleModal('rank-modal');
            const listEl = document.getElementById('ranking-list');
            listEl.innerHTML = '<p class="text-center text-gray-400">A carregar dados...</p>';

            try {
                if (!window.fsMethods || !window.db) {
                    listEl.innerHTML = '<p class="text-center text-amber-400">Sem conexão com o banco.</p>';
                    return;
                }
                const { collection, query, orderBy, limit, getDocs } = window.fsMethods;
                const q = query(collection(window.db, "players"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                listEl.innerHTML = '';
                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    listEl.innerHTML += `
                        <div class="flex justify-between items-center p-2 rounded-xl bg-gray-800/40 border border-gray-700/50">
                            <span class="font-bold text-amber-400">#${rank} ${item.name}</span>
                            <div class="flex gap-3 text-gray-300">
                                <span>Pts: <b>${item.score}</b></span>
                                <span>QI: <b>${item.iq}</b></span>
                            </div>
                        </div>
                    `;
                    rank++;
                });
            } catch (err) {
                listEl.innerHTML = '<p class="text-center text-red-400">Erro ao carregar ranking.</p>';
            }
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasSize = Math.min(rect.width, rect.height);
            
            canvas.width = canvasSize * dpr; canvas.height = canvasSize * dpr;
            canvas.style.width = canvasSize + 'px'; canvas.style.height = canvasSize + 'px';
            effectCanvas.width = canvasSize * dpr; effectCanvas.height = canvasSize * dpr;
            effectCanvas.style.width = canvasSize + 'px'; effectCanvas.style.height = canvasSize + 'px';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            effectCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cellSize = canvasSize / gridCount;
            render();
        }

        function generateRandomPuzzle() {
            const shuffled = [...ALL_COLORS].sort(() => Math.random() - 0.5).slice(0, pairsCount);
            currentDots = [];
            
            const templates = {
                3: [{x: 1, y: 1}, {x: 4, y: 1}, {x: 1, y: 3}, {x: 4, y: 3}, {x: 1, y: 5}, {x: 4, y: 5}],
                4: [{x: 1, y: 0}, {x: 4, y: 0}, {x: 1, y: 2}, {x: 4, y: 2}, {x: 1, y: 4}, {x: 4, y: 4}, {x: 2, y: 1}, {x: 3, y: 5}],
                5: [{x: 0, y: 0}, {x: 5, y: 0}, {x: 0, y: 1}, {x: 5, y: 1}, {x: 0, y: 2}, {x: 5, y: 2}, {x: 0, y: 3}, {x: 5, y: 3}, {x: 0, y: 4}, {x: 5, y: 4}]
            };

            let coords = templates[pairsCount] || templates[4];
            for(let i = 0; i < pairsCount; i++) {
                currentDots.push({x: coords[i*2].x, y: coords[i*2].y, color: shuffled[i]});
                currentDots.push({x: coords[i*2+1].x, y: coords[i*2+1].y, color: shuffled[i]});
            }

            initNewGameSession();
        }

        function initNewGameSession() {
            paths = {}; currentPath = []; pathHistory = []; isDrawing = false; activeColor = null;
            hintsLeft = 3; document.getElementById('hint-badge').innerText = hintsLeft;
            resizeCanvas();
        }

        function setPairsCount(num) {
            pairsCount = num;
            for (let i = 3; i <= 5; i++) {
                const btn = document.getElementById(`btn-pairs-${i}`);
                btn.className = (i === num) ? "flex-1 py-1 text-[10px] font-bold rounded-md transition bg-indigo-600 text-white shadow" : "flex-1 py-1 text-[10px] font-bold rounded-md transition text-gray-400 hover:text-white";
            }
            generateRandomPuzzle();
        }

        function getCellCoords(pos) { return { x: pos.x * cellSize + cellSize / 2, y: pos.y * cellSize + cellSize / 2 }; }
        function getGridPos(px, py) {
            const x = Math.floor(px / cellSize);
            const y = Math.floor(py / cellSize);
            return (x >= 0 && x < gridCount && y >= 0 && y < gridCount) ? { x, y } : null;
        }
        function getDotAt(x, y) { return currentDots.find(d => d.x === x && d.y === y); }

        function render() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);

            ctx.strokeStyle = currentTheme === 'light' ? 'rgba(0, 0, 0, 0.1)' : '#3d281a';
            ctx.lineWidth = 1.5;
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvasSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(canvasSize, i * cellSize); ctx.stroke();
            }

            Object.keys(paths).forEach(color => drawPathLine(paths[color], color, false));
            if (isDrawing && currentPath.length > 1) drawPathLine(currentPath, activeColor, true);

            currentDots.forEach(dot => {
                const c = getCellCoords(dot);
                const palette = COLOR_PALETTE[dot.color] || { hex: '#fff' };
                ctx.save();
                ctx.shadowColor = palette.hex;
                ctx.shadowBlur = 12;
                ctx.fillStyle = palette.hex;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.28, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.strokeStyle = currentTheme === 'light' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.28, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawPathLine(pathArr, colorKey, isActive) {
            if (!pathArr || pathArr.length < 2) return;
            const palette = COLOR_PALETTE[colorKey] || { hex: '#fff' };
            ctx.save();
            ctx.strokeStyle = palette.hex;
            ctx.lineWidth = cellSize * 0.28;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = palette.hex;
            ctx.shadowBlur = isActive ? 15 : 8;
            ctx.beginPath();
            const start = getCellCoords(pathArr[0]);
            ctx.moveTo(start.x, start.y);
            for (let i = 1; i < pathArr.length; i++) {
                const pt = getCellCoords(pathArr[i]);
                ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function isAdjacent(a, b) {
            const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
            return (dx === 1 && dy === 0) || (dx === 0 && dy === 1);
        }

        canvas.addEventListener('pointerdown', (e) => {
            audio.init(); e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const dot = getDotAt(gPos.x, gPos.y);
            if (dot) {
                if (paths[dot.color]) {
                    pathHistory.push({ type: 'remove', color: dot.color, path: [...paths[dot.color]] });
                    delete paths[dot.color];
                }
                activeColor = dot.color;
                isDrawing = true;
                currentPath = [{ x: gPos.x, y: gPos.y }];
                audio.playPop(400);
                render();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !activeColor) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const lastPt = currentPath[currentPath.length - 1];
            if (lastPt.x === gPos.x && lastPt.y === gPos.y) return;

            if (currentPath.length >= 2) {
                const prev = currentPath[currentPath.length - 2];
                if (prev.x === gPos.x && prev.y === gPos.y) {
                    currentPath.pop(); audio.playPop(350); render(); return;
                }
            }

            if (isAdjacent(lastPt, gPos)) {
                if (currentPath.some(p => p.x === gPos.x && p.y === gPos.y)) { audio.playError(); return; }

                currentPath.push({ x: gPos.x, y: gPos.y });
                audio.playPop(500 + currentPath.length * 20);
                
                const dot = getDotAt(gPos.x, gPos.y);
                if (dot && dot.color === activeColor && currentPath.length > 2) {
                    finishCurrentPath();
                    return;
                }
                render();
            }
        });

        canvas.addEventListener('pointerup', () => { if (isDrawing) finishCurrentPath(); });
        canvas.addEventListener('pointercancel', () => { if (isDrawing) finishCurrentPath(); });

        function finishCurrentPath() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentPath.length >= 2) {
                const first = currentPath[0], last = currentPath[currentPath.length - 1];
                const firstDot = getDotAt(first.x, first.y);
                const lastDot = getDotAt(last.x, last.y);
                
                if (firstDot && lastDot && firstDot.color === activeColor && lastDot.color === activeColor) {
                    paths[activeColor] = [...currentPath];
                    pathHistory.push({ type: 'add', color: activeColor, path: [...currentPath] });
                    audio.playConnect();
                    setTimeout(checkWin, 200);
                } else { audio.playError(); }
            } else { audio.playError(); }
            currentPath = []; activeColor = null; render();
        }

        function undo() {
            if (pathHistory.length === 0) return;
            const last = pathHistory.pop();
            if (last.type === 'add') delete paths[last.color];
            else if (last.type === 'remove') paths[last.color] = last.path;
            audio.playUndo(); render();
        }

        function useHint() {
            if (hintsLeft <= 0) return;
            const colors = [...new Set(currentDots.map(d => d.color))];
            const unsolved = colors.filter(c => !paths[c] || paths[c].length < 2);
            if (unsolved.length === 0) return;

            const color = unsolved[0];
            const dotPair = currentDots.filter(d => d.color === color);
            if (dotPair.length === 2) {
                paths[color] = [{x: dotPair[0].x, y: dotPair[0].y}, {x: dotPair[1].x, y: dotPair[1].y}];
                hintsLeft--;
                document.getElementById('hint-badge').innerText = hintsLeft;
                audio.playHint();
                render();
                setTimeout(checkWin, 200);
            }
        }

        function triggerDirectWin() {
            const colors = [...new Set(currentDots.map(d => d.color))];
            colors.forEach(c => {
                const pair = currentDots.filter(d => d.color === c);
                if(pair.length === 2) paths[c] = [{x: pair[0].x, y: pair[0].y}, {x: pair[1].x, y: pair[1].y}];
            });
            render();
            checkWin();
        }

        async function checkWin() {
            const colors = [...new Set(currentDots.map(d => d.color))];
            let allConnected = true;
            for (const c of colors) {
                if (!paths[c] || paths[c].length < 2) { allConnected = false; break; }
            }
            if (!allConnected) return;

            const finalScore = 120;
            audio.playWin();
            IQ = Math.min(180, IQ + 12);
            document.getElementById('iq-value').innerText = IQ;
            playerScore += finalScore;

            try {
                if (window.fsMethods && window.db) {
                    const { doc, updateDoc } = window.fsMethods;
                    const playerRef = doc(window.db, "players", playerName);
                    await updateDoc(playerRef, { score: playerScore, iq: IQ, updatedAt: new Date() });
                }
            } catch (err) { console.error("Erro no update do Firestore:", err); }

            document.getElementById('win-score-display').innerText = finalScore;
            setTimeout(() => {
                const modal = document.getElementById('win-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.style.opacity = '1', 10);
            }, 300);
        }

        document.getElementById('btn-reset').addEventListener('click', initNewGameSession);
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-hint').addEventListener('click', useHint);
        document.getElementById('btn-new-random').addEventListener('click', generateRandomPuzzle);
        document.getElementById('btn-next-random').addEventListener('click', () => {
            const modal = document.getElementById('win-modal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.classList.add('hidden'); generateRandomPuzzle(); }, 300);
        });

        window.addEventListener('resize', () => resizeCanvas());
        generateRandomPuzzle();
    </script>
</body>
</html>
