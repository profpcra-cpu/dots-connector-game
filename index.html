<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Master: Link the Dots - 6x6 Randômico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.theme-cyber {
            background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%);
            color: #cdd6f4;
        }
        body.theme-cyber .glass-panel {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.theme-cyber .board-frame {
            background: #2b1d12;
            border: 10px solid #5c3d2e;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
        }

        .glass-panel {
            backdrop-filter: blur(12px);
            border-radius: 20px;
        }
        .board-frame {
            border-radius: 20px;
            transition: all 0.4s ease;
        }
        .iq-progress {
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-bg {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="theme-cyber flex flex-col items-center justify-between h-screen p-3 md:p-6 select-none overflow-hidden">

    <!-- Header -->
    <header class="w-full max-w-md flex flex-col items-center gap-2.5 glass-panel p-3.5 shadow-xl">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-indigo-600/30 rounded-xl flex items-center justify-center text-indigo-400 font-bold text-lg border border-indigo-500/30">
                    <i class="fa-solid fa-dice"></i>
                </div>
                <div>
                    <h1 class="text-xs text-gray-400 font-semibold tracking-wider">MODO <span class="text-white text-base">RANDÔMICO 6x6</span></h1>
                    <p id="level-mode-desc" class="text-[11px] text-indigo-400 font-medium">4 Pares de Cores</p>
                </div>
            </div>

            <div class="bg-gradient-to-r from-amber-500 to-orange-600 px-3 py-1.5 rounded-xl shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-brain text-white text-base"></i>
                <div class="flex flex-col">
                    <span class="text-[9px] text-amber-100 uppercase tracking-wider font-bold">QI</span>
                    <span id="iq-value" class="text-base font-black text-white leading-none">75</span>
                </div>
            </div>
        </div>

        <!-- Seletor de Dificuldade/Pares -->
        <div class="w-full flex items-center justify-between gap-1 bg-gray-900/40 p-1 rounded-xl border border-gray-700/40">
            <button onclick="setPairsCount(3)" id="btn-pairs-3" class="flex-1 py-1 text-xs font-bold rounded-lg transition bg-indigo-600 text-white">3 Pares</button>
            <button onclick="setPairsCount(4)" id="btn-pairs-4" class="flex-1 py-1 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white">4 Pares</button>
            <button onclick="setPairsCount(5)" id="btn-pairs-5" class="flex-1 py-1 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white">5 Pares</button>
        </div>

        <div class="w-full flex justify-between items-center px-1">
            <span class="text-[10px] text-gray-400 font-semibold">Vitórias: <span id="wins-text" class="text-white">0</span></span>
            <span id="moves-counter" class="text-[10px] text-gray-400 font-semibold">Movimentos: <span class="text-white">0</span></span>
        </div>
    </header>

    <!-- Canvas -->
    <main class="relative flex-1 w-full max-w-md my-2 flex items-center justify-center">
        <div class="board-frame relative w-full aspect-square max-w-[380px] max-h-[380px] p-2.5 flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full rounded-xl cursor-pointer touch-none"></canvas>
            <canvas id="effectCanvas" class="absolute inset-0 w-full h-full pointer-events-none rounded-xl"></canvas>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md glass-panel p-3 shadow-xl flex items-center justify-around gap-2">
        <button id="btn-reset" class="flex-1 py-2 px-2 bg-gray-800/40 hover:bg-gray-700/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700/50">
            <i class="fa-solid fa-rotate-left text-amber-400 text-base"></i>
            <span class="text-[10px] font-semibold text-gray-300">Reiniciar</span>
        </button>

        <button id="btn-undo" class="flex-1 py-2 px-2 bg-gray-800/40 hover:bg-gray-700/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700/50">
            <i class="fa-solid fa-arrow-rotate-left text-blue-400 text-base"></i>
            <span class="text-[10px] font-semibold text-gray-300">Desfazer</span>
        </button>

        <button id="btn-hint" class="flex-1 py-2 px-2 bg-indigo-950/40 hover:bg-indigo-900/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-indigo-500/40 relative">
            <span id="hint-badge" class="absolute -top-1 -right-1 bg-indigo-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-gray-900">3</span>
            <i class="fa-solid fa-lightbulb text-yellow-300 text-base"></i>
            <span class="text-[10px] font-semibold text-indigo-200">Dica</span>
        </button>

        <button id="btn-new-random" class="flex-1 py-2 px-2 bg-emerald-950/40 hover:bg-emerald-900/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-emerald-500/40">
            <i class="fa-solid fa-shuffle text-emerald-300 text-base"></i>
            <span class="text-[10px] font-semibold text-emerald-200">Novo Jogo</span>
        </button>
    </footer>

    <!-- Toast de feedback -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl font-semibold text-sm shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-[60]"></div>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-gray-900/90 border border-indigo-500/30 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center text-3xl text-gray-900 shadow-lg shadow-amber-500/30 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h2 class="text-xl font-extrabold text-white">Incrível! Puzzle Resolvido! 🎉</h2>
                <p class="text-xs text-gray-300 mt-1" id="win-subtitle">Conexões perfeitas realizadas no 6x6!</p>
            </div>
            <button id="btn-next-random" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">
                Gerar Novo Desafio <i class="fa-solid fa-shuffle ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        // ===== CONFIGURAÇÃO DE ÁUDIO =====
        class SoundEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() { 
                if (!this.ctx) {
                    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } 
                    catch(e) { this.enabled = false; }
                }
            }
            playTone(freq, duration = 0.08, type = 'sine', volume = 0.15) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPop(freq = 440) { this.playTone(freq, 0.08, 'sine', 0.15); }
            playConnect() { this.playTone(600, 0.1, 'triangle', 0.12); }
            playError() { this.playTone(200, 0.15, 'sawtooth', 0.1); }
            playHint() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.playTone(f, 0.12, 'sine', 0.12), i * 80)); }
            playWin() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.playTone(f, 0.15, 'triangle', 0.15), i * 100)); }
            playUndo() { this.playTone(300, 0.1, 'sine', 0.1); }
        }
        const audio = new SoundEngine();

        const COLOR_PALETTE = {
            red:     { hex: '#ef4444' },
            blue:    { hex: '#3b82f6' },
            green:   { hex: '#22c55e' },
            yellow:  { hex: '#eab308' },
            purple:  { hex: '#a855f7' },
            orange:  { hex: '#f97316' },
            cyan:    { hex: '#06b6d4' },
            pink:    { hex: '#ec4899' }
        };
        const ALL_COLORS = Object.keys(COLOR_PALETTE);

        // ===== ESTADO DO JOGO =====
        const gridCount = 6;
        let pairsCount = 4;
        let cellSize = 0;
        let canvasSize = 0;
        let activeColor = null;
        let isDrawing = false;
        let paths = {};
        let currentPath = [];
        let pathHistory = [];
        let hintsLeft = 3;
        let movesCount = 0;
        let winsCount = 0;
        let IQ = 75;
        let currentDots = [];
        let currentSolution = null;
        let particles = [];
        let animationFrame = null;
        let previousBoards = [];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const effectCanvas = document.getElementById('effectCanvas');
        const effectCtx = effectCanvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = rect.width, h = rect.height;
            canvasSize = Math.min(w, h);
            
            canvas.width = canvasSize * dpr; canvas.height = canvasSize * dpr;
            canvas.style.width = canvasSize + 'px'; canvas.style.height = canvasSize + 'px';
            effectCanvas.width = canvasSize * dpr; effectCanvas.height = canvasSize * dpr;
            effectCanvas.style.width = canvasSize + 'px'; effectCanvas.style.height = canvasSize + 'px';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            effectCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cellSize = canvasSize / gridCount;
            render();
        }

        // ===== GERADOR RANDÔMICO COM VALIDAÇÃO DE SOLUÇÃO =====
        function generateRandomPuzzle() {
            let attempts = 0;
            while (attempts < 300) {
                attempts++;
                const shuffledColors = [...ALL_COLORS].sort(() => Math.random() - 0.5).slice(0, pairsCount);
                const availableCells = [];
                for (let y = 0; y < gridCount; y++) {
                    for (let x = 0; x < gridCount; x++) {
                        availableCells.push({ x, y });
                    }
                }
                availableCells.sort(() => Math.random() - 0.5);

                const dots = [];
                let validPlacement = true;
                for (let color of shuffledColors) {
                    if (availableCells.length < 2) { validPlacement = false; break; }
                    const p1 = availableCells.pop();
                    const p2 = availableCells.pop();
                    dots.push({ x: p1.x, y: p1.y, color });
                    dots.push({ x: p2.x, y: p2.y, color });
                }

                if (!validPlacement) continue;

                // Evitar repetição exata em relação às jogadas anteriores
                const boardSignature = JSON.stringify(dots.map(d => `${d.x},${d.y}:${d.color}`).sort());
                if (previousBoards.includes(boardSignature)) continue;

                // Testar se o tabuleiro gerado possui solução válida respeitando bloqueio de bolinhas
                const solution = solveLevelForDots(dots);
                if (solution) {
                    previousBoards.push(boardSignature);
                    if (previousBoards.length > 15) previousBoards.shift();
                    currentDots = dots;
                    currentSolution = solution;
                    initNewGameSession();
                    return;
                }
            }
            // Fallback caso demore
            generateRandomPuzzleDirectFallback();
        }

        function generateRandomPuzzleDirectFallback() {
            const shuffledColors = [...ALL_COLORS].sort(() => Math.random() - 0.5).slice(0, pairsCount);
            currentDots = [
                {x:0, y:0, color: shuffledColors[0]}, {x:5, y:5, color: shuffledColors[0]},
                {x:5, y:0, color: shuffledColors[1]}, {x:0, y:5, color: shuffledColors[1]},
                {x:2, y:2, color: shuffledColors[2]}, {x:3, y:3, color: shuffledColors[2]}
            ];
            if (pairsCount >= 4) {
                currentDots.push({x:1, y:4, color: shuffledColors[3]}, {x:4, y:1, color: shuffledColors[3]});
            }
            if (pairsCount >= 5) {
                currentDots.push({x:2, y:4, color: shuffledColors[4]}, {x:4, y:2, color: shuffledColors[4]});
            }
            currentSolution = solveLevelForDots(currentDots);
            initNewGameSession();
        }

        function initNewGameSession() {
            paths = {};
            currentPath = [];
            pathHistory = [];
            isDrawing = false;
            activeColor = null;
            hintsLeft = 3;
            movesCount = 0;
            particles = [];
            document.getElementById('level-mode-desc').innerText = `${pairsCount} Pares de Cores • Matriz 6x6`;
            document.getElementById('moves-counter').innerHTML = `Movimentos: <span class="text-white">0</span>`;
            document.getElementById('wins-text').innerText = winsCount;
            document.getElementById('hint-badge').innerText = hintsLeft;
            document.getElementById('hint-badge').style.display = 'flex';
            resizeCanvas();
        }

        function setPairsCount(num) {
            pairsCount = num;
            for (let i = 3; i <= 5; i++) {
                const btn = document.getElementById(`btn-pairs-${i}`);
                if (i === num) {
                    btn.className = "flex-1 py-1 text-xs font-bold rounded-lg transition bg-indigo-600 text-white";
                } else {
                    btn.className = "flex-1 py-1 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white";
                }
            }
            generateRandomPuzzle();
        }

        // ===== SOLVER / VALIDADOR LÓGICO =====
        function solveLevelForDots(dots) {
            const size = gridCount;
            const dotMap = {};
            dots.forEach(d => {
                if (!dotMap[d.color]) dotMap[d.color] = [];
                dotMap[d.color].push({ x: d.x, y: d.y });
            });
            const colors = Object.keys(dotMap);
            const solution = {};

            function backtrack(idx, usedGrid) {
                if (idx >= colors.length) return true;
                const color = colors[idx];
                const [start, end] = dotMap[color];
                
                for (const [s, e] of [[start, end], [end, start]]) {
                    const visited = usedGrid.map(row => row.map(v => v !== false && v !== color ? true : false));
                    for (let y = 0; y < size; y++) {
                        for (let x = 0; x < size; x++) {
                            const c = usedGrid[y][x];
                            if (c !== false && c !== color) visited[y][x] = true;
                        }
                    }
                    visited[s.y][s.x] = true;
                    const path = [{ x: s.x, y: s.y }];
                    
                    function dfs(cx, cy) {
                        if (cx === e.x && cy === e.y) return true;
                        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                        for (const [dx, dy] of dirs) {
                            const nx = cx + dx, ny = cy + dy;
                            if (nx < 0 || nx >= size || ny < 0 || ny >= size) continue;
                            if (visited[ny][nx]) continue;
                            const cell = usedGrid[ny][nx];
                            if (cell !== false && cell !== color) continue;
                            if (cell === color && !(nx === e.x && ny === e.y)) continue;
                            
                            visited[ny][nx] = true;
                            path.push({ x: nx, y: ny });
                            if (dfs(nx, ny)) return true;
                            path.pop();
                            visited[ny][nx] = false;
                        }
                        return false;
                    }
                    
                    if (dfs(s.x, s.y)) {
                        const newGrid = usedGrid.map(row => [...row]);
                        path.forEach(p => { newGrid[p.y][p.x] = color; });
                        solution[color] = [...path];
                        if (backtrack(idx + 1, newGrid)) return true;
                        delete solution[color];
                    }
                }
                return false;
            }

            const gridColors = Array.from({ length: size }, () => Array(size).fill(false));
            dots.forEach(d => gridColors[d.y][d.x] = d.color);

            if (backtrack(0, gridColors)) return solution;
            return null;
        }

        // ===== RENDERIZAÇÃO DO TABULEIRO =====
        function getCellCoords(pos) {
            return { x: pos.x * cellSize + cellSize / 2, y: pos.y * cellSize + cellSize / 2 };
        }
        function getGridPos(px, py) {
            const x = Math.floor(px / cellSize);
            const y = Math.floor(py / cellSize);
            return (x >= 0 && x < gridCount && y >= 0 && y < gridCount) ? { x, y } : null;
        }
        function getDotAt(x, y) {
            return currentDots.find(d => d.x === x && d.y === y);
        }

        function render() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);

            // Grade 6x6
            ctx.strokeStyle = '#3d281a';
            ctx.lineWidth = 1.5;
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvasSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(canvasSize, i * cellSize); ctx.stroke();
            }

            // Linhas desenhadas
            Object.keys(paths).forEach(color => {
                drawPathLine(paths[color], color, false);
            });
            if (isDrawing && currentPath.length > 1) {
                drawPathLine(currentPath, activeColor, true);
            }

            // Bolinhas (Obstáculos Intransponíveis)
            currentDots.forEach(dot => {
                const c = getCellCoords(dot);
                const palette = COLOR_PALETTE[dot.color];
                
                ctx.save();
                ctx.shadowColor = palette.hex;
                ctx.shadowBlur = 12;
                ctx.fillStyle = palette.hex;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.30, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.30, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(c.x - cellSize * 0.08, c.y - cellSize * 0.08, cellSize * 0.06, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawPathLine(pathArr, colorKey, isActive) {
            if (!pathArr || pathArr.length < 2) return;
            const palette = COLOR_PALETTE[colorKey] || { hex: '#fff' };
            ctx.save();
            ctx.strokeStyle = palette.hex;
            ctx.lineWidth = cellSize * 0.30;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = palette.hex;
            ctx.shadowBlur = isActive ? 15 : 8;
            ctx.beginPath();
            const start = getCellCoords(pathArr[0]);
            ctx.moveTo(start.x, start.y);
            for (let i = 1; i < pathArr.length; i++) {
                const pt = getCellCoords(pathArr[i]);
                ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function spawnParticles(x, y, colorKey, count = 12) {
            const palette = COLOR_PALETTE[colorKey];
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = 2 + Math.random() * 3;
                particles.push({
                    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
                    size: 3 + Math.random() * 4, color: palette.hex, life: 1
                });
            }
            if (!animationFrame) animationFrame = requestAnimationFrame(renderEffects);
        }

        function renderEffects() {
            effectCtx.clearRect(0, 0, canvasSize, canvasSize);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                effectCtx.save();
                effectCtx.globalAlpha = p.life;
                effectCtx.fillStyle = p.color;
                effectCtx.beginPath();
                effectCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                effectCtx.fill();
                effectCtx.restore();
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
            });
            if (particles.length > 0) animationFrame = requestAnimationFrame(renderEffects);
            else animationFrame = null;
        }

        // ===== REGRAS DE MOVIMENTO RIGOROSAS (Bolinhas Bloqueiam) =====
        function isAdjacent(a, b) {
            const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
            return (dx === 1 && dy === 0) || (dx === 0 && dy === 1);
        }

        function canMoveTo(x, y, colorKey) {
            if (x < 0 || x >= gridCount || y < 0 || y >= gridCount) return false;
            
            // REGRA: QUALQUER BOLINHA BLOQUEIA O CAMINHO (exceto os próprios endpoints da cor ativa no início/fim)
            const dot = getDotAt(x, y);
            if (dot && dot.color !== colorKey) return false;
            
            return true;
        }

        // ===== INTERAÇÃO DE TOQUE / MOUSE =====
        canvas.addEventListener('pointerdown', (e) => {
            audio.init(); e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const dot = getDotAt(gPos.x, gPos.y);
            if (dot) {
                if (paths[dot.color]) {
                    pathHistory.push({ type: 'remove', color: dot.color, path: [...paths[dot.color]] });
                    delete paths[dot.color];
                }
                activeColor = dot.color;
                isDrawing = true;
                currentPath = [{ x: gPos.x, y: gPos.y }];
                audio.playPop(400);
                render();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !activeColor) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const lastPt = currentPath[currentPath.length - 1];
            if (lastPt.x === gPos.x && lastPt.y === gPos.y) return;

            if (currentPath.length >= 2) {
                const prev = currentPath[currentPath.length - 2];
                if (prev.x === gPos.x && prev.y === gPos.y) {
                    currentPath.pop(); audio.playPop(350); render(); return;
                }
            }

            if (isAdjacent(lastPt, gPos)) {
                if (canMoveTo(gPos.x, gPos.y, activeColor)) {
                    const dot = getDotAt(gPos.x, gPos.y);
                    if (dot && dot.color === activeColor) {
                        if (currentPath.length > 1) {
                            currentPath.push({ x: gPos.x, y: gPos.y });
                            audio.playConnect();
                            finishCurrentPath();
                            return;
                        }
                    } else if (!dot) {
                        currentPath.push({ x: gPos.x, y: gPos.y });
                        audio.playPop(500 + currentPath.length * 20);
                    }
                    render();
                } else {
                    audio.playError();
                }
            }
        });

        canvas.addEventListener('pointerup', () => { if (isDrawing) finishCurrentPath(); });
        canvas.addEventListener('pointercancel', () => { if (isDrawing) finishCurrentPath(); });

        function finishCurrentPath() {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (currentPath.length > 1) {
                const first = currentPath[0], last = currentPath[currentPath.length - 1];
                const firstDot = getDotAt(first.x, first.y);
                const lastDot = getDotAt(last.x, last.y);
                
                if (firstDot && lastDot && firstDot.color === activeColor && lastDot.color === activeColor) {
                    paths[activeColor] = [...currentPath];
                    pathHistory.push({ type: 'add', color: activeColor, path: [...currentPath] });
                    movesCount++;
                    document.getElementById('moves-counter').innerHTML = `Movimentos: <span class="text-white">${movesCount}</span>`;
                    
                    const endCoords = getCellCoords(last);
                    spawnParticles(endCoords.x, endCoords.y, activeColor, 15);
                    audio.playConnect();
                    setTimeout(checkWin, 200);
                } else {
                    audio.playError();
                }
            }
            currentPath = []; activeColor = null; render();
        }

        function undo() {
            if (pathHistory.length === 0) return;
            const last = pathHistory.pop();
            if (last.type === 'add') delete paths[last.color];
            else if (last.type === 'remove') paths[last.color] = last.path;
            audio.playUndo(); render();
        }

        function useHint() {
            if (hintsLeft <= 0 || !currentSolution) return;
            const unsolved = currentDots.map(d => d.color).filter(c => {
                const p = paths[c];
                if (!p) return true;
                const f = getDotAt(p[0].x, p[0].y), l = getDotAt(p[p.length-1].x, p[p.length-1].y);
                return !(f && l && f.color === c && l.color === c);
            });
            if (unsolved.length === 0) return;

            const color = unsolved[Math.floor(Math.random() * unsolved.length)];
            const solPath = currentSolution[color];
            if (!solPath) return;

            paths[color] = [];
            hintsLeft--;
            document.getElementById('hint-badge').innerText = hintsLeft;
            audio.playHint();

            let i = 0;
            const anim = () => {
                if (i < solPath.length) {
                    paths[color].push(solPath[i]); render(); i++; setTimeout(anim, 70);
                } else {
                    movesCount++;
                    document.getElementById('moves-counter').innerHTML = `Movimentos: <span class="text-white">${movesCount}</span>`;
                    const end = getCellCoords(solPath[solPath.length - 1]);
                    spawnParticles(end.x, end.y, color, 15);
                    setTimeout(checkWin, 200);
                }
            };
            anim();
        }

        function checkWin() {
            const colors = [...new Set(currentDots.map(d => d.color))];
            let allConnected = true;
            for (const c of colors) {
                if (!paths[c] || paths[c].length < 2) { allConnected = false; break; }
                const f = getDotAt(paths[c][0].x, paths[c][0].y);
                const l = getDotAt(paths[c][paths[c].length-1].x, paths[c][paths[c].length-1].y);
                if (!f || !l || f.color !== c || l.color !== c) { allConnected = false; break; }
            }
            if (!allConnected) return;

            audio.playWin();
            winsCount++;
            IQ = Math.min(180, IQ + 12);
            document.getElementById('iq-value').innerText = IQ;
            document.getElementById('iq-progress').style.width = Math.min(100, ((IQ - 75) / (180 - 75)) * 100) + '%';

            setTimeout(() => {
                const modal = document.getElementById('win-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.style.opacity = '1', 10);
            }, 400);
        }

        // Eventos UI
        document.getElementById('btn-reset').addEventListener('click', initNewGameSession);
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-hint').addEventListener('click', useHint);
        document.getElementById('btn-new-random').addEventListener('click', generateRandomPuzzle);
        document.getElementById('btn-next-random').addEventListener('click', () => {
            const modal = document.getElementById('win-modal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.classList.add('hidden');
                generateRandomPuzzle();
            }, 300);
        });

        window.addEventListener('resize', () => resizeCanvas());

        // Iniciar
        generateRandomPuzzle();
    </script>
</body>
</html>
