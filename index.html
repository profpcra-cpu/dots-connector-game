<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link the Balls - Ultimate Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .wood-board {
            background: linear-gradient(135deg, #deb887 0%, #c49a6c 50%, #b58351 100%);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4), inset 0 3px 6px rgba(255,255,255,0.5), inset 0 -4px 8px rgba(0,0,0,0.3);
            border: 8px solid #7d4e24;
        }
        .btn-game {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-game:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }
        .btn-game:active {
            transform: translateY(1px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-900 h-screen text-white flex flex-col items-center justify-between py-2 px-3 sm:p-4 overflow-hidden">

    <!-- Header & Profile Bar -->

            <button onclick="app.showLevelSelect()" class="bg-amber-600/90 hover:bg-amber-500 px-3 py-1.5 rounded-xl font-bold shadow-md flex items-center gap-2 text-xs sm:text-sm btn-game border border-amber-400/40">
                <i class="fa-solid fa-list-ul"></i> Níveis
            </button>
            
            <!-- User Profile Button -->
            <button onclick="app.showProfileModal()" class="bg-slate-800/90 hover:bg-slate-700 px-3 py-1.5 rounded-xl font-bold shadow-md flex items-center gap-2 text-xs border border-purple-500/40 btn-game">
                <span id="header-avatar" class="text-base">🦊</span>
                <span id="header-username" class="text-amber-300 truncate max-w-[90px]">Jogador</span>
                <i class="fa-solid fa-pen text-[10px] text-slate-400"></i>
            </button>

            <button onclick="app.restartLevel()" class="bg-rose-600/90 hover:bg-rose-500 px-3 py-1.5 rounded-xl font-bold shadow-md flex items-center gap-2 text-xs sm:text-sm btn-game border border-rose-400/40">
                <i class="fa-solid fa-rotate-right"></i> Reiniciar
            </button>
        </div>

        <!-- IQ & Score Meter Card -->
        <div class="w-full bg-slate-900/80 backdrop-blur-md border border-purple-500/30 rounded-xl p-2.5 shadow-xl flex flex-col gap-1">
            <div class="flex justify-between text-xs font-bold text-purple-200 px-1 items-center">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-brain text-pink-400"></i> QI: <strong id="iq-score" class="text-amber-400 text-sm">75</strong></span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-star text-amber-300"></i> Score: <strong id="total-score" class="text-cyan-300 text-sm">0</strong></span>
            </div>
            <div class="relative w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 shadow-inner border border-slate-700">
                <div id="iq-bar" class="bg-gradient-to-r from-rose-500 via-amber-400 to-emerald-400 h-full rounded-full transition-all duration-700" style="width: 0%;"></div>
            </div>
            <div class="flex justify-between text-[10px] text-slate-400 font-semibold px-1">
                <span id="iq-title">Iniciante Curioso</span>
                <span>Meta: 180 (Einstein)</span>

        </div>
    </header>

    <!-- Main Game Board -->
    <main class="relative w-full max-w-[280px] sm:max-w-[310px] aspect-square flex items-center justify-center my-auto shrink-0">
        <div class="wood-board w-full h-full rounded-2xl p-2.5 sm:p-3 relative flex items-center justify-center shadow-2xl">
            <div class="relative w-full h-full bg-slate-100 rounded-xl overflow-hidden shadow-inner cursor-crosshair border border-amber-900/20">
                <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            </div>
        </div>

        <!-- Success Modal Overlay -->

                <p id="success-message" class="text-xs text-slate-300 mb-4">+20 Pontos de QI Adicionados!</p>
                <button onclick="app.nextLevel()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-bold rounded-xl shadow-lg text-white btn-game flex items-center justify-center gap-2 text-sm">

    </main>

    <!-- Footer Controls -->

            <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-base"></i> Solução
        </button>
    </footer>

    <!-- Level Selection Modal -->
    <div id="level-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-purple-500/40 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">

                <button onclick="app.hideLevelSelect()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition-colors">

                </button>
            </div>
            <div id="level-grid" class="grid grid-cols-3 gap-3.5 py-2 max-h-64 overflow-y-auto px-1"></div>
        </div>
    </div>

    <!-- User Profile & Registration Modal -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-purple-500/40 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-lg font-bold text-amber-300 flex items-center gap-2"><i class="fa-solid fa-user-pen"></i> Perfil do Jogador</h2>
                <button onclick="app.hideProfileModal()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="flex flex-col gap-3 py-2">
                <label class="text-xs text-slate-300 font-semibold">Seu Nome:</label>
                <input type="text" id="input-username" maxlength="15" class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-bold outline-none focus:border-amber-400 transition-colors" placeholder="Digite seu nome...">
                
                <label class="text-xs text-slate-300 font-semibold mt-1">Escolha seu Avatar:</label>
                <div class="grid grid-cols-5 gap-2" id="avatar-selector">
                    <!-- Avatars injected via JS -->

            </div>
            <button onclick="app.saveProfile()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg btn-game mt-2">
                Salvar Perfil
            </button>
        </div>

        class SoundManager {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = AudioContext ? new AudioContext() : null;
            }
            playTone(freq, type, duration) {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            connect() { this.playTone(580, 'sine', 0.15); }
            win() {
                if (!this.ctx) return;
                setTimeout(() => this.playTone(440, 'triangle', 0.15), 0);
                setTimeout(() => this.playTone(554, 'triangle', 0.15), 150);
                setTimeout(() => this.playTone(659, 'triangle', 0.3), 300);
            }
            hint() { this.playTone(350, 'sine', 0.2); }
        }

        class LinkPuzzleGame {
            constructor() {
                this.currentLevelIndex = 0;
                this.iqScore = parseInt(localStorage.getItem('link_balls_iq')) || 75;
                this.totalScore = parseInt(localStorage.getItem('link_balls_score')) || 0;
                this.completedLevels = JSON.parse(localStorage.getItem('link_balls_completed')) || [0];
                this.username = localStorage.getItem('link_balls_username') || 'Jogador';
                this.avatar = localStorage.getItem('link_balls_avatar') || '🦊';

                this.userPaths = {};
                this.completedPairs = new Set();
                this.activePair = null;
                this.currentPathPoints = [];

                this.sound = new SoundManager();
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.initCanvasSize();
                this.setupEventListeners();
                this.updateProfileUI();
                this.loadLevel(this.currentLevelIndex);
                this.updateIQDisplay();
                this.renderLevelGrid();
                this.setupAvatarSelector();

                if (!localStorage.getItem('link_balls_username')) {
                    setTimeout(() => this.showProfileModal(), 500);
                }
            }

            initCanvasSize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.width = rect.width;
                this.height = rect.height;
            }

            loadLevel(index) {
                this.currentLevelIndex = index;
                this.userPaths = {};
                this.completedPairs = new Set();
                this.activePair = null;
                this.currentPathPoints = [];

                document.getElementById('success-modal').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('success-card').classList.remove('scale-100');
                document.getElementById('success-card').classList.add('scale-95');
                this.redraw();
            }

            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.initCanvasSize();
                    this.redraw();
                });

                const startHandler = (e) => {
                    const pos = this.getEventPos(e);
                    const dot = this.findDotAt(pos.x, pos.y);
                    if (dot) {
                        for (let [key, path] of Object.entries(this.userPaths)) {
                            const [id1, id2] = key.split('-').map(Number);
                            if (id1 === dot.id || id2 === dot.id) {
                                delete this.userPaths[key];
                                this.completedPairs.delete(key);
                            }
                        }

                        const level = levels[this.currentLevelIndex];
                        const pairMatch = level.dots.find(d => d.color === dot.color && d.id !== dot.id);
                        if (pairMatch) {
                            this.activePair = {
                                color: dot.color,
                                fromDot: dot,
                                targetDotId: pairMatch.id
                            };
                            this.currentPathPoints = [{x: dot.x, y: dot.y}];
                        }
                    }
                };

                const moveHandler = (e) => {
                    if (!this.activePair) return;
                    e.preventDefault();
                    const pos = this.getEventPos(e);
                    const nx = Math.max(0.06, Math.min(0.94, pos.x / this.width));
                    const ny = Math.max(0.06, Math.min(0.94, pos.y / this.height));

                    this.currentPathPoints.push({x: nx, y: ny});
                    this.redraw();
                };

                const endHandler = (e) => {
                    if (!this.activePair) return;
                    const pos = this.getEventPos(e);
                    const dot = this.findDotAt(pos.x, pos.y);

                    if (dot && dot.id === this.activePair.targetDotId) {
                        this.currentPathPoints.push({x: dot.x, y: dot.y});
                        const key = [this.activePair.fromDot.id, dot.id].sort((a,b)=>a-b).join('-');
                        this.userPaths[key] = [...this.currentPathPoints];
                        this.completedPairs.add(key);
                        this.sound.connect();
                        this.checkWinCondition();
                    }

                    this.activePair = null;
                    this.currentPathPoints = [];
                    this.redraw();
                };

                this.canvas.addEventListener('mousedown', startHandler);
                this.canvas.addEventListener('mousemove', moveHandler);
                window.addEventListener('mouseup', endHandler);

                this.canvas.addEventListener('touchstart', startHandler, {passive: false});
                this.canvas.addEventListener('touchmove', moveHandler, {passive: false});
                window.addEventListener('touchend', endHandler);
            }

            getEventPos(e) {
                const rect = this.canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            findDotAt(x, y) {
                const level = levels[this.currentLevelIndex];
                const threshold = 35;
                for (let dot of level.dots) {
                    const dx = dot.x * this.width - x;
                    const dy = dot.y * this.height - y;
                    if (Math.sqrt(dx*dx + dy*dy) <= threshold) {
                        return dot;
                    }
                }
                return null;
            }

            redraw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                const level = levels[this.currentLevelIndex];

                for (let [key, path] of Object.entries(this.userPaths)) {
                    if (path.length < 2) continue;
                    const firstDot = level.dots.find(d => d.id === Number(key.split('-')[0]));
                    this.drawPathLine(path, firstDot ? firstDot.color : '#64748b', 12);
                }

                if (this.activePair && this.currentPathPoints.length > 1) {
                    this.drawPathLine(this.currentPathPoints, this.activePair.color, 12, true);
                }

                for (let dot of level.dots) {
                    this.drawDot(dot);
                }
            }

            drawPathLine(points, color, width, dashed = false) {
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.moveTo(points[0].x * this.width, points[0].y * this.height);
                for (let i = 1; i < points.length; i++) {
                    this.ctx.lineTo(points[i].x * this.width, points[i].y * this.height);
                }
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = width;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                if (dashed) {
                    this.ctx.setLineDash([8, 6]);
                }
                this.ctx.shadowColor = 'rgba(0,0,0,0.25)';
                this.ctx.shadowBlur = 5;
                this.ctx.stroke();
                this.ctx.restore();
            }

            drawDot(dot) {
                const x = dot.x * this.width;
                const y = dot.y * this.height;
                const radius = 20;

                this.ctx.save();
                this.ctx.shadowColor = 'rgba(0,0,0,0.35)';
                this.ctx.shadowBlur = 6;
                this.ctx.shadowOffsetY = 3;

                const gradient = this.ctx.createRadialGradient(x - 5, y - 5, 3, x, y, radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.35, dot.color);
                gradient.addColorStop(1, this.darkenColor(dot.color, 45));

                this.ctx.beginPath();
                this.ctx.arc(x, y, radius, 0, Math.PI * 2);
                this.ctx.fillStyle = gradient;
                this.ctx.fill();

                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                this.ctx.stroke();
                this.ctx.restore();
            }

            darkenColor(hex, percent) {
                let num = parseInt(hex.replace('#',''), 16);
                let amt = Math.round(2.55 * percent);
                let R = (num >> 16) - amt;
                let G = (num >> 8 & 0x00ff) - amt;
                let B = (num & 0x0000ff) - amt;
                return `#${(0x1000000 + (R<0?0:R)*0x10000 + (G<0?0:G)*0x100 + (B<0?0:B)).toString(16).slice(1)}`;
            }

            checkWinCondition() {
                const level = levels[this.currentLevelIndex];
                const totalPairs = level.dots.length / 2;
                if (this.completedPairs.size === totalPairs) {
                    this.iqScore = Math.min(180, this.iqScore + 20);
                    this.totalScore += 100 * level.id;
                    this.updateIQDisplay();
                    localStorage.setItem('link_balls_iq', this.iqScore);
                    localStorage.setItem('link_balls_score', this.totalScore);

                    if (!this.completedLevels.includes(this.currentLevelIndex + 1) && this.currentLevelIndex + 1 < levels.length) {
                        this.completedLevels.push(this.currentLevelIndex + 1);
                        localStorage.setItem('link_balls_completed', JSON.stringify(this.completedLevels));
                    }
                    this.renderLevelGrid();
                    this.sound.win();

                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });

                    setTimeout(() => {
                        const modal = document.getElementById('success-modal');
                        modal.classList.remove('opacity-0', 'pointer-events-none');
                        const card = document.getElementById('success-card');
                        card.classList.remove('scale-95');
                        card.classList.add('scale-100');
                    }, 400);
                }
            }

            updateIQDisplay() {
                document.getElementById('iq-score').innerText = this.iqScore;
                document.getElementById('total-score').innerText = this.totalScore;
                const percentage = ((this.iqScore - 75) / (180 - 75)) * 100;
                document.getElementById('iq-bar').style.width = `${Math.max(4, Math.min(100, percentage))}%`;

                let title = "Iniciante Curioso";
                if (this.iqScore >= 110) title = "Mente Brilhante";
                if (this.iqScore >= 145) title = "Gênio Absoluto (Einstein)";
                document.getElementById('iq-title').innerText = title;
            }

            giveHint() {
                const level = levels[this.currentLevelIndex];
                for (let conn of level.connections) {
                    const key = [conn.from, conn.to].sort((a,b)=>a-b).join('-');
                    if (!this.completedPairs.has(key)) {
                        this.userPaths[key] = conn.path.slice(0, Math.ceil(conn.path.length / 2));
                        this.sound.hint();
                        this.redraw();
                        break;
                    }
                }
            }

            showSolution() {
                const level = levels[this.currentLevelIndex];
                this.userPaths = {};
                this.completedPairs = new Set();

                let step = 0;
                const animateStep = () => {
                    if (step < level.connections.length) {
                        const conn = level.connections[step];
                        const key = [conn.from, conn.to].sort((a,b)=>a-b).join('-');
                        this.userPaths[key] = conn.path;
                        this.completedPairs.add(key);
                        this.sound.connect();
                        this.redraw();
                        step++;
                        setTimeout(animateStep, 450);
                    } else {
                        setTimeout(() => this.checkWinCondition(), 350);
                    }
                };
                animateStep();
            }

            restartLevel() {
                this.loadLevel(this.currentLevelIndex);
            }

            nextLevel() {
                if (this.currentLevelIndex + 1 < levels.length) {
                    this.loadLevel(this.currentLevelIndex + 1);
                } else {
                    this.showLevelSelect();
                }
            }

            showLevelSelect() {
                document.getElementById('level-modal').classList.remove('hidden');
            }

            hideLevelSelect() {
                document.getElementById('level-modal').classList.add('hidden');
            }

            showProfileModal() {
                document.getElementById('input-username').value = this.username;
                document.getElementById('profile-modal').classList.remove('hidden');
            }

            hideProfileModal() {
                document.getElementById('profile-modal').classList.add('hidden');
            }

            setupAvatarSelector() {
                const avatars = ['🦊', '🐱', '🐶', '🐼', '🦁', '🐯', '🦄', '🐨', '🐸', '🤖'];
                const container = document.getElementById('avatar-selector');
                container.innerHTML = '';
                avatars.forEach(av => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `text-2xl p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border transition-all ${this.avatar === av ? 'border-amber-400 bg-slate-700 scale-105' : 'border-slate-700'}`;
                    btn.innerText = av;
                    btn.onclick = () => {
                        this.avatar = av;
                        this.setupAvatarSelector();
                    };
                    container.appendChild(btn);
                });
            }

            saveProfile() {
                const val = document.getElementById('input-username').value.trim();
                if (val) {
                    this.username = val;
                }
                localStorage.setItem('link_balls_username', this.username);
                localStorage.setItem('link_balls_avatar', this.avatar);
                this.updateProfileUI();
                this.hideProfileModal();
            }

            updateProfileUI() {
                document.getElementById('header-avatar').innerText = this.avatar;
                document.getElementById('header-username').innerText = this.username;
            }

            renderLevelGrid() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = '';
                levels.forEach((lvl, idx) => {
                    const unlocked = this.completedLevels.includes(idx);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `py-3 rounded-2xl font-bold flex flex-col items-center justify-center gap-1 transition-all ${
                        unlocked 
                            ? 'bg-gradient-to-br from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 shadow-md btn-game' 
                            : 'bg-slate-800 text-slate-500 border border-slate-700/50 cursor-not-allowed'
                    }`;
                    
                    btn.innerHTML = `
                        <span class="text-sm">Nível ${lvl.id}</span>
                        <span class="text-[10px] opacity-80">${unlocked ? (idx === this.currentLevelIndex ? 'Atual' : 'Liberado') : '<i class="fa-solid fa-lock"></i>'}</span>
                    `;

                    if (unlocked) {
                        btn.onclick = () => {
                            this.loadLevel(idx);
                            this.hideLevelSelect();
                        };
                    }
                    grid.appendChild(btn);
                });
            }
        }

        // Inicialização da aplicação
        let app = null;
        window.addEventListener('DOMContentLoaded', () => {
            app = new LinkPuzzleGame();
        });
    </script>
</body>
</html>
