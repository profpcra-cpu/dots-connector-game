<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Hub - Central de Jogos Mentais</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
            1. DESIGN TOKENS
            ========================================================== */
        :root {
            /* Superfícies */
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            /* Texto */
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            /* Bordas e inputs */
            --border-color: rgba(148, 163, 184, 0.2);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            /* Cores de ação */
            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;

            --btn-success: #10b981;
            --btn-success-hover: #34d399;
            --btn-sudoku: #3b82f6;
            --btn-sudoku-hover: #60a5fa;
            --btn-danger: #ef4444;
            --btn-danger-hover: #f87171;

            /* Sombras e raios */
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 22px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);

            /* Transições */
            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.2);
            --input-bg: rgba(255, 255, 255, 0.9);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.25);
        }

        /* ==========================================================
            2. RESET E BASE
            ========================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        /* Fundo decorativo — duas "auras" suaves */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
            transition: opacity var(--t-slow);
        }
        body::before {
            width: 420px; height: 420px;
            background: #6366f1;
            top: -140px; left: -120px;
        }
        body::after {
            width: 460px; height: 460px;
            background: #8b5cf6;
            bottom: -180px; right: -140px;
        }
        [data-theme="light"] body::before,
        [data-theme="light"] body::after {
            opacity: 0.25;
        }

        /* ==========================================================
            3. CONTAINER PRINCIPAL (glassmorphism)
            ========================================================== */
        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 34px 32px 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 460px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
            opacity: 0.8;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }

        /* ==========================================================
            4. TOP BAR (tema)
            ========================================================== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 6px;
        }

        .theme-toggle-btn {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
        }
        .theme-toggle-btn:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            transform: translateY(-1px);
            background: var(--card-bg);
        }

        /* ==========================================================
            5. TIPOGRAFIA
            ========================================================== */
        h2 {
            margin: 8px 0 6px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-color), var(--text-muted));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #login-hub h2 {
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd 55%, #f0abfc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .instructions {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.55;
        }

        /* ==========================================================
            6. INPUTS
            ========================================================== */
        input {
            width: 100%;
            padding: 14px 16px;
            margin-top: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-color);
            transition: border-color var(--t-base), box-shadow var(--t-base), background var(--t-base);
        }
        input::placeholder { color: var(--text-subtle); }
        input:focus {
            outline: none;
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
            background: var(--card-bg);
        }

        /* ==========================================================
            7. BOTÕES
            ========================================================== */
        button {
            width: 100%;
            padding: 15px 18px;
            margin-top: 14px;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            box-shadow: var(--shadow-btn);
            transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
            position: relative;
            overflow: hidden;
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
        }
        button:active { transform: translateY(0); filter: brightness(0.97); }

        .game-btn {
            background: linear-gradient(135deg, var(--btn-success), #14b8a6);
            box-shadow: 0 6px 20px -6px rgba(16, 185, 129, 0.55);
        }
        .game-btn:hover {
            box-shadow: 0 10px 28px -8px rgba(16, 185, 129, 0.7);
        }

        .sudoku-btn {
            background: linear-gradient(135deg, var(--btn-sudoku), #6366f1);
            box-shadow: 0 6px 20px -6px rgba(59, 130, 246, 0.55);
        }
        .sudoku-btn:hover {
            box-shadow: 0 10px 28px -8px rgba(59, 130, 246, 0.7);
        }

        button[onclick="sairDaConta()"] {
            background: transparent;
            color: var(--btn-danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
            box-shadow: none;
            font-weight: 600;
            margin-top: 22px;
        }
        button[onclick="sairDaConta()"]:hover {
            background: rgba(239, 68, 68, 0.12);
            color: var(--btn-danger-hover);
            border-color: var(--btn-danger);
            box-shadow: 0 6px 18px -8px rgba(239, 68, 68, 0.6);
        }

        /* ==========================================================
            8. AVATARES
            ========================================================== */
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        .avatar-option {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 26px;
            cursor: pointer;
            transition: all var(--t-base);
            user-select: none;
        }
        .avatar-option:hover {
            transform: translateY(-3px) scale(1.06);
            border-color: var(--border-strong);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
        }
        .avatar-option.selected {
            border-color: var(--btn-primary);
            background: linear-gradient(135deg, rgba(99,102,241,0.28), rgba(139,92,246,0.22));
            box-shadow: 0 0 0 3px rgba(99,102,241,0.25), 0 10px 24px -8px rgba(99,102,241,0.7);
        }

        /* ==========================================================
            9. MENU DO HUB
            ========================================================== */
        #menu-hub {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #menu-hub > div:first-child {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            width: 92px;
            height: 92px;
            margin: 4px auto 10px;
            font-size: 48px !important;
            background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(139,92,246,0.18));
            border: 2px solid rgba(99, 102, 241, 0.45);
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.08), 0 20px 40px -18px rgba(99, 102, 241, 0.9);
        }

        #menu-hub h2 {
            font-size: 24px;
            margin-top: 4px;
        }

        #hub-nome {
            background: linear-gradient(135deg, #a5b4fc, #f0abfc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        #menu-hub .instructions + button,
        #menu-hub button.game-btn {
            margin-top: 22px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR (TEMA) -->
        <div class="top-bar">
            <button id="theme-toggle" class="theme-toggle-btn">🌙 Tema</button>
        </div>

        <!-- ETAPA 1: LOGIN / IDENTIFICAÇÃO -->
        <div id="login-hub">
            <h2>Brain Hub</h2>
            <p class="instructions">Escolha a sua carinha, o seu nome e e-mail para entrar:</p>

            <div class="avatar-grid" id="avatar-container">
                <div class="avatar-option selected" data-avatar="😀">😀</div>
                <div class="avatar-option" data-avatar="😎">😎</div>
                <div class="avatar-option" data-avatar="🚀">🚀</div>
                <div class="avatar-option" data-avatar="🦊">🦊</div>
                <div class="avatar-option" data-avatar="🦄">🦄</div>
                <div class="avatar-option" data-avatar="🤖">🤖</div>
                <div class="avatar-option" data-avatar="⭐">⭐</div>
                <div class="avatar-option" data-avatar="🔥">🔥</div>
            </div>

            <input type="text" id="nome-jogador" placeholder="O seu nome..." autocomplete="off">
            <input type="email" id="email-jogador" placeholder="O seu e-mail..." autocomplete="off">
            <button id="btn-entrar">Entrar no Hub</button>
        </div>

        <!-- ETAPA 2: MENU DE SELEÇÃO DE JOGOS -->
        <div id="menu-hub" class="hidden">
            <div style="font-size: 45px;" id="hub-avatar">😀</div>
            <h2>Olá, <span id="hub-nome"></span>!</h2>
            <p class="instructions">Escolha o desafio cerebral que deseja treinar hoje:</p>

            <!-- Link atualizado para apontar para o ficheiro independente criado -->
            <button class="game-btn" onclick="window.location.href='brain-flow-master.html'">🧠 Brain Flow Master (Ligar Pontos)</button>
            <button class="sudoku-btn" onclick="window.location.href='sudoku.html'">🔢 Sudoku Express</button>

            <button style="background-color: #ef4444; margin-top: 20px;" onclick="sairDaConta()">Terminar Sessão</button>
        </div>
    </div>

    <!-- Lógica do Hub Central -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let avatarSelecionado = "😀";
        const themeToggleBtn = document.getElementById('theme-toggle');

        // Gestão de Tema
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarTextoBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
            atualizarTextoBotaoTema(newTheme);
        });

        function atualizarTextoBotaoTema(theme) {
            themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        }

        document.querySelectorAll('.avatar-option').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                avatarSelecionado = item.dataset.avatar;
            });
        });

        // Verificar se já existe sessão ativa guardada no navegador
        const jogadorSalvo = localStorage.getItem('brain_hub_jogador');
        if (jogadorSalvo) {
            const dados = JSON.parse(jogadorSalvo);
            mostrarMenu(dados.nome, dados.avatar);
        }

        document.getElementById('btn-entrar').addEventListener('click', async () => {
            const nome = document.getElementById('nome-jogador').value.trim();
            const email = document.getElementById('email-jogador').value.trim().toLowerCase();

            if (!nome) { alert("Por favor, introduza o seu nome."); return; }
            if (!email || !email.includes('@') || !email.includes('.')) { alert("Por favor, introduza um e-mail válido."); return; }

            const chave = email.replace(/\./g, ',');
            const jogadorRef = ref(db, 'jogadores/' + chave);

            try {
                const snapshot = await get(jogadorRef);
                if (!snapshot.exists()) {
                    await set(jogadorRef, {
                        nome, email, avatar: avatarSelecionado, pontos: 0, nivel: 1, ultimaAtualizacao: new Date().toISOString()
                    });
                } else {
                    const dados = snapshot.val();
                    avatarSelecionado = dados.avatar || avatarSelecionado;
                }

                // Guardar sessão para transitar entre os jogos
                localStorage.setItem('brain_hub_jogador', JSON.stringify({ nome, email, chave, avatar: avatarSelecionado }));
                mostrarMenu(nome, avatarSelecionado);

            } catch (error) {
                console.error("Erro ao ligar ao Firebase:", error);
                alert("Erro ao aceder à base de dados.");
            }
        });

        function mostrarMenu(nome, avatar) {
            document.getElementById('hub-nome').textContent = nome;
            document.getElementById('hub-avatar').textContent = avatar;
            document.getElementById('login-hub').classList.add('hidden');
            document.getElementById('menu-hub').classList.remove('hidden');
        }

        window.sairDaConta = function() {
            localStorage.removeItem('brain_hub_jogador');
            document.getElementById('menu-hub').classList.add('hidden');
            document.getElementById('login-hub').classList.remove('hidden');
        };
    </script>
</body>
</html>
