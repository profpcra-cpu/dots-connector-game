<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Flow Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-3xl font-bold text-center text-cyan-400 mb-2">Brain Flow Master</h1>
    <p class="text-center text-slate-400 text-sm mb-6">Desafie sua mente e registre seu QI no ranking global</p>

    <!-- ÁREA DE JOGO (Simulação de Exemplo) -->
    <div id="game-container" class="space-y-4">
      <div class="bg-slate-700 p-4 rounded-lg text-center">
        <p class="text-slate-300 mb-2">Jogador Ativo:</p>
        <input type="text" id="player-name" placeholder="Digite seu nome ou apelido" class="w-full p-2 bg-slate-900 rounded border border-slate-600 text-white text-center font-bold focus:outline-none focus:border-cyan-400">
      </div>

      <div class="flex justify-between gap-4">
        <button id="btn-simular" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-bold rounded transition">
          Simular Partida (+ QI)
        </button>
      </div>
    </div>

    <!-- SEÇÃO DO RANKING -->
    <div class="mt-8 border-t border-slate-700 pt-6">
      <h2 class="text-xl font-bold text-cyan-300 mb-4 flex items-center justify-between">
        <span>🏆 Ranking Global</span>
        <span id="loading-status" class="text-xs text-slate-400 font-normal">Sincronizando...</span>
      </h2>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/50 text-slate-400 uppercase text-xs">
            <tr>
              <th class="p-2">Posição</th>
              <th class="p-2">Jogador</th>
              <th class="p-2 text-center">Pontos</th>
              <th class="p-2 text-right">QI Estimado</th>
            </tr>
          </thead>
          <tbody id="ranking-body">
            <!-- Os dados do Firebase serão inseridos aqui -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE MODULE v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // SUAS CREDENCIAIS DO BRAIN FLOW MASTER
    const firebaseConfig = {
      apiKey: "AIzaSyBiP8g18Ev_7yv05-etUcKRLa-P6xOsh8I",
      authDomain: "brain-flow-master.firebaseapp.com",
      databaseURL: "https://brain-flow-master-default-rtdb.firebaseio.com",
      projectId: "brain-flow-master",
      storageBucket: "brain-flow-master.firebasestorage.app",
      messagingSenderId: "137353474062",
      appId: "1:137353474062:web:b53db8e1cde4c341740c5f",
      measurementId: "G-XHCEYHY37W"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Elementos da Interface
    const rankingBody = document.getElementById('ranking-body');
    const loadingStatus = document.getElementById('loading-status');
    const btnSimular = document.getElementById('btn-simular');
    const playerNameInput = document.getElementById('player-name');

    // Função para Carregar o Ranking Global
    async function carregarRanking() {
      loadingStatus.textContent = "Atualizando...";
      try {
        const rankingRef = collection(db, "ranking");
        const q = query(rankingRef, orderBy("qi", "desc"), limit(10));
        const querySnapshot = await getDocs(q);

        rankingBody.innerHTML = "";
        let pos = 1;

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const row = `
            <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
              <td class="p-2 font-bold text-cyan-400">#${pos}</td>
              <td class="p-2">${data.nome || 'Anônimo'}</td>
              <td class="p-2 text-center">${data.pontos || 0}</td>
              <td class="p-2 text-right font-semibold text-emerald-400">${data.qi || 100}</td>
            </tr>
          `;
          rankingBody.innerHTML += row;
          pos++;
        });

        loadingStatus.textContent = "Conectado ao GCP";
      } catch (error) {
        console.error("Erro ao carregar ranking:", error);
        loadingStatus.textContent = "Erro na conexão";
      }
    }

    // Função para Salvar Nova Pontuação
    async function salvarResultado(nome, pontos, qi) {
      loadingStatus.textContent = "Gravando no Firestore...";
      try {
        await addDoc(collection(db, "ranking"), {
          nome: nome,
          pontos: pontos,
          qi: qi,
          data: new Date()
        });
        await carregarRanking();
      } catch (error) {
        console.error("Erro ao salvar resultado:", error);
        alert("Erro ao gravar dados no Firebase. Verifique se o Firestore está ativo no Console.");
      }
    }

    // Ação do Botão de Teste/Simulação
    btnSimular.addEventListener('click', () => {
      const nome = playerNameInput.value.trim() || "Jogador Sem Nome";
      const pontosRandom = Math.floor(Math.random() * 50) + 50; 
      const qiRandom = Math.floor(Math.random() * 40) + 110; 

      salvarResultado(nome, pontosRandom, qiRandom);
    });

    // Carrega o ranking ao abrir a página
    carregarRanking();
  </script>
</body>
</html>
