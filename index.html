<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brain Flow Master: Estrelas, Ranking & Lógica</title>
  
  <!-- CDN Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

  <!-- MODAL DE CADASTRO REESTRUTURADO -->
  <div id="modalCadastro" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl text-center space-y-4">
      
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-2">
        <i class="fa-solid fa-brain"></i>
      </div>

      <h2 class="text-2xl font-bold text-white">Brain Flow Master</h2>
      <p class="text-xs text-slate-400">Inscreva-se para registrar seu QI e Pontuação no Ranking Global!</p>

      <form id="formCadastro" onsubmit="realizarCadastro(event)" class="space-y-3 text-left">
        <div>
          <label class="block text-xs text-slate-300 font-semibold mb-1">Nome / Apelido <span class="text-rose-400">*</span></label>
          <input type="text" id="inputNome" required placeholder="Digite seu nome ou apelido"
            class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-semibold mb-1">Curso / Turma / Setor <span class="text-rose-400">*</span></label>
          <input type="text" id="inputTurma" required placeholder="Ex: Enfermagem - Turma A"
            class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-semibold mb-1">Matrícula ou E-mail <span class="text-slate-500">(Opcional)</span></label>
          <input type="text" id="inputIdentificador" placeholder="Ex: 20261010 ou seu e-mail"
            class="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <button type="submit" id="btnEntrar"
          class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
          <span>Entrar na Partida</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- INTERFACE PRINCIPAL DO JOGO -->
  <header class="w-full max-w-lg px-4 py-3 flex justify-between items-center bg-slate-900/60 border-b border-slate-800">
    <div>
      <h1 id="nomeJogadorDisplay" class="text-sm font-bold text-indigo-400">Visitante</h1>
      <p id="turmaJogadorDisplay" class="text-xs text-slate-400">Geral</p>
    </div>
    <button onclick="abrirRanking()" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-600/40 transition flex items-center gap-1.5">
      <i class="fa-solid fa-trophy text-amber-400"></i>
      <span>Ranking</span>
    </button>
  </header>

  <main class="flex-1 w-full max-w-lg flex flex-col items-center justify-center p-4">
    <!-- O Canvas / Tabuleiro do Jogo entra aqui -->
    <div id="gameContainer" class="w-full aspect-square bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-center text-slate-500 text-sm">
      <p>Área de Jogo Ativa</p>
    </div>
  </main>

  <!-- LÓGICA DE INTEGRAÇÃO COM O GOOGLE APPS SCRIPT -->
  <script>
    // URL do seu Google Apps Script (Web App)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwy4Yq6RTLQnQ4Y0sOaM5XG2G8c2h4N_xP_Exemplo/exec";

    let jogadorAtual = null;

    // Verificar se já existe cadastro salvo localmente ao carregar a página
    window.addEventListener('DOMContentLoaded', () => {
      const dadosSalvos = localStorage.getItem('brainFlowMaster_player');
      if (dadosSalvos) {
        jogadorAtual = JSON.parse(dadosSalvos);
        carregarInterfaceJogador();
      }
    });

    async function realizarCadastro(event) {
      event.preventDefault();
      
      const btn = document.getElementById("btnEntrar");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> A Conectar...`;

      const payload = {
        action: "REGISTRAR_JOGADOR",
        nome: document.getElementById("inputNome").value.trim(),
        turma: document.getElementById("inputTurma").value.trim(),
        identificador: document.getElementById("inputIdentificador").value.trim()
      };

      try {
        let responseData = null;
        if (WEB_APP_URL && !WEB_APP_URL.includes("Exemplo")) {
          const res = await fetch(WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          responseData = await res.json();
        }

        // Define dados do jogador (com ID retornado da planilha ou gerado localmente)
        jogadorAtual = {
          id: responseData?.idJogador || "JOG_" + Date.now(),
          nome: payload.nome,
          turma: payload.turma
        };

        // Salva na sessão local do navegador
        localStorage.setItem('brainFlowMaster_player', JSON.stringify(jogadorAtual));
        carregarInterfaceJogador();

      } catch (err) {
        console.error("Erro no registro:", err);
        alert("Erro de ligação com a planilha. O jogo iniciará em modo offline.");
        
        jogadorAtual = {
          id: "JOG_OFF_" + Date.now(),
          nome: payload.nome,
          turma: payload.turma
        };
        carregarInterfaceJogador();
      }
    }

    function carregarInterfaceJogador() {
      document.getElementById("nomeJogadorDisplay").innerText = jogadorAtual.nome;
      document.getElementById("turmaJogadorDisplay").innerText = jogadorAtual.turma;
      document.getElementById("modalCadastro").classList.add("hidden");
    }

    async function salvarPontuacao(pontos, iq) {
      if (!jogadorAtual || !WEB_APP_URL || WEB_APP_URL.includes("Exemplo")) return;

      const payload = {
        action: "SALVAR_PONTUACAO",
        idJogador: jogadorAtual.id,
        nome: jogadorAtual.nome,
        turma: jogadorAtual.turma,
        pontos: pontos,
        iq: iq
      };

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Erro ao guardar a pontuação:", e);
      }
    }

    function abrirRanking() {
      alert("Carregando o ranking global...");
    }
  </script>
</body>
</html>
