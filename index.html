<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Flow - Master</title>
  
  <!-- Tailwind CSS (conforme visível na sua imagem) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>

  <!-- 1. Importar os SDKs do Firebase via CDN (Versão Compatível com HTML estático) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // A sua configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBiP8g18Ev_7yv05-etUcKRLa-P6xOsh8I",
      authDomain: "brain-flow-master.firebaseapp.com",
      databaseURL: "https://brain-flow-master-default-rtdb.firebaseio.com",
      projectId: "brain-flow-master",
      storageBucket: "brain-flow-master.firebasestorage.app",
      messagingSenderId: "137353474062",
      appId: "1:137353474062:web:b53db8e1cde4c341740c5f",
      measurementId: "G-XHCEYHY37W"
    };

    // Inicializar o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Exemplo de função global para testar a gravação no banco de dados diretamente no HTML
    window.salvarNoFirebase = function(dadoExemplo) {
      set(ref(db, 'testes/fluxo'), {
        mensagem: dadoExemplo,
        timestamp: new Date().toISOString()
      }).then(() => {
        console.log("Dado guardado com sucesso no Firebase!");
      }).catch((error) => {
        console.error("Erro ao guardar:", error);
      });
    };
  </script>
</head>
<body class="bg-slate-900 text-white p-6">
  <div class="max-w-xl mx-auto bg-slate-800 p-6 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold mb-4">Brain Flow Master - Firebase Integrado</h1>
    <p class="text-slate-400 mb-4">Aplicação de ficheiro único pronta a interagir com o Realtime Database.</p>
    
    <button onclick="window.salvarNoFirebase('Teste feito a partir do index.html')" 
            class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded">
      Testar Gravação no Firebase
    </button>
  </div>
</body>
</html>
