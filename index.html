<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Ligar Pontos - Brain Flow Master</title>
    
    <!-- SDK do EmailJS para envio de e-mails -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Substitua 'SEU_PUBLIC_KEY' pela sua chave pública do EmailJS
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #0f172a;
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .hidden {
            display: none !important;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .avatar-option {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .avatar-option:hover {
            background: #334155;
            transform: scale(1.05);
        }
        .avatar-option.selected {
            border-color: #3b82f6;
            background: #1d4ed8;
        }
        .score-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0f172a;
            padding: 12px 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #334155;
            text-align: center;
        }
        .user-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .user-avatar-display {
            font-size: 32px;
            background: #334155;
            padding: 5px 12px;
            border-radius: 50%;
        }
        #game-board {
            position: relative;
            width: 100%;
            height: 350px;
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            cursor: crosshair;
        }
        .dot {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            user-select: none;
        }
        .dot:hover {
            background: #60a5fa;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .dot.completed {
            background: #22c55e;
        }
        #canvas-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .instructions {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN / REGISTO -->
        <div id="login-screen">
            <h2>Brain Flow Master</h2>
            <p class="instructions">Escolha a sua carinha, o seu nome e e-mail para entrar:</p>
            
            <div class="avatar-grid" id="avatar-container">
                <div class="avatar-option selected" data-avatar="😀">😀</div>
                <div class="avatar-option" data-avatar="😎">😎</div>
                <div class="avatar-option" data-avatar="🚀">🚀</div>
                <div class="avatar-option" data-avatar="🦊">🦊</div>
                <div class="avatar-option" data-avatar="🦄">🦄</div>
                <div class="avatar-option" data-avatar="🤖">🤖</div>
                <div class="avatar-option" data-avatar="⭐">⭐</div>
                <div class="avatar-option" data-avatar="🔥">🔥</div>
            </div>

            <input type="text" id="nome-jogador" placeholder="O seu nome..." autocomplete="off">
            <input type="email" id="email-jogador" placeholder="O seu e-mail..." autocomplete="off">
            <button id="btn-entrar">Entrar no Jogo</button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <div class="user-header">
                <span id="display-avatar" class="user-avatar-display">😀</span>
                <h2>Olá, <span id="display-nome"></span>!</h2>
            </div>
            
            <div class="score-board">
                <div>Nível: <br><strong id="display-nivel" style="color: #38bdf8;">1</strong></div>
                <div>Pontos: <br><strong id="display-pontos" style="color: #4ade80;">0</strong></div>
                <div>Próximo: <br><strong id="display-proximo" style="color: #60a5fa;">1</strong></div>
            </div>
            <p class="instructions" id="info-instrucao">Clique nos pontos na ordem numérica correta.</p>
            
            <div id="game-board">
                <svg id="canvas-lines"></svg>
            </div>

            <button id="btn-reiniciar" class="hidden" style="margin-top: 15px; background-color: #10b981;">Avançar de Nível</button>
        </div>
    </div>

    <!-- Lógica do Jogo com importação modular do Firebase e EmailJS -->
    <script type="module">
        import { db, analytics } from "./firebase-config.js";
        import { ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let chaveJogadorAtual = null;
        let nomeJogadorAtual = "";
        let emailJogadorAtual = "";
        let pontuacaoAcumulada = 0;
        let nivelAtual = 1;
        let avatarSelecionado = "😀";
        let totalPontosNivel = 5;
        let proximoNumeroEsperado = 1;
        let coordenadasPontos = [];
        let ligacoesFeitas = [];

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const inputNome = document.getElementById('nome-jogador');
        const inputEmail = document.getElementById('email-jogador');
        const btnEntrar = document.getElementById('btn-entrar');
        const displayNome = document.getElementById('display-nome');
        const displayAvatar = document.getElementById('display-avatar');
        const displayNível = document.getElementById('display-nivel');
        const displayPontos = document.getElementById('display-pontos');
        const displayProximo = document.getElementById('display-proximo');
        const infoInstrucao = document.getElementById('info-instrucao');
        const gameBoard = document.getElementById('game-board');
        const canvasLines = document.getElementById('canvas-lines');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        document.querySelectorAll('.avatar-option').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                avatarSelecionado = item.dataset.avatar;
            });
        });

        btnEntrar.addEventListener('click', async () => {
            const nome = inputNome.value.trim();
            const email = inputEmail.value.trim().toLowerCase();

            if (!nome) {
                alert("Por favor, introduza o seu nome.");
                return;
            }
            if (!email || !email.includes('@') || !email.includes('.')) {
                alert("Por favor, introduza um e-mail válido.");
                return;
            }

            nomeJogadorAtual = nome;
            emailJogadorAtual = email;

            // O Firebase não aceita pontos '.' nas chaves, por isso substituímos por vírgulas ','
            const emailSeguro = email.replace(/\./g, ',');
            chaveJogadorAtual = emailSeguro;

            const jogadorRef = ref(db, 'jogadores/' + chaveJogadorAtual);

            try {
                btnEntrar.disabled = true;
                btnEntrar.textContent = "A verificar base de dados...";

                const snapshot = await get(jogadorRef);

                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    pontuacaoAcumulada = dados.pontos || 0;
                    nivelAtual = dados.nivel || 1;
                    avatarSelecionado = dados.avatar || avatarSelecionado;
                } else {
                    await set(jogadorRef, {
                        nome: nome,
                        email: email,
                        avatar: avatarSelecionado,
                        pontos: 0,
                        nivel: 1,
                        ultimaAtualizacao: new Date().toISOString()
                    });
                    pontuacaoAcumulada = 0;
                    nivelAtual = 1;
                }

                displayNome.textContent = nome;
                displayAvatar.textContent = avatarSelecionado;
                displayPontos.textContent = pontuacaoAcumulada;
                displayNível.textContent = nivelAtual;

                loginScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');

                iniciarNovoJogoRonda();

            } catch (error) {
                console.error("Erro ao ligar ao Firebase:", error);
                alert("Erro ao aceder à base de dados. Verifique a consola (F12).");
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar no Jogo";
            }
        });

        function iniciarNovoJogoRonda() {
            totalPontosNivel = 4 + (nivelAtual * 2);
            proximoNumeroEsperado = 1;
            displayProximo.textContent = proximoNumeroEsperado;
            displayNível.textContent = nivelAtual;
            ligacoesFeitas = [];
            btnReiniciar.classList.add('hidden');
            infoInstrucao.textContent = `Nível ${nivelAtual}: Conecte de 1 até ${totalPontosNivel} em ordem crescente.`;

            document.querySelectorAll('.dot').forEach(el => el.remove());
            canvasLines.innerHTML = '';

            coordenadasPontos = [];
            const larguraMax = 420;
            const alturaMax = 280;

            for (let i = 1; i <= totalPontosNivel; i++) {
                let x, y, tentativas = 0;
                let sobreposto;
                do {
                    x = Math.floor(Math.random() * (larguraMax - 60)) + 40;
                    y = Math.floor(Math.random() * (alturaMax - 60)) + 40;
                    sobreposto = coordenadasPontos.some(p => Math.hypot(p.x - x, p.y - y) < 55);
                    tentativas++;
                } while (sobreposto && tentativas < 50);

                coordenadasPontos.push({ id: i, x, y });
            }

            coordenadasPontos.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.textContent = p.id;
                dot.style.left = `${p.x}px`;
                dot.style.top = `${p.y}px`;
                dot.dataset.id = p.id;

                dot.addEventListener('click', () => lidarComCliquePonto(p, dot));
                gameBoard.appendChild(dot);
            });
        }

        function lidarComCliquePonto(ponto, elementoDot) {
            if (ponto.id === proximoNumeroEsperado) {
                elementoDot.classList.add('completed');
                ligacoesFeitas.push(ponto);

                if (proximoNumeroEsperado > 1) {
                    desenharLinha(ligacoesFeitas[ligacoesFeitas.length - 2], ponto);
                }

                proximoNumeroEsperado++;
                displayProximo.textContent = proximoNumeroEsperado <= totalPontosNivel ? proximoNumeroEsperado : "Fim!";

                if (proximoNumeroEsperado > totalPontosNivel) {
                    concluirNivelComSucesso();
                }
            } else if (ponto.id > proximoNumeroEsperado) {
                alert(`Ops! Esse é o ponto ${ponto.id}. Clique no ponto ${proximoNumeroEsperado}.`);
            }
        }

        function desenharLinha(p1, p2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', '#22c55e');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            canvasLines.appendChild(line);
        }

        async function concluirNivelComSucesso() {
            infoInstrucao.textContent = `🎉 Nível ${nivelAtual} Concluído com Sucesso!`;
            
            const pontosGanhos = nivelAtual * 10;
            pontuacaoAcumulada += pontosGanhos;
            nivelAtual++;

            const jogadorRef = ref(db, 'jogadores/' + chaveJogadorAtual);

            try {
                await update(jogadorRef, {
                    pontos: pontuacaoAcumulada,
                    nivel: nivelAtual,
                    avatar: avatarSelecionado,
                    ultimaAtualizacao: new Date().toISOString()
                });

                displayPontos.textContent = pontuacaoAcumulada;
                displayNível.textContent = nivelAtual;
                
                // Enviar e-mail de resumo de pontuação através do EmailJS
                enviarEmailResumo(nomeJogadorAtual, emailJogadorAtual, nivelAtual, pontuacaoAcumulada, avatarSelecionado);

                alert(`Parabéns! Passou o nível e ganhou ${pontosGanhos} pontos!\nProgresso guardado no Firebase e e-mail enviado.`);
                btnReiniciar.textContent = `Avançar para o Nível ${nivelAtual}`;
                btnReiniciar.classList.remove('hidden');

            } catch (error) {
                console.error("Erro ao atualizar progresso no Firebase:", error);
                alert("Progresso concluído, mas ocorreu um erro ao salvar na base de dados.");
                btnReiniciar.classList.remove('hidden');
            }
        }

        function enviarEmailResumo(nome, email, nivel, pontos, avatar) {
            const templateParams = {
                to_name: nome,
                to_email: email,
                avatar: avatar,
                nivel: nivel,
                pontos: pontos,
                mensagem: `Parabéns pelo seu progresso no Brain Flow Master! O seu nível atual é ${nivel} e acumulou um total de ${pontos} pontos.`
            };

            // Substitua 'SEU_SERVICE_ID' e 'SEU_TEMPLATE_ID' pelos valores gerados no EmailJS
            emailjs.send('SEU_SERVICE_ID', 'SEU_TEMPLATE_ID', templateParams)
                .then((response) => {
                    console.log('E-mail enviado com sucesso!', response.status, response.text);
                }, (error) => {
                    console.error('Erro ao enviar e-mail:', error);
                });
        }

        btnReiniciar.addEventListener('click', () => {
            iniciarNovoJogoRonda();
        });
    </script>
</body>
</html>
