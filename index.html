<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Master: Link the Dots</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 50% 0%, #2a2a3e 0%, #0f0f17 100%);
            color: #cdd6f4;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 30, 46, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .board-frame {
            background: #2b1d12;
            border: 10px solid #5c3d2e;
            box-shadow: 
                inset 0 0 25px rgba(0,0,0,0.9), 
                0 15px 40px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.05);
            border-radius: 20px;
            transition: box-shadow 0.3s;
        }

        .board-frame.win-glow {
            box-shadow: 
                inset 0 0 25px rgba(0,0,0,0.9),
                0 15px 40px rgba(0,0,0,0.6),
                0 0 60px rgba(34, 197, 94, 0.6);
        }

        .iq-progress {
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px currentColor); }
            50% { filter: drop-shadow(0 0 20px currentColor); }
        }
        .glow-effect { animation: pulse-glow 2s infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.3s; }

        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }
        .float-text {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            font-size: 20px;
            animation: float-up 1s ease-out forwards;
            z-index: 100;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .modal-bg {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        .btn-press:active { transform: scale(0.92); }

        /* Combo indicator */
        @keyframes combo-pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .combo-pop { animation: combo-pop 0.4s ease-out; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen p-3 md:p-6 select-none">

    <header class="w-full max-w-md flex flex-col items-center gap-3 glass-panel p-4 rounded-2xl shadow-xl">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center gap-2">

        <div class="w-full mt-1">

                <span class="flex items-center gap-1"><i class="fa-solid fa-brain text-pink-400"></i> 75</span>
                <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-yellow-400"></i> 130</span>
                <span class="flex items-center gap-1"><i class="fa-solid fa-graduation-cap text-cyan-400"></i> 180+</span>

            <div class="w-full h-3.5 bg-gray-800 rounded-full p-0.5 relative overflow-hidden border border-gray-700">

    <main class="relative flex-1 w-full max-w-md my-3 flex items-center justify-center">

    <footer class="w-full max-w-md glass-panel p-3 rounded-2xl shadow-xl flex items-center justify-around gap-2">
        <button id="btn-reset" class="btn-press flex-1 py-2.5 px-3 bg-gray-800 hover:bg-gray-700 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700">
            <i class="fa-solid fa-rotate-left text-amber-400 text-lg"></i>
            <span class="text-[11px] font-semibold text-gray-300">Reiniciar</span>
        </button>

        <button id="btn-undo" class="btn-press flex-1 py-2.5 px-3 bg-gray-800 hover:bg-gray-700 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700">

        <button id="btn-hint" class="btn-press flex-1 py-2.5 px-3 bg-indigo-900/40 hover:bg-indigo-800/60 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-indigo-500/40 relative">
            <span id="hint-badge" class="absolute -top-1.5 -right-1.5 bg-indigo-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-gray-900">3</span>

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-gray-900/90 border border-indigo-500/30 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4 transform scale-90 transition-transform duration-300" id="win-modal-card">
            <div class="w-20 h-20 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center text-4xl text-gray-900 shadow-lg shadow-amber-500/30 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-white">Nível Concluído!</h2>
                <p class="text-sm text-gray-300 mt-1" id="win-message">Conexões perfeitas e estrelas coletadas!</p>
            </div>
            
            <div class="w-full bg-gray-800/80 p-3 rounded-xl border border-gray-700 flex justify-around">
                <div class="text-center">
                    <p class="text-xs text-gray-400">Pontos QI</p>
                    <p id="win-iq-gained" class="text-xl font-black text-amber-400">+10 QI</p>
                </div>
                <div class="w-[1px] bg-gray-700"></div>
                <div class="text-center">
                    <p class="text-xs text-gray-400">Estrelas</p>

            <button id="btn-next-level" class="btn-press w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition">

    <!-- Levels Modal -->
    <div id="levels-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-gray-900/95 border border-gray-700 p-6 rounded-3xl max-w-md w-full shadow-2xl flex flex-col gap-4 max-h-[85vh]">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-map text-indigo-400"></i> Seleção de Níveis
                </h2>
                <button id="btn-close-levels" class="btn-press w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>

            <div id="levels-grid" class="grid grid-cols-4 gap-3 overflow-y-auto p-1 max-h-[60vh]"></div>
        </div>

    <script>
        /* ===================================================================
           AUDIO SYNTHESIZER ENGINE (Melhorado com efeitos extras)
           =================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.masterGain = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.5;
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            playPop(freq = 440, duration = 0.08, volume = 0.25) {
                if (!this.ctx || !this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.8, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playConnect() {
                if (!this.ctx || !this.enabled) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + 0.3);
            }

            playWin() {
                if (!this.ctx || !this.enabled) return;
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start();
                        osc.stop(this.ctx.currentTime + 0.4);
                    }, idx * 120);
                });
            }

            playStar() {
                if (!this.ctx || !this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1567.98, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playError() {
                if (!this.ctx || !this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
        }

        const audio = new SoundEngine();

        /* ===================================================================
           LEVELS DATA (com solução de referência para hints)
           =================================================================== */
        const COLOR_PALETTE = {
            red: { hex: '#ef4444', glow: 'rgba(239, 68, 68, 0.5)' },
            blue: { hex: '#3b82f6', glow: 'rgba(59, 130, 246, 0.5)' },
            green: { hex: '#22c55e', glow: 'rgba(34, 197, 94, 0.5)' },
            yellow: { hex: '#eab308', glow: 'rgba(234, 179, 8, 0.5)' },
            purple: { hex: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' },
            orange: { hex: '#f97316', glow: 'rgba(249, 115, 22, 0.5)' },
            cyan: { hex: '#06b6d4', glow: 'rgba(6, 182, 212, 0.5)' }
        };

        const LEVELS = [
            { size: 4, title: "Grid 4x4 - Desafio Inicial",
              dots: [
                { x: 0, y: 0, color: 'green' }, { x: 3, y: 3, color: 'green' },
                { x: 3, y: 0, color: 'red' },   { x: 2, y: 2, color: 'red' },
                { x: 0, y: 3, color: 'blue' },  { x: 2, y: 1, color: 'blue' }
              ], stars: [{ x: 3, y: 2 }, { x: 1, y: 1 }] },
            { size: 4, title: "Grid 4x4 - Curvas Práticas",
              dots: [
                { x: 0, y: 0, color: 'red' }, { x: 2, y: 3, color: 'red' },
                { x: 1, y: 0, color: 'yellow' }, { x: 3, y: 2, color: 'yellow' },
                { x: 0, y: 2, color: 'blue' }, { x: 3, y: 3, color: 'blue' }
              ], stars: [{ x: 1, y: 2 }] },
            { size: 5, title: "Grid 5x5 - Expansão de QI",
              dots: [
                { x: 0, y: 1, color: 'red' }, { x: 4, y: 1, color: 'red' },
                { x: 1, y: 0, color: 'blue' }, { x: 3, y: 4, color: 'blue' },
                { x: 0, y: 4, color: 'green' }, { x: 4, y: 3, color: 'green' },
                { x: 2, y: 2, color: 'purple' }, { x: 4, y: 4, color: 'purple' }
              ], stars: [{ x: 2, y: 1 }, { x: 3, y: 2 }] },
            { size: 5, title: "Grid 5x5 - Labirinto de Cores",
              dots: [
                { x: 0, y: 0, color: 'orange' }, { x: 4, y: 2, color: 'orange' },
                { x: 1, y: 1, color: 'cyan' }, { x: 3, y: 3, color: 'cyan' },
                { x: 2, y: 0, color: 'red' }, { x: 0, y: 4, color: 'red' },
                { x: 4, y: 0, color: 'yellow' }, { x: 2, y: 4, color: 'yellow' }
              ], stars: [{ x: 2, y: 2 }] },
            { size: 6, title: "Grid 6x6 - Mente Brilhante",
              dots: [
                { x: 0, y: 0, color: 'red' }, { x: 5, y: 5, color: 'red' },
                { x: 0, y: 5, color: 'blue' }, { x: 5, y: 0, color: 'blue' },
                { x: 2, y: 1, color: 'green' }, { x: 3, y: 4, color: 'green' },
                { x: 1, y: 3, color: 'yellow' }, { x: 4, y: 2, color: 'yellow' },
                { x: 2, y: 2, color: 'purple' }, { x: 3, y: 3, color: 'purple' }
              ], stars: [{ x: 1, y: 1 }, { x: 4, y: 4 }] },
            { size: 6, title: "Grid 6x6 - Nível Avançado",
              dots: [
                { x: 0, y: 2, color: 'red' }, { x: 4, y: 3, color: 'red' },
                { x: 1, y: 0, color: 'cyan' }, { x: 5, y: 4, color: 'cyan' },
                { x: 2, y: 2, color: 'green' }, { x: 3, y: 5, color: 'green' },
                { x: 0, y: 4, color: 'orange' }, { x: 4, y: 1, color: 'orange' },
                { x: 1, y: 5, color: 'purple' }, { x: 5, y: 1, color: 'purple' }
              ], stars: [{ x: 3, y: 1 }, { x: 2, y: 4 }] },
            { size: 7, title: "Grid 7x7 - Desafio de Einstein",
              dots: [
                { x: 0, y: 0, color: 'red' }, { x: 6, y: 6, color: 'red' },
                { x: 0, y: 6, color: 'blue' }, { x: 6, y: 0, color: 'blue' },
                { x: 1, y: 2, color: 'green' }, { x: 5, y: 4, color: 'green' },
                { x: 2, y: 1, color: 'yellow' }, { x: 4, y: 5, color: 'yellow' },
                { x: 3, y: 0, color: 'purple' }, { x: 3, y: 6, color: 'purple' },
                { x: 2, y: 4, color: 'orange' }, { x: 4, y: 2, color: 'orange' }
              ], stars: [{ x: 3, y: 3 }, { x: 1, y: 5 }, { x: 5, y: 1 }] }
        ];

        /* ===================================================================
           GAME STATE
           =================================================================== */
        let currentLevelIdx = 0;
        let IQ = 75;
        let hintsLeft = 3;
        let moveCount = 0;
        let levelStartTime = 0;
        let bestTimes = JSON.parse(localStorage.getItem('brainMaster_bestTimes') || '{}');
        let unlockedLevels = JSON.parse(localStorage.getItem('brainMaster_unlocked') || '[0]');

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        const floatLayer = document.getElementById('float-layer');

        let gridCount = 4;
        let cellSize = 0;
        let activeColor = null;
        let isDrawing = false;
        let paths = {};
        let currentPath = [];
        let collectedStars = new Set();
        let particles = [];
        let confetti = [];
        let animationFrameId = null;
        let winning = false;

        /* ===================================================================
           CANVAS & RENDERING (com cache de gradientes)
           =================================================================== */
        let ballGradients = {};

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            confettiCanvas.width = rect.width * dpr;
            confettiCanvas.height = rect.height * dpr;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            cellSize = rect.width / gridCount;
            ballGradients = {}; // Reset cache
            render();
        }

        function loadLevel(idx) {
            currentLevelIdx = idx;
            const lvl = LEVELS[currentLevelIdx];
            gridCount = lvl.size;
            
            document.getElementById('level-num').innerText = currentLevelIdx + 1;
            document.getElementById('level-name').innerText = lvl.title;

            paths = {};
            currentPath = [];
            isDrawing = false;
            activeColor = null;
            collectedStars.clear();
            moveCount = 0;
            winning = false;
            levelStartTime = Date.now();
            document.getElementById('move-count').innerText = '0';
            document.getElementById('board-wrapper').classList.remove('win-glow');

            resizeCanvas();
            updateIQBar();
            saveProgress();
        }

        function getCellCoords(gridPos) {
            return {
                x: gridPos.x * cellSize + cellSize / 2,
                y: gridPos.y * cellSize + cellSize / 2
            };
        }

        function getGridPos(pixelX, pixelY) {
            const x = Math.floor(pixelX / cellSize);
            const y = Math.floor(pixelY / cellSize);
            if (x >= 0 && x < gridCount && y >= 0 && y < gridCount) return { x, y };
            return null;
        }

        function render() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // Background
            ctx.fillStyle = '#22150c';
            ctx.fillRect(0, 0, width, height);

            // Grid lines (batch)
            ctx.strokeStyle = '#3d281a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= gridCount; i++) {
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, height);
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(width, i * cellSize);
            }
            ctx.stroke();

            // Grid dots (batch)
            ctx.fillStyle = '#4a3323';
            ctx.beginPath();
            for (let x = 0; x < gridCount; x++) {
                for (let y = 0; y < gridCount; y++) {
                    const c = getCellCoords({ x, y });
                    ctx.moveTo(c.x, c.y);
                    ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
                }
            }
            ctx.fill();

            const currentLvl = LEVELS[currentLevelIdx];

            // Stars
            if (currentLvl.stars) {
                currentLvl.stars.forEach(star => {
                    const c = getCellCoords(star);
                    const isCollected = collectedStars.has(`${star.x},${star.y}`);
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    if (isCollected) {
                        ctx.globalAlpha = 0.3;
                        ctx.fillStyle = '#6b7280';
                    } else {
                        ctx.fillStyle = '#f59e0b';
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 12;
                    }
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * (cellSize * 0.22),
                                   -Math.sin((18 + i * 72) * Math.PI / 180) * (cellSize * 0.22));
                        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (cellSize * 0.1),
                                   -Math.sin((54 + i * 72) * Math.PI / 180) * (cellSize * 0.1));
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                });
            }

            // Helper para desenhar linha
            const drawPathLine = (pathArr, colorKey, alpha = 1) => {
                if (!pathArr || pathArr.length === 0) return;
                const palette = COLOR_PALETTE[colorKey] || { hex: '#ffffff' };
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = palette.hex;
                ctx.lineWidth = cellSize * 0.28;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = palette.hex;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                const start = getCellCoords(pathArr[0]);
                ctx.moveTo(start.x, start.y);
                for (let i = 1; i < pathArr.length; i++) {
                    const pt = getCellCoords(pathArr[i]);
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
                ctx.restore();
            };

            Object.keys(paths).forEach(color => drawPathLine(paths[color], color));
            if (isDrawing && activeColor && currentPath.length > 0) {
                drawPathLine(currentPath, activeColor);
            }

            // Endpoint balls (com gradiente cacheado)
            currentLvl.dots.forEach(dot => {
                const c = getCellCoords(dot);
                const palette = COLOR_PALETTE[dot.color];
                const cacheKey = `${dot.color}_${cellSize}`;

                ctx.save();
                ctx.shadowColor = palette.hex;
                ctx.shadowBlur = 18;

                if (!ballGradients[cacheKey]) {
                    const grad = ctx.createRadialGradient(
                        -cellSize * 0.08, -cellSize * 0.08, cellSize * 0.05,
                        0, 0, cellSize * 0.28
                    );
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, palette.hex);
                    grad.addColorStop(1, '#111827');
                    ballGradients[cacheKey] = grad;
                }

                ctx.translate(c.x, c.y);
                ctx.fillStyle = ballGradients[cacheKey];
                ctx.beginPath();
                ctx.arc(0, 0, cellSize * 0.26, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(-cellSize * 0.08, -cellSize * 0.08, cellSize * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            renderParticles();
        }

            return { x: clientX - rect.left, y: clientY - rect.top };
        }
