<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Ligar Pontos com Firebase</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #0f172a;
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .hidden {
            display: none !important;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #334155;
        }
        /* Tabuleiro do Jogo */
        #game-board {
            position: relative;
            width: 100%;
            height: 350px;
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            cursor: crosshair;
        }
        .dot {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            user-select: none;
        }
        .dot:hover {
            background: #60a5fa;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .dot.completed {
            background: #22c55e;
        }
        #canvas-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .instructions {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="login-screen">
            <h2>Ligar Pontos</h2>
            <p class="instructions">Digite o seu nome para entrar ou recuperar a sua pontuação:</p>
            <input type="text" id="nome-jogador" placeholder="O seu nome..." autocomplete="off">
            <button id="btn-entrar">Entrar no Jogo</button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <h2>Olá, <span id="display-nome"></span>!</h2>
            <div class="score-board">
                <span>Total Acumulado: <strong id="display-pontos" style="color: #4ade80;">0</strong> pts</span>
                <span>Próximo: <strong id="display-proximo" style="color: #60a5fa;">1</strong></span>
            </div>
            <p class="instructions" id="info-instrucao">Clique nos pontos na ordem numérica correta (1 até 5).</p>
            
            <div id="game-board">
                <svg id="canvas-lines"></svg>
                <!-- Os pontos serão gerados dinamicamente aqui -->
            </div>

            <button id="btn-reiniciar" class="hidden" style="margin-top: 15px; background-color: #10b981;">Jogar Outra Ronda</button>
        </div>
    </div>

    <!-- Lógica do Firebase e do Jogo -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (Insira os seus dados)
        // ==========================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SUA_STORAGE_BUCKET",
            messagingSenderId: "SUA_MESSAGING_SENDER_ID",
            appId: "SUA_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variáveis de Estado do Jogo
        let idDocAtual = null;
        let pontuacaoAcumulada = 0;
        let proximoNumeroEsperado = 1;
        let pontosDaRonda = 20; // Pontos ganhos ao concluir com sucesso
        let coordenadasPontos = [];
        let ligacoesFeitas = [];

        // Elementos UI
        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const inputNome = document.getElementById('nome-jogador');
        const btnEntrar = document.getElementById('btn-entrar');
        const displayNome = document.getElementById('display-nome');
        const displayPontos = document.getElementById('display-pontos');
        const displayProximo = document.getElementById('display-proximo');
        const infoInstrucao = document.getElementById('info-instrucao');
        const gameBoard = document.getElementById('game-board');
        const canvasLines = document.getElementById('canvas-lines');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        // 1. LOGIN / VERIFICAÇÃO NO FIREBASE
        btnEntrar.addEventListener('click', async () => {
            const nome = inputNome.value.trim();
            if (!nome) {
                alert("Por favor, introduza o seu nome.");
                return;
            }

            // Normaliza o nome para criar um ID de documento único e seguro no Firestore
            idDocAtual = nome.toLowerCase().replace(/\s+/g, '_');
            const docRef = doc(db, "jogadores", idDocAtual);

            try {
                btnEntrar.disabled = true;
                btnEntrar.textContent = "A verificar base de dados...";

                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // Se já existe, resgata a pontuação acumulada gravada
                    pontuacaoAcumulada = docSnap.data().pontos || 0;
                } else {
                    // Se não existe, cria o documento inicial com 0 pontos
                    await setDoc(docRef, {
                        nome: nome,
                        pontos: 0,
                        ultimaAtualizacao: new Date()
                    });
                    pontuacaoAcumulada = 0;
                }

                // Atualiza a interface e exibe o jogo
                displayNome.textContent = nome;
                displayPontos.textContent = pontuacaoAcumulada;

                loginScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');

                iniciarNovoJogoRonda();

            } catch (error) {
                console.error("Erro ao ligar ao Firebase:", error);
                alert("Erro ao aceder à base de dados. Verifique a consola (F12) e as suas credenciais do Firebase.");
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar no Jogo";
            }
        });

        // 2. INICIAR / REINICIAR UMA RONDA DE LIGAR PONTOS
        function iniciarNovoJogoRonda() {
            proximoNumeroEsperado = 1;
            displayProximo.textContent = proximoNumeroEsperado;
            ligacoesFeitas = [];
            btnReiniciar.classList.add('hidden');
            infoInstrucao.textContent = "Clique nos pontos na ordem numérica correta (1 até 5).";

            // Limpa pontos e linhas anteriores do tabuleiro
            document.querySelectorAll('.dot').forEach(el => el.remove());
            canvasLines.innerHTML = '';

            // Definir posições aleatórias mas seguras para 5 pontos numerados
            coordenadasPontos = [
                { id: 1, x: 50, y: 80 },
                { id: 2, x: 150, y: 250 },
                { id: 3, x: 280, y: 100 },
                { id: 4, x: 380, y: 280 },
                { id: 5, x: 440, y: 120 }
            ];

            // Renderizar os pontos no tabuleiro
            coordenadasPontos.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.textContent = p.id;
                dot.style.left = `${p.x}px`;
                dot.style.top = `${p.y}px`;
                dot.dataset.id = p.id;

                dot.addEventListener('click', () => lidarComCliquePonto(p, dot));
                gameBoard.appendChild(dot);
            });
        }

        // 3. LÓGICA DE CLIQUE NOS PONTOS
        function lidarComCliquePonto(ponto, elementoDot) {
            if (ponto.id === proximoNumeroEsperado) {
                // Acertou na sequência correta
                elementoDot.classList.add('completed');
                ligacoesFeitas.push(ponto);

                if (proximoNumeroEsperado > 1) {
                    // Desenhar linha entre o ponto anterior e o atual
                    desenharLinha(ligacoesFeitas[ligacoesFeitas.length - 2], ponto);
                }

                proximoNumeroEsperado++;
                displayProximo.textContent = proximoNumeroEsperado <= 5 ? proximoNumeroEsperado : "Fim!";

                // Verificar se completou todos os pontos (ex: 5 pontos)
                if (proximoNumeroEsperado > 5) {
                    concluirRondaComSucesso();
                }
            } else if (ponto.id > proximoNumeroEsperado) {
                alert(`Ops! Esse é o ponto ${ponto.id}. Por favor, clique no ponto ${proximoNumeroEsperado}.`);
            }
        }

        // Desenhar linha SVG entre dois pontos
        function desenharLinha(p1, p2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', '#22c55e');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            canvasLines.appendChild(line);
        }

        // 4. CONCLUSÃO DA RONDA E ATUALIZAÇÃO NO FIREBASE
        async function concluirRondaComSucesso() {
            infoInstrucao.textContent = "🎉 Parabéns! Ligou todos os pontos com sucesso!";
            
            const docRef = doc(db, "jogadores", idDocAtual);

            try {
                // Atualiza a pontuação no Firestore de forma atómica
                await updateDoc(docRef, {
                    pontos: increment(pontosDaRonda),
                    ultimaAtualizacao: new Date()
                });

                // Atualiza a pontuação acumulada localmente
                pontuacaoAcumulada += pontosDaRonda;
                displayPontos.textContent = pontuacaoAcumulada;

                alert(`Parabéns! Ganhou ${pontosDaRonda} pontos nesta ronda.\nPontuação total acumulada guardada no servidor!`);

                // Mostra botão para iniciar outro jogo
                btnReiniciar.classList.remove('hidden');

            } catch (error) {
                console.error("Erro ao atualizar pontuação no Firebase:", error);
                alert("Os pontos foram conseguidos, mas ocorreu um erro ao salvar na base de dados.");
                btnReiniciar.classList.remove('hidden');
            }
        }

        // Botão para iniciar novo jogo mantendo o acumulado
        btnReiniciar.addEventListener('click', () => {
            iniciarNovoJogoRonda();
        });
    </script>
</body>
</html>
