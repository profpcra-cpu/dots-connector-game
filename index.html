<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Ligar Pontos - Brain Flow Master</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #0f172a;
            color: #fff;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .hidden {
            display: none !important;
        }
        .score-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0f172a;
            padding: 12px 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #334155;
            text-align: center;
        }
        #game-board {
            position: relative;
            width: 100%;
            height: 350px;
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            cursor: crosshair;
        }
        .dot {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
            user-select: none;
        }
        .dot:hover {
            background: #60a5fa;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .dot.completed {
            background: #22c55e;
        }
        #canvas-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .instructions {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="login-screen">
            <h2>Ligar Pontos</h2>
            <p class="instructions">Digite o seu nome para entrar ou recuperar o seu progresso:</p>
            <input type="text" id="nome-jogador" placeholder="O seu nome..." autocomplete="off">
            <button id="btn-entrar">Entrar no Jogo</button>
        </div>

        <!-- TELA DO JOGO -->
        <div id="game-screen" class="hidden">
            <h2>Olá, <span id="display-nome"></span>!</h2>
            <div class="score-board">
                <div>Nível: <br><strong id="display-nivel" style="color: #38bdf8;">1</strong></div>
                <div>Pontos: <br><strong id="display-pontos" style="color: #4ade80;">0</strong></div>
                <div>Próximo: <br><strong id="display-proximo" style="color: #60a5fa;">1</strong></div>
            </div>
            <p class="instructions" id="info-instrucao">Clique nos pontos na ordem numérica correta.</p>
            
            <div id="game-board">
                <svg id="canvas-lines"></svg>
            </div>

            <button id="btn-reiniciar" class="hidden" style="margin-top: 15px; background-color: #10b981;">Avançar de Nível</button>
        </div>
    </div>

    <!-- Script do Firebase Realtime Database e Lógica do Jogo -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiP8g18Ev_7yv05-etUcKRLa-P6xOsh8I",
            authDomain: "brain-flow-master.firebaseapp.com",
            databaseURL: "https://brain-flow-master-default-rtdb.firebaseio.com",
            projectId: "brain-flow-master",
            storageBucket: "brain-flow-master.firebasestorage.app",
            messagingSenderId: "137353474062",
            appId: "1:137353474062:web:b53db8e1cde4c341740c5f",
            measurementId: "G-XHCEYHY37W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        try { getAnalytics(app); } catch (e) {}

        let chaveJogadorAtual = null;
        let pontuacaoAcumulada = 0;
        let nivelAtual = 1;
        let totalPontosNivel = 5; // Começa com 5 pontos no Nível 1
        let proximoNumeroEsperado = 1;
        let coordenadasPontos = [];
        let ligacoesFeitas = [];

        const loginScreen = document.getElementById('login-screen');
        const gameScreen = document.getElementById('game-screen');
        const inputNome = document.getElementById('nome-jogador');
        const btnEntrar = document.getElementById('btn-entrar');
        const displayNome = document.getElementById('display-nome');
        const displayNivel = document.getElementById('display-nivel');
        const displayPontos = document.getElementById('display-pontos');
        const displayProximo = document.getElementById('display-proximo');
        const infoInstrucao = document.getElementById('info-instrucao');
        const gameBoard = document.getElementById('game-board');
        const canvasLines = document.getElementById('canvas-lines');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        btnEntrar.addEventListener('click', async () => {
            const nome = inputNome.value.trim();
            if (!nome) {
                alert("Por favor, introduza o seu nome.");
                return;
            }

            chaveJogadorAtual = nome.toLowerCase().replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
            const jogadorRef = ref(db, 'jogadores/' + chaveJogadorAtual);

            try {
                btnEntrar.disabled = true;
                btnEntrar.textContent = "A carregar perfil...";

                const snapshot = await get(jogadorRef);

                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    pontuacaoAcumulada = dados.pontos || 0;
                    nivelAtual = dados.nivel || 1;
                } else {
                    await set(jogadorRef, {
                        nome: nome,
                        pontos: 0,
                        nivel: 1,
                        ultimaAtualizacao: new Date().toISOString()
                    });
                    pontuacaoAcumulada = 0;
                    nivelAtual = 1;
                }

                displayNome.textContent = nome;
                displayPontos.textContent = pontuacaoAcumulada;
                displayNivel.textContent = nivelAtual;

                loginScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');

                iniciarNovoJogoRonda();

            } catch (error) {
                console.error("Erro ao ligar ao Firebase:", error);
                alert("Erro ao aceder à base de dados. Verifique a consola (F12).");
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar no Jogo";
            }
        });

        function iniciarNovoJogoRonda() {
            // A cada nível, adicionamos mais 2 pontos para aumentar a dificuldade (Nível 1=5 pts, Nível 2=7 pts, etc.)
            totalPontosNivel = 4 + (nivelAtual * 2);
            proximoNumeroEsperado = 1;
            displayProximo.textContent = proximoNumeroEsperado;
            displayNivel.textContent = nivelAtual;
            ligacoesFeitas = [];
            btnReiniciar.classList.add('hidden');
            infoInstrucao.textContent = `Nível ${nivelAtual}: Conecte de 1 até ${totalPontosNivel} em ordem crescente.`;

            document.querySelectorAll('.dot').forEach(el => el.remove());
            canvasLines.innerHTML = '';

            // Gerar posições aleatórias mas seguras dentro da caixa de jogo
            coordenadasPontos = [];
            const larguraMax = 420;
            const alturaMax = 280;

            for (let i = 1; i <= totalPontosNivel; i++) {
                let x, y, tentativas = 0;
                let sobreposto;
                do {
                    x = Math.floor(Math.random() * (larguraMax - 60)) + 40;
                    y = Math.floor(Math.random() * (alturaMax - 60)) + 40;
                    sobreposto = coordenadasPontos.some(p => Math.hypot(p.x - x, p.y - y) < 55);
                    tentativas++;
                } while (sobreposto && tentativas < 50);

                coordenadasPontos.push({ id: i, x, y });
            }

            coordenadasPontos.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.textContent = p.id;
                dot.style.left = `${p.x}px`;
                dot.style.top = `${p.y}px`;
                dot.dataset.id = p.id;

                dot.addEventListener('click', () => lidarComCliquePonto(p, dot));
                gameBoard.appendChild(dot);
            });
        }

        function lidarComCliquePonto(ponto, elementoDot) {
            if (ponto.id === proximoNumeroEsperado) {
                elementoDot.classList.add('completed');
                ligacoesFeitas.push(ponto);

                if (proximoNumeroEsperado > 1) {
                    desenharLinha(ligacoesFeitas[ligacoesFeitas.length - 2], ponto);
                }

                proximoNumeroEsperado++;
                displayProximo.textContent = proximoNumeroEsperado <= totalPontosNivel ? proximoNumeroEsperado : "Fim!";

                if (proximoNumeroEsperado > totalPontosNivel) {
                    concluirNivelComSucesso();
                }
            } else if (ponto.id > proximoNumeroEsperado) {
                alert(`Ops! Esse é o ponto ${ponto.id}. Clique no ponto ${proximoNumeroEsperado}.`);
            }
        }

        function desenharLinha(p1, p2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1.x);
            line.setAttribute('y1', p1.y);
            line.setAttribute('x2', p2.x);
            line.setAttribute('y2', p2.y);
            line.setAttribute('stroke', '#22c55e');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            canvasLines.appendChild(line);
        }

        async function concluirNivelComSucesso() {
            infoInstrucao.textContent = `🎉 Nível ${nivelAtual} Concluído com Sucesso!`;
            
            const pontosGanhos = nivelAtual * 10;
            pontuacaoAcumulada += pontosGanhos;
            nivelAtual++; // Avança o nível

            const jogadorRef = ref(db, 'jogadores/' + chaveJogadorAtual);

            try {
                await update(jogadorRef, {
                    pontos: pontuacaoAcumulada,
                    nivel: nivelAtual,
                    ultimaAtualizacao: new Date().toISOString()
                });

                displayPontos.textContent = pontuacaoAcumulada;
                displayNivel.textContent = nivelAtual;
                
                alert(`Parabéns! Passou o nível e ganhou ${pontosGanhos} pontos!\nProgresso guardado no Firebase.`);
                btnReiniciar.textContent = `Avançar para o Nível ${nivelAtual}`;
                btnReiniciar.classList.remove('hidden');

            } catch (error) {
                console.error("Erro ao atualizar progresso no Firebase:", error);
                alert("Progresso concluído, mas ocorreu um erro ao salvar na base de dados.");
                btnReiniciar.classList.remove('hidden');
            }
        }

        btnReiniciar.addEventListener('click', () => {
            iniciarNovoJogoRonda();
        });
    </script>
</body>
</html>
