<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Master: Link the Dots - Temas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            user-select: none;
        }

        /* Temas Dinâmicos via Variáveis / Classes */
        body.theme-cyber {
            background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%);
            color: #cdd6f4;
        }
        body.theme-cyber .glass-panel {
            background: rgba(30, 30, 46, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.theme-cyber .board-frame {
            background: #2b1d12;
            border: 10px solid #5c3d2e;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
        }

        body.theme-neon {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
        }
        body.theme-neon .glass-panel {
            background: rgba(15, 12, 41, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }
        body.theme-neon .board-frame {
            background: #090514;
            border: 8px solid #00f3ff;
            box-shadow: inset 0 0 20px rgba(0,243,255,0.5), 0 0 25px rgba(0,243,255,0.4);
        }

        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
        }
        body.theme-light .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        body.theme-light .board-frame {
            background: #cbd5e1;
            border: 8px solid #94a3b8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.1);
        }
        body.theme-light text-gray-400 { color: #64748b !important; }
        body.theme-light .text-white { color: #0f172a !important; }

        .glass-panel {
            backdrop-filter: blur(12px);
            border-radius: 20px;
        }
        .board-frame {
            border-radius: 20px;
        }
        .iq-progress {
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px currentColor); }
            50% { filter: drop-shadow(0 0 18px currentColor); }
        }
        .glow-effect {
            animation: pulse-glow 2s infinite;
        }
        .modal-bg {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="theme-cyber flex flex-col items-center justify-between h-screen p-3 md:p-6 select-none">

    <!-- Top Header & IQ Bar Section -->
    <header class="w-full max-w-md flex flex-col items-center gap-2.5 glass-panel p-3.5 shadow-xl">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-indigo-600/30 rounded-xl flex items-center justify-center text-indigo-400 font-bold text-lg border border-indigo-500/30">
                    <i class="fa-solid fa-puzzle-piece"></i>
                </div>
                <div>
                    <h1 class="text-xs text-gray-400 font-semibold tracking-wider">NÍVEL <span id="level-num" class="text-white text-base">1</span></h1>
                    <p id="level-name" class="text-[11px] text-indigo-400 font-medium">Grid 4x4 - Iniciante</p>
                </div>
            </div>

            <!-- Botão de Alternar Tema -->
            <button id="btn-theme-toggle" class="px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/30 rounded-xl text-xs font-semibold text-indigo-300 flex items-center gap-1.5 transition active:scale-95">
                <i class="fa-solid fa-palette"></i> <span id="theme-name">Cyber</span>
            </button>

            <!-- IQ Badge -->
            <div class="bg-gradient-to-r from-amber-500 to-orange-600 px-3 py-1.5 rounded-xl shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-brain text-white text-base"></i>
                <div class="flex flex-col">
                    <span class="text-[9px] text-amber-100 uppercase tracking-wider font-bold">QI</span>
                    <span id="iq-value" class="text-base font-black text-white leading-none">75</span>
                </div>
            </div>
        </div>

        <!-- IQ Meter Visual -->
        <div class="w-full">
            <div class="flex justify-between text-[10px] font-bold text-gray-400 mb-1 px-1">
                <span>75</span>
                <span>130</span>
                <span>180+</span>
            </div>
            <div class="w-full h-3 bg-gray-800/50 rounded-full p-0.5 relative overflow-hidden border border-gray-700/50">
                <div id="iq-bar" class="iq-progress h-full bg-gradient-to-r from-pink-500 via-yellow-400 to-cyan-400 rounded-full" style="width: 0%;"></div>
            </div>
        </div>
    </header>

    <!-- Canvas Game Container -->
    <main class="relative flex-1 w-full max-w-md my-2 flex items-center justify-center">
        <div class="board-frame relative w-full aspect-square max-w-[380px] max-h-[380px] p-2.5 flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full rounded-xl cursor-pointer touch-none"></canvas>
            <canvas id="confettiCanvas" class="absolute inset-0 w-full h-full pointer-events-none rounded-xl"></canvas>
        </div>
    </main>

    <!-- Control Buttons Bottom Bar -->
    <footer class="w-full max-w-md glass-panel p-3 shadow-xl flex items-center justify-around gap-2">
        <button id="btn-reset" class="flex-1 py-2 px-2 bg-gray-800/40 hover:bg-gray-700/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700/50">
            <i class="fa-solid fa-rotate-left text-amber-400 text-base"></i>
            <span class="text-[10px] font-semibold text-gray-300">Reiniciar</span>
        </button>

        <button id="btn-undo" class="flex-1 py-2 px-2 bg-gray-800/40 hover:bg-gray-700/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700/50">
            <i class="fa-solid fa-arrow-rotate-left text-blue-400 text-base"></i>
            <span class="text-[10px] font-semibold text-gray-300">Desfazer</span>
        </button>

        <button id="btn-hint" class="flex-1 py-2 px-2 bg-indigo-950/40 hover:bg-indigo-900/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-indigo-500/40 relative">
            <span id="hint-badge" class="absolute -top-1 -right-1 bg-indigo-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-gray-900">3</span>
            <i class="fa-solid fa-lightbulb text-yellow-300 text-base"></i>
            <span class="text-[10px] font-semibold text-indigo-200">Dica</span>
        </button>

        <button id="btn-levels" class="flex-1 py-2 px-2 bg-gray-800/40 hover:bg-gray-700/60 active:scale-95 transition rounded-xl flex flex-col items-center justify-center gap-1 border border-gray-700/50">
            <i class="fa-solid fa-grid-2 text-emerald-400 text-base"></i>
            <span class="text-[10px] font-semibold text-gray-300">Fases</span>
        </button>
    </footer>

    <!-- Level Win Modal -->
    <div id="win-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-gray-900/90 border border-indigo-500/30 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4">
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center text-3xl text-gray-900 shadow-lg shadow-amber-500/30 animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h2 class="text-xl font-extrabold text-white">Nível Concluído!</h2>
                <p class="text-xs text-gray-300 mt-1">Conexões perfeitas realizadas!</p>
            </div>
            <button id="btn-next-level" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">
                Próximo Nível <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Level Selection Modal -->
    <div id="levels-modal" class="fixed inset-0 modal-bg flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel bg-gray-900/95 border border-gray-700 p-5 rounded-3xl max-w-md w-full shadow-2xl flex flex-col gap-3 max-h-[80vh]">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-map text-indigo-400"></i> Seleção de Níveis
                </h2>
                <button id="btn-close-levels" class="w-7 h-7 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="levels-grid" class="grid grid-cols-4 gap-2.5 overflow-y-auto p-1 max-h-[55vh]"></div>
        </div>
    </div>

    <script>
        // Gerenciamento de Temas Visuais
        const themes = ['theme-cyber', 'theme-neon', 'theme-light'];
        const themeNames = ['Cyber', 'Neon', 'Clean'];
        let currentThemeIdx = 0;

        const themeBtn = document.getElementById('btn-theme-toggle');
        const themeLabel = document.getElementById('theme-name');

        themeBtn.addEventListener('click', () => {
            document.body.classList.remove(themes[currentThemeIdx]);
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            document.body.classList.add(themes[currentThemeIdx]);
            themeLabel.innerText = themeNames[currentThemeIdx];
            render();
        });

        // Motor de Áudio Simples (Web Audio API)
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playPop(freq = 440) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playWin() {
                if (!this.ctx) return;
                [440, 554, 659, 880].forEach((freq, idx) => {
                    setTimeout(() => this.playPop(freq), idx * 80);
                });
            }
        }
        const audio = new SoundEngine();

        // Estrutura de Fases do Jogo
        const COLOR_PALETTE = {
            red: { hex: '#ef4444' },
            blue: { hex: '#3b82f6' },
            green: { hex: '#22c55e' },
            yellow: { hex: '#eab308' },
            purple: { hex: '#a855f7' },
            orange: { hex: '#f97316' },
            cyan: { hex: '#06b6d4' }
        };

        const LEVELS = [
            { size: 4, title: "Grid 4x4 - Iniciante", dots: [{x:0,y:0,color:'green'},{x:3,y:3,color:'green'},{x:3,y:0,color:'red'},{x:2,y:2,color:'red'},{x:0,y:3,color:'blue'},{x:2,y:1,color:'blue'}] },
            { size: 4, title: "Grid 4x4 - Desafio Prático", dots: [{x:0,y:0,color:'red'},{x:2,y:3,color:'red'},{x:1,y:0,color:'yellow'},{x:3,y:2,color:'yellow'},{x:0,y:2,color:'blue'},{x:3,y:3,color:'blue'}] },
            { size: 5, title: "Grid 5x5 - Avançado", dots: [{x:0,y:1,color:'red'},{x:4,y:1,color:'red'},{x:1,y:0,color:'blue'},{x:3,y:4,color:'blue'},{x:0,y:4,color:'green'},{x:4,y:3,color:'green'},{x:2,y:2,color:'purple'},{x:4,y:4,color:'purple'}] }
        ];

        let currentLevelIdx = 0, gridCount = 4, cellSize = 0;
        let activeColor = null, isDrawing = false, paths = {}, currentPath = [];
        let IQ = 75;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            cellSize = rect.width / gridCount;
            render();
        }

        function loadLevel(idx) {
            currentLevelIdx = idx;
            const lvl = LEVELS[currentLevelIdx];
            gridCount = lvl.size;
            document.getElementById('level-num').innerText = currentLevelIdx + 1;
            document.getElementById('level-name').innerText = lvl.title;
            paths = {}; currentPath = []; isDrawing = false; activeColor = null;
            resizeCanvas();
        }

        function getCellCoords(pos) {
            return { x: pos.x * cellSize + cellSize / 2, y: pos.y * cellSize + cellSize / 2 };
        }

        function getGridPos(px, py) {
            const x = Math.floor(px / cellSize);
            const y = Math.floor(py / cellSize);
            return (x >= 0 && x < gridCount && y >= 0 && y < gridCount) ? { x, y } : null;
        }

        function render() {
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, width, height);

            // Desenhar linhas do grid de fundo conforme o tema atual
            ctx.strokeStyle = currentThemeIdx === 2 ? '#cbd5e1' : '#3d281a';
            ctx.lineWidth = 1.5;
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(width, i * cellSize); ctx.stroke();
            }

            // Desenhar caminhos concluídos
            Object.keys(paths).forEach(color => {
                drawPathLine(paths[color], color);
            });
            if (isDrawing && currentPath.length > 0) {
                drawPathLine(currentPath, activeColor);
            }

            // Desenhar Pontos (Bolinhas)
            LEVELS[currentLevelIdx].dots.forEach(dot => {
                const c = getCellCoords(dot);
                const palette = COLOR_PALETTE[dot.color];
                ctx.fillStyle = palette.hex;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.28, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawPathLine(pathArr, colorKey) {
            if (!pathArr || pathArr.length < 2) return;
            const palette = COLOR_PALETTE[colorKey] || { hex: '#fff' };
            ctx.save();
            ctx.strokeStyle = palette.hex;
            ctx.lineWidth = cellSize * 0.28;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            const start = getCellCoords(pathArr[0]);
            ctx.moveTo(start.x, start.y);
            for (let i = 1; i < pathArr.length; i++) {
                const pt = getCellCoords(pathArr[i]);
                ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
        }

        // Eventos de Toque e Mouse
        canvas.addEventListener('pointerdown', (e) => {
            audio.init();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const dot = LEVELS[currentLevelIdx].dots.find(d => d.x === gPos.x && d.y === gPos.y);
            if (dot) {
                activeColor = dot.color;
                isDrawing = true;
                currentPath = [{ x: gPos.x, y: gPos.y }];
                delete paths[activeColor];
                audio.playPop(400);
                render();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !activeColor) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const lastPt = currentPath[currentPath.length - 1];
            if (lastPt.x !== gPos.x || lastPt.y !== gPos.y) {
                const dx = Math.abs(gPos.x - lastPt.x);
                const dy = Math.abs(gPos.y - lastPt.y);
                if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
                    currentPath.push({ x: gPos.x, y: gPos.y });
                    audio.playPop(500);
                    render();
                }
            }
        });

        canvas.addEventListener('pointerup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentPath.length > 1) {
                paths[activeColor] = [...currentPath];
            }
            currentPath = [];
            render();
        });

        // Controles dos botões inferiores
        document.getElementById('btn-reset').addEventListener('click', () => loadLevel(currentLevelIdx));
        document.getElementById('btn-levels').addEventListener('click', () => {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            LEVELS.forEach((l, idx) => {
                const btn = document.createElement('button');
                btn.className = "p-3 bg-gray-800 hover:bg-gray-700 text-white rounded-xl font-bold text-sm border border-gray-700";
                btn.innerText = `Fase ${idx + 1}`;
                btn.onclick = () => { loadLevel(idx); document.getElementById('levels-modal').classList.add('hidden'); };
                grid.appendChild(btn);
            });
            document.getElementById('levels-modal').classList.remove('hidden');
        });
        document.getElementById('btn-close-levels').addEventListener('click', () => document.getElementById('levels-modal').classList.add('hidden'));

        window.addEventListener('resize', resizeCanvas);
        loadLevel(0);
    </script>
</body>
</html>
