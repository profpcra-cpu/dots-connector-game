<script>
        class SoundEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() { 
                if (!this.ctx) {
                    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } 
                    catch(e) { this.enabled = false; }
                }
            }
            playTone(freq, duration = 0.08, type = 'sine', volume = 0.15) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playPop(freq = 440) { this.playTone(freq, 0.08, 'sine', 0.15); }
            playConnect() { this.playTone(600, 0.1, 'triangle', 0.12); }
            playStar() { [659, 880, 1174].forEach((f, i) => setTimeout(() => this.playTone(f, 0.1, 'sine', 0.15), i * 60)); }
            playError() { this.playTone(200, 0.15, 'sawtooth', 0.1); }
            playHint() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.playTone(f, 0.12, 'sine', 0.12), i * 80)); }
            playWin() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.playTone(f, 0.15, 'triangle', 0.15), i * 100)); }
            playUndo() { this.playTone(300, 0.1, 'sine', 0.1); }
        }
        const audio = new SoundEngine();

        const COLOR_PALETTE = {
            red:     { hex: '#ef4444' },
            blue:    { hex: '#3b82f6' },
            green:   { hex: '#22c55e' },
            yellow:  { hex: '#eab308' },
            purple:  { hex: '#a855f7' },
            orange:  { hex: '#f97316' },
            cyan:    { hex: '#06b6d4' },
            pink:    { hex: '#ec4899' }
        };
        const ALL_COLORS = Object.keys(COLOR_PALETTE);

        const gridCount = 6;
        let pairsCount = 4;
        let cellSize = 0;
        let canvasSize = 0;
        let activeColor = null;
        let isDrawing = false;
        let paths = {};
        let currentPath = [];
        let pathHistory = [];
        let hintsLeft = 3;
        let IQ = 75;
        let playerName = "Paulo";
        let playerScore = 0;
        let currentDots = [];
        let currentStars = [];
        let collectedStars = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const effectCanvas = document.getElementById('effectCanvas');
        const effectCtx = effectCanvas.getContext('2d');

        async function registerPlayer() {
            const input = document.getElementById('player-nickname').value.trim();
            if (!input) return;

            playerName = input;
            document.getElementById('player-display').innerText = playerName;

            try {
                if (window.fsMethods && window.db) {
                    const { doc, getDoc, setDoc } = window.fsMethods;
                    const playerRef = doc(window.db, "players", playerName);
                    const playerSnap = await getDoc(playerRef);

                    if (playerSnap.exists()) {
                        const data = playerSnap.data();
                        IQ = data.iq || 75;
                        playerScore = data.score || 0;
                    } else {
                        await setDoc(playerRef, {
                            name: playerName,
                            score: 0,
                            iq: 75,
                            updatedAt: new Date()
                        });
                        IQ = 75;
                        playerScore = 0;
                    }
                }
                document.getElementById('iq-value').innerText = IQ;
            } catch (err) {
                console.error("Erro ao conectar ao Firebase:", err);
            }

            const modal = document.getElementById('auth-modal');
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 300);
            resizeCanvas();
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.style.opacity = '1', 10);
            } else {
                modal.style.opacity = '0';
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        async function openRanking() {
            toggleModal('rank-modal');
            const listEl = document.getElementById('ranking-list');
            listEl.innerHTML = '<p class="text-center text-gray-400">Carregando dados...</p>';

            try {
                if (!window.fsMethods || !window.db) {
                    listEl.innerHTML = '<p class="text-center text-amber-400">Sem conexão com o banco.</p>';
                    return;
                }
                const { collection, query, orderBy, limit, getDocs } = window.fsMethods;
                const q = query(collection(window.db, "players"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                listEl.innerHTML = '';
                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    listEl.innerHTML += `
                        <div class="flex justify-between items-center p-2 rounded-xl bg-gray-800/60 border border-gray-700/50">
                            <span class="font-bold text-amber-400">#${rank} ${item.name}</span>
                            <div class="flex gap-3 text-gray-300">
                                <span>Pts: <b>${item.score}</b></span>
                                <span>QI: <b>${item.iq}</b></span>
                            </div>
                        </div>
                    `;
                    rank++;
                });
            } catch (err) {
                console.error("Erro no ranking:", err);
                listEl.innerHTML = '<p class="text-center text-red-400">Erro ao carregar ranking.</p>';
            }
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasSize = Math.min(rect.width, rect.height);
            
            canvas.width = canvasSize * dpr; canvas.height = canvasSize * dpr;
            canvas.style.width = canvasSize + 'px'; canvas.style.height = canvasSize + 'px';
            effectCanvas.width = canvasSize * dpr; effectCanvas.height = canvasSize * dpr;
            effectCanvas.style.width = canvasSize + 'px'; effectCanvas.style.height = canvasSize + 'px';
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            effectCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cellSize = canvasSize / gridCount;
            render();
        }

        function generateRandomPuzzle() {
            const shuffled = [...ALL_COLORS].sort(() => Math.random() - 0.5).slice(0, pairsCount);
            currentDots = [];
            
            // Templates perfeitos alinhados sem conflitos para 3, 4 e 5 pares
            const templates = {
                3: [
                    {x: 1, y: 1}, {x: 4, y: 1},
                    {x: 1, y: 3}, {x: 4, y: 3},
                    {x: 1, y: 5}, {x: 4, y: 5}
                ],
                4: [
                    {x: 1, y: 0}, {x: 4, y: 0},
                    {x: 1, y: 2}, {x: 4, y: 2},
                    {x: 1, y: 4}, {x: 4, y: 4},
                    {x: 2, y: 1}, {x: 3, y: 5}
                ],
                5: [
                    {x: 0, y: 0}, {x: 5, y: 0},
                    {x: 0, y: 1}, {x: 5, y: 1},
                    {x: 0, y: 2}, {x: 5, y: 2},
                    {x: 0, y: 3}, {x: 5, y: 3},
                    {x: 0, y: 4}, {x: 5, y: 4}
                ]
            };

            let coords = templates[pairsCount] || templates[4];
            for(let i = 0; i < pairsCount; i++) {
                currentDots.push({x: coords[i*2].x, y: coords[i*2].y, color: shuffled[i]});
                currentDots.push({x: coords[i*2+1].x, y: coords[i*2+1].y, color: shuffled[i]});
            }

            currentStars = [{x: 2, y: 3}, {x: 3, y: 3}];
            initNewGameSession();
        }

        function initNewGameSession() {
            paths = {};
            currentPath = [];
            pathHistory = [];
            collectedStars = {};
            isDrawing = false;
            activeColor = null;
            hintsLeft = 3;
            document.getElementById('hint-badge').innerText = hintsLeft;
            resizeCanvas();
        }

        function setPairsCount(num) {
            pairsCount = num;
            for (let i = 3; i <= 5; i++) {
                const btn = document.getElementById(`btn-pairs-${i}`);
                btn.className = (i === num) ? "flex-1 py-0.5 text-[11px] font-bold rounded-lg transition bg-indigo-600 text-white" : "flex-1 py-0.5 text-[11px] font-bold rounded-lg transition text-gray-400 hover:text-white";
            }
            generateRandomPuzzle();
        }

        function getCellCoords(pos) {
            return { x: pos.x * cellSize + cellSize / 2, y: pos.y * cellSize + cellSize / 2 };
        }
        function getGridPos(px, py) {
            const x = Math.floor(px / cellSize);
            const y = Math.floor(py / cellSize);
            return (x >= 0 && x < gridCount && y >= 0 && y < gridCount) ? { x, y } : null;
        }
        function getDotAt(x, y) {
            return currentDots.find(d => d.x === x && d.y === y);
        }

        function render() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);

            ctx.strokeStyle = '#3d281a';
            ctx.lineWidth = 1.5;
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvasSize); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(canvasSize, i * cellSize); ctx.stroke();
            }

            Object.keys(paths).forEach(color => drawPathLine(paths[color], color, false));
            if (isDrawing && currentPath.length > 1) drawPathLine(currentPath, activeColor, true);

            currentDots.forEach(dot => {
                const c = getCellCoords(dot);
                const palette = COLOR_PALETTE[dot.color];
                ctx.save();
                ctx.shadowColor = palette.hex;
                ctx.shadowBlur = 12;
                ctx.fillStyle = palette.hex;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.28, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x, c.y, cellSize * 0.28, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawPathLine(pathArr, colorKey, isActive) {
            if (!pathArr || pathArr.length < 2) return;
            const palette = COLOR_PALETTE[colorKey] || { hex: '#fff' };
            ctx.save();
            ctx.strokeStyle = palette.hex;
            ctx.lineWidth = cellSize * 0.28;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = palette.hex;
            ctx.shadowBlur = isActive ? 15 : 8;
            ctx.beginPath();
            const start = getCellCoords(pathArr[0]);
            ctx.moveTo(start.x, start.y);
            for (let i = 1; i < pathArr.length; i++) {
                const pt = getCellCoords(pathArr[i]);
                ctx.lineTo(pt.x, pt.y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function isAdjacent(a, b) {
            const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
            return (dx === 1 && dy === 0) || (dx === 0 && dy === 1);
        }

        canvas.addEventListener('pointerdown', (e) => {
            audio.init(); e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const dot = getDotAt(gPos.x, gPos.y);
            if (dot) {
                if (paths[dot.color]) {
                    pathHistory.push({ type: 'remove', color: dot.color, path: [...paths[dot.color]] });
                    delete paths[dot.color];
                }
                activeColor = dot.color;
                isDrawing = true;
                currentPath = [{ x: gPos.x, y: gPos.y }];
                audio.playPop(400);
                render();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !activeColor) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const pos = { x: (e.clientX - rect.left) * (canvasSize / rect.width), y: (e.clientY - rect.top) * (canvasSize / rect.height) };
            const gPos = getGridPos(pos.x, pos.y);
            if (!gPos) return;

            const lastPt = currentPath[currentPath.length - 1];
            if (lastPt.x === gPos.x && lastPt.y === gPos.y) return;

            if (currentPath.length >= 2) {
                const prev = currentPath[currentPath.length - 2];
                if (prev.x === gPos.x && prev.y === gPos.y) {
                    currentPath.pop(); audio.playPop(350); render(); return;
                }
            }

            if (isAdjacent(lastPt, gPos)) {
                if (currentPath.some(p => p.x === gPos.x && p.y === gPos.y)) { audio.playError(); return; }

                currentPath.push({ x: gPos.x, y: gPos.y });
                audio.playPop(500 + currentPath.length * 20);
                
                const dot = getDotAt(gPos.x, gPos.y);
                if (dot && dot.color === activeColor && currentPath.length > 2) {
                    finishCurrentPath();
                    return;
                }
                render();
            }
        });

        canvas.addEventListener('pointerup', () => { if (isDrawing) finishCurrentPath(); });
        canvas.addEventListener('pointercancel', () => { if (isDrawing) finishCurrentPath(); });

        function finishCurrentPath() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentPath.length >= 2) {
                const first = currentPath[0], last = currentPath[currentPath.length - 1];
                const firstDot = getDotAt(first.x, first.y);
                const lastDot = getDotAt(last.x, last.y);
                
                if (firstDot && lastDot && firstDot.color === activeColor && lastDot.color === activeColor) {
                    paths[activeColor] = [...currentPath];
                    pathHistory.push({ type: 'add', color: activeColor, path: [...currentPath] });
                    audio.playConnect();
                    setTimeout(checkWin, 200);
                } else {
                    audio.playError();
                }
            } else {
                audio.playError();
            }
            currentPath = []; activeColor = null; render();
        }

        function undo() {
            if (pathHistory.length === 0) return;
            const last = pathHistory.pop();
            if (last.type === 'add') delete paths[last.color];
            else if (last.type === 'remove') paths[last.color] = last.path;
            audio.playUndo(); render();
        }

        function useHint() {
            if (hintsLeft <= 0) return;
            const colors = [...new Set(currentDots.map(d => d.color))];
            const unsolved = colors.filter(c => !paths[c] || paths[c].length < 2);
            if (unsolved.length === 0) return;

            const color = unsolved[0];
            const dotPair = currentDots.filter(d => d.color === color);
            if (dotPair.length === 2) {
                paths[color] = [{x: dotPair[0].x, y: dotPair[0].y}, {x: dotPair[1].x, y: dotPair[1].y}];
                hintsLeft--;
                document.getElementById('hint-badge').innerText = hintsLeft;
                audio.playHint();
                render();
                setTimeout(checkWin, 200);
            }
        }

        function triggerDirectWin() {
            const colors = [...new Set(currentDots.map(d => d.color))];
            colors.forEach(c => {
                const pair = currentDots.filter(d => d.color === c);
                if(pair.length === 2) paths[c] = [{x: pair[0].x, y: pair[0].y}, {x: pair[1].x, y: pair[1].y}];
            });
            render();
            checkWin();
        }

        async function checkWin() {
            const colors = [...new Set(currentDots.map(d => d.color))];
            let allConnected = true;
            for (const c of colors) {
                if (!paths[c] || paths[c].length < 2) { allConnected = false; break; }
            }
            if (!allConnected) return;

            const finalScore = 120;
            audio.playWin();
            IQ = Math.min(180, IQ + 12);
            document.getElementById('iq-value').innerText = IQ;
            playerScore += finalScore;

            try {
                if (window.fsMethods && window.db) {
                    const { doc, updateDoc } = window.fsMethods;
                    const playerRef = doc(window.db, "players", playerName);
                    await updateDoc(playerRef, {
                        score: playerScore,
                        iq: IQ,
                        updatedAt: new Date()
                    });
                }
            } catch (err) {
                console.error("Erro ao atualizar no Firestore:", err);
            }

            document.getElementById('win-score-display').innerText = finalScore;
            setTimeout(() => {
                const modal = document.getElementById('win-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.style.opacity = '1', 10);
            }, 300);
        }

        document.getElementById('btn-reset').addEventListener('click', initNewGameSession);
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-hint').addEventListener('click', useHint);
        document.getElementById('btn-new-random').addEventListener('click', generateRandomPuzzle);
        document.getElementById('btn-next-random').addEventListener('click', () => {
            const modal = document.getElementById('win-modal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.classList.add('hidden');
                generateRandomPuzzle();
            }, 300);
        });

        window.addEventListener('resize', () => resizeCanvas());
        generateRandomPuzzle();
    </script>
