<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desenho a Lápis — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 9px 12px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-nivel { color: var(--c-cyan); }
#display-tempo { color: #60a5fa; }
#display-pontos { color: var(--c-green); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
}

.paleta-cores {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}
.lapis-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, border-color 0.2s;
    padding: 0;
    flex-shrink: 0;
}
.lapis-btn.ativo {
    transform: scale(1.15);
    border-color: #fff;
    box-shadow: 0 0 15px currentColor;
}

#grid-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    background: #050914;
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#grid-container {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 4px;
    /* grid-template-columns e rows são aplicados via JS */
}

.cell {
    background: rgba(30, 41, 59, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: background 0.1s;
    min-width: 0;
    min-height: 0;
}
.cell.errado {
    animation: shake 0.4s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
.controls-grid.three {
    grid-template-columns: 1fr 1fr 1fr;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.btn-success { background: linear-gradient(135deg, #16a34a, #22c55e); }
.hidden { display: none !important; }

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 24px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 52px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay .countdown {
    font-size: 84px;
    font-weight: 800;
    color: var(--c-cyan);
    font-family: 'JetBrains Mono', monospace;
    animation: pulse-cd 1s infinite;
}
@keyframes pulse-cd {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.85; }
}
.overlay button {
    max-width: 260px;
}

.badge-nivel {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="livre">🎨 Modo Livre</button>
        <button class="mode-btn" data-mode="desafio">🧠 Desafio</button>
    </div>

    <div class="score-board">
        <div id="label-bloco1">Modo<br><strong id="display-nivel">Livre</strong></div>
        <div id="label-bloco2">Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div id="label-bloco3">Células<br><strong id="display-pontos">0/25</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">
        ✏️ Escolha um lápis de cor abaixo e arraste livremente para desenhar e preencher o tabuleiro!
    </p>

    <div class="paleta-cores" id="paleta-cores"></div>

    <div id="grid-wrapper">
        <div id="grid-container"></div>
        <div id="overlay" class="overlay hidden"></div>
    </div>

    <div class="controls-grid" id="controls-livre">
        <select id="select-tamanho">
            <option value="4">Grelha 4x4 (Fácil)</option>
            <option value="5" selected>Grelha 5x5 (Padrão)</option>
            <option value="6">Grelha 6x6 (Amplo)</option>
        </select>
        <button id="btn-reiniciar" class="btn-secondary">🔄 Limpar Tabuleiro</button>
    </div>

    <div class="controls-grid three hidden" id="controls-desafio">
        <button id="btn-iniciar-desafio">▶️ Iniciar</button>
        <button id="btn-dica" class="btn-secondary" disabled>💡 Dica</button>
        <button id="btn-confirmar" class="btn-success" disabled>✅ Confirmar</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-desenho] Inicializando...');

    // ==========================================================
    // CONSTANTES
    // ==========================================================
    var CORES = [
        '#f43f5e',
        '#38bdf8',
        '#fbbf24',
        '#4ade80',
        '#a855f7',
        '#fb923c'
    ];

    var NIVEIS_DESAFIO = [
        { tamanho: 4, celulas: 4,  tempo: 4.0 },
        { tamanho: 4, celulas: 6,  tempo: 3.5 },
        { tamanho: 4, celulas: 8,  tempo: 3.0 },
        { tamanho: 5, celulas: 8,  tempo: 3.5 },
        { tamanho: 5, celulas: 10, tempo: 3.0 },
        { tamanho: 5, celulas: 12, tempo: 2.5 },
        { tamanho: 6, celulas: 12, tempo: 3.0 },
        { tamanho: 6, celulas: 15, tempo: 2.5 },
        { tamanho: 6, celulas: 18, tempo: 2.0 },
        { tamanho: 6, celulas: 22, tempo: 1.8 }
    ];
    var MAX_NIVEL = NIVEIS_DESAFIO.length;

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = 'livre';
    var tamanhoGrelha = 5;
    var corAtual = CORES[0];
    var matrizDesenho = [];
    var desenhando = false;
    var segundos = 0;
    var timer = null;
    var jogoAtivo = true;

    var nivelAtual = 1;
    var pontosDesafio = 0;
    var matrizAlvo = [];
    var fase = 'idle';
    var dicasUsadas = 0;

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
        },
        play: function(freq, type, duration) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.08, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start();
                o.stop(this.ctx.currentTime + duration);
            } catch (e) {}
        },
        draw:   function() { this.play(440 + Math.random() * 200, 'sine', 0.08); },
        click:  function() { this.play(600, 'triangle', 0.1); },
        acerto: function() { var self = this; [523, 659, 783].forEach(function(f, i) { setTimeout(function() { self.play(f, 'sine', 0.18); }, i * 80); }); },
        erro:   function() { this.play(220, 'sawtooth', 0.2); var self = this; setTimeout(function() { self.play(160, 'sawtooth', 0.25); }, 100); },
        win:    function() { var self = this; [523, 659, 783, 1046].forEach(function(f, i) { setTimeout(function() { self.play(f, 'sine', 0.2); }, i * 100); }); },
        tick:   function() { this.play(880, 'square', 0.05); }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function formatarTempo(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function contarCelulasPreenchidas(matriz) {
        var count = 0;
        for (var r = 0; r < matriz.length; r++) {
            for (var c = 0; c < matriz[r].length; c++) {
                if (matriz[r][c] !== null) count++;
            }
        }
        return count;
    }

    function gerarPadraoAleatorio(tamanho, quantidade) {
        var grade = [];
        for (var i = 0; i < tamanho; i++) {
            var linha = [];
            for (var j = 0; j < tamanho; j++) linha.push(null);
            grade.push(linha);
        }
        var total = tamanho * tamanho;
        var qtd = Math.min(quantidade, total);

        var indices = [];
        while (indices.length < qtd) {
            var idx = Math.floor(Math.random() * total);
            if (indices.indexOf(idx) === -1) indices.push(idx);
        }

        for (var k = 0; k < indices.length; k++) {
            var id = indices[k];
            var r = Math.floor(id / tamanho);
            var c = id % tamanho;
            var cor = CORES[Math.floor(Math.random() * CORES.length)];
            grade[r][c] = cor;
        }

        return grade;
    }

    // ==========================================================
    // PALETA
    // ==========================================================
    function montarPaleta() {
        var paleta = $('paleta-cores');
        paleta.innerHTML = '';
        CORES.forEach(function(cor) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'lapis-btn' + (cor === corAtual ? ' ativo' : '');
            btn.style.backgroundColor = cor;
            btn.style.color = cor;
            btn.setAttribute('aria-label', 'Selecionar cor ' + cor);
            btn.addEventListener('click', function() {
                corAtual = cor;
                var todos = document.querySelectorAll('.lapis-btn');
                for (var i = 0; i < todos.length; i++) todos[i].classList.remove('ativo');
                btn.classList.add('ativo');
                som.click();
            });
            paleta.appendChild(btn);
        });
    }

    // ==========================================================
    // GRID DOM
    // ==========================================================
    var listenersGlobaisAtivos = false;

    function montarDOMGrid() {
        var gridContainer = $('grid-container');
        gridContainer.innerHTML = '';

        // Aplica o grid template via JS de forma explícita
        gridContainer.style.display = 'grid';
        gridContainer.style.gridTemplateColumns = 'repeat(' + tamanhoGrelha + ', 1fr)';
        gridContainer.style.gridTemplateRows = 'repeat(' + tamanhoGrelha + ', 1fr)';
        gridContainer.style.width = '100%';
        gridContainer.style.height = '100%';
        gridContainer.style.gap = '4px';

        var interativo = (modoAtual === 'livre' && jogoAtivo) ||
                         (modoAtual === 'desafio' && fase === 'reproduzindo');

        for (var r = 0; r < tamanhoGrelha; r++) {
            for (var c = 0; c < tamanhoGrelha; c++) {
                var cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;

                if (interativo) {
                    cell.style.cursor = 'pointer';
                    (function(rr, cc) {
                        cell.addEventListener('mousedown', function(e) { e.preventDefault(); iniciarPintura(rr, cc); });
                        cell.addEventListener('mouseenter', function() { continuarPintura(rr, cc); });
                        cell.addEventListener('touchstart', function(e) { e.preventDefault(); iniciarPintura(rr, cc); }, { passive: false });
                        cell.addEventListener('touchmove', function(e) {
                            e.preventDefault();
                            var touch = e.touches[0];
                            var target = document.elementFromPoint(touch.clientX, touch.clientY);
                            if (target && target.classList.contains('cell')) {
                                continuarPintura(parseInt(target.dataset.r, 10), parseInt(target.dataset.c, 10));
                            }
                        }, { passive: false });
                    })(r, c);
                } else {
                    cell.style.cursor = 'default';
                }

                gridContainer.appendChild(cell);
            }
        }

        if (!listenersGlobaisAtivos) {
            window.addEventListener('mouseup', finalizarPintura);
            window.addEventListener('touchend', finalizarPintura);
            listenersGlobaisAtivos = true;
        }

        atualizarVisualGrid();
    }

    // ==========================================================
    // PINTURA
    // ==========================================================
    function iniciarPintura(r, c) {
        if (modoAtual === 'livre' && !jogoAtivo) return;
        if (modoAtual === 'desafio' && fase !== 'reproduzindo') return;
        desenhando = true;
        aplicarCor(r, c);
    }

    function continuarPintura(r, c) {
        if (!desenhando) return;
        aplicarCor(r, c);
    }

    function finalizarPintura() { desenhando = false; }

    function aplicarCor(r, c) {
        if (!matrizDesenho[r] || matrizDesenho[r][c] === undefined) return;
        var corAntiga = matrizDesenho[r][c];
        if (corAntiga === corAtual) {
            matrizDesenho[r][c] = null;
        } else {
            matrizDesenho[r][c] = corAtual;
        }

        som.draw();
        atualizarVisualGrid();
        if (modoAtual === 'livre') {
            atualizarEstatisticasLivre();
            verificarPreenchimentoTotalLivre();
        } else {
            atualizarEstatisticasDesafio();
        }
    }

    function atualizarVisualGrid() {
        var cells = document.querySelectorAll('.cell');
        for (var i = 0; i < cells.length; i++) {
            var cell = cells[i];
            var r = parseInt(cell.dataset.r, 10);
            var c = parseInt(cell.dataset.c, 10);

            var cor;
            if (modoAtual === 'desafio' && fase === 'memorizando') {
                cor = matrizAlvo[r][c];
            } else {
                cor = matrizDesenho[r][c];
            }

            if (cor) {
                cell.style.background = cor;
                cell.style.borderColor = '#ffffff';
            } else {
                cell.style.background = 'rgba(30, 41, 59, 0.4)';
                cell.style.borderColor = 'rgba(255, 255, 255, 0.04)';
            }
        }
    }

    // ==========================================================
    // ESTATÍSTICAS
    // ==========================================================
    function atualizarEstatisticasLivre() {
        var preenchidas = contarCelulasPreenchidas(matrizDesenho);
        var total = tamanhoGrelha * tamanhoGrelha;
        $('display-pontos').textContent = preenchidas + '/' + total;
        $('display-nivel').textContent = 'Livre';
    }

    function atualizarEstatisticasDesafio() {
        var preenchidas = contarCelulasPreenchidas(matrizDesenho);
        var totalAlvo = contarCelulasPreenchidas(matrizAlvo);
        $('display-nivel').textContent = 'Nv ' + nivelAtual + '/' + MAX_NIVEL;
        $('display-pontos').textContent = preenchidas + '/' + totalAlvo;
        $('display-tempo').textContent = formatarTempo(segundos);
    }

    // ==========================================================
    // TIMER
    // ==========================================================
    function iniciarTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(function() {
            if (modoAtual === 'livre' && !jogoAtivo) return;
            if (modoAtual === 'desafio' && fase !== 'reproduzindo') return;

            segundos++;
            $('display-tempo').textContent = formatarTempo(segundos);
        }, 1000);
    }

    function pararTimer() { if (timer) { clearInterval(timer); timer = null; } }

    // ==========================================================
    // VERIFICAÇÕES
    // ==========================================================
    function verificarPreenchimentoTotalLivre() {
        var preenchidas = contarCelulasPreenchidas(matrizDesenho);
        var total = tamanhoGrelha * tamanhoGrelha;
        if (preenchidas === total && jogoAtivo) {
            jogoAtivo = false;
            pararTimer();
            som.win();
            mostrarOverlay({
                titulo: '🎨 Obra Completa!',
                subtitulo: 'Excelente trabalho artístico! Você preencheu ' + total + ' células em ' + formatarTempo(segundos) + '.',
                botao: { texto: '🔄 Jogar Novamente', acao: function() { inicializarModoLivre(tamanhoGrelha); } }
            });
        }
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var overlay = $('overlay');
        overlay.classList.add('hidden');
        overlay.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var overlay = $('overlay');
        overlay.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            overlay.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            overlay.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            overlay.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            overlay.appendChild(btn);
        }
        if (cfg.botaoSecundario) {
            var btn2 = document.createElement('button');
            btn2.textContent = cfg.botaoSecundario.texto;
            btn2.className = 'btn-secondary';
            btn2.addEventListener('click', cfg.botaoSecundario.acao);
            overlay.appendChild(btn2);
        }

        overlay.classList.remove('hidden');
    }

    // ==========================================================
    // MODOS
    // ==========================================================
    function inicializarModoLivre(tam) {
        tamanhoGrelha = tam;
        matrizDesenho = [];
        for (var i = 0; i < tamanhoGrelha; i++) {
            var linha = [];
            for (var j = 0; j < tamanhoGrelha; j++) linha.push(null);
            matrizDesenho.push(linha);
        }
        segundos = 0;
        jogoAtivo = true;

        montarPaleta();
        montarDOMGrid();
        atualizarEstatisticasLivre();
        $('display-tempo').textContent = '00:00';
        iniciarTimer();
        esconderOverlay();
    }

    function inicializarModoDesafio() {
        nivelAtual = 1;
        pontosDesafio = 0;
        iniciarNivel();
    }

    function iniciarNivel() {
        var cfg = NIVEIS_DESAFIO[nivelAtual - 1];
        tamanhoGrelha = cfg.tamanho;
        matrizAlvo = gerarPadraoAleatorio(cfg.tamanho, cfg.celulas);
        matrizDesenho = [];
        for (var i = 0; i < cfg.tamanho; i++) {
            var linha = [];
            for (var j = 0; j < cfg.tamanho; j++) linha.push(null);
            matrizDesenho.push(linha);
        }
        dicasUsadas = 0;
        fase = 'memorizando';
        segundos = 0;

        montarPaleta();
        montarDOMGrid();
        atualizarEstatisticasDesafio();
        atualizarBotoesDesafio();
        mostrarOverlayMemorizacao(cfg.tempo);
    }

    function mostrarOverlayMemorizacao(tempoTotal) {
        var restante = Math.ceil(tempoTotal);
        var overlay = $('overlay');
        overlay.innerHTML = '';
        overlay.classList.remove('hidden');

        var badge = document.createElement('div');
        badge.className = 'badge-nivel';
        badge.textContent = 'Nível ' + nivelAtual + ' de ' + MAX_NIVEL;
        overlay.appendChild(badge);

        var titulo = document.createElement('h2');
        titulo.textContent = '👀 Memorize o padrão!';
        overlay.appendChild(titulo);

        var countdown = document.createElement('div');
        countdown.className = 'countdown';
        countdown.textContent = restante;
        overlay.appendChild(countdown);

        var sub = document.createElement('div');
        sub.className = 'subtitulo';
        sub.textContent = 'Você terá que reproduzi-lo de memória.';
        overlay.appendChild(sub);

        var tickAnterior = restante;
        var interval = setInterval(function() {
            restante -= 0.1;
            if (restante <= 0) {
                clearInterval(interval);
                iniciarFaseReproducao();
                return;
            }
            var ceil = Math.ceil(restante);
            if (ceil !== tickAnterior) {
                tickAnterior = ceil;
                som.tick();
            }
            countdown.textContent = ceil;
        }, 100);
    }

    function iniciarFaseReproducao() {
        fase = 'reproduzindo';
        segundos = 0;
        matrizDesenho = [];
        for (var i = 0; i < tamanhoGrelha; i++) {
            var linha = [];
            for (var j = 0; j < tamanhoGrelha; j++) linha.push(null);
            matrizDesenho.push(linha);
        }

        esconderOverlay();
        montarDOMGrid();
        atualizarEstatisticasDesafio();
        atualizarBotoesDesafio();

        $('info-instrucao').textContent =
            '✏️ Reproduza o padrão de memória! Use as cores corretas e toque em ✅ Confirmar quando terminar.';
    }

    function atualizarBotoesDesafio() {
        var btnIniciar = $('btn-iniciar-desafio');
        var btnDica = $('btn-dica');
        var btnConf = $('btn-confirmar');

        if (fase === 'idle') {
            btnIniciar.disabled = false;
            btnIniciar.textContent = '▶️ Iniciar';
            btnDica.disabled = true;
            btnConf.disabled = true;
        } else if (fase === 'memorizando') {
            btnIniciar.disabled = true;
            btnDica.disabled = true;
            btnConf.disabled = true;
        } else if (fase === 'reproduzindo') {
            btnIniciar.disabled = true;
            btnDica.disabled = dicasUsadas >= 1;
            btnDica.textContent = dicasUsadas >= 1 ? '💡 Usada' : '💡 Dica';
            btnConf.disabled = false;
        } else {
            btnIniciar.disabled = true;
            btnDica.disabled = true;
            btnConf.disabled = true;
        }
    }

    function usarDica() {
        if (fase !== 'reproduzindo' || dicasUsadas >= 1) return;
        dicasUsadas++;

        var overlay = $('overlay');
        overlay.innerHTML = '';
        overlay.style.background = 'rgba(5, 9, 20, 0.75)';
        overlay.classList.remove('hidden');

        var titulo = document.createElement('h2');
        titulo.textContent = '💡 Dica';
        overlay.appendChild(titulo);

        var sub = document.createElement('div');
        sub.className = 'subtitulo';
        sub.textContent = 'Observe bem... 1.5s';
        overlay.appendChild(sub);

        var cells = document.querySelectorAll('.cell');
        for (var i = 0; i < cells.length; i++) {
            var cell = cells[i];
            var r = parseInt(cell.dataset.r, 10);
            var c = parseInt(cell.dataset.c, 10);
            var corAlvo = matrizAlvo[r][c];
            if (corAlvo && !matrizDesenho[r][c]) {
                cell.style.boxShadow = 'inset 0 0 0 2px ' + corAlvo + ', 0 0 10px ' + corAlvo;
            }
        }

        som.click();
        setTimeout(function() {
            overlay.style.background = 'rgba(5, 9, 20, 0.92)';
            for (var i = 0; i < cells.length; i++) {
                var cell = cells[i];
                var r = parseInt(cell.dataset.r, 10);
                var c = parseInt(cell.dataset.c, 10);
                if (!matrizDesenho[r][c]) {
                    cell.style.boxShadow = 'none';
                }
            }
            esconderOverlay();
            atualizarBotoesDesafio();
        }, 1500);

        atualizarBotoesDesafio();
    }

    function confirmarResposta() {
        if (fase !== 'reproduzindo') return;
        fase = 'resultado';

        var erros = 0;
        var faltando = 0;

        for (var r = 0; r < tamanhoGrelha; r++) {
            for (var c = 0; c < tamanhoGrelha; c++) {
                var alvo = matrizAlvo[r][c];
                var feito = matrizDesenho[r][c];

                var ehErro = false;
                if (alvo === null && feito !== null) { erros++; ehErro = true; }
                else if (alvo !== null && feito === null) { faltando++; ehErro = true; }
                else if (alvo !== null && feito !== null && alvo !== feito) { erros++; ehErro = true; }

                if (ehErro) {
                    var cell = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
                    if (cell) cell.classList.add('errado');
                }
            }
        }

        var totalAlvo = contarCelulasPreenchidas(matrizAlvo);
        var acertosAlvo = contarAcertosAlvo();
        var pontosNivel = acertosAlvo * 10 - erros * 5 - faltando * 5 - dicasUsadas * 15;
        pontosNivel = Math.max(0, pontosNivel);

        pontosDesafio += pontosNivel;

        if (acertosAlvo === totalAlvo && erros === 0 && faltando === 0) {
            som.acerto();
        } else {
            som.erro();
        }

        var perfeito = (acertosAlvo === totalAlvo && erros === 0 && faltando === 0);
        var htmlExtra =
            '<div class="grande">+' + pontosNivel + '</div>' +
            '<div style="display:flex; gap:14px; justify-content:center; margin-top:10px; font-size:13px;">' +
                '<span style="color:var(--c-green)">✅ ' + acertosAlvo + ' certas</span>' +
                '<span style="color:var(--c-red)">❌ ' + erros + ' erradas</span>' +
                '<span style="color:var(--c-amber)">⚠️ ' + faltando + ' faltando</span>' +
            '</div>' +
            (dicasUsadas > 0 ? '<div style="font-size:12px; color:var(--text-muted); margin-top:6px;">💡 Dica usada: -15 pontos</div>' : '');

        var ultimo = (nivelAtual >= MAX_NIVEL);
        mostrarOverlay({
            titulo: perfeito ? '🌟 Perfeito!' : '📊 Resultado',
            htmlExtra: htmlExtra,
            subtitulo: 'Pontuação total: ' + pontosDesafio + ' pts',
            botao: {
                texto: ultimo ? '🏁 Ver Resultado Final' : '➡️ Próximo Nível',
                acao: function() {
                    if (ultimo) {
                        finalizarDesafio();
                    } else {
                        nivelAtual++;
                        esconderOverlay();
                        iniciarNivel();
                    }
                }
            },
            botaoSecundario: {
                texto: '🔄 Repetir Nível',
                acao: function() {
                    esconderOverlay();
                    iniciarNivel();
                }
            }
        });

        atualizarBotoesDesafio();
    }

    function contarAcertosAlvo() {
        var acertos = 0;
        for (var r = 0; r < tamanhoGrelha; r++) {
            for (var c = 0; c < tamanhoGrelha; c++) {
                if (matrizAlvo[r][c] !== null && matrizAlvo[r][c] === matrizDesenho[r][c]) {
                    acertos++;
                }
            }
        }
        return acertos;
    }

    function finalizarDesafio() {
        fase = 'finalizado';
        var maxPossivel = NIVEIS_DESAFIO.reduce(function(acc, n) { return acc + n.celulas * 10; }, 0);
        var percentual = (pontosDesafio / maxPossivel) * 100;

        var medalha, titulo, msg;
        if (percentual >= 90) {
            medalha = '🏆'; titulo = 'Mestre da Memória!';
            msg = 'Impressionante! Você tem uma memória visual extraordinária.';
        } else if (percentual >= 70) {
            medalha = '🥇'; titulo = 'Olhar de Águia!';
            msg = 'Excelente! Sua percepção visual está muito afiada.';
        } else if (percentual >= 50) {
            medalha = '🥈'; titulo = 'Aprendiz Atento!';
            msg = 'Bom trabalho! Continue treinando para melhorar ainda mais.';
        } else {
            medalha = '🥉'; titulo = 'Iniciante Curioso!';
            msg = 'Todo mestre começou assim. Tente novamente!';
        }

        som.win();

        mostrarOverlay({
            titulo: medalha + ' ' + titulo,
            htmlExtra: '<div class="grande">' + pontosDesafio + ' pts</div>',
            subtitulo: msg,
            botao: {
                texto: '🔄 Jogar Novamente',
                acao: function() {
                    esconderOverlay();
                    inicializarModoDesafio();
                }
            }
        });

        atualizarBotoesDesafio();
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;
        pararTimer();
        esconderOverlay();
        desenhando = false;
        fase = 'idle';

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        $('controls-livre').classList.toggle('hidden', novoModo !== 'livre');
        $('controls-desafio').classList.toggle('hidden', novoModo !== 'desafio');

        if (novoModo === 'livre') {
            $('label-bloco1').innerHTML = 'Modo<br><strong id="display-nivel">Livre</strong>';
            $('label-bloco3').innerHTML = 'Células<br><strong id="display-pontos">0/25</strong>';
            $('info-instrucao').textContent =
                '✏️ Escolha um lápis de cor abaixo e arraste livremente para desenhar e preencher o tabuleiro!';
            var tam = parseInt($('select-tamanho').value, 10);
            inicializarModoLivre(tam);
        } else {
            $('label-bloco1').innerHTML = 'Nível<br><strong id="display-nivel">Nv 1/10</strong>';
            $('label-bloco3').innerHTML = 'Pintadas<br><strong id="display-pontos">0/0</strong>';
            $('info-instrucao').textContent =
                '🧠 Memorize o padrão exibido, espere esconder, e reproduza-o de memória!';
            tamanhoGrelha = 5;
            matrizDesenho = [];
            for (var i2 = 0; i2 < 5; i2++) {
                var linha = [];
                for (var j2 = 0; j2 < 5; j2++) linha.push(null);
                matrizDesenho.push(linha);
            }
            matrizAlvo = [];
            for (var i3 = 0; i3 < 5; i3++) {
                var linha2 = [];
                for (var j3 = 0; j3 < 5; j3++) linha2.push(null);
                matrizAlvo.push(linha2);
            }
            montarPaleta();
            montarDOMGrid();
            atualizarBotoesDesafio();
            $('display-tempo').textContent = '00:00';
            $('display-nivel').textContent = 'Nv ' + nivelAtual + '/' + MAX_NIVEL;
            $('display-pontos').textContent = '0/0';
        }

        iniciarTimer();
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-reiniciar').addEventListener('click', function() {
        inicializarModoLivre(tamanhoGrelha);
    });

    $('select-tamanho').addEventListener('change', function(e) {
        inicializarModoLivre(parseInt(e.target.value, 10));
    });

    $('btn-iniciar-desafio').addEventListener('click', function() {
        if (fase === 'finalizado') {
            inicializarModoDesafio();
        } else {
            if (nivelAtual === 1 && pontosDesafio === 0) {
                inicializarModoDesafio();
            } else {
                iniciarNivel();
            }
        }
    });

    $('btn-dica').addEventListener('click', usarDica);
    $('btn-confirmar').addEventListener('click', confirmarResposta);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    inicializarModoLivre(5);
    console.log('[brain-desenho] Pronto! Grid:', tamanhoGrelha + 'x' + tamanhoGrelha);
})();
</script>
</body>
</html>
