<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória 4x4 - Brain Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(148, 163, 184, 0.15);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.18);
            --input-bg: rgba(15, 23, 42, 0.7);
            --btn-primary: #3b82f6;
            --btn-accent: #1d4ed8;
            --cell-bg: #1e293b;
            --cell-hover: #334155;
            --cell-flipped: #3b82f6;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
        }
        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --text-muted: #475569;
            --input-bg: rgba(241, 245, 249, 0.8);
            --cell-bg: #cbd5e1;
            --cell-hover: #94a3b8;
            --cell-flipped: #2563eb;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed; color: var(--text-color);
            margin: 0; padding: 16px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            position: relative; background: var(--card-bg); backdrop-filter: blur(18px);
            padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
            width: 100%; max-width: 420px; text-align: center; border: 1px solid var(--card-border);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .btn-small {
            padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
            background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-muted); cursor: pointer;
            text-decoration: none; display: inline-flex; align-items: center;
        }
        .btn-small:hover { color: var(--text-color); }
        .brain-meter {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--input-bg); padding: 8px 14px; border-radius: 12px; margin-bottom: 12px;
            border: 1px solid var(--border-color); font-size: 13px; font-weight: bold;
        }
        .score-board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            background: var(--input-bg); padding: 8px; border-radius: 12px; margin-bottom: 12px;
            font-size: 11px; text-transform: uppercase; font-weight: 600; border: 1px solid var(--border-color);
        }
        .score-board strong { font-size: 14px; font-family: 'JetBrains Mono', monospace; }
        .instructions { font-size: 12.5px; color: var(--text-muted); margin-bottom: 15px; }
        
        /* Grelha do Jogo da Memória 4x4 */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            aspect-ratio: 1;
            margin: 0 auto 15px auto;
        }
        .memory-card {
            background-color: var(--cell-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }
        .memory-card:hover { transform: scale(1.03); }
        .memory-card.flipped {
            background-color: var(--cell-flipped);
            color: #ffffff;
            transform: rotateY(180deg);
        }
        .memory-card.matched {
            background-color: #10b981;
            color: #ffffff;
            opacity: 0.85;
            cursor: default;
        }

        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
        button {
            width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent)); color: white; border: none; cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        .btn-secondary { background: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="btn-small">🏠 Menu Hub</a>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
        <div class="brain-meter">
            <div>🧠 <span id="qi-cerebro">90</span></div>
            <div>Memória 4x4 🧩</div>
            <div>⚡ <span id="qi-einstein">185</span></div>
        </div>
        <div class="score-board">
            <div>Tentativas<br><strong id="display-erros" style="color: #38bdf8;">0</strong></div>
            <div>Tempo<br><strong id="display-tempo" style="color: #60a5fa;">00:00</strong></div>
            <div>Pares<br><strong id="display-pares" style="color: #10b981;">0/8</strong></div>
        </div>
        <p class="instructions" id="info-instrucao">Encontre os 8 pares escondidos na matriz.</p>
        
        <div class="memory-grid" id="memory-board"></div>

        <div class="controls-grid">
            <button id="btn-novo" class="btn-secondary">🔄 Novo Jogo</button>
        </div>
    </div>

    <script>
        let segundos = 0, timerInterval = null, tentativas = 0, paresEncontrados = 0;
        let primeiraCarta = null, segundaCarta = null, bloqueioTabuleiro = false;

        // Ícones/Emojis para formar os 8 pares da matriz 4x4 (16 posições)
        const simbolos = ['🚀', '💡', '⚡', '🎯', '🔮', '🧩', '🎨', '🔥'];

        const boardEl = document.getElementById('memory-board');
        const displayTempo = document.getElementById('display-tempo');
        const displayErros = document.getElementById('display-erros');
        const displayPares = document.getElementById('display-pares');
        const infoInstrucao = document.getElementById('info-instrucao');
        const themeToggleBtn = document.getElementById('theme-toggle');

        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('brain_flow_theme', next);
        });

        function formatarTempo(seg) {
            return `${String(Math.floor(seg / 60)).padStart(2, '0')}:${String(seg % 60).padStart(2, '0')}`;
        }

        function iniciarJogo() {
            clearInterval(timerInterval);
            segundos = 0;
            tentativas = 0;
            paresEncontrados = 0;
            primeiraCarta = null;
            segundaCarta = null;
            bloqueioTabuleiro = false;

            displayErros.textContent = tentativas;
            displayPares.textContent = `${paresEncontrados}/8`;
            infoInstrucao.textContent = "Encontre os 8 pares escondidos na matriz.";

            timerInterval = setInterval(() => {
                segundos++;
                displayTempo.textContent = formatarTempo(segundos);
            }, 1000);

            // Duplicar símbolos para criar 8 pares (16 cartas) e baralhar
            const cartasBaralhadas = [...simbolos, ...simbolos]
                .sort(() => Math.random() - 0.5);

            renderizarTabuleiro(cartasBaralhadas);
        }

        function renderizarTabuleiro(cartas) {
            boardEl.innerHTML = '';
            cartas.forEach(simbolo => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.dataset.simbolo = simbolo;
                card.addEventListener('click', virarCarta);
                boardEl.appendChild(card);
            });
        }

        function virarCarta() {
            if (bloqueioTabuleiro) return;
            if (this === primeiraCarta) return;
            if (this.classList.contains('matched')) return;

            this.classList.add('flipped');
            this.textContent = this.dataset.simbolo;

            if (!primeiraCarta) {
                primeiraCarta = this;
                return;
            }

            segundaCarta = this;
            tentativas++;
            displayErros.textContent = tentativas;
            verificarCorrespondencia();
        }

        function verificarCorrespondencia() {
            const ehPar = primeiraCarta.dataset.simbolo === segundaCarta.dataset.simbolo;

            if (ehPar) {
                desativarCartas();
            } else {
                desvirarCartas();
            }
        }

        function desativarCartas() {
            primeiraCarta.classList.add('matched');
            segundaCarta.classList.add('matched');
            paresEncontrados++;
            displayPares.textContent = `${paresEncontrados}/8`;

            resetarTabuleiro();

            if (paresEncontrados === 8) {
                clearInterval(timerInterval);
                infoInstrucao.textContent = `🎉 Incrível! Concluiu em ${formatarTempo(segundos)} com ${tentativas} tentativas!`;
            }
        }

        function desvirarCartas() {
            bloqueioTabuleiro = true;
            setTimeout(() => {
                primeiraCarta.classList.remove('flipped');
                primeiraCarta.textContent = '';
                segundaCarta.classList.remove('flipped');
                segundaCarta.textContent = '';
                resetarTabuleiro();
            }, 900);
        }

        function resetarTabuleiro() {
            [primeiraCarta, segundaCarta, bloqueioTabuleiro] = [null, null, false];
        }

        document.getElementById('btn-novo').addEventListener('click', iniciarJogo);

        iniciarJogo();
    </script>
</body>
</html>
