<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Master - Brain Hub</title>
    
    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-primary: #6366f1;
            --btn-primary-hover: #4f46e5;
            --cell-fixed: #334155;
            --cell-error: rgba(239, 68, 68, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --btn-primary: #4f46e5;
            --btn-primary-hover: #4338ca;
            --cell-fixed: #e2e8f0;
            --cell-error: rgba(239, 68, 68, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-small {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            width: auto;
            margin: 0;
        }
        .btn-small:hover {
            background: var(--border-color);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        /* TABULEIRO SUDOKU 9x9 COM DIVISÕES 3x3 */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: var(--border-color);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .sudoku-cell {
            aspect-ratio: 1;
            background: var(--input-bg);
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
            outline: none;
            padding: 0;
        }

        /* Linhas grossas para separar as caixas 3x3 */
        .sudoku-cell:nth-child(9n+3), .sudoku-cell:nth-child(9n+6) {
            border-right: 2px solid var(--border-color);
        }
        
        .sudoku-grid > div:nth-n(27) ~ div:nth-n(-54) { /* Simplificado via JS nas bordas inferiores */ }

        .sudoku-cell:focus {
            background: rgba(99, 102, 241, 0.2);
        }

        .sudoku-cell.fixed {
            background: var(--cell-fixed);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .sudoku-cell.error {
            background: var(--cell-error);
            color: #ef4444;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: var(--btn-primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--btn-primary-hover);
        }

        .instructions {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <div class="user-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="display-avatar" style="font-size: 22px;">😀</span>
                <strong id="display-nome" style="font-size: 14px;"></strong>
            </div>
            <span style="font-size: 13px; color: var(--text-muted);">Sudoku Master (9x9)</span>
        </div>

        <div class="score-board">
            <div>Pontos: <br><strong id="display-pontos" style="color: #4ade80;">0</strong></div>
            <div>Tempo: <br><strong id="display-tempo" style="color: #38bdf8;">00:00</strong></div>
            <div>Erros: <br><strong id="display-erros" style="color: #ef4444;">0</strong></div>
        </div>

        <!-- CONTROLES DE DIFICULDADE -->
        <div class="controls-grid">
            <select id="select-dificuldade">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Difícil</option>
            </select>
            <button id="btn-novo" class="btn-small" style="margin-top:0; background: #475569;">Novo Jogo 🔄</button>
        </div>

        <!-- TABULEIRO 9x9 -->
        <div class="sudoku-grid" id="sudoku-board"></div>

        <button id="btn-verificar">Validar Resposta ✅</button>
    </div>

    <!-- Lógica do Sudoku Completo -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        document.getElementById('display-nome').textContent = jogadorSessao.nome;
        document.getElementById('display-avatar').textContent = jogadorSessao.avatar;

        let tabuleiroSolucao = [];
        let tabuleiroAtual = [];
        let segundos = 0;
        let timerInterval = null;
        let totalErros = 0;

        // Gestão de Tema
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('brain_flow_theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        });

        // Gerador e Validador de Sudoku 9x9 Padrão
        function gerarSudokuCompleto() {
            let grid = Array(9).fill(0).map(() => Array(9).fill(0));
            resolverSudoku(grid);
            return grid;
        }

        function resolverSudoku(grid) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) {
                        let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                        for (let num of nums) {
                            if (isValido(grid, r, c, num)) {
                                grid[r][c] = num;
                                if (resolverSudoku(grid)) return true;
                                grid[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function isValido(grid, r, c, num) {
            for (let i = 0; i < 9; i++) {
                if (grid[r][i] === num && i !== c) return false;
                if (grid[i][c] === num && i !== r) return false;
            }
            let startRow = Math.floor(r / 3) * 3;
            let startCol = Math.floor(c / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    let curR = startRow + i;
                    let curC = startCol + j;
                    if (grid[curR][curC] === num && (curR !== r || curC !== c)) return false;
                }
            }
            return true;
        }

        function criarNovoJogo() {
            clearInterval(timerInterval);
            segundos = 0;
            totalErros = 0;
            document.getElementById('display-erros').textContent = totalErros;
            iniciarTempo();

            tabuleiroSolucao = gerarSudokuCompleto();
            tabuleiroAtual = tabuleiroSolucao.map(row => [...row]);

            const dificuldade = document.getElementById('select-dificuldade').value;
            let celulasParaRemover = dificuldade === 'easy' ? 35 : dificuldade === 'medium' ? 45 : 55;

            let removidas = 0;
            while (removidas < celulasParaRemover) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (tabuleiroAtual[r][c] !== 0) {
                    tabuleiroAtual[r][c] = 0;
                    removidas++;
                }
            }

            renderizarTabuleiro();
        }

        function renderizarTabuleiro() {
            const boardDiv = document.getElementById('sudoku-board');
            boardDiv.innerHTML = '';

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.min = '1';
                    input.max = '9';
                    input.className = 'sudoku-cell';
                    input.dataset.row = r;
                    input.dataset.col = c;

                    // Bordas grossas para as caixas 3x3
                    if (c === 2 || c === 5) input.style.borderRight = '2px solid var(--border-color)';
                    if (r === 2 || r === 5) input.style.borderBottom = '2px solid var(--border-color)';

                    if (tabuleiroAtual[r][c] !== 0) {
                        input.value = tabuleiroAtual[r][c];
                        input.classList.add('fixed');
                        input.disabled = true;
                    } else {
                        input.addEventListener('input', (e) => {
                            let val = e.target.value;
                            if (val.length > 1) e.target.value = val.slice(-1);
                            input.classList.remove('error');
                        });
                    }
                    boardDiv.appendChild(input);
                }
            }
        }

        function iniciarTempo() {
            timerInterval = setInterval(() => {
                segundos++;
                let m = String(Math.floor(segundos / 60)).padStart(2, '0');
                let s = String(segundos % 60).padStart(2, '0');
                document.getElementById('display-tempo').textContent = `${m}:${s}`;
            }, 1000);
        }

        document.getElementById('btn-novo').addEventListener('click', criarNovoJogo);
        document.getElementById('select-dificuldade').addEventListener('change', criarNovoJogo);

        document.getElementById('btn-verificar').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.sudoku-cell');
            let completo = true;
            let correto = true;

            inputs.forEach(input => {
                const r = input.dataset.row;
                const c = input.dataset.col;
                const val = parseInt(input.value);

                if (!val) {
                    completo = false;
                } else if (val !== tabuleiroSolucao[r][c]) {
                    correto = false;
                    if (!input.classList.contains('fixed')) {
                        input.classList.add('error');
                    }
                }
            });

            if (!completo) {
                alert("Preencha todos os espaços vazios do tabuleiro antes de validar!");
                return;
            }

            if (correto) {
                clearInterval(timerInterval);
                alert("🎉 Parabéns! Completou o Sudoku corretamente!");
                
                // Atualizar pontuação no Firebase
                const diff = document.getElementById('select-dificuldade').value;
                const pontosGanho = diff === 'easy' ? 50 : diff === 'medium' ? 100 : 200;

                const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
                try {
                    const snapshot = await get(jogadorRef);
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        const novosPontos = (dados.pontos || 0) + pontosGanho;
                        await update(jogadorRef, { pontos: novosPontos, ultimaAtualizacao: new Date().toISOString() });
                        document.getElementById('display-pontos').textContent = novosPontos;
                    }
                } catch (e) {
                    console.error("Erro ao atualizar pontos:", e);
                }
            } else {
                totalErros++;
                document.getElementById('display-erros').textContent = totalErros;
                alert("Existem números incorretos assinalados a vermelho. Reveja o seu tabuleiro!");
            }
        });

        // Carregar pontos iniciais do Firebase
        async function carregarPontosIniciais() {
            try {
                const snapshot = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
                if (snapshot.exists()) {
                    document.getElementById('display-pontos').textContent = snapshot.val().pontos || 0;
                }
            } catch (e) { console.error(e); }
        }

        carregarPontosIniciais();
        criarNovoJogo();
    </script>
</body>
</html>
