<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Master Pro — Multiplayer</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.85);
            --card-solid: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --input-bg: rgba(15, 23, 42, 0.9);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --cell-fixed: #334155;
            --cell-fixed-text: #cbd5e1;
            --cell-user: #6366f1;
            --cell-error: rgba(239, 68, 68, 0.25);
            --cell-highlight: rgba(99, 102, 241, 0.15);
            --cell-same: rgba(99, 102, 241, 0.25);
            --cell-selected: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --opponent: #ec4899;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: rgba(255, 255, 255, 0.9);
            --card-solid: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --input-bg: rgba(248, 250, 252, 0.9);
            --primary: #4f46e5;
            --cell-fixed: #e2e8f0;
            --cell-fixed-text: #334155;
            --cell-user: #4f46e5;
            --cell-error: rgba(239, 68, 68, 0.2);
            --cell-highlight: rgba(99, 102, 241, 0.1);
            --cell-same: rgba(99, 102, 241, 0.2);
            --cell-selected: rgba(99, 102, 241, 0.35);
        }

        * {
            font-family: 'Outfit', system-ui, sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 14px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .btn-icon:hover { background: var(--border); }
        .btn-icon:active { transform: scale(0.92); }
        .btn-icon.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* ===== USER HEADER ===== */
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
        }
        .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(99,102,241,0.4);
            flex-shrink: 0;
        }
        .user-name { font-weight: 800; font-size: 14px; line-height: 1.1; }
        .user-sub { font-size: 10px; color: var(--text-muted); font-weight: 600; }

        /* ===== SCORE BOARD ===== */
        .score-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .stat-card {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 4px;
            text-align: center;
            transition: all 0.2s;
        }
        .stat-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        /* ===== MULTIPLAYER BAR ===== */
        .mp-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(236,72,153,0.15));
            border: 1px solid rgba(99,102,241,0.3);
            font-size: 12px;
            font-weight: 700;
        }
        .mp-player {
            flex: 1;
            text-align: center;
            padding: 4px;
        }
        .mp-player .name {
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mp-player .progress {
            height: 6px;
            background: rgba(0,0,0,0.2);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 3px;
        }
        .mp-player .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s ease;
            border-radius: 999px;
        }
        .mp-player.opponent .progress-fill {
            background: var(--opponent);
        }
        .mp-vs {
            font-size: 14px;
            font-weight: 900;
            color: var(--warning);
            flex-shrink: 0;
        }

        /* ===== CONTROLS ===== */
        select, .btn {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        select:focus { outline: none; border-color: var(--primary); }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(99,102,241,0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(16,185,129,0.4);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(245,158,11,0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(239,68,68,0.4);
        }
        .btn-ghost {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-ghost:hover { background: var(--border); }
        .btn-ghost.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .controls-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        /* ===== SUDOKU GRID ===== */
        .sudoku-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 55vh;
            margin: 0 auto;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 0;
            background: var(--border);
            border: 3px solid var(--text);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        .sudoku-cell {
            background: var(--input-bg);
            border: none;
            text-align: center;
            font-size: clamp(14px, 4.5vw, 22px);
            font-weight: 700;
            color: var(--cell-user);
            outline: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-variant-numeric: tabular-nums;
            user-select: none;
        }
        .sudoku-cell[data-col="2"], .sudoku-cell[data-col="5"] { border-right: 2px solid var(--text); }
        .sudoku-cell[data-row="2"], .sudoku-cell[data-row="5"] { border-bottom: 2px solid var(--text); }
        .sudoku-cell.fixed {
            background: var(--cell-fixed);
            color: var(--cell-fixed-text);
            cursor: not-allowed;
            font-weight: 900;
        }
        .sudoku-cell.highlight { background: var(--cell-highlight); }
        .sudoku-cell.same-number { background: var(--cell-same); }
        .sudoku-cell.selected {
            background: var(--cell-selected) !important;
            box-shadow: inset 0 0 0 2px var(--primary);
        }
        .sudoku-cell.error {
            background: var(--cell-error) !important;
            color: var(--danger) !important;
            animation: shake 0.35s ease-in-out;
        }
        .sudoku-cell.hint-flash {
            animation: hint-flash 0.8s ease;
        }
        .sudoku-cell.opponent-cell::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--opponent);
            box-shadow: 0 0 6px var(--opponent);
        }
        @keyframes hint-flash {
            0%, 100% { background: var(--input-bg); }
            50% { background: var(--success); color: white; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .pencil-marks {
            position: absolute;
            inset: 2px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            font-size: 8px;
            color: var(--text-muted);
            font-weight: 600;
            pointer-events: none;
        }
        .pencil-marks span {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== NUMPAD ===== */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .numpad-btn {
            aspect-ratio: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            position: relative;
        }
        .numpad-btn:hover { background: var(--border); }
        .numpad-btn:active { transform: scale(0.92); }
        .numpad-btn.erase {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.4);
        }
        .numpad-btn .count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .numpad-btn.completed-num {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--card-solid);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            z-index: 1000;
            transition: transform 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90vw;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
        #toast.success { background: var(--success); color: white; }
        #toast.error { background: var(--danger); color: white; }
        #toast.warning { background: var(--warning); color: white; }

        /* ===== MODAL ===== */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }
        .modal-bg.show { opacity: 1; visibility: visible; }
        .modal-panel {
            background: var(--card-solid);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            transform: scale(0.85);
            transition: transform 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-bg.show .modal-panel { transform: scale(1); }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 200;
        }

        .avatar-option {
            aspect-ratio: 1;
            border-radius: 12px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.15s;
        }
        .avatar-option:hover { transform: scale(1.08); border-color: var(--primary); }
        .avatar-option.selected {
            border-color: var(--primary);
            background: rgba(99,102,241,0.2);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.3);
        }

        .pause-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            gap: 12px;
            color: white;
        }
        .pause-overlay i { font-size: 48px; }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            color: var(--text);
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .hidden { display: none !important; }

        /* ===== ROOM CODE ===== */
        .room-code {
            font-family: 'Courier New', monospace;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(99,102,241,0.5);
            padding: 16px;
            background: var(--input-bg);
            border: 2px dashed var(--primary);
            border-radius: 16px;
            margin: 16px 0;
            user-select: all;
        }

        /* ===== QUICK REACTIONS ===== */
        .quick-reactions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .reaction-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .reaction-btn:hover { transform: scale(1.15); }
        .reaction-btn:active { transform: scale(0.9); }

        .floating-reaction {
            position: fixed;
            font-size: 48px;
            pointer-events: none;
            animation: float-up 2s ease-out forwards;
            z-index: 500;
        }
        @keyframes float-up {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.3); opacity: 1; }
            100% { transform: translateY(-200px) scale(1); opacity: 0; }
        }

        @media (max-height: 700px) {
            .sudoku-wrapper { max-height: 45vh; }
            .numpad-btn { font-size: 16px; }
        }
    </style>
</head>
<body>
