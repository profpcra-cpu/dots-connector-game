<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Master - Brain Hub</title>

    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           1. DESIGN TOKENS (mesma linguagem visual do Brain Hub)
           ========================================================== */
        :root {
            /* Superfícies */
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            /* Texto */
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;

            /* Bordas e inputs */
            --border-color: rgba(148, 163, 184, 0.18);
            --border-strong: rgba(148, 163, 184, 0.35);
            --input-bg: rgba(15, 23, 42, 0.7);

            /* Ações */
            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;

            /* Células do Sudoku */
            --cell-bg: rgba(15, 23, 42, 0.6);
            --cell-fixed: rgba(51, 65, 85, 0.85);
            --cell-fixed-text: #cbd5e1;
            --cell-focus: rgba(99, 102, 241, 0.25);
            --cell-error: rgba(239, 68, 68, 0.22);
            --cell-error-text: #fca5a5;
            --cell-border-strong: rgba(148, 163, 184, 0.55);

            /* Cores de status */
            --c-green: #4ade80;
            --c-blue: #38bdf8;
            --c-amber: #f59e0b;
            --c-red: #ef4444;

            /* Sombras e raios */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
            --shadow-cell: 0 1px 0 rgba(255, 255, 255, 0.02) inset;

            /* Transições */
            --t-fast: 0.15s ease;
            --t-base: 0.25s ease;
            --t-slow: 0.4s ease;
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-glow: rgba(99, 102, 241, 0.15);

            --text-color: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;

            --border-color: rgba(15, 23, 42, 0.1);
            --border-strong: rgba(15, 23, 42, 0.25);
            --input-bg: rgba(255, 255, 255, 0.95);

            --cell-bg: rgba(248, 250, 252, 0.95);
            --cell-fixed: rgba(226, 232, 240, 0.95);
            --cell-fixed-text: #475569;
            --cell-focus: rgba(99, 102, 241, 0.18);
            --cell-error: rgba(239, 68, 68, 0.15);
            --cell-error-text: #dc2626;
            --cell-border-strong: rgba(15, 23, 42, 0.3);

            --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
        }

        /* ==========================================================
           2. RESET E BASE
           ========================================================== */
        *, *::before, *::after { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--t-slow), color var(--t-base);
            -webkit-font-smoothing: antialiased;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: -1;
            pointer-events: none;
        }
        body::before {
            width: 420px; height: 420px;
            background: #6366f1;
            top: -140px; left: -120px;
        }
        body::after {
            width: 460px; height: 460px;
            background: #8b5cf6;
            bottom: -180px; right: -140px;
        }

        /* ==========================================================
           3. CONTAINER (glassmorphism)
           ========================================================== */
        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            padding: 20px 20px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid var(--card-border);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
            opacity: 0.9;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        /* ==========================================================
           4. TOP BAR
           ========================================================== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .btn-small {
            width: auto;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--t-base);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-small:hover {
            color: var(--text-color);
            border-color: var(--border-strong);
            transform: translateY(-1px);
            background: var(--card-bg);
        }

        /* ==========================================================
           5. USER HEADER
           ========================================================== */
        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: border-color var(--t-base);
        }
        .user-header:hover {
            border-color: var(--border-strong);
        }

        #display-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            font-size: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
        }

        #display-nome {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .user-header .game-name {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        /* ==========================================================
           6. SCORE BOARD
           ========================================================== */
        .score-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            font-size: 11px;
            border: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .score-board > div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            transition: background var(--t-base), transform var(--t-base);
        }
        .score-board > div:hover {
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-1px);
        }

        .score-board strong {
            font-size: 15px;
            font-family: 'JetBrains Mono', 'Segoe UI', monospace;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: none;
        }

        #display-pontos { color: var(--c-green); }
        #display-tempo  { color: var(--c-blue); }
        #display-recorde{ color: var(--c-amber); }
        #display-erros  { color: var(--c-red); }

        /* ==========================================================
           7. CONTROLES
           ========================================================== */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: border-color var(--t-base), box-shadow var(--t-base);
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }
        select:focus {
            outline: none;
            border-color: var(--btn-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
        }

        #btn-novo {
            margin: 0;
            background: linear-gradient(135deg, #475569, #334155);
            border: 1px solid var(--border-color);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.6);
        }
        #btn-novo:hover {
            background: linear-gradient(135deg, #64748b, #475569);
            transform: translateY(-1px);
        }

        /* ==========================================================
           8. TABULEIRO DE SUDOKU
           ========================================================== */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: var(--border-strong);
            border: 2px solid var(--border-strong);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 14px;
            box-shadow:
                0 12px 40px -14px rgba(0, 0, 0, 0.55),
                0 0 0 1px var(--card-border);
            animation: gridIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes gridIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .sudoku-cell {
            aspect-ratio: 1;
            background: var(--cell-bg);
            border: none;
            text-align: center;
            font-size: 17px;
            font-family: 'JetBrains Mono', 'Segoe UI', monospace;
            font-weight: 700;
            color: var(--text-color);
            outline: none;
            padding: 0;
            width: 100%;
            box-shadow: var(--shadow-cell);
            transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast);
            /* Esconde setinhas do input number (mantém funcionalidade) */
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .sudoku-cell::-webkit-outer-spin-button,
        .sudoku-cell::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .sudoku-cell:hover:not(.fixed):not(:disabled) {
            background: rgba(99, 102, 241, 0.12);
        }

        .sudoku-cell:focus {
            background: var(--cell-focus);
            box-shadow: 0 0 0 2px var(--btn-primary) inset;
            z-index: 1;
            transform: scale(1.04);
            border-radius: 4px;
        }

        .sudoku-cell.fixed {
            background: var(--cell-fixed);
            color: var(--cell-fixed-text);
            cursor: not-allowed;
            font-weight: 700;
        }

        .sudoku-cell.error {
            background: var(--cell-error);
            color: var(--cell-error-text);
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-2px); }
            75%      { transform: translateX(2px); }
        }

        /* ==========================================================
           9. BOTÕES PRINCIPAIS
           ========================================================== */
        button {
            width: 100%;
            padding: 14px 18px;
            margin-top: 8px;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            box-shadow: var(--shadow-btn);
            transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
        }
        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
        }
        button:active { transform: translateY(0); filter: brightness(0.97); }

        #btn-verificar {
            margin-top: 4px;
        }

        /* ==========================================================
           10. RESPONSIVIDADE
           ========================================================== */
        @media (max-width: 440px) {
            body { padding: 10px; }
            .container { padding: 16px 14px 18px; border-radius: 16px; max-width: 100%; }
            .sudoku-cell { font-size: 15px; }
            .score-board { font-size: 10px; }
            .score-board strong { font-size: 13px; }
            .user-header .game-name { display: none; }
        }

        /* ==========================================================
           11. ACESSIBILIDADE
           ========================================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        :focus-visible {
            outline: 2px solid var(--btn-primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <div class="user-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="display-avatar">😀</span>
                <strong id="display-nome"></strong>
            </div>
            <span class="game-name">Sudoku Master</span>
        </div>

        <!-- PAINEL DE ESTATÍSTICAS E RECORDES -->
        <div class="score-board">
            <div>Pontos<br><strong id="display-pontos">0</strong></div>
            <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
            <div>Recorde<br><strong id="display-recorde">--:--</strong></div>
            <div>Erros<br><strong id="display-erros">0</strong></div>
        </div>

        <!-- CONTROLES -->
        <div class="controls-grid">
            <select id="select-dificuldade">
                <option value="easy">Fácil</option>
                <option value="medium" selected>Médio</option>
                <option value="hard">Difícil</option>
            </select>
            <button id="btn-novo" class="btn-small">Novo Jogo 🔄</button>
        </div>

        <!-- TABULEIRO 9x9 -->
        <div class="sudoku-grid" id="sudoku-board"></div>

        <button id="btn-verificar">Validar Resposta ✅</button>
    </div>

    <!-- Lógica com Recordes por Tempo -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        document.getElementById('display-nome').textContent = jogadorSessao.nome;
        document.getElementById('display-avatar').textContent = jogadorSessao.avatar;

        let tabuleiroSolucao = [];
        let tabuleiroAtual = [];
        let segundos = 0;
        let timerInterval = null;
        let totalErros = 0;
        let dadosJogadorFirebase = { pontos: 0, recordes: {} };

        // Gestão de Tema
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('brain_flow_theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        });

        function formatarTempo(seg) {
            if (!seg || seg === 0) return "--:--";
            let m = String(Math.floor(seg / 60)).padStart(2, '0');
            let s = String(seg % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function atualizarDisplayRecorde() {
            const diff = document.getElementById('select-dificuldade').value;
            const recordes = dadosJogadorFirebase.recordes || {};
            const melhorTempo = recordes[diff] || 0;
            document.getElementById('display-recorde').textContent = formatarTempo(melhorTempo);
        }

        // Gerador e Validador de Sudoku 9x9
        function gerarSudokuCompleto() {
            let grid = Array(9).fill(0).map(() => Array(9).fill(0));
            resolverSudoku(grid);
            return grid;
        }

        function resolverSudoku(grid) {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (grid[r][c] === 0) {
                        let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                        for (let num of nums) {
                            if (isValido(grid, r, c, num)) {
                                grid[r][c] = num;
                                if (resolverSudoku(grid)) return true;
                                grid[r][c] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        function isValido(grid, r, c, num) {
            for (let i = 0; i < 9; i++) {
                if (grid[r][i] === num && i !== c) return false;
                if (grid[i][c] === num && i !== r) return false;
            }
            let startRow = Math.floor(r / 3) * 3;
            let startCol = Math.floor(c / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    let curR = startRow + i;
                    let curC = startCol + j;
                    if (grid[curR][curC] === num && (curR !== r || curC !== c)) return false;
                }
            }
            return true;
        }

        function criarNovoJogo() {
            clearInterval(timerInterval);
            segundos = 0;
            totalErros = 0;
            document.getElementById('display-erros').textContent = totalErros;
            document.getElementById('display-tempo').textContent = "00:00";
            atualizarDisplayRecorde();
            iniciarTempo();

            tabuleiroSolucao = gerarSudokuCompleto();
            tabuleiroAtual = tabuleiroSolucao.map(row => [...row]);

            const dificuldade = document.getElementById('select-dificuldade').value;
            let celulasParaRemover = dificuldade === 'easy' ? 35 : dificuldade === 'medium' ? 45 : 55;

            let removidas = 0;
            while (removidas < celulasParaRemover) {
                let r = Math.floor(Math.random() * 9);
                let c = Math.floor(Math.random() * 9);
                if (tabuleiroAtual[r][c] !== 0) {
                    tabuleiroAtual[r][c] = 0;
                    removidas++;
                }
            }

            renderizarTabuleiro();
        }

        function renderizarTabuleiro() {
            const boardDiv = document.getElementById('sudoku-board');
            boardDiv.innerHTML = '';

            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.min = '1';
                    input.max = '9';
                    input.className = 'sudoku-cell';
                    input.dataset.row = r;
                    input.dataset.col = c;

                    if (c === 2 || c === 5) input.style.borderRight = '2px solid var(--border-color)';
                    if (r === 2 || r === 5) input.style.borderBottom = '2px solid var(--border-color)';

                    if (tabuleiroAtual[r][c] !== 0) {
                        input.value = tabuleiroAtual[r][c];
                        input.classList.add('fixed');
                        input.disabled = true;
                    } else {
                        input.addEventListener('input', (e) => {
                            let val = e.target.value;
                            if (val.length > 1) e.target.value = val.slice(-1);
                            input.classList.remove('error');
                        });
                    }
                    boardDiv.appendChild(input);
                }
            }
        }

        function iniciarTempo() {
            timerInterval = setInterval(() => {
                segundos++;
                document.getElementById('display-tempo').textContent = formatarTempo(segundos);
            }, 1000);
        }

        document.getElementById('btn-novo').addEventListener('click', criarNovoJogo);
        document.getElementById('select-dificuldade').addEventListener('change', criarNovoJogo);

        document.getElementById('btn-verificar').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.sudoku-cell');
            let completo = true;
            let correto = true;

            inputs.forEach(input => {
                const r = input.dataset.row;
                const c = input.dataset.col;
                const val = parseInt(input.value);

                if (!val) {
                    completo = false;
                } else if (val !== tabuleiroSolucao[r][c]) {
                    correto = false;
                    if (!input.classList.contains('fixed')) {
                        input.classList.add('error');
                    }
                }
            });

            if (!completo) {
                alert("Preencha todos os espaços vazios do tabuleiro antes de validar!");
                return;
            }

            if (correto) {
                clearInterval(timerInterval);
                
                const diff = document.getElementById('select-dificuldade').value;
                let pontosBase = diff === 'easy' ? 50 : diff === 'medium' ? 100 : 200;
                
                // Verificar recorde
                let recordes = dadosJogadorFirebase.recordes || {};
                let melhorTempoAtual = recordes[diff] || 0;
                let bateuRecorde = false;

                if (melhorTempoAtual === 0 || segundos < melhorTempoAtual) {
                    recordes[diff] = segundos;
                    bateuRecorde = true;
                    pontosBase += 50; // Bónus por recorde batido
                }

                dadosJogadorFirebase.pontos = (dadosJogadorFirebase.pontos || 0) + pontosBase;
                dadosJogadorFirebase.recordes = recordes;

                document.getElementById('display-pontos').textContent = dadosJogadorFirebase.pontos;
                atualizarDisplayRecorde();

                const mensagemRecorde = bateuRecorde ? `🏆 NOVO RECORDE PESSOAL! (${formatarTempo(segundos)}) +50 pontos bónus!` : `Tempo: ${formatarTempo(segundos)}`;
                alert(`🎉 Parabéns! Completou o Sudoku correto!\n${mensagemRecorde}\nTotal ganho: ${pontosBase} pontos.`);

                // Sincronizar com o Firebase
                const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
                try {
                    await update(jogadorRef, {
                        pontos: dadosJogadorFirebase.pontos,
                        recordes: recordes,
                        ultimaAtualizacao: new Date().toISOString()
                    });
                } catch (e) {
                    console.error("Erro ao salvar no Firebase:", e);
                }

            } else {
                totalErros++;
                document.getElementById('display-erros').textContent = totalErros;
                alert("Existem números incorretos assinalados a vermelho. Reveja o seu tabuleiro!");
            }
        });

        // Carregar dados iniciais do Firebase
        async function carregarDadosIniciais() {
            try {
                const snapshot = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
                if (snapshot.exists()) {
                    dadosJogadorFirebase = snapshot.val();
                    document.getElementById('display-pontos').textContent = dadosJogadorFirebase.pontos || 0;
                }
            } catch (e) { console.error(e); }
            criarNovoJogo();
        }

        carregarDadosIniciais();
    </script>
</body>
</html>
