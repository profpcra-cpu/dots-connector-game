<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Express - Brain Hub</title>
    
    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-primary: #6366f1;
            --btn-primary-hover: #4f46e5;
            --board-bg: #0f172a;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --btn-primary: #4f46e5;
            --btn-primary-hover: #4338ca;
            --board-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-small {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            width: auto;
            margin: 0;
        }
        .btn-small:hover {
            background: var(--border-color);
        }

        .user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        /* TABULEIRO SUDOKU 4x4 SIMPLIFICADO */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            background: var(--border-color);
            padding: 4px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .sudoku-cell {
            aspect-ratio: 1;
            background: var(--input-bg);
            border: none;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            border-radius: 4px;
            outline: none;
        }
        .sudoku-cell:focus {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--btn-primary);
        }
        .sudoku-cell:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: var(--btn-primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: var(--btn-primary-hover);
        }

        .instructions {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <div class="user-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="display-avatar" style="font-size: 22px;">😀</span>
                <strong id="display-nome" style="font-size: 14px;"></strong>
            </div>
            <span style="font-size: 13px; color: var(--text-muted);">Sudoku Express</span>
        </div>

        <div class="score-board">
            <div>Pontos Ganhos: <br><strong id="display-pontos" style="color: #4ade80;">0</strong></div>
            <div>Estado: <br><strong id="display-estado" style="color: #38bdf8;">A Jogar</strong></div>
        </div>

        <p class="instructions">Preencha os espaços vazios (1 a 4) sem repetir números na mesma linha ou coluna.</p>

        <!-- TABULEIRO 4x4 -->
        <div class="sudoku-grid" id="sudoku-board">
            <!-- Gerado via JavaScript -->
        </div>

        <button id="btn-verificar">Verificar Resposta ✅</button>
        <button id="btn-novo" class="btn-small" style="background-color: #475569; width: 100%; margin-top: 8px;">Novo Jogo 🔄</button>
    </div>

    <!-- Lógica do Sudoku -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) {
            window.location.href = 'index.html';
        }

        document.getElementById('display-nome').textContent = jogadorSessao.nome;
        document.getElementById('display-avatar').textContent = jogadorSessao.avatar;

        // Gestão de Tema
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('theme-toggle').textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('brain_flow_theme', next);
            document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        });

        // Tabuleiro modelo 4x4 (0 representa célula vazia)
        // Solução válida:
        // 1 2 | 3 4
        // 3 4 | 1 2
        // ----+----
        // 2 1 | 4 3
        // 4 3 | 2 1
        const gabarito = [
            [1, 2, 3, 4],
            [3, 4, 1, 2],
            [2, 1, 4, 3],
            [4, 3, 2, 1]
        ];

        // Máscara inicial (algumas posições visíveis, outras vazias '')
        const tabuleiroInicial = [
            [1, '', 3, ''],
            ['', 4, '', 2],
            [2, '', '', 3],
            ['', 3, 2, '']
        ];

        function montarTabuleiro() {
            const boardDiv = document.getElementById('sudoku-board');
            boardDiv.innerHTML = '';

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.min = '1';
                    input.max = '4';
                    input.className = 'sudoku-cell';
                    input.dataset.row = r;
                    input.dataset.col = c;

                    const valorFixo = tabuleiroInicial[r][c];
                    if (valorFixo !== '') {
                        input.value = valorFixo;
                        input.disabled = true;
                    }

                    boardDiv.appendChild(input);
                }
            }
            document.getElementById('display-estado').textContent = "A Jogar";
            document.getElementById('display-estado').style.color = "#38bdf8";
        }

        montarTabuleiro();

        document.getElementById('btn-novo').addEventListener('click', () => {
            montarTabuleiro();
        });

        document.getElementById('btn-verificar').addEventListener('click', async () => {
            const inputs = document.querySelectorAll('.sudoku-cell');
            let correto = true;

            inputs.forEach(input => {
                const r = input.dataset.row;
                const c = input.dataset.col;
                const val = parseInt(input.value);

                if (val !== gabarito[r][c]) {
                    correto = false;
                }
            });

            const estadoEl = document.getElementById('display-estado');
            if (correto) {
                estadoEl.textContent = "Concluído! 🎉";
                estadoEl.style.color = "#4ade80";

                // Atualizar pontos no Firebase
                const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
                try {
                    const snapshot = await get(jogadorRef);
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        const novosPontos = (dados.pontos || 0) + 50;
                        
                        await update(jogadorRef, {
                            pontos: novosPontos,
                            ultimaAtualizacao: new Date().toISOString()
                        });

                        document.getElementById('display-pontos').textContent = novosPontos;
                        alert("Parabéns! Ganhou 50 pontos pelo Sudoku concluído com sucesso!");
                    }
                } catch (e) {
                    console.error("Erro ao atualizar pontos:", e);
                }
            } else {
                estadoEl.textContent = "Há erros! ❌";
                estadoEl.style.color = "#ef4444";
                alert("Existem valores incorretos no tabuleiro. Tente novamente!");
            }
        });
    </script>
</body>
</html>
