<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matrix Puzzle — Brain Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --c-red: #ef4444;
    --c-amber: #fbbf24;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.mode-switch {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    background: var(--input-bg);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 12px;
    border: 1px solid var(--border-color);
}
.mode-btn {
    padding: 8px 4px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    line-height: 1.2;
}
.mode-btn.active {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99, 102, 241, 0.6);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 900;
    color: var(--text-color);
}
#display-rodada { color: var(--c-cyan); }
#display-pontos { color: var(--c-green); }
#display-recorde { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    font-weight: 500;
}

.timer-bar {
    height: 6px;
    background: rgba(148, 163, 184, 0.2);
    border-radius: 99px;
    overflow: hidden;
    margin: 0 0 12px;
}
.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--c-green), var(--c-amber), var(--c-red));
    border-radius: 99px;
    transition: width 0.3s linear;
    width: 100%;
}

.fase-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    padding: 5px 14px;
    border-radius: 99px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--c-cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 24px;
    line-height: 14px;
}
.fase-badge.ok {
    background: rgba(74, 222, 128, 0.15);
    color: var(--c-green);
    border-color: rgba(74, 222, 128, 0.3);
}
.fase-badge.erro {
    background: rgba(239, 68, 68, 0.15);
    color: var(--c-red);
    border-color: rgba(239, 68, 68, 0.3);
}

/* ==========================================================
   MATRIZ 3×3
   ========================================================== */
.matrix-area {
    background: linear-gradient(135deg, #0f172a 0%, #050914 100%);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55);
    display: flex;
    justify-content: center;
}
.matrix-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 1 / 1;
}
.matrix-cel {
    background: rgba(30, 41, 59, 0.6);
    border: 2px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s ease;
    overflow: hidden;
    padding: 4px;
}
.matrix-cel.interrogacao {
    background: rgba(251, 191, 36, 0.1);
    border-color: var(--c-amber);
    border-style: dashed;
    animation: pulsar-q 1.4s infinite;
}
@keyframes pulsar-q {
    0%, 100% { box-shadow: 0 0 0 rgba(251, 191, 36, 0); }
    50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.5); }
}
.matrix-cel.interrogacao::after {
    content: "?";
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(36px, 8vmin, 56px);
    font-weight: 900;
    color: var(--c-amber);
    text-shadow: 0 0 20px var(--c-amber);
}
.matrix-cel .shape {
    width: 60%;
    height: 60%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 8vmin, 56px);
    line-height: 1;
}

/* ==========================================================
   OPÇÕES DE RESPOSTA
   ========================================================== */
.opcoes-wrapper {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 12px;
}
.opcoes-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    text-align: left;
    padding-left: 4px;
}
.opcoes-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}
.opcao {
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    border: 2px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.55);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.opcao .shape {
    width: 60%;
    height: 60%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 8vmin, 56px);
    line-height: 1;
}
.opcao:hover:not(:disabled) {
    border-color: var(--btn-primary);
    background: rgba(99, 102, 241, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(99, 102, 241, 0.4);
}
.opcao:disabled {
    cursor: default;
}
.opcao.correta {
    background: rgba(74, 222, 128, 0.25) !important;
    border-color: var(--c-green) !important;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.5);
    animation: acerto-pop 0.4s ease;
}
.opcao.incorreta {
    background: rgba(239, 68, 68, 0.25) !important;
    border-color: var(--c-red) !important;
    animation: erro-shake 0.4s ease;
}
@keyframes acerto-pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}
@keyframes erro-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.hidden { display: none !important; }

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.94);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay.hidden { display: none !important; }
.overlay h2 { margin: 0; font-size: 22px; font-weight: 800; }
.overlay .subtitulo { font-size: 13px; color: #94a3b8; line-height: 1.5; }
.overlay .grande {
    font-size: 48px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.overlay button { max-width: 260px; }
.overlay .trofeu {
    font-size: 56px;
    animation: bounce 1.4s infinite ease-in-out;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.feedback-float {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 900;
    pointer-events: none;
    z-index: 20;
    animation: float-up 0.9s ease-out forwards;
}
.feedback-float.positivo { color: var(--c-green); text-shadow: 0 0 20px var(--c-green); }
.feedback-float.negativo { color: var(--c-red); text-shadow: 0 0 20px var(--c-red); }
@keyframes float-up {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -130%) scale(1); }
}
</style>
</head>
<body>
<div class="container" id="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="facil">🟢 Fácil</button>
        <button class="mode-btn" data-mode="medio">🟡 Médio</button>
        <button class="mode-btn" data-mode="dificil">🔴 Difícil</button>
        <button class="mode-btn" data-mode="misto">🎲 Misto</button>
    </div>

    <div class="score-board">
        <div>🔢 Rodada<br><strong id="display-rodada">1</strong></div>
        <div>⭐ Pontos<br><strong id="display-pontos">0</strong></div>
        <div>🏆 Recorde<br><strong id="display-recorde">0</strong></div>
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div style="text-align:center;">
        <span class="fase-badge" id="fase-badge">Pronto</span>
    </div>

    <p class="instructions" id="info-instrucao">
        🧩 Descubra a peça que falta na matriz. Encontre o padrão lógico!
    </p>

    <div class="matrix-area">
        <div class="matrix-grid" id="matrix-grid"></div>
    </div>

    <div class="opcoes-wrapper">
        <div class="opcoes-label">🎯 Escolha a peça correta</div>
        <div class="opcoes-grid" id="opcoes-grid"></div>
    </div>

    <div class="controls-grid">
        <button id="btn-iniciar">▶️ Iniciar Jogo</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('[brain-matrix] Inicializando...');

    // ==========================================================
    // CONFIGURAÇÃO POR MODO
    // ==========================================================
    var MODOS = {
        facil:   { tipos: ['rotacao', 'crescimento'], tempoMax: 20, nome: 'Fácil' },
        medio:   { tipos: ['rotacao', 'crescimento', 'cor', 'contagem'], tempoMax: 20, nome: 'Médio' },
        dificil: { tipos: ['rotacao', 'crescimento', 'cor', 'contagem', 'substracao', 'composicao'], tempoMax: 25, nome: 'Difícil' },
        misto:   { tipos: ['rotacao', 'crescimento', 'cor', 'contagem', 'substracao', 'composicao'], tempoMax: 20, nome: 'Misto' }
    };

    // ==========================================================
    // PALETA DE FORMAS E CORES
    // ==========================================================
    var FORMAS = ['●', '■', '▲', '◆', '★', '❤', '⬢', '✦'];
    var CORES = ['#ef4444', '#3b82f6', '#22c55e', '#fbbf24', '#a855f7', '#fb923c', '#ec4899', '#06b6d4'];

    // ==========================================================
    // ESTADO
    // ==========================================================
    var modoAtual = 'facil';
    var rodada = 1;
    var pontos = 0;
    var acertos = 0;
    var erros = 0;
    var comboAtual = 0;
    var jogoAtivo = false;
    var aceitandoResposta = false;
    var puzzleAtual = null;
    var tempoRestante = 0;
    var timerInterval = null;

    var recordes = {
        facil:   parseInt(localStorage.getItem('brain_matrix_recorde_facil')   || '0', 10),
        medio:   parseInt(localStorage.getItem('brain_matrix_recorde_medio')   || '0', 10),
        dificil: parseInt(localStorage.getItem('brain_matrix_recorde_dificil') || '0', 10),
        misto:   parseInt(localStorage.getItem('brain_matrix_recorde_misto')   || '0', 10)
    };

    // ==========================================================
    // SOM
    // ==========================================================
    var som = {
        ativo: true,
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { this.ctx = null; }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(function(){});
            }
        },
        play: function(freq, type, duration, vol) {
            if (!this.ativo) return;
            this.init();
            if (!this.ctx) return;
            try {
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                var agora = this.ctx.currentTime;
                g.gain.setValueAtTime(0, agora);
                g.gain.linearRampToValueAtTime(vol || 0.08, agora + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, agora + duration);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(agora);
                o.stop(agora + duration + 0.02);
            } catch (e) {}
        },
        acerto: function() {
            var self = this;
            [523, 659, 783].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.18); }, i * 70);
            });
        },
        erro: function() { this.play(180, 'sawtooth', 0.3); },
        click: function() { this.play(700, 'triangle', 0.06); },
        tique: function() { this.play(880, 'square', 0.04); },
        vitoria: function() {
            var self = this;
            [523, 659, 783, 1046].forEach(function(f, i) {
                setTimeout(function() { self.play(f, 'sine', 0.22); }, i * 100);
            });
        }
    };

    // ==========================================================
    // HELPERS
    // ==========================================================
    function $(id) { return document.getElementById(id); }

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function embaralhar(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function atualizarBadge(texto, classe) {
        var b = $('fase-badge');
        b.textContent = texto;
        b.className = 'fase-badge' + (classe ? ' ' + classe : '');
    }

    function atualizarPlacar() {
        $('display-rodada').textContent = String(rodada);
        $('display-pontos').textContent = String(pontos);
        $('display-recorde').textContent = String(recordes[modoAtual]);
    }

    // ==========================================================
    // GERADORES DE MATRIZ
    // ==========================================================
    // Cada gerador retorna:
    //   {
    //     matriz: array 9 de itens (8 visíveis + 1 null no índice 8)
    //     resposta: item correto
    //     distratores: array de 3 itens errados
    //   }
    // Cada item é: { forma: '●', cor: '#ff0000', tamanho: 1.0, rotacao: 0 }
    // ==========================================================

    // --- Gerador 1: ROTAÇÃO ---
    // Formas iguais, girando progressivamente. Linha 1: 0°,45°,90°; Linha 2: 45°,90°,135°; etc.
    function gerarRotacao() {
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        var cor = CORES[randInt(0, CORES.length - 1)];

        var matriz = [];
        for (var l = 0; l < 3; l++) {
            for (var c = 0; c < 3; c++) {
                var rot = (l + c) * 45;
                matriz.push({
                    forma: forma,
                    cor: cor,
                    rotacao: rot,
                    tamanho: 1.0
                });
            }
        }
        // Remove último (resposta correta)
        var resposta = matriz[8];
        matriz[8] = null;

        // Distratores: rotações erradas
        var distratores = [
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0 },
            { forma: forma, cor: cor, rotacao: 45, tamanho: 1.0 },
            { forma: forma, cor: cor, rotacao: 135, tamanho: 1.0 }
        ];

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // --- Gerador 2: CRESCIMENTO ---
    // Tamanho cresce da esquerda para a direita e de cima para baixo
    function gerarCrescimento() {
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        var cor = CORES[randInt(0, CORES.length - 1)];

        var matriz = [];
        for (var l = 0; l < 3; l++) {
            for (var c = 0; c < 3; c++) {
                var tamanho = 0.5 + (l + c) * 0.15;
                matriz.push({
                    forma: forma,
                    cor: cor,
                    rotacao: 0,
                    tamanho: tamanho
                });
            }
        }
        var resposta = matriz[8];
        matriz[8] = null;

        var distratores = [
            { forma: forma, cor: cor, rotacao: 0, tamanho: 0.5 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 0.8 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.15 }
        ];

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // --- Gerador 3: CORES ---
    // Cores variam em cada linha/coluna (matriz de permutação)
    function gerarCor() {
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        // Embaralha 3 cores
        var cores = embaralhar(CORES).slice(0, 3);

        var matriz = [];
        // Cada linha tem as 3 cores em ordem diferente (deslocamento)
        for (var l = 0; l < 3; l++) {
            for (var c = 0; c < 3; c++) {
                var corIdx = (l + c) % 3;
                matriz.push({
                    forma: forma,
                    cor: cores[corIdx],
                    rotacao: 0,
                    tamanho: 1.0
                });
            }
        }
        var resposta = matriz[8];
        matriz[8] = null;

        // Distratores: cores diferentes
        var todasCores = CORES.slice();
        var outras = [];
        for (var i = 0; i < todasCores.length; i++) {
            if (cores.indexOf(todasCores[i]) === -1) outras.push(todasCores[i]);
        }
        var distratores = [
            { forma: forma, cor: outras[0] || cores[1], rotacao: 0, tamanho: 1.0 },
            { forma: forma, cor: outras[1] || cores[2], rotacao: 0, tamanho: 1.0 },
            { forma: forma, cor: outras[2] || cores[0], rotacao: 0, tamanho: 1.0 }
        ];

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // --- Gerador 4: CONTAGEM ---
    // Número de formas cresce em cada linha
    function gerarContagem() {
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        var cor = CORES[randInt(0, CORES.length - 1)];

        var matriz = [];
        for (var l = 0; l < 3; l++) {
            for (var c = 0; c < 3; c++) {
                var quantidade = (l + c) + 1;
                matriz.push({
                    forma: forma,
                    cor: cor,
                    rotacao: 0,
                    tamanho: 1.0,
                    quantidade: quantidade
                });
            }
        }
        var resposta = matriz[8];
        matriz[8] = null;

        // Distratores: quantidades erradas
        var distratores = [
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: 3 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: 4 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: 6 }
        ];

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // --- Gerador 5: SUBTRAÇÃO ---
    // Coluna 3 = Coluna 1 - Coluna 2 (em número de formas)
    function gerarSubstracao() {
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        var cor = CORES[randInt(0, CORES.length - 1)];

        var matriz = [];
        for (var l = 0; l < 3; l++) {
            var a = randInt(4, 7);
            var b = randInt(1, 3);
            // Coluna 1: a formas
            matriz.push({ forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: a });
            // Coluna 2: b formas
            matriz.push({ forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: b });
            // Coluna 3: a - b formas
            matriz.push({ forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: a - b });
        }
        var resposta = matriz[8];
        matriz[8] = null;

        var distratores = [
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: resposta.quantidade + 1 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: resposta.quantidade - 1 },
            { forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: resposta.quantidade + 2 }
        ].filter(function(d) { return d.quantidade >= 1; });

        // Garante 3 distratores
        while (distratores.length < 3) {
            var q = randInt(1, 8);
            if (q !== resposta.quantidade) {
                distratores.push({ forma: forma, cor: cor, rotacao: 0, tamanho: 1.0, quantidade: q });
            }
        }

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // --- Gerador 6: COMPOSIÇÃO ---
    // Combina 2 regras (ex: rotação + mudança de cor)
    function gerarComposicao() {
        // Regra 1: forma gira 45° por coluna
        // Regra 2: cor muda a cada linha
        var forma = FORMAS[randInt(0, FORMAS.length - 1)];
        var cores = embaralhar(CORES).slice(0, 3);

        var matriz = [];
        for (var l = 0; l < 3; l++) {
            for (var c = 0; c < 3; c++) {
                matriz.push({
                    forma: forma,
                    cor: cores[l],
                    rotacao: c * 45,
                    tamanho: 1.0
                });
            }
        }
        var resposta = matriz[8];
        matriz[8] = null;

        var distratores = [
            { forma: forma, cor: cores[0], rotacao: 45, tamanho: 1.0 },
            { forma: forma, cor: cores[1], rotacao: 90, tamanho: 1.0 },
            { forma: forma, cor: cores[2], rotacao: 0, tamanho: 1.0 }
        ];

        return { matriz: matriz, resposta: resposta, distratores: distratores };
    }

    // Mapa de geradores
    var GERADORES = {
        'rotacao':     gerarRotacao,
        'crescimento': gerarCrescimento,
        'cor':         gerarCor,
        'contagem':    gerarContagem,
        'substracao':  gerarSubstracao,
        'composicao':  gerarComposicao
    };

    // ==========================================================
    // GERAR PUZZLE
    // ==========================================================
    function gerarPuzzle() {
        var tipos = MODOS[modoAtual].tipos;
        var tipo = tipos[randInt(0, tipos.length - 1)];
        var gerador = GERADORES[tipo];
        if (!gerador) gerador = gerarRotacao;
        return gerador();
    }

    // ==========================================================
    // RENDERIZAÇÃO
    // ==========================================================
    function renderizarShape(item) {
        var wrapper = document.createElement('div');
        wrapper.className = 'shape';
        wrapper.style.color = item.cor || '#ffffff';

        // Tamanho base
        var escala = item.tamanho || 1.0;
        var baseSize = 100 * escala;
        wrapper.style.transform = 'rotate(' + (item.rotacao || 0) + 'deg)';

        if (item.quantidade) {
            // Mostra N formas pequenas
            wrapper.style.display = 'flex';
            wrapper.style.flexWrap = 'wrap';
            wrapper.style.alignItems = 'center';
            wrapper.style.justifyContent = 'center';
            wrapper.style.gap = '2px';
            wrapper.style.fontSize = (48 / Math.max(2, Math.sqrt(item.quantidade))) + 'px';
            for (var i = 0; i < item.quantidade; i++) {
                var s = document.createElement('span');
                s.textContent = item.forma;
                wrapper.appendChild(s);
            }
        } else {
            wrapper.textContent = item.forma;
            wrapper.style.fontSize = '48px';
        }

        return wrapper;
    }

    function renderizarMatriz() {
        var grid = $('matrix-grid');
        grid.innerHTML = '';

        var m = puzzleAtual.matriz;

        for (var i = 0; i < 9; i++) {
            var cel = document.createElement('div');
            cel.className = 'matrix-cel';

            if (m[i] === null) {
                // Célula da incógnita
                cel.classList.add('interrogacao');
            } else {
                cel.appendChild(renderizarShape(m[i]));
            }

            grid.appendChild(cel);
        }
    }

    function renderizarOpcoes() {
        var grid = $('opcoes-grid');
        grid.innerHTML = '';

        // Junta resposta + distratores e embaralha
        var todas = [puzzleAtual.resposta].concat(puzzleAtual.distratores);
        todas = embaralhar(todas);

        todas.forEach(function(item) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opcao';
            btn.dataset.correta = (item === puzzleAtual.resposta) ? '1' : '0';

            btn.appendChild(renderizarShape(item));

            btn.addEventListener('click', function() {
                responder(item === puzzleAtual.resposta, btn);
            });

            grid.appendChild(btn);
        });
    }

    // ==========================================================
    // RESPONDER
    // ==========================================================
    function responder(acertou, btn) {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        pararTimer();

        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            var b = botoes[i];
            b.disabled = true;
            if (b.dataset.correta === '1') {
                b.classList.add('correta');
            } else if (b === btn && !acertou) {
                b.classList.add('incorreta');
            }
        }

        if (acertou) {
            acertos++;
            comboAtual++;
            var bonus = Math.min(comboAtual, 5);
            var bonusTempo = Math.ceil(tempoRestante);
            var ganho = 10 + bonus * 2 + bonusTempo;
            pontos += ganho;

            som.acerto();
            atualizarBadge('✅ Correto! +' + ganho, 'ok');
            mostrarFeedbackFloat('+' + ganho, 'positivo');

            if (pontos > recordes[modoAtual]) {
                recordes[modoAtual] = pontos;
                localStorage.setItem('brain_matrix_recorde_' + modoAtual, String(pontos));
            }
        } else {
            erros++;
            comboAtual = 0;
            som.erro();
            atualizarBadge('❌ Errado!', 'erro');
            mostrarFeedbackFloat('✗', 'negativo');
        }

        atualizarPlacar();

        rodada++;
        setTimeout(function() {
            if (jogoAtivo) proximaRodada();
        }, acertou ? 1400 : 2200);
    }

    function tempoEsgotado() {
        if (!aceitandoResposta) return;
        aceitandoResposta = false;
        comboAtual = 0;
        erros++;

        var botoes = document.querySelectorAll('.opcao');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].disabled = true;
            if (botoes[i].dataset.correta === '1') {
                botoes[i].classList.add('correta');
            }
        }

        som.erro();
        atualizarBadge('⏰ Tempo esgotado!', 'erro');
        atualizarPlacar();

        rodada++;
        setTimeout(function() {
            if (jogoAtivo) proximaRodada();
        }, 2200);
    }

    // ==========================================================
    // TIMER
    // ==========================================================
    function iniciarTimer(segundos) {
        tempoRestante = segundos;
        atualizarTimerBar();
        if (timerInterval) clearInterval(timerInterval);
        var tiqueAnterior = Math.ceil(tempoRestante);

        timerInterval = setInterval(function() {
            tempoRestante -= 0.1;
            if (tempoRestante <= 0) {
                tempoRestante = 0;
                atualizarTimerBar();
                clearInterval(timerInterval);
                timerInterval = null;
                tempoEsgotado();
                return;
            }
            atualizarTimerBar();
            var seg = Math.ceil(tempoRestante);
            if (seg !== tiqueAnterior) {
                tiqueAnterior = seg;
                if (seg <= 3) som.tique();
            }
        }, 100);
    }

    function atualizarTimerBar() {
        var tempoMax = MODOS[modoAtual].tempoMax;
        var pct = (tempoRestante / tempoMax) * 100;
        $('timer-fill').style.width = pct + '%';
    }

    function pararTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    // ==========================================================
    // FEEDBACK FLUTUANTE
    // ==========================================================
    function mostrarFeedbackFloat(texto, tipo) {
        var el = document.createElement('div');
        el.className = 'feedback-float ' + tipo;
        el.textContent = texto;
        document.querySelector('.matrix-area').appendChild(el);
        setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
        }, 900);
    }

    // ==========================================================
    // FLUXO DO JOGO
    // ==========================================================
    function proximaRodada() {
        puzzleAtual = gerarPuzzle();
        renderizarMatriz();
        renderizarOpcoes();
        aceitandoResposta = true;
        atualizarBadge('👉 Sua vez!', '');

        var tempoMax = MODOS[modoAtual].tempoMax;
        iniciarTimer(tempoMax);
    }

    function iniciarJogo() {
        jogoAtivo = true;
        rodada = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        comboAtual = 0;
        aceitandoResposta = false;

        esconderOverlay();
        atualizarPlacar();
        atualizarBadge('🧩 Prepare-se...', 'ok');

        setTimeout(function() {
            proximaRodada();
        }, 400);
    }

    // ==========================================================
    // OVERLAYS
    // ==========================================================
    function esconderOverlay() {
        var ov = $('overlay');
        if (!ov) return;
        ov.classList.add('hidden');
        ov.innerHTML = '';
    }

    function mostrarOverlay(cfg) {
        var ov = $('overlay');
        if (!ov) {
            ov = document.createElement('div');
            ov.id = 'overlay';
            ov.className = 'overlay';
            $('container').appendChild(ov);
        }
        ov.innerHTML = '';

        if (cfg.titulo) {
            var h2 = document.createElement('h2');
            h2.textContent = cfg.titulo;
            ov.appendChild(h2);
        }
        if (cfg.htmlExtra) {
            var div = document.createElement('div');
            div.innerHTML = cfg.htmlExtra;
            ov.appendChild(div);
        }
        if (cfg.subtitulo) {
            var p = document.createElement('div');
            p.className = 'subtitulo';
            p.textContent = cfg.subtitulo;
            ov.appendChild(p);
        }
        if (cfg.botao) {
            var btn = document.createElement('button');
            btn.textContent = cfg.botao.texto;
            btn.addEventListener('click', cfg.botao.acao);
            ov.appendChild(btn);
        }

        ov.classList.remove('hidden');
    }

    // ==========================================================
    // TROCA DE MODO
    // ==========================================================
    function trocarModo(novoModo) {
        if (novoModo === modoAtual) return;
        modoAtual = novoModo;

        jogoAtivo = false;
        aceitandoResposta = false;
        pararTimer();
        esconderOverlay();

        var botoes = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < botoes.length; i++) {
            botoes[i].classList.toggle('active', botoes[i].dataset.mode === novoModo);
        }

        rodada = 1;
        pontos = 0;
        acertos = 0;
        erros = 0;
        comboAtual = 0;

        atualizarPlacar();
        atualizarBadge('Pronto', '');
        $('matrix-grid').innerHTML = '';
        $('opcoes-grid').innerHTML = '';
        $('timer-fill').style.width = '0%';

        var modo = MODOS[novoModo];
        $('info-instrucao').textContent = '🧩 Modo ' + modo.nome + ': encontre o padrão na matriz!';
    }

    // ==========================================================
    // EVENTOS DE UI
    // ==========================================================
    var modeBtns = document.querySelectorAll('.mode-btn');
    for (var i = 0; i < modeBtns.length; i++) {
        (function(btn) {
            btn.addEventListener('click', function() { trocarModo(btn.dataset.mode); });
        })(modeBtns[i]);
    }

    $('btn-iniciar').addEventListener('click', iniciarJogo);

    var soundToggleBtn = $('sound-toggle');
    soundToggleBtn.addEventListener('click', function() {
        som.ativo = !som.ativo;
        soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
    });

    var savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $('theme-toggle').addEventListener('click', function() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('brain_flow_theme', next);
    });

    // ==========================================================
    // BOOT
    // ==========================================================
    trocarModo('facil');
    console.log('[brain-matrix] Pronto! Modo:', modoAtual);
})();
</script>
