<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Curves — Brain Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.72);
    --card-border: rgba(148, 163, 184, 0.15);
    --card-glow: rgba(99, 102, 241, 0.25);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --border-color: rgba(148, 163, 184, 0.18);
    --border-strong: rgba(148, 163, 184, 0.35);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-green: #4ade80;
    --c-blue: #38bdf8;
    --c-amber: #f59e0b;
    --board-bg: rgba(15, 23, 42, 0.55);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --t-fast: 0.15s ease;
    --t-base: 0.25s ease;
    --t-slow: 0.4s ease;
}

[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-glow: rgba(99, 102, 241, 0.15);
    --text-color: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;
    --border-color: rgba(15, 23, 42, 0.1);
    --border-strong: rgba(15, 23, 42, 0.25);
    --input-bg: rgba(255, 255, 255, 0.95);
    --board-bg: rgba(248, 250, 252, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}

body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.3;
    z-index: -1;
    pointer-events: none;
}
body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
body::after  { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
    opacity: 0.9;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}

.btn-small {
    width: auto;
    margin: 0;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--t-base);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    text-decoration: none;
}
.btn-small:hover {
    color: var(--text-color);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.user-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    background: var(--input-bg);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
}
.user-info-left { display: flex; align-items: center; gap: 10px; }
.user-avatar-display {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    font-size: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
    border: 1px solid rgba(99, 102, 241, 0.4);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
}
#display-nome { font-size: 14px; font-weight: 700; }
.game-name {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 11px;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 2px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.02);
}
.score-board strong {
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: none;
}
#display-nivel  { color: var(--c-blue); }
#display-pontos { color: var(--c-green); }
#display-tempo  { color: #60a5fa; }
#display-pares  { color: var(--c-amber); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    line-height: 1.5;
    min-height: 18px;
}

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 460px;
    margin: 0 auto 12px;
    border-radius: 14px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
        var(--board-bg);
    background-image:
        linear-gradient(var(--board-bg), var(--board-bg)),
        linear-gradient(135deg,
            rgba(99, 102, 241, 0.55) 0%,
            rgba(139, 92, 246, 0.35) 30%,
            rgba(56, 189, 248, 0.30) 65%,
            rgba(99, 102, 241, 0.45) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border: 2px solid transparent;
    box-shadow:
        0 12px 40px -14px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--card-border),
        0 0 24px -6px rgba(99, 102, 241, 0.35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#canvas-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

.dot {
    cursor: grab;
    touch-action: none;
    transition: filter var(--t-base);
}
.dot:hover { filter: brightness(1.2) drop-shadow(0 0 8px currentColor); }

.trail {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
    pointer-events: none;
}
.trail.live {
    stroke-dasharray: 12 8;
    animation: trailDash 0.6s linear infinite;
}
@keyframes trailDash {
    to { stroke-dashoffset: -20; }
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
.controls-grid.triple {
    grid-template-columns: 1fr 1fr 1fr;
}

select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    background: var(--input-bg);
    color: var(--text-color);
    cursor: pointer;
    transition: border-color var(--t-base), box-shadow var(--t-base);
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 36px;
}
select:focus {
    outline: none;
    border-color: var(--btn-primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
}

button.action {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    box-shadow: var(--shadow-btn);
    transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
}
button.action:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
}
button.action:active { transform: translateY(0); filter: brightness(0.97); }

button.secondary {
    background: linear-gradient(135deg, #475569, #334155);
    box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.6);
}
button.secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }

.back-float {
    position: fixed;
    bottom: 84px;
    right: 20px;
    z-index: 998;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border-strong);
    color: var(--text-color);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transition: opacity var(--t-base), transform var(--t-base), border-color var(--t-base);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    text-decoration: none;
}
.back-float.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}
.back-float:hover {
    transform: translateY(-3px) scale(1.05);
    border-color: var(--btn-primary);
}
@media (min-width: 769px) { .back-float { bottom: 24px; } }

@media (max-width: 440px) {
    body { padding: 10px; }
    .container { padding: 16px 14px 18px; border-radius: 16px; max-width: 100%; }
    .score-board { font-size: 10px; }
    .score-board strong { font-size: 13px; }
    .game-name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
    }
}

:focus-visible { outline: 2px solid var(--btn-primary); outline-offset: 2px; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-small">⬅ Menu Hub</a>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>
    </div>

    <div class="user-header">
        <div class="user-info-left">
            <span id="display-avatar" class="user-avatar-display">😀</span>

    <div class="score-board">

    </div>

    <p class="instructions" id="info-instrucao">
        Arraste de uma bolinha à outra da <b>mesma cor</b> sem cruzar traços.
    </p>

        <svg id="canvas-svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">

        </svg>
    </div>

    <div class="controls-grid">
        <select id="select-nivel">
            <option value="1" selected>Nível 1 — 2 pares</option>
            <option value="2">Nível 2 — 3 pares</option>

            <option value="4">Nível 4 — 5 pares</option>
        </select>
        <button id="btn-reset" class="action secondary">🔄 Reiniciar</button>
    </div>
</div>

<a href="index.html" id="btn-back-float" class="back-float" title="Voltar ao Menu Hub" aria-label="Voltar ao Menu Hub">⬅</a>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* ============================================================
   SESSÃO
   ============================================================ */
const jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
if (!jogadorSessao) { window.location.href = 'index.html'; }

/* ============================================================
   CONFIGURAÇÃO DO TABULEIRO
   ============================================================ */
const BOARD = {
    largura: 400,
    altura: 400,
    margemSegura: 55,      // bolinhas normais ficam a ≥ 55px das bordas
    faixaBorda: [20, 35],  // a bolinha "de borda" fica entre 20 e 35px
    minDistPares: 60,      // distância mínima entre pares diferentes
    minDistPar: 220,       // distância mínima entre as duas do mesmo par
    raioBolinha: 22
};

const PALETA = [
    '#22c55e', '#3b82f6', '#ef4444', '#f59e0b', '#a855f7',
    '#06b6d4', '#ec4899', '#84cc16'
];

/* ============================================================
   GERADOR DE NÍVEIS
   ============================================================
   Fases:
     1. Distribuir pares em regiões angulares opostas
     2. Validar distâncias mínimas e margens
     3. NOVO: forçar pelo menos 1 bolinha na faixa de borda
     4. Fallback em grade se falhar 80x
   ============================================================ */
function gerarNivel(quantidadePares) {
    const tentativasMax = 80;
    for (let tentativa = 0; tentativa < tentativasMax; tentativa++) {
        const resultado = tentarGerar(quantidadePares);
        if (resultado) return resultado;
    }
    return gerarFallback(quantidadePares);
}

function tentarGerar(quantidadePares) {
    const dots = [];
    const pontosUsados = [];

    const centro = { x: BOARD.largura / 2, y: BOARD.altura / 2 };
    const raio = Math.min(BOARD.largura, BOARD.altura) / 2 - BOARD.margemSegura;
    const anguloBase = Math.random() * Math.PI * 2;

    for (let parId = 0; parId < quantidadePares; parId++) {
        const anguloCentro = anguloBase + (parId * 2 * Math.PI / quantidadePares);
        const anguloSpread = (2 * Math.PI / quantidadePares) * 0.7;

        let posicaoA = null, posicaoB = null;

        for (let tent = 0; tent < 100; tent++) {
            const anguloA = anguloCentro + (Math.random() - 0.5) * anguloSpread;
            const anguloB = anguloCentro + Math.PI + (Math.random() - 0.5) * anguloSpread;
            const raioA = raio * (0.6 + Math.random() * 0.4);
            const raioB = raio * (0.6 + Math.random() * 0.4);

            const a = {
                x: centro.x + Math.cos(anguloA) * raioA,
                y: centro.y + Math.sin(anguloA) * raioA
            };
            const b = {
                x: centro.x + Math.cos(anguloB) * raioB,
                y: centro.y + Math.sin(anguloB) * raioB
            };

            if (!dentroDaMargem(a) || !dentroDaMargem(b)) continue;
            if (Math.hypot(a.x - b.x, a.y - b.y) < BOARD.minDistPar) continue;

            let ok = true;
            for (const p of pontosUsados) {
                if (Math.hypot(a.x - p.x, a.y - p.y) < BOARD.minDistPares ||
                    Math.hypot(b.x - p.x, b.y - p.y) < BOARD.minDistPares) {
                    ok = false;
                    break;
                }
            }
            if (!ok) continue;

            posicaoA = a;
            posicaoB = b;
            break;
        }

        if (!posicaoA || !posicaoB) return null;

        dots.push({ ...posicaoA, cor: PALETA[parId % PALETA.length], parId });
        dots.push({ ...posicaoB, cor: PALETA[parId % PALETA.length], parId });
        pontosUsados.push(posicaoA, posicaoB);
    }

    /* ============================================================
       FORÇAR PELO MENOS UMA BOLINHA NA BORDA
       ============================================================
       Se nenhuma das bolinhas geradas está na faixa de borda,
       move uma aleatória para uma posição "grudada" na borda.
       A escolha é aleatória entre as 4 bordas.
       ============================================================ */
    const temBorda = dots.some(d => estaNaBorda(d));
    if (!temBorda) {
        // Tenta mover bolinhas até conseguir (até 20 tentativas)
        for (let tent = 0; tent < 20; tent++) {
            const idx = Math.floor(Math.random() * dots.length);
            const dot = dots[idx];
            const bordaEscolhida = Math.floor(Math.random() * 4);
            const nova = calcularPosicaoBorda(bordaEscolhida);
            if (!nova) continue;

            // Verifica se a nova posição não colide com outras bolinhas
            const colide = dots.some((outro, j) => {
                if (j === idx) return false;
                return Math.hypot(outro.x - nova.x, outro.y - nova.y) < BOARD.minDistPares;
            });
            if (colide) continue;

            // Verifica se a nova posição não fica longe demais do par
            const par = dots.find((o, j) => o.parId === dot.parId && j !== idx);
            if (par && Math.hypot(par.x - nova.x, par.y - nova.y) < BOARD.minDistPar) continue;

            // Aplica a mudança
            dot.x = nova.x;
            dot.y = nova.y;
            break;
        }
    }

    return dots;
}

/**
 * Retorna true se a bolinha está dentro da faixa de borda.
 */
function estaNaBorda(dot) {
    const [min, max] = BOARD.faixaBorda;
    const distEsq = dot.x;
    const distDir = BOARD.largura - dot.x;
    const distTop = dot.y;
    const distBot = BOARD.altura - dot.y;
    const menorDist = Math.min(distEsq, distDir, distTop, distBot);
    return menorDist >= min && menorDist <= max;
}

/**
 * Calcula uma posição aleatória numa das 4 bordas, dentro da faixa.
 * Retorna null se a borda não tem espaço útil.
 */
function calcularPosicaoBorda(indiceBorda) {
    const [min, max] = BOARD.faixaBorda;
    const dist = min + Math.random() * (max - min);
    const margemParalela = BOARD.margemSegura;

    switch (indiceBorda) {
        case 0: // topo
            return { x: margemParalela + Math.random() * (BOARD.largura - 2 * margemParalela), y: dist };
        case 1: // direita
            return { x: BOARD.largura - dist, y: margemParalela + Math.random() * (BOARD.altura - 2 * margemParalela) };
        case 2: // base
            return { x: margemParalela + Math.random() * (BOARD.largura - 2 * margemParalela), y: BOARD.altura - dist };
        case 3: // esquerda
            return { x: dist, y: margemParalela + Math.random() * (BOARD.altura - 2 * margemParalela) };
    }
    return null;
}

function dentroDaMargem(p) {
    return p.x >= BOARD.margemSegura &&
           p.x <= BOARD.largura - BOARD.margemSegura &&
           p.y >= BOARD.margemSegura &&
           p.y <= BOARD.altura - BOARD.margemSegura;
}

function gerarFallback(quantidadePares) {
    const dots = [];
    const total = quantidadePares * 2;
    const colunas = Math.ceil(Math.sqrt(total));
    const linhas = Math.ceil(total / colunas);
    const passoX = (BOARD.largura - 2 * BOARD.margemSegura) / (colunas - 1 || 1);
    const passoY = (BOARD.altura - 2 * BOARD.margemSegura) / (linhas - 1 || 1);

    let idx = 0;
    for (let parId = 0; parId < quantidadePares; parId++) {
        for (let k = 0; k < 2; k++) {
            const col = idx % colunas;
            const lin = Math.floor(idx / colunas);
            dots.push({
                x: BOARD.margemSegura + col * passoX,
                y: BOARD.margemSegura + lin * passoY,
                cor: PALETA[parId % PALETA.length],
                parId
            });
            idx++;
        }
    }

    // Aplica a regra de borda também no fallback
    if (dots.length > 0 && !dots.some(d => estaNaBorda(d))) {
        dots[0].x = BOARD.faixaBorda[0] + Math.random() * (BOARD.faixaBorda[1] - BOARD.faixaBorda[0]);
    }

    return dots;
}

/* ============================================================
   ESTADO
   ============================================================ */
const estado = {
    nivel: 1,
    dots: [],
    trilhas: {},
    desenhando: null,
    paresConcluidos: 0,
    pontos: 0,
    segundos: 0,
    timer: null,
    concluido: false,
    totalPares: 0
};

/* ============================================================
   DOM
   ============================================================ */
const svg = document.getElementById('canvas-svg');
const trailsLayer = document.getElementById('trails-layer');
const dotsLayer = document.getElementById('dots-layer');

const displayNivel = document.getElementById('display-nivel');
const displayPontos = document.getElementById('display-pontos');
const displayTempo = document.getElementById('display-tempo');
const displayPares = document.getElementById('display-pares');
const infoInstrucao = document.getElementById('info-instrucao');
const selectNivel = document.getElementById('select-nivel');
const btnReset = document.getElementById('btn-reset');
const themeToggle = document.getElementById('theme-toggle');
const btnBackFloat = document.getElementById('btn-back-float');

/* ============================================================
   SONS
   ============================================================ */
let audioCtx = null;
function tocarSom(tipo) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (tipo === 'par') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(660, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        } else if (tipo === 'vitoria') {
            [523, 659, 784, 1047].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                g.gain.setValueAtTime(0.09, audioCtx.currentTime + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.25);
                o.start(audioCtx.currentTime + i * 0.1);
                o.stop(audioCtx.currentTime + i * 0.1 + 0.25);
            });
        }
    } catch (_) { /* silencioso */ }
}

/* ============================================================
   GEOMETRIA — cruzamento de segmentos
   ============================================================ */
function orientacao(a, b, c) {
    const v = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    if (Math.abs(v) < 1e-9) return 0;
    return v > 0 ? 1 : -1;
}

function onSegmento(a, b, c) {
    return Math.min(a.x, b.x) <= c.x && c.x <= Math.max(a.x, b.x) &&
           Math.min(a.y, b.y) <= c.y && c.y <= Math.max(a.y, b.y);
}

function segmentosSeCruzam(p1, p2, p3, p4) {
    const o1 = orientacao(p1, p2, p3);
    const o2 = orientacao(p1, p2, p4);
    const o3 = orientacao(p3, p4, p1);
    const o4 = orientacao(p3, p4, p2);
    if (o1 !== o2 && o3 !== o4) return true;
    if (o1 === 0 && onSegmento(p1, p2, p3)) return true;
    if (o2 === 0 && onSegmento(p1, p2, p4)) return true;
    if (o3 === 0 && onSegmento(p3, p4, p1)) return true;
    if (o4 === 0 && onSegmento(p3, p4, p2)) return true;
    return false;
}

function cruzariaAlgumaTrilha(p1, p2, parIdAtual) {
    for (const parId in estado.trilhas) {
        if (parseInt(parId) === parIdAtual) continue;
        const trilha = estado.trilhas[parId].pontos;
        for (let i = 0; i < trilha.length - 1; i++) {
            if (segmentosSeCruzam(p1, p2, trilha[i], trilha[i + 1])) return true;
        }
    }
    return false;
}

/* ============================================================
   INICIALIZAÇÃO DO NÍVEL
   ============================================================ */
function iniciarNivel(nivel) {
    const quantidadePares = nivel + 1;

    estado.dots = gerarNivel(quantidadePares);
    estado.nivel = nivel;
    estado.totalPares = quantidadePares;
    estado.trilhas = {};
    estado.desenhando = null;
    estado.paresConcluidos = 0;
    estado.concluido = false;

    displayNivel.textContent = nivel;
    atualizarContadorPares();
    infoInstrucao.textContent = `Nível ${nivel}: ligue ${quantidadePares} pares sem cruzar traços.`;

    renderizarTudo();
    iniciarTimer();
}

function atualizarContadorPares() {
    displayPares.textContent = `${estado.paresConcluidos}/${estado.totalPares}`;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderizarTudo() {
    trailsLayer.innerHTML = '';
    for (const parId in estado.trilhas) {
        const trilha = estado.trilhas[parId];
        const path = criarPathSVG(trilha.pontos, trilha.cor, false);
        trailsLayer.appendChild(path);
    }
    if (estado.desenhando && estado.desenhando.pontos.length > 1) {
        const path = criarPathSVG(estado.desenhando.pontos, estado.desenhando.cor, true);
        trailsLayer.appendChild(path);
    }

    dotsLayer.innerHTML = '';
    for (const dot of estado.dots) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', dot.x);
        circle.setAttribute('cy', dot.y);
        circle.setAttribute('r', BOARD.raioBolinha);
        circle.setAttribute('fill', dot.cor);
        circle.setAttribute('stroke', 'rgba(255,255,255,0.9)');
        circle.setAttribute('stroke-width', '3');
        circle.classList.add('dot');
        circle.dataset.parId = dot.parId;
        circle.style.color = dot.cor;
        circle.addEventListener('pointerdown', onPointerDown);
        dotsLayer.appendChild(circle);
    }
}

function criarPathSVG(pontos, cor, live) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d = `M ${pontos[0].x} ${pontos[0].y}`;
    for (let i = 1; i < pontos.length; i++) {
        d += ` L ${pontos[i].x} ${pontos[i].y}`;
    }
    path.setAttribute('d', d);
    path.setAttribute('stroke', cor);
    path.setAttribute('class', 'trail' + (live ? ' live' : ''));
    return path;
}

/* ============================================================
   INTERAÇÃO
   ============================================================ */
function getSVGPoint(evt) {
    const rect = svg.getBoundingClientRect();
    const x = (evt.clientX - rect.left) / rect.width * 400;
    const y = (evt.clientY - rect.top) / rect.height * 400;
    return { x, y };
}

function onPointerDown(evt) {
    if (estado.concluido) return;
    const circle = evt.currentTarget;
    const parId = parseInt(circle.dataset.parId);

    if (estado.trilhas[parId]) {
        delete estado.trilhas[parId];
        estado.paresConcluidos--;
        atualizarContadorPares();
        renderizarTudo();
        return;
    }

    const dot = estado.dots.find(d => d.parId === parId && Math.hypot(
        parseFloat(circle.getAttribute('cx')) - d.x,
        parseFloat(circle.getAttribute('cy')) - d.y
    ) < 1);
    if (!dot) return;

    evt.preventDefault();
    estado.desenhando = {
        parId,
        cor: dot.cor,
        pontos: [{ x: dot.x, y: dot.y }],
        dotOrigem: dot
    };

    try { svg.setPointerCapture(evt.pointerId); } catch (_) {}
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);

    renderizarTudo();
}

function onPointerMove(evt) {
    if (!estado.desenhando) return;
    evt.preventDefault();

    const pt = getSVGPoint(evt);
    pt.x = Math.max(15, Math.min(385, pt.x));
    pt.y = Math.max(15, Math.min(385, pt.y));

    const pontos = estado.desenhando.pontos;
    const ultimo = pontos[pontos.length - 1];

    if (Math.hypot(pt.x - ultimo.x, pt.y - ultimo.y) < 5) return;

    if (cruzariaAlgumaTrilha(ultimo, pt, estado.desenhando.parId)) {
        infoInstrucao.textContent = '⚠️ Não pode cruzar outros traços!';
        return;
    }

    pontos.push(pt);
    renderizarTudo();
}

function onPointerUp(evt) {
    svg.removeEventListener('pointermove', onPointerMove);
    svg.removeEventListener('pointerup', onPointerUp);
    svg.removeEventListener('pointercancel', onPointerUp);
    try { svg.releasePointerCapture(evt.pointerId); } catch (_) {}

    if (!estado.desenhando) return;

    const pt = getSVGPoint(evt);
    const dotOrigem = estado.desenhando.dotOrigem;
    const alvo = estado.dots.find(d => {
        return d.parId === estado.desenhando.parId &&
               !(d === dotOrigem) &&
               Math.hypot(d.x - pt.x, d.y - pt.y) < BOARD.raioBolinha * 1.6;
    });

    if (alvo && estado.desenhando.pontos.length >= 2) {
        estado.desenhando.pontos.push({ x: alvo.x, y: alvo.y });
        estado.trilhas[estado.desenhando.parId] = {
            cor: estado.desenhando.cor,
            pontos: [...estado.desenhando.pontos]
        };
        estado.paresConcluidos++;
        atualizarContadorPares();
        tocarSom('par');
        if (navigator.vibrate) navigator.vibrate(40);
        infoInstrucao.textContent = `✅ Par ligado! ${estado.paresConcluidos}/${estado.totalPares}`;
    } else {
        infoInstrucao.textContent = 'Traço cancelado — solte sobre a bolinha par da mesma cor.';
    }

    estado.desenhando = null;
    renderizarTudo();
    verificarConclusao();
}

/* ============================================================
   VITÓRIA
   ============================================================ */
function verificarConclusao() {
    if (estado.paresConcluidos === estado.totalPares && !estado.concluido) {
        estado.concluido = true;
        pararTimer();
        tocarSom('vitoria');
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

        const tempoBonus = Math.max(0, 200 - estado.segundos);
        const ganho = estado.nivel * 30 + tempoBonus;
        estado.pontos += ganho;
        displayPontos.textContent = estado.pontos;

        infoInstrucao.textContent = `🎉 Nível ${estado.nivel} concluído em ${formatarTempo(estado.segundos)}! +${ganho} pts.`;
        salvarProgresso();
    }
}

async function salvarProgresso() {
    try {
        const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
        const snap = await get(jogadorRef);
        const dados = snap.exists() ? snap.val() : {};
        const recordes = dados.recordesCurves || {};
        if (!recordes[estado.nivel] || estado.segundos < recordes[estado.nivel]) {
            recordes[estado.nivel] = estado.segundos;
        }
        await update(jogadorRef, {
            pontos: estado.pontos,
            recordesCurves: recordes,
            ultimaAtualizacao: new Date().toISOString()
        });
    } catch (e) {
        console.warn('Modo offline — progresso não sincronizado', e);
    }
}

/* ============================================================
   TIMER
   ============================================================ */
function formatarTempo(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${m}:${ss}`;
}

function iniciarTimer() {
    pararTimer();
    estado.segundos = 0;
    displayTempo.textContent = '00:00';
    estado.timer = setInterval(() => {
        estado.segundos++;
        displayTempo.textContent = formatarTempo(estado.segundos);
    }, 1000);
}

function pararTimer() {
    if (estado.timer) clearInterval(estado.timer);
    estado.timer = null;
}

/* ============================================================
   EVENTOS
   ============================================================ */
selectNivel.addEventListener('change', () => {
    const n = parseInt(selectNivel.value);
    if (n >= 1 && n <= 4) iniciarNivel(n);
});

btnReset.addEventListener('click', () => iniciarNivel(estado.nivel));

/* ============================================================
   TEMA
   ============================================================ */
const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
atualizarTextoBotaoTema(savedTheme);

themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('brain_flow_theme', next);
    atualizarTextoBotaoTema(next);
});

function atualizarTextoBotaoTema(theme) {
    themeToggle.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
}

/* ============================================================
   SESSÃO / PERFIL
   ============================================================ */
try {
    document.getElementById('display-nome').textContent = jogadorSessao.nome || 'Visitante';
    document.getElementById('display-avatar').textContent = jogadorSessao.avatar || '😀';
} catch (_) {
    document.getElementById('display-nome').textContent = 'Visitante';
}

async function carregarProgresso() {
    try {
        const snap = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
        if (snap.exists()) {
            const dados = snap.val();
            estado.pontos = dados.pontos || 0;
        }
    } catch (e) { /* offline */ }
    displayPontos.textContent = estado.pontos;
    iniciarNivel(1);
}

carregarProgresso();

/* ============================================================
   BOTÃO FLUTUANTE
   ============================================================ */
function atualizarBackFloat() {
    const scrolled = window.scrollY || document.documentElement.scrollTop || 0;
    if (scrolled > 120) btnBackFloat.classList.add('visible');
    else btnBackFloat.classList.remove('visible');
}
window.addEventListener('scroll', atualizarBackFloat, { passive: true });
atualizarBackFloat();
</script>
</body>
