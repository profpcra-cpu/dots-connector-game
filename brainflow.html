<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brain Flow Curves — Ligação Livre sem Cruzamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-pink: #f43f5e;
    --c-gold: #fbbf24;
    --c-green: #4ade80;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.score-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-color);
}
#display-nivel { color: var(--c-cyan); }
#display-estrelas { color: var(--c-gold); }
#display-tempo { color: #60a5fa; }
#display-pontos { color: var(--c-green); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
    transition: color 0.3s ease;
}
.instructions.alerta { color: var(--c-gold); }
.instructions.erro { color: var(--c-pink); }
.instructions.sucesso { color: var(--c-green); }

#canvas-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    margin: 0 auto 12px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
        0 12px 40px -14px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--card-border),
        0 0 24px -6px rgba(99, 102, 241, 0.35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}
#game-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #050914;
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-secondary {
    background: linear-gradient(135deg, #475569, #334155);
}
.btn-secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }
#btn-proximo {
    margin-top: 10px;
    background: linear-gradient(135deg, #10b981, #14b8a6);
}
.hidden { display: none !important; }

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #f8fafc;
    z-index: 10;
    padding: 20px;
    text-align: center;
}
.overlay h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
}
.overlay .subtitulo {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 8px;
}
.overlay .estrelas-resultado {
    font-size: 32px;
    letter-spacing: 6px;
    margin: 8px 0;
}
.overlay button {
    width: auto;
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    font-size: 15px;
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="score-board">
        <div>Nível<br><strong id="display-nivel">1</strong></div>
        <div>⭐<br><strong id="display-estrelas">0/3</strong></div>
        <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div>Pontos<br><strong id="display-pontos">0</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">
        🚫 <b>Proibido cruzar linhas!</b> Contorne os obstáculos e trilhos para ligar e guiar a esfera.
    </p>

    <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="overlay" class="overlay hidden">
            <h2 id="overlay-titulo">Fim de Jogo</h2>
            <div class="subtitulo" id="overlay-sub"></div>
            <div class="estrelas-resultado" id="overlay-estrelas"></div>
            <button id="btn-overlay-acao">Tentar de novo</button>
        </div>
    </div>

    <div class="controls-grid">
        <select id="select-nivel">
            <option value="" disabled selected>Selecionar Nível...</option>
            <option value="1">Nível 1 — Fácil</option>
            <option value="2">Nível 2 — Médio</option>
            <option value="3">Nível 3 — Difícil</option>
            <option value="4">Nível 4 — Expert</option>
            <option value="5">Nível 5 — Insano</option>
        </select>
        <button id="btn-reiniciar" class="btn-secondary">🔄 Reiniciar</button>
    </div>

    <button id="btn-proximo" class="hidden">Próximo Nível 🚀</button>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
if (!jogadorSessao) { window.location.href = 'index.html'; }

const VERSAO = 'v3-curves-no-cross';
console.log(`✅ Brain Flow Curves ${VERSAO}`);

/* ==========================================================
   ÁUDIO SIMULADO (Web Audio API)
   ========================================================== */
class SoundManager {
    constructor() {
        this.ctx = null;
        this.ativo = localStorage.getItem('brain_flow_sound') !== 'false';
    }
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    toggle() {
        this.ativo = !this.ativo;
        localStorage.setItem('brain_flow_sound', this.ativo);
        return this.ativo;
    }
    playTone(freq, type, duration, gainVal = 0.1) {
        if (!this.ativo) return;
        try {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    }
    star() { this.playTone(587.33, 'sine', 0.2, 0.15); setTimeout(() => this.playTone(880, 'sine', 0.3, 0.15), 100); }
    portal() { this.playTone(440, 'triangle', 0.4, 0.2); }
    crash() { this.playTone(120, 'sawtooth', 0.4, 0.25); }
    invalid() { this.playTone(200, 'square', 0.15, 0.1); setTimeout(() => this.playTone(150, 'square', 0.2, 0.1), 80); }
    win() { 
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            setTimeout(() => this.playTone(f, 'sine', 0.3, 0.15), i * 100);
        });
    }
}
const som = new SoundManager();

const soundToggleBtn = document.getElementById('sound-toggle');
soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
soundToggleBtn.addEventListener('click', () => {
    const status = som.toggle();
    soundToggleBtn.textContent = status ? '🔊 Som' : '🔇 Mudo';
});

/* ==========================================================
   ESTADO GLOBAL
   ========================================================== */
const estado = {
    nivel: 1,
    pontos: 0,
    recordes: {},
    segundos: 0,
    timer: null,
    pausado: false,
    rodando: false,
    vitoria: false,
    gameOver: false,
    estrelasColetadas: 0,
    estrelasTotal: 0
};

/* ==========================================================
   CANVAS
   ========================================================== */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const W = 900;
const H = 600;
canvas.width = W;
canvas.height = H;

function ajustarDPR() {
    const dpr = window.devicePixelRatio || 1;
    if (dpr > 1) {
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);
    }
}
ajustarDPR();

/* ==========================================================
   CONFIG DE NÍVEIS
   ========================================================== */
const CONFIG = {
    1: { estrelas: 3, velocidade: 3.2, raio: 10, obstaculos: 0, tempoLimite: 90 },
    2: { estrelas: 4, velocidade: 3.5, raio: 10, obstaculos: 1, tempoLimite: 90 },
    3: { estrelas: 5, velocidade: 3.8, raio: 11, obstaculos: 2, tempoLimite: 100 },
    4: { estrelas: 6, velocidade: 4.1, raio: 11, obstaculos: 3, tempoLimite: 110 },
    5: { estrelas: 7, velocidade: 4.5, raio: 12, obstaculos: 4, tempoLimite: 120 }
};

/* ==========================================================
   JOGO
   ========================================================== */
const jogo = {
    bola: { x: W / 2, y: H / 2, raio: 10, angulo: 0, velocidade: 3.2, viva: true },
    linhasPassadas: [],  // Lista de segmentos de linha confirmados e ativos no tabuleiro
    tracadoAtual: [],    // Segmentos do traço que o utilizador está a desenhar agora
    estrelas: [],
    obstaculos: [],
    portal: { x: 0, y: 0, ativo: false, raio: 24, angulo: 0 },
    startTime: 0,
    ultimoUpdate: 0
};

/* ==========================================================
   GEOMETRIA E VERIFICAÇÃO DE INTERSEÇÃO DE SEGMENTOS
   ========================================================== */
function linhasCruzam(p1, p2, p3, p4) {
    function ccw(A, B, C) {
        return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
    }
    return ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4);
}

function tracadoCruzouLinhasExistentes(novoSegmento) {
    // Verifica se o novo segmento cruza com qualquer segmento salvo em linhasPassadas
    for (const linha of jogo.linhasPassadas) {
        if (linhasCruzam(novoSegmento.p1, novoSegmento.p2, linha.p1, linha.p2)) {
            return true;
        }
    }
    // Verifica também autokey/cruzamento dentro do próprio traçado atual
    if (jogo.tracadoAtual.length > 2) {
        const p1 = novoSegmento.p1;
        const p2 = novoSegmento.p2;
        for (let i = 0; i < jogo.tracadoAtual.length - 2; i++) {
            const l1 = jogo.tracadoAtual[i];
            const l2 = jogo.tracadoAtual[i+1];
            if (linhasCruzam(p1, p2, l1, l2)) return true;
        }
    }
    return false;
}

/* ==========================================================
   INICIALIZAÇÃO DE NÍVEL
   ========================================================== */
function iniciarNivel(nivel, preservarPontos = true) {
    if (!CONFIG[nivel]) nivel = 1;
    estado.nivel = nivel;
    const cfg = CONFIG[nivel];

    estado.estrelasTotal = cfg.estrelas;
    estado.estrelasColetadas = 0;
    estado.segundos = 0;
    estado.pausado = false;
    estado.rodando = true;
    estado.vitoria = false;
    estado.gameOver = false;
    if (!preservarPontos) estado.pontos = 0;

    jogo.bola.x = W / 2;
    jogo.bola.y = H / 2;
    jogo.bola.raio = cfg.raio;
    jogo.bola.velocidade = cfg.velocidade;
    jogo.bola.angulo = Math.random() * Math.PI * 2;
    jogo.bola.viva = true;

    jogo.linhasPassadas = [];
    jogo.tracadoAtual = [];

    // Estrelas
    jogo.estrelas = [];
    const margem = 70;
    for (let i = 0; i < cfg.estrelas; i++) {
        let tentativas = 0;
        while (tentativas < 60) {
            tentativas++;
            const x = margem + Math.random() * (W - margem * 2);
            const y = margem + Math.random() * (H - margem * 2);
            if (Math.hypot(x - W / 2, y - H / 2) < 110) continue;
            let ok = true;
            for (const e of jogo.estrelas) {
                if (Math.hypot(e.x - x, e.y - y) < 85) { ok = false; break; }
            }
            if (!ok) continue;
            jogo.estrelas.push({ x, y, coletada: false, angulo: Math.random() * Math.PI * 2 });
            break;
        }
    }

    // Obstáculos fixos/estáticos ou móveis leves
    jogo.obstaculos = [];
    for (let i = 0; i < cfg.obstaculos; i++) {
        let tentativas = 0;
        while (tentativas < 60) {
            tentativas++;
            const x = margem + Math.random() * (W - margem * 2);
            const y = margem + Math.random() * (H - margem * 2);
            if (Math.hypot(x - W / 2, y - H / 2) < 130) continue;
            let ok = true;
            for (const e of jogo.estrelas) {
                if (Math.hypot(e.x - x, e.y - y) < 100) { ok = false; break; }
            }
            if (!ok) continue;
            jogo.obstaculos.push({
                x, y, raio: 22 + Math.random() * 8,
                fase: Math.random() * Math.PI * 2,
                moveY: (Math.random() - 0.5) * 0.6,
                baseY: y
            });
            break;
        }
    }

    // Portal
    jogo.portal.x = 80 + Math.random() * (W - 160);
    jogo.portal.y = 80 + Math.random() * (H - 160);
    jogo.portal.ativo = false;
    jogo.portal.angulo = 0;

    jogo.startTime = performance.now();
    jogo.ultimoUpdate = performance.now();

    atualizarUI();
    esconderOverlay();
    iniciarTimer();
    atualizarInstrucao('🚫 Proibido cruzar linhas! Desenhe contornando obstáculos para guiar a esfera.');
}

/* ==========================================================
   TIMER
   ========================================================== */
function iniciarTimer() {
    pararTimer();
    estado.timer = setInterval(() => {
        if (estado.pausado || !estado.rodando) return;
        estado.segundos++;
        const limite = CONFIG[estado.nivel].tempoLimite;
        document.getElementById('display-tempo').textContent = formatarTempo(estado.segundos);
        if (estado.segundos >= limite) {
            finalizarJogo(false, '⏰ Tempo esgotado!');
        }
    }, 1000);
}
function pararTimer() {
    if (estado.timer) clearInterval(estado.timer);
    estado.timer = null;
}
function formatarTempo(s) {
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function atualizarUI() {
    document.getElementById('display-nivel').textContent = estado.nivel;
    document.getElementById('display-estrelas').textContent = `${estado.estrelasColetadas}/${estado.estrelasTotal}`;
    document.getElementById('display-pontos').textContent = estado.pontos;
    document.getElementById('display-tempo').textContent = formatarTempo(estado.segundos);
}

function atualizarInstrucao(txt, tipo = '') {
    const el = document.getElementById('info-instrucao');
    el.innerHTML = txt;
    el.className = 'instructions' + (tipo ? ' ' + tipo : '');
}

/* ==========================================================
   INPUTS E VALIDAÇÃO DE CRUZAMENTO EM TEMPO REAL
   ========================================================== */
let desenhandoAtivo = false;

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function iniciarDesenho(e) {
    if (!estado.rodando || estado.pausado || estado.vitoria) return;
    e.preventDefault();
    som.init();
    desenhandoAtivo = true;
    const pos = getCanvasPos(e);
    jogo.tracadoAtual = [pos];
}

function continuarDesenho(e) {
    if (!desenhandoAtivo) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    const ultimo = jogo.tracadoAtual[jogo.tracadoAtual.length - 1];
    
    if (Math.hypot(pos.x - ultimo.x, pos.y - ultimo.y) < 6) return;

    const novoSegmento = { p1: ultimo, p2: pos };

    // Verifica se cruza linhas já passadas ou o próprio traçado
    if (tracadoCruzouLinhasExistentes(novoSegmento)) {
        som.invalid();
        atualizarInstrucao('❌ Proibido cruzar linhas! O traço foi cancelado.', 'erro');
        desenhandoAtivo = false;
        jogo.tracadoAtual = [];
        return;
    }

    jogo.tracadoAtual.push(pos);
}

function finalizarDesenho() {
    if (!desenhandoAtivo) return;
    desenhandoAtivo = false;
    
    // Converte o traçado atual bem-sucedido em linhas permanentes para a bola seguir e respeitar
    if (jogo.tracadoAtual.length > 1) {
        for (let i = 1; i < jogo.tracadoAtual.length; i++) {
            jogo.linhasPassadas.push({
                p1: jogo.tracadoAtual[i - 1],
                p2: jogo.tracadoAtual[i]
            });
        }
    }
    jogo.tracadoAtual = [];
    atualizarInstrucao('👍 Linha fixada com sucesso! A esfera está a seguir o trajeto.');
}

canvas.addEventListener('mousedown', iniciarDesenho);
canvas.addEventListener('mousemove', continuarDesenho);
window.addEventListener('mouseup', finalizarDesenho);

canvas.addEventListener('touchstart', iniciarDesenho, { passive: false });
canvas.addEventListener('touchmove', continuarDesenho, { passive: false });
window.addEventListener('touchend', finalizarDesenho);
window.addEventListener('touchcancel', finalizarDesenho);

/* ==========================================================
   LOOP DE FÍSICA E JOGO
   ========================================================== */
let rafId = null;

function loop(timestamp) {
    rafId = requestAnimationFrame(loop);
    if (!estado.rodando || estado.pausado) return;

    const dt = Math.min(timestamp - jogo.ultimoUpdate, 50);
    jogo.ultimoUpdate = timestamp;

    update(dt);
    render();
}

function update(dt) {
    const bola = jogo.bola;
    if (!bola.viva) return;

    // A bola guia-se pelas linhas desenhadas e confirmadas (linhasPassadas)
    let alvo = null;
    let distAlvo = Infinity;

    if (jogo.linhasPassadas.length > 0) {
        for (const linha of jogo.linhasPassadas) {
            const d1 = Math.hypot(linha.p1.x - bola.x, linha.p1.y - bola.y);
            const d2 = Math.hypot(linha.p2.x - bola.x, linha.p2.y - bola.y);
            
            [linha.p1, linha.p2].forEach(p => {
                const d = Math.hypot(p.x - bola.x, p.y - bola.y);
                const anguloParaP = Math.atan2(p.y - bola.y, p.x - bola.x);
                let diff = anguloParaP - bola.angulo;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;

                if (Math.abs(diff) < Math.PI * 0.75 && d > 3) {
                    if (d < distAlvo) {
                        distAlvo = d;
                        alvo = p;
                    }
                }
            });
        }
    }

    if (alvo) {
        const anguloAlvo = Math.atan2(alvo.y - bola.y, alvo.x - bola.x);
        let diff = anguloAlvo - bola.angulo;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        bola.angulo += diff * 0.15;
    }

    bola.x += Math.cos(bola.angulo) * bola.velocidade;
    bola.y += Math.sin(bola.angulo) * bola.velocidade;

    // Colisão com bordas
    if (bola.x < bola.raio || bola.x > W - bola.raio || bola.y < bola.raio || bola.y > H - bola.raio) {
        som.crash();
        finalizarJogo(false, '💥 Bateu na borda do tabuleiro!');
        return;
    }

    // Colisão com obstáculos móveis
    for (const obs of jogo.obstaculos) {
        obs.fase += dt * 0.001;
        obs.y = obs.baseY + Math.sin(obs.fase) * 40;
        if (Math.hypot(obs.x - bola.x, obs.y - bola.y) < obs.raio + bola.raio) {
            som.crash();
            finalizarJogo(false, '💥 Atingiu um obstáculo!');
            return;
        }
    }

    // Recolha de estrelas
    for (const est of jogo.estrelas) {
        if (est.coletada) continue;
        est.angulo += dt * 0.002;
        if (Math.hypot(est.x - bola.x, est.y - bola.y) < 24 + bola.raio) {
            est.coletada = true;
            estado.estrelasColetadas++;
            bola.velocidade *= 1.02;
            bola.raio = Math.min(bola.raio + 0.4, 15);
            som.star();
            atualizarUI();
            atualizarInstrucao(`⭐ Estrela apanhada! (${estado.estrelasColetadas}/${estado.estrelasTotal})`, 'sucesso');
            
            if (estado.estrelasColetadas >= estado.estrelasTotal) {
                jogo.portal.ativo = true;
                som.portal();
                atualizarInstrucao('🌟 Portal aberto! Contorne o caminho e chegue até ele!', 'alerta');
            }
        }
    }

    // Entrada no portal
    if (jogo.portal.ativo) {
        jogo.portal.angulo += dt * 0.003;
        if (Math.hypot(jogo.portal.x - bola.x, jogo.portal.y - bola.y) < jogo.portal.raio + bola.raio) {
            som.win();
            finalizarJogo(true);
            return;
        }
    }
}

/* ==========================================================
   RENDERIZAÇÃO GRÁFICA
   ========================================================== */
function render() {
    ctx.clearRect(0, 0, W, H);

    // Fundo
    const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, Math.max(W, H));
    grad.addColorStop(0, '#0e163b');
    grad.addColorStop(1, '#02050e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Grid subtil
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    // Desenha linhas passadas (trilhos confirmados)
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const linha of jogo.linhasPassadas) {
        ctx.beginPath();
        ctx.moveTo(linha.p1.x, linha.p1.y);
        ctx.lineTo(linha.p2.x, linha.p2.y);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 3.5;
        ctx.stroke();
    }
    ctx.restore();

    // Desenha traçado atual em curso
    if (jogo.tracadoAtual.length > 1) {
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(jogo.tracadoAtual[0].x, jogo.tracadoAtual[0].y);
        for (let i = 1; i < jogo.tracadoAtual.length; i++) {
            ctx.lineTo(jogo.tracadoAtual[i].x, jogo.tracadoAtual[i].y);
        }
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
    }

    // Obstáculos
    for (const obs of jogo.obstaculos) {
        ctx.save();
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.raio, 0, Math.PI * 2);
        const gradObs = ctx.createRadialGradient(obs.x, obs.y, 2, obs.x, obs.y, obs.raio);
        gradObs.addColorStop(0, '#d8b4fe');
        gradObs.addColorStop(1, '#7c3aed');
        ctx.fillStyle = gradObs;
        ctx.fill();
        ctx.restore();
    }

    // Estrelas
    for (const est of jogo.estrelas) {
        if (est.coletada) continue;
        ctx.save();
        ctx.translate(est.x, est.y);
        ctx.rotate(est.angulo);
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const r = i % 2 === 0 ? 12 : 5;
            const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
        ctx.restore();
    }

    // Portal
    if (jogo.portal.ativo) {
        ctx.save();
        ctx.translate(jogo.portal.x, jogo.portal.y);
        ctx.rotate(jogo.portal.angulo);
        ctx.shadowColor = '#4ade80';
        ctx.shadowBlur = 30;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, jogo.portal.raio + i * 6, 0, Math.PI * 2);
            ctx.strokeStyle = ['#4ade80', '#38bdf8', '#a855f7'][i];
            ctx.lineWidth = 3;
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, jogo.portal.raio * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(74, 222, 128, 0.45)';
        ctx.fill();
        ctx.restore();
    }

    // Bola
    ctx.save();
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(jogo.bola.x, jogo.bola.y, jogo.bola.raio, 0, Math.PI * 2);
    const gradBola = ctx.createRadialGradient(
        jogo.bola.x - jogo.bola.raio * 0.3, jogo.bola.y - jogo.bola.raio * 0.3, 1,
        jogo.bola.x, jogo.bola.y, jogo.bola.raio
    );
    gradBola.addColorStop(0, '#f0fdf4');
    gradBola.addColorStop(1, '#0284c7');
    ctx.fillStyle = gradBola;
    ctx.fill();
    ctx.restore();
}

/* ==========================================================
   FIM DE JOGO E FIREBASE
   ========================================================== */
function finalizarJogo(vitoria, motivo = '') {
    if (!estado.rodando) return;
    estado.rodando = false;
    estado.vitoria = vitoria;
    estado.gameOver = !vitoria;
    pararTimer();

    const overlay = document.getElementById('overlay');
    const titulo = document.getElementById('overlay-titulo');
    const sub = document.getElementById('overlay-sub');
    const estrelasEl = document.getElementById('overlay-estrelas');
    const btnAcao = document.getElementById('btn-overlay-acao');

    if (vitoria) {
        const tempoLimite = CONFIG[estado.nivel].tempoLimite;
        const bonusTempo = Math.max(0, (tempoLimite - estado.segundos) * 4);
        const bonusEstrelas = estado.estrelasTotal * 60;
        const ganho = 120 * estado.nivel + bonusEstrelas + bonusTempo;
        estado.pontos += ganho;

        let avaliacao = '⭐';
        if (estado.segundos < tempoLimite * 0.5) avaliacao = '⭐⭐⭐';
        else if (estado.segundos < tempoLimite * 0.75) avaliacao = '⭐⭐';

        titulo.textContent = '🎉 Nível Concluído!';
        sub.textContent = `Tempo: ${formatarTempo(estado.segundos)} • +${ganho} pontos`;
        estrelasEl.textContent = avaliacao;
        btnAcao.textContent = estado.nivel < 5 ? 'Próximo Nível 🚀' : 'Jogar do Zero';

        estado.recordes[estado.nivel] = Math.min(
            estado.recordes[estado.nivel] || 999999,
            estado.segundos
        );
        salvarProgresso();
        document.getElementById('btn-proximo').classList.remove('hidden');
    } else {
        titulo.textContent = '💥 Fim de Jogo';
        sub.textContent = motivo || 'Tente novamente!';
        estrelasEl.textContent = '';
        btnAcao.textContent = 'Tentar de novo';
    }

    atualizarUI();
    overlay.classList.remove('hidden');
}

function esconderOverlay() {
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('btn-proximo').classList.add('hidden');
}

async function salvarProgresso() {
    try {
        await update(ref(db, 'jogadores/' + jogadorSessao.chave), {
            pontos: (jogadorSessao.pontos || 0) + estado.pontos,
            pontosCurves: estado.pontos,
            recordesCurves: estado.recordes,
            nivelCurves: estado.nivel + 1,
            ultimaAtualizacao: new Date().toISOString()
        });
    } catch (e) {
        console.warn('Modo offline / erro ao salvar:', e);
    }
}

async function carregarProgresso() {
    try {
        const snap = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
        if (snap.exists()) {
            const dados = snap.val();
            estado.pontos = dados.pontosCurves || 0;
            estado.recordes = dados.recordesCurves || {};
            estado.nivel = Math.min(5, Math.max(1, dados.nivelCurves || 1));
        }
    } catch (e) {
        console.warn('Modo offline:', e);
    }
    document.getElementById('display-pontos').textContent = estado.pontos;
}

document.getElementById('btn-reiniciar').addEventListener('click', () => iniciarNivel(estado.nivel, true));
document.getElementById('btn-proximo').addEventListener('click', () => {
    const proximo = estado.nivel >= 5 ? 1 : estado.nivel + 1;
    iniciarNivel(proximo, true);
});
document.getElementById('select-nivel').addEventListener('change', (e) => {
    const n = parseInt(e.target.value);
    if (n >= 1 && n <= 5) {
        e.target.value = '';
        iniciarNivel(n, true);
    }
});
document.getElementById('btn-overlay-acao').addEventListener('click', () => {
    if (estado.vitoria) {
        const proximo = estado.nivel >= 5 ? 1 : estado.nivel + 1;
        iniciarNivel(proximo, true);
    } else {
        iniciarNivel(estado.nivel, true);
    }
});

const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('brain_flow_theme', next);
});

async function iniciar() {
    await carregarProgresso();
    iniciarNivel(estado.nivel, true);
    rafId = requestAnimationFrame(loop);
}

iniciar();
</script>
