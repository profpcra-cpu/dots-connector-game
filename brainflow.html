<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Curves — Brain Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.72);
    --card-border: rgba(148, 163, 184, 0.15);
    --card-glow: rgba(99, 102, 241, 0.25);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --border-color: rgba(148, 163, 184, 0.18);
    --border-strong: rgba(148, 163, 184, 0.35);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-green: #4ade80;
    --c-blue: #38bdf8;
    --c-amber: #f59e0b;
    --c-star: #fbbf24;
    --board-bg: rgba(15, 23, 42, 0.55);
    --cell-empty: rgba(30, 41, 59, 0.55);
    --cell-empty-rest: rgba(239, 68, 68, 0.15);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --t-fast: 0.15s ease;
    --t-base: 0.25s ease;
    --t-slow: 0.4s ease;
}

[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(15, 23, 42, 0.08);
    --card-glow: rgba(99, 102, 241, 0.15);
    --text-color: #0f172a;
    --text-muted: #475569;
    --text-subtle: #64748b;
    --border-color: rgba(15, 23, 42, 0.1);
    --border-strong: rgba(15, 23, 42, 0.25);
    --input-bg: rgba(255, 255, 255, 0.95);
    --board-bg: rgba(248, 250, 252, 0.95);
    --cell-empty: rgba(226, 232, 240, 0.7);
    --cell-empty-rest: rgba(239, 68, 68, 0.12);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}

body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.3;
    z-index: -1;
    pointer-events: none;
}
body::before { width: 420px; height: 420px; background: #6366f1; top: -140px; left: -120px; }
body::after  { width: 460px; height: 460px; background: #8b5cf6; bottom: -180px; right: -140px; }

.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid var(--card-border);
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
}

.container::before {
    content: "";
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--card-glow), transparent);
    opacity: 0.9;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}

.btn-small {
    width: auto;
    margin: 0;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--t-base);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    text-decoration: none;
}
.btn-small:hover {
    color: var(--text-color);
    border-color: var(--border-strong);
    transform: translateY(-1px);
}

.user-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    background: var(--input-bg);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
}
.user-info-left { display: flex; align-items: center; gap: 10px; }
.user-avatar-display {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    font-size: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2));
    border: 1px solid rgba(99, 102, 241, 0.4);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
}
#display-nome { font-size: 14px; font-weight: 700; }
.game-name {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
}

.score-board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 2px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.02);
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    text-transform: none;
}
#display-nivel  { color: var(--c-blue); }
#display-pontos { color: var(--c-green); }
#display-tempo  { color: #60a5fa; }
#display-pares  { color: var(--c-amber); }
#display-estrelas { color: var(--c-star); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    line-height: 1.5;
    min-height: 36px;
}

.board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 460px;
    margin: 0 auto 12px;
    border-radius: 14px;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
        var(--board-bg);
    background-image:
        linear-gradient(var(--board-bg), var(--board-bg)),
        linear-gradient(135deg,
            rgba(99, 102, 241, 0.55) 0%,
            rgba(139, 92, 246, 0.35) 30%,
            rgba(56, 189, 248, 0.30) 65%,
            rgba(99, 102, 241, 0.45) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border: 2px solid transparent;
    box-shadow:
        0 12px 40px -14px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--card-border),
        0 0 24px -6px rgba(99, 102, 241, 0.35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#game-board {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 2px;
    padding: 6px;
}

.cell {
    background: var(--cell-empty);
    border-radius: 4px;
    position: relative;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.cell.error {
    animation: shake 0.3s ease;
    box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.8);
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-2px); }
    75%      { transform: translateX(2px); }
}

/* Células vazias quando todos os pares estão ligados */
.cell.vazia-restante {
    box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.6);
    animation: vaziaPulse 1.6s ease-in-out infinite;
    background: var(--cell-empty-rest);
}
@keyframes vaziaPulse {
    0%, 100% { box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.6); }
    50%      { box-shadow: inset 0 0 0 4px rgba(239, 68, 68, 0.9); }
}

/* Endpoint */
.endpoint {
    width: 68%;
    height: 68%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    box-shadow:
        inset -2px -2px 4px rgba(0, 0, 0, 0.35),
        0 3px 6px rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.75);
    z-index: 3;
    pointer-events: none;
    transition: transform 0.2s ease;
}
.endpoint.connected {
    box-shadow:
        inset -2px -2px 4px rgba(0, 0, 0, 0.35),
        0 0 0 4px rgba(255, 255, 255, 0.55),
        0 0 20px rgba(255, 255, 255, 0.6);
}

/* Trilha */
.cell.trail {
    background: var(--trail-color, transparent);
}
.cell.trail::after {
    content: "";
    position: absolute;
    inset: 34%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    opacity: 0.9;
}
.cell.trail.connected {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
}
.cell.trail.connected::after { background: #fff; opacity: 1; }

/* Trilha em construção */
.cell.trail.live::after {
    animation: trailPulse 0.9s ease-in-out infinite;
}
@keyframes trailPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.25); opacity: 1; }
}

/* Cruzamento — trilha por baixo com anel dourado */
.cell.trail.cruzada {
    box-shadow: inset 0 0 0 3px rgba(251, 191, 36, 0.85);
}
.cell.trail.cruzada::before {
    content: "⭐";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fbbf24;
    text-shadow: 0 0 6px rgba(251, 191, 36, 0.9);
    animation: starTwinkle 1.6s ease-in-out infinite;
    z-index: 5;
    pointer-events: none;
}
@keyframes starTwinkle {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.15); }
}

/* Cruzamento — trilha por cima com moldura dupla */
.cell.trail.cruzando {
    box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.55),
        0 0 0 2px rgba(251, 191, 36, 0.85);
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
.controls-grid.triple {
    grid-template-columns: 1fr 1fr 1fr;
}

select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    background: var(--input-bg);
    color: var(--text-color);
    cursor: pointer;
    transition: border-color var(--t-base), box-shadow var(--t-base);
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 16px;
    padding-right: 36px;
}
select:focus {
    outline: none;
    border-color: var(--btn-primary);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.18);
}

button.action {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    box-shadow: var(--shadow-btn);
    transition: transform var(--t-fast), box-shadow var(--t-base), filter var(--t-base);
}
button.action:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px -8px rgba(99, 102, 241, 0.7);
}
button.action:active { transform: translateY(0); filter: brightness(0.97); }

button.secondary {
    background: linear-gradient(135deg, #475569, #334155);
    box-shadow: 0 6px 20px -10px rgba(0, 0, 0, 0.6);
}
button.secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }

button.magic {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #1c1917;
    font-weight: 800;
    box-shadow: 0 6px 20px -6px rgba(245, 158, 11, 0.6);
}
button.magic:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px -8px rgba(245, 158, 11, 0.8);
}

.back-float {
    position: fixed;
    bottom: 84px;
    right: 20px;
    z-index: 998;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border-strong);
    color: var(--text-color);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    transition: opacity var(--t-base), transform var(--t-base), border-color var(--t-base);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    text-decoration: none;
}
.back-float.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}
.back-float:hover {
    transform: translateY(-3px) scale(1.05);
    border-color: var(--btn-primary);
}
@media (min-width: 769px) { .back-float { bottom: 24px; } }

@media (max-width: 440px) {
    body { padding: 10px; }
    .container { padding: 16px 14px 18px; border-radius: 16px; max-width: 100%; }
    .score-board { font-size: 9px; }
    .score-board strong { font-size: 12px; }
    .game-name { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
    }
}

:focus-visible { outline: 2px solid var(--btn-primary); outline-offset: 2px; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="index.html" class="btn-small">⬅ Menu Hub</a>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>

const selectNivel = document.getElementById('select-nivel');
const btnReset = document.getElementById('btn-reset');
const btnHint = document.getElementById('btn-hint');
const themeToggle = document.getElementById('theme-toggle');
const btnBackFloat = document.getElementById('btn-back-float');

/* ============================================================
   SONS
   ============================================================ */
let audioCtx = null;
function tocarSom(tipo) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const emitir = (freq1, freq2, dur, vol = 0.09) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur + 0.06);
            osc.start();
            osc.stop(audioCtx.currentTime + dur + 0.06);
        };

        if (tipo === 'par')      emitir(660, 990, 0.12);
        if (tipo === 'estrela')  emitir(880, 1320, 0.15, 0.11);
        if (tipo === 'cruzamento') emitir(440, 660, 0.18, 0.12);
        if (tipo === 'aviso')    emitir(440, 330, 0.2, 0.08);
        if (tipo === 'erro')     emitir(220, 110, 0.15, 0.08);
        if (tipo === 'vitoria') {
            [523, 659, 784, 1047].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                g.gain.setValueAtTime(0.09, audioCtx.currentTime + i * 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.25);
                o.start(audioCtx.currentTime + i * 0.1);
                o.stop(audioCtx.currentTime + i * 0.1 + 0.25);
            });
        }
    } catch (_) { /* silencioso */ }
}

/* ============================================================
   INICIALIZAÇÃO DO PUZZLE
   ============================================================ */
function iniciarPuzzle(nivel) {
    const puzzle = PUZZLES[nivel] || PUZZLES[1];
    estado.nivel = nivel;
    estado.tamanho = puzzle.tamanho;
    estado.pares = puzzle.pares.map((p, i) => ({ ...p, id: i }));
    estado.totalPares = puzzle.pares.length;
    estado.totalCelulas = puzzle.tamanho * puzzle.tamanho;
    estado.trilhas = {};
    estado.desenhando = null;
    estado.concluido = false;
    estado.cruzamentosAtivos = [];
    // Estrelas zeradas a cada nova partida
    estado.estrelas = 0;

    estado.grid = Array.from({ length: puzzle.tamanho }, () =>
        Array.from({ length: puzzle.tamanho }, () => ({
            cor: null, parId: null, tipo: 'vazio'
        }))
    );

    for (const par of estado.pares) {
        estado.grid[par.a.r][par.a.c] = { cor: par.cor, parId: par.id, tipo: 'endpoint' };
        estado.grid[par.b.r][par.b.c] = { cor: par.cor, parId: par.id, tipo: 'endpoint' };
    }

    displayNivel.textContent = nivel;
    atualizarContadores();
    infoInstrucao.innerHTML = `Nível ${nivel} (${puzzle.tamanho}×${puzzle.tamanho}): ligue os ${estado.totalPares} pares. Estenda trilhas para ganhar ⭐.`;

    renderizarBoard();
    atualizarVisual();
    iniciarTimer();
}

function atualizarContadores() {
    const paresLigados = Object.keys(estado.trilhas).length;
    displayPares.textContent = `${paresLigados}/${estado.totalPares}`;
    displayEstrelas.textContent = estado.estrelas;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderizarBoard() {
    const n = estado.tamanho;
    board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    board.innerHTML = '';

    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.id = `cell-${r}-${c}`;
            board.appendChild(cell);
        }
    }
}

function atualizarVisual() {
    const n = estado.tamanho;
    const todosParesLigados = Object.keys(estado.trilhas).length === estado.totalPares;

    // Limpa tudo
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (!cell) continue;
            cell.className = 'cell';
            cell.style.background = '';
            cell.innerHTML = '';
            cell.style.removeProperty('--trail-color');
        }
    }

    // Desenha o estado atual do grid
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            const dado = estado.grid[r][c];
            if (!cell) continue;

            if (dado.tipo === 'endpoint') {
                const conectado = estado.trilhas[dado.parId] ? ' connected' : '';
                cell.innerHTML = `<div class="endpoint${conectado}" style="background:${dado.cor}"></div>`;
            } else if (dado.tipo === 'trilha') {
                cell.classList.add('trail');
                cell.style.setProperty('--trail-color', dado.cor);
            } else if (dado.tipo === 'vazio') {
                if (todosParesLigados && !estado.concluido) {
                    cell.classList.add('vazia-restante');
                }
            }
        }
    }

    // Marca trilhas conectadas
    for (const parId in estado.trilhas) {
        const t = estado.trilhas[parId].pontos;
        if (t.length < 2) continue;
        const par = estado.pares.find(p => p.id == parId);
        if (!par) continue;
        const inicio = t[0], fim = t[t.length - 1];
        const conecta =
            (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
            (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);
        if (conecta) {
            for (const cell of t) {
                const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
                if (el) el.classList.add('connected');
            }
        }
    }

    // Marca cruzamentos visuais
    for (const cz of estado.cruzamentosAtivos) {
        const el = document.getElementById(`cell-${cz.r}-${cz.c}`);
        if (el) {
            el.classList.add('cruzada');
            el.classList.add('cruzando');
        }
    }

    // Feedback trilha em construção
    if (estado.desenhando && estado.desenhando.pontos.length > 1) {
        for (const p of estado.desenhando.pontos) {
            if (estado.grid[p.r][p.c].tipo === 'trilha') {
                const el = document.getElementById(`cell-${p.r}-${p.c}`);
                if (el) el.classList.add('live');
            }
        }
    }
}

/* ============================================================
   INTERAÇÃO — Pointer events
   ============================================================ */
let activePointerId = null;

board.addEventListener('pointerdown', (e) => {
    if (estado.concluido) return;
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
    const dado = estado.grid[r][c];

    if (dado.tipo === 'endpoint') {
        e.preventDefault();
        activePointerId = e.pointerId;
        try { board.setPointerCapture(e.pointerId); } catch (_) {}

        // Se já existe trilha deste par, remove
        if (estado.trilhas[dado.parId]) {
            limparTrilhaDoGrid(estado.trilhas[dado.parId].pontos);
            // Remove cruzamentos associados
            estado.cruzamentosAtivos = estado.cruzamentosAtivos.filter(cz => cz.parIdAtual !== dado.parId);
            delete estado.trilhas[dado.parId];
        }

        estado.desenhando = {
            parId: dado.parId,
            cor: dado.cor,
            pontos: [{ r, c }],
            cruzamentos: []
        };
        atualizarContadores();
        atualizarVisual();
    }
});

board.addEventListener('pointermove', (e) => {
    if (!estado.desenhando) return;
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();

    const cell = cellFromPoint(e.clientX, e.clientY);
    if (!cell) return;
    const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
    estenderTrilha(r, c);
});

board.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    finalizarDesenho();
});

board.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== activePointerId) return;
    cancelarDesenho();
});

window.addEventListener('pointerup', (e) => {
    if (e.pointerId === activePointerId && estado.desenhando) finalizarDesenho();
});
window.addEventListener('pointercancel', (e) => {
    if (e.pointerId === activePointerId && estado.desenhando) cancelarDesenho();
});

function cellFromPoint(clientX, clientY) {
    const els = board.querySelectorAll('.cell');
    for (const el of els) {
        const rect = el.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right &&
            clientY >= rect.top && clientY <= rect.bottom) return el;
    }
    return null;
}

function finalizarDesenho() {
    try { board.releasePointerCapture(activePointerId); } catch (_) {}
    activePointerId = null;
    if (estado.desenhando) finalizarTrilha();
}

function cancelarDesenho() {
    try { board.releasePointerCapture(activePointerId); } catch (_) {}
    activePointerId = null;
    if (estado.desenhando) cancelarTrilha();
}

/* ============================================================
   LÓGICA DE TRILHA — com cruzamento e estrelas
   ============================================================ */
function estenderTrilha(r, c) {
    const d = estado.desenhando;
    const trail = d.pontos;
    const ultima = trail[trail.length - 1];

    if (ultima.r === r && ultima.c === c) return;

    // Backtrack imediato
    if (trail.length >= 2) {
        const anterior = trail[trail.length - 2];
        if (anterior.r === r && anterior.c === c) {
            trail.pop();
            // Remove marca de trilha (se não for endpoint)
            const ult = estado.grid[ultima.r][ultima.c];
            if (ult.tipo === 'trilha') {
                estado.grid[ultima.r][ultima.c] = { cor: null, parId: null, tipo: 'vazio' };
            }
            // Remove cruzamento se houver
            d.cruzamentos = d.cruzamentos.filter(cz => !(cz.r === ultima.r && cz.c === ultima.c));
            atualizarVisual();
            return;
        }
    }

    // Movimento ortogonal adjacente
    const dr = Math.abs(r - ultima.r), dc = Math.abs(c - ultima.c);
    if (dr + dc !== 1) {
        // Backtrack para célula da trilha
        const idx = trail.findIndex(p => p.r === r && p.c === c);
        if (idx >= 0) {
            for (let i = idx + 1; i < trail.length; i++) {
                const rem = trail[i];
                const g = estado.grid[rem.r][rem.c];
                if (g.tipo === 'trilha') {
                    estado.grid[rem.r][rem.c] = { cor: null, parId: null, tipo: 'vazio' };
                }
                d.cruzamentos = d.cruzamentos.filter(cz => !(cz.r === rem.r && cz.c === rem.c));
            }
            trail.length = idx + 1;
            atualizarVisual();
        }
        return;
    }

    const alvo = estado.grid[r][c];

    // ---- Endpoint do MESMO par ----
    if (alvo.tipo === 'endpoint' && alvo.parId === d.parId) {
        trail.push({ r, c });
        estado.trilhas[d.parId] = {
            pontos: [...trail],
            cruzamentos: [...d.cruzamentos]
        };
        // Registra cruzamentos ativos
        for (const cz of d.cruzamentos) {
            estado.cruzamentosAtivos.push({ ...cz, parIdAtual: d.parId });
        }
        // Calcula estrelas ganhas
        const estrelasGanhas = calcularEstrelasGanhas(d.parId, trail);
        if (estrelasGanhas > 0) {
            estado.estrelas += estrelasGanhas;
            infoInstrucao.innerHTML = `⭐ Trilha longa! Ganhaste <b>${estrelasGanhas} estrela(s)</b>.`;
            tocarSom('estrela');
        } else {
            infoInstrucao.textContent = '✅ Par ligado!';
        }
        estado.desenhando = null;
        atualizarContadores();
        atualizarVisual();
        tocarSom('par');
        if (navigator.vibrate) navigator.vibrate(40);
        verificarVitoria();
        return;
    }

    // ---- Endpoint de OUTRO par → bloqueia ----
    if (alvo.tipo === 'endpoint') {
        piscarErro(r, c);
        infoInstrucao.textContent = '⚠️ Não pode passar por cima de outro número!';
        return;
    }

    // ---- Já é trilha deste par → backtrack ----
    const idxMesma = trail.findIndex(p => p.r === r && p.c === c);
    if (idxMesma >= 0) {
        for (let i = idxMesma + 1; i < trail.length; i++) {
            const rem = trail[i];
            const g = estado.grid[rem.r][rem.c];
            if (g.tipo === 'trilha') {
                estado.grid[rem.r][rem.c] = { cor: null, parId: null, tipo: 'vazio' };
            }
            d.cruzamentos = d.cruzamentos.filter(cz => !(cz.r === rem.r && cz.c === rem.c));
        }
        trail.length = idxMesma + 1;
        atualizarVisual();
        return;
    }

    // ---- Trilha de OUTRO par → precisa estrela para cruzar ----
    if (alvo.tipo === 'trilha') {
        if (estado.estrelas < 1) {
            piscarErro(r, c);
            infoInstrucao.innerHTML = '⚠️ Sem ⭐ suficientes! Estenda uma trilha antes para ganhar.';
            tocarSom('erro');
            return;
        }
        // Verifica se já não há cruzamento neste ponto
        if (d.cruzamentos.some(cz => cz.r === r && cz.c === c)) {
            return;
        }
        // Consome 1 estrela
        estado.estrelas -= 1;
        d.cruzamentos.push({ r, c, parIdAbaixo: alvo.parId });
        trail.push({ r, c });
        // Não substitui o grid (a trilha por baixo mantém-se)
        infoInstrucao.innerHTML = `⭐ Cruzamento! Estrelas restantes: <b>${estado.estrelas}</b>`;
        tocarSom('cruzamento');
        if (navigator.vibrate) navigator.vibrate(60);
        atualizarContadores();
        atualizarVisual();
        return;
    }

    // ---- Célula vazia → adiciona ----
    trail.push({ r, c });
    estado.grid[r][c] = { cor: d.cor, parId: d.parId, tipo: 'trilha' };
    atualizarVisual();
}

/**
 * Calcula quantas estrelas o par ganhou ao fechar a trilha.
 * Fórmula: cada 2 células além do caminho mínimo = 1 estrela.
 */
function calcularEstrelasGanhas(parId, trail) {
    const par = estado.pares.find(p => p.id === parId);
    if (!par) return 0;
    // Caminho mínimo = distância de Manhattan + 1 (inclui ambos endpoints)
    const minimo = Math.abs(par.a.r - par.b.r) + Math.abs(par.a.c - par.b.c) + 1;
    const extras = trail.length - minimo;
    if (extras <= 0) return 0;
    return Math.floor(extras / 2);
}

function finalizarTrilha() {
    const d = estado.desenhando;
    if (!d) return;
    const trail = d.pontos;
    const par = estado.pares.find(p => p.id === d.parId);
    const inicio = trail[0], fim = trail[trail.length - 1];
    const conecta =
        (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
        (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);

    if (conecta && trail.length >= 2) {
        estado.trilhas[d.parId] = {
            pontos: [...trail],
            cruzamentos: [...d.cruzamentos]
        };
        for (const cz of d.cruzamentos) {
            estado.cruzamentosAtivos.push({ ...cz, parIdAtual: d.parId });
        }
        const estrelasGanhas = calcularEstrelasGanhas(d.parId, trail);
        if (estrelasGanhas > 0) {
            estado.estrelas += estrelasGanhas;
            infoInstrucao.innerHTML = `⭐ Trilha longa! Ganhaste <b>${estrelasGanhas} estrela(s)</b>.`;
            tocarSom('estrela');
        } else {
            infoInstrucao.textContent = '✅ Par ligado!';
        }
        tocarSom('par');
        if (navigator.vibrate) navigator.vibrate(40);
    } else {
        // Reverte: devolve estrelas gastas em cruzamentos e limpa
        const estrelasGastas = d.cruzamentos.length;
        estado.estrelas += estrelasGastas;
        limparTrilhaDoGrid(trail);
    }
    estado.desenhando = null;
    atualizarContadores();
    atualizarVisual();
    verificarVitoria();
}

function cancelarTrilha() {
    const d = estado.desenhando;
    if (d) {
        const estrelasGastas = d.cruzamentos.length;
        estado.estrelas += estrelasGastas;
        limparTrilhaDoGrid(d.pontos);
    }
    estado.desenhando = null;
    atualizarContadores();
    atualizarVisual();
}

function limparTrilhaDoGrid(pontos) {
    for (const p of pontos) {
        if (estado.grid[p.r][p.c].tipo === 'trilha') {
            estado.grid[p.r][p.c] = { cor: null, parId: null, tipo: 'vazio' };
        }
    }
}

function piscarErro(r, c) {
    const el = document.getElementById(`cell-${r}-${c}`);
    if (!el) return;
    el.classList.add('error');
    setTimeout(() => el.classList.remove('error'), 320);
}

/* ============================================================
   VITÓRIA — 90% + todos pares
   ============================================================ */
const LIMIAR_VITORIA = 0.90;   // 90% das células preenchidas

function verificarVitoria() {
    if (estado.concluido) return;
    const n = estado.tamanho;
    const totalCelulas = n * n;

    // 1. Todos os pares ligados?
    let paresLigados = 0;
    for (const par of estado.pares) {
        const t = estado.trilhas[par.id];
        if (!t || t.pontos.length < 2) return;
        const inicio = t.pontos[0], fim = t.pontos[t.pontos.length - 1];
        const conecta =
            (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
            (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);
        if (conecta) paresLigados++;
    }
    if (paresLigados !== estado.totalPares) return;

    // 2. Atingiu 90% de preenchimento?
    let preenchidas = 0;
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            if (estado.grid[r][c].tipo !== 'vazio') preenchidas++;
        }
    }
    const percentual = preenchidas / totalCelulas;

    if (percentual < LIMIAR_VITORIA) {
        const restantes = totalCelulas - preenchidas;
        infoInstrucao.innerHTML = `
            ✅ <b>Todos os pares ligados!</b>
            Faltam <b>${restantes}</b> células (${(percentual * 100).toFixed(0)}% preenchido).
            Estende trilhas ou usa ⭐ para cruzamentos.
        `;
        tocarSom('aviso');
        return;
    }

    // Vitória!
    estado.concluido = true;
    pararTimer();
    tocarSom('vitoria');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

    const bonusEstrelas = estado.estrelas * 20;
    const bonusPreenchimento = Math.round((percentual - LIMIAR_VITORIA) * 500);
    const ganhoBase = estado.nivel * 40 + Math.max(0, 250 - estado.segundos);
    const ganhoTotal = ganhoBase + bonusEstrelas + bonusPreenchimento;

    estado.pontos += ganhoTotal;
    displayPontos.textContent = estado.pontos;

    infoInstrucao.innerHTML = `
        🎉 <b>Nível ${estado.nivel} concluído!</b>
        ${percentual === 1 ? '💯 Preenchimento total!' : `${(percentual * 100).toFixed(0)}% preenchido`}
        ⭐ ${estado.estrelas} restantes → +${bonusEstrelas} bônus.
        <b>+${ganhoTotal} pontos</b>.
    `;
    salvarProgresso();
}

async function salvarProgresso() {
    try {
        const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
        const snap = await get(jogadorRef);
        const dados = snap.exists() ? snap.val() : {};
        const recordes = dados.recordesCurves || {};
        if (!recordes[estado.nivel] || estado.segundos < recordes[estado.nivel]) {
            recordes[estado.nivel] = estado.segundos;
        }
        await update(jogadorRef, {
            pontos: estado.pontos,
            recordesCurves: recordes,
            ultimaAtualizacao: new Date().toISOString()
        });
    } catch (e) {
        console.warn('Modo offline — progresso não sincronizado', e);
    }
}

/* ============================================================
   TIMER
   ============================================================ */
function formatarTempo(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${m}:${ss}`;
}

function iniciarTimer() {
    pararTimer();
    estado.segundos = 0;
    displayTempo.textContent = '00:00';
    estado.timer = setInterval(() => {
        estado.segundos++;
        displayTempo.textContent = formatarTempo(estado.segundos);
    }, 1000);
}

function pararTimer() {
    if (estado.timer) clearInterval(estado.timer);
    estado.timer = null;
}

/* ============================================================
   DICA — liga o próximo par pendente (sem consumir estrelas)
   ============================================================ */
function darDica() {
    if (estado.concluido) return;

    for (const par of estado.pares) {
        if (estado.trilhas[par.id]) continue;
        const caminho = construirCaminhoSimples(par);
        if (!caminho) continue;

        // Registra a trilha
        estado.trilhas[par.id] = { pontos: caminho, cruzamentos: [] };
        for (const p of caminho) {
            if (estado.grid[p.r][p.c].tipo === 'vazio') {
                estado.grid[p.r][p.c] = { cor: par.cor, parId: par.id, tipo: 'trilha' };
            }
        }
        atualizarContadores();
        atualizarVisual();
        tocarSom('par');
        infoInstrucao.innerHTML = `💡 Dica: par ${par.id + 1} ligado!`;
        verificarVitoria();
        return;
    }

    infoInstrucao.textContent = '🎉 Todos os pares já foram ligados!';
}

function construirCaminhoSimples(par) {
    const { a, b } = par;
    const caminho = [{ r: a.r, c: a.c }];

    let c = a.c;
    while (c !== b.c) {
        c += Math.sign(b.c - a.c);
        const g = estado.grid[a.r][c];
        if (g.tipo === 'vazio' || g.tipo === 'endpoint') {
            caminho.push({ r: a.r, c });
        } else {
            return null;
        }
    }
    let r = a.r;
    while (r !== b.r) {
        r += Math.sign(b.r - a.r);
        const g = estado.grid[r][b.c];
        if (g.tipo === 'vazio' || g.tipo === 'endpoint') {
            caminho.push({ r, c: b.c });
        } else {
            return null;
        }
    }
    return caminho;
}

/* ============================================================
   EVENTOS
   ============================================================ */
selectNivel.addEventListener('change', () => {
    const n = parseInt(selectNivel.value);
    if (n >= 1 && n <= 4) iniciarPuzzle(n);
});

btnReset.addEventListener('click', () => iniciarPuzzle(estado.nivel));
btnHint.addEventListener('click', darDica);

/* ============================================================
   TEMA
   ============================================================ */
const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
atualizarTextoBotaoTema(savedTheme);

themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('brain_flow_theme', next);
    atualizarTextoBotaoTema(next);
});

function atualizarTextoBotaoTema(theme) {
    themeToggle.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
}

/* ============================================================
   SESSÃO / PERFIL
   ============================================================ */
try {
    document.getElementById('display-nome').textContent = jogadorSessao.nome || 'Visitante';
    document.getElementById('display-avatar').textContent = jogadorSessao.avatar || '😀';
} catch (_) {
    document.getElementById('display-nome').textContent = 'Visitante';
}

async function carregarProgresso() {
    try {
        const snap = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
        if (snap.exists()) {
            const dados = snap.val();
            estado.pontos = dados.pontos || 0;
        }
    } catch (e) { /* offline */ }
    displayPontos.textContent = estado.pontos;
    iniciarPuzzle(1);
}

carregarProgresso();

/* ============================================================
   BOTÃO FLUTUANTE
   ============================================================ */
function atualizarBackFloat() {
    const scrolled = window.scrollY || document.documentElement.scrollTop || 0;
    if (scrolled > 120) btnBackFloat.classList.add('visible');
    else btnBackFloat.classList.remove('visible');
}
window.addEventListener('scroll', atualizarBackFloat, { passive: true });
atualizarBackFloat();
</script>
