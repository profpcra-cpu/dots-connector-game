<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desenho a Lápis — Ligação Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --c-cyan: #38bdf8;
    --c-green: #4ade80;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
}
[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.score-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--text-color);
}
#display-nivel { color: var(--c-cyan); }
#display-tempo { color: #60a5fa; }
#display-pontos { color: var(--c-green); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
}

/* Seletor de Cores / Lápis */
.paleta-cores {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
}
.lapis-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.2s, border-color 0.2s;
}
.lapis-btn.ativo {
    transform: scale(1.15);
    border-color: #fff;
    box-shadow: 0 0 15px currentColor;
}

#grid-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    background: #050914;
    border-radius: 14px;
    padding: 12px;
    display: grid;
    box-shadow: 0 12px 40px -14px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--card-border);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.cell {
    background: rgba(30, 41, 59, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transition: background 0.1s;
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-secondary { background: linear-gradient(135deg, #475569, #334155); }
.hidden { display: none !important; }

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 9, 20, 0.9);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 20px;
    text-align: center;
    border-radius: 14px;
}
.overlay h2 { margin: 0; font-size: 26px; font-weight: 800; }
.overlay .subtitulo { font-size: 14px; color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <div style="display: flex; gap: 6px;">
            <button id="sound-toggle" class="btn-small">🔊 Som</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>
    </div>

    <div class="score-board">
        <div>Modo<br><strong id="display-nivel">Livre</strong></div>
        <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div>Células<br><strong id="display-pontos">0</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">
        ✏️ Escolha um lápis de cor abaixo e arraste livremente para desenhar e preencher o tabuleiro!
    </p>

    <!-- Paleta de Lápis para Desenho Livre -->
    <div class="paleta-cores" id="paleta-cores"></div>

    <div id="grid-wrapper">
        <div id="grid-container" style="display: grid; width: 100%; height: 100%; gap: 4px;"></div>
        <div id="overlay" class="overlay hidden">
            <h2 id="overlay-titulo">Tabuleiro Completo!</h2>
            <div class="subtitulo" id="overlay-sub">Excelente trabalho artístico!</div>
            <button id="btn-reiniciar-overlay" class="btn-secondary">🔄 Jogar Novamente</button>
        </div>
    </div>

    <div class="controls-grid">
        <select id="select-tamanho">
            <option value="4">Grelha 4x4 (Fácil)</option>
            <option value="5" selected>Grelha 5x5 (Padrão)</option>
            <option value="6">Grelha 6x6 (Amplo)</option>
        </select>
        <button id="btn-reiniciar" class="btn-secondary">🔄 Limpar Tabuleiro</button>
    </div>
</div>

<script type="module">
const CORES = [
    '#f43f5e', // Rosa/Vermelho
    '#38bdf8', // Azul Ciano
    '#fbbf24', // Amarelo Dourado
    '#4ade80', // Verde
    '#a855f7', // Roxo
    '#fb923c'  // Laranja
];

let tamanhoGrelha = 5;
let corAtual = CORES[0];
let matrizDesenho = [];
let desenhando = false;
let segundos = 0;
let timer = null;
let jogoAtivo = true;

/* Gestor de Som Simples */
class SoundManager {
    constructor() { this.ativo = true; this.ctx = null; }
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    play(freq, type, duration) {
        if (!this.ativo) return;
        try {
            this.init();
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = type; o.frequency.value = freq;
            g.gain.setValueAtTime(0.08, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + duration);
        } catch(e){}
    }
    draw() { this.play(440 + Math.random() * 200, 'sine', 0.1); }
    win() { [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.play(f, 'sine', 0.2), i * 100)); }
}
const som = new SoundManager();

function inicializarJogo(tam) {
    tamanhoGrelha = tam;
    matrizDesenho = Array(tamanhoGrelha).fill(null).map(() => Array(tamanhoGrelha).fill(null));
    segundos = 0;
    jogoAtivo = true;
    
    montarPaleta();
    montarDOMGrid();
    atualizarEstatisticas();
    iniciarTimer();
}

function montarPaleta() {
    const paleta = document.getElementById('paleta-cores');
    paleta.innerHTML = '';
    CORES.forEach((cor, idx) => {
        const btn = document.createElement('div');
        btn.className = `lapis-btn ${cor === corAtual ? 'ativo' : ''}`;
        btn.style.backgroundColor = cor;
        btn.style.color = cor;
        btn.addEventListener('click', () => {
            corAtual = cor;
            document.querySelectorAll('.lapis-btn').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            som.play(600, 'triangle', 0.1);
        });
        paleta.appendChild(btn);
    });
}

function montarDOMGrid() {
    const gridContainer = document.getElementById('grid-container');
    gridContainer.style.gridTemplateColumns = `repeat(${tamanhoGrelha}, 1fr)`;
    gridContainer.style.gridTemplateRows = `repeat(${tamanhoGrelha}, 1fr)`;
    gridContainer.innerHTML = '';

    for (let r = 0; r < tamanhoGrelha; r++) {
        for (let c = 0; c < tamanhoGrelha; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;

            // Eventos de rato e toque para pintura contínua estilo lápis
            cell.addEventListener('mousedown', () => iniciarPintura(r, c));
            cell.addEventListener('mouseenter', () => continuarPintura(r, c));
            cell.addEventListener('touchstart', (e) => { e.preventDefault(); iniciarPintura(r, c); });
            cell.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('cell')) {
                    continuarPintura(parseInt(target.dataset.r), parseInt(target.dataset.c));
                }
            }, {passive: false});

            gridContainer.appendChild(cell);
        }
    }

    window.addEventListener('mouseup', finalizarPintura);
    window.addEventListener('touchend', finalizarPintura);
    atualizarVisualGrid();
}

function iniciarPintura(r, c) {
    if (!jogoAtivo) return;
    desenhando = true;
    aplicarCor(r, c);
}

function continuarPintura(r, c) {
    if (!desenhando || !jogoAtivo) return;
    aplicarCor(r, c);
}

function finalizarPintura() {
    desenhando = false;
}

function aplicarCor(r, c) {
    // Alterna ou pinta com a cor ativa do lápis
    const corAntiga = matrizDesenho[r][c];
    if (corAntiga !== corAtual) {
        matrizDesenho[r][c] = corAtual;
        som.draw();
        atualizarVisualGrid();
        atualizarEstatisticas();
        verificarPreenchimentoTotal();
    }
}

function atualizarVisualGrid() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => {
        const r = parseInt(cell.dataset.r);
        const c = parseInt(cell.dataset.c);
        const cor = matrizDesenho[r][c];

        if (cor) {
            cell.style.background = cor;
            cell.style.borderColor = '#ffffff';
            cell.style.boxShadow = `inset 0 0 12px rgba(0,0,0,0.3)`;
        } else {
            cell.style.background = 'rgba(30, 41, 59, 0.4)';
            cell.style.borderColor = 'rgba(255, 255, 255, 0.04)';
            cell.style.boxShadow = 'none';
        }
    });
}

function contarCelulasPreenchidas() {
    let count = 0;
    for (let r = 0; r < tamanhoGrelha; r++) {
        for (let c = 0; c < tamanhoGrelha; c++) {
            if (matrizDesenho[r][c] !== null) count++;
        }
    }
    return count;
}

function atualizarEstatisticas() {
    const preenchidas = contarCelulasPreenchidas();
    const total = tamanhoGrelha * tamanhoGrelha;
    document.getElementById('display-pontos').textContent = `${preenchidas}/${total}`;
}

function verificarPreenchimentoTotal() {
    const preenchidas = contarCelulasPreenchidas();
    const total = tamanhoGrelha * tamanhoGrelha;
    if (preenchidas === total && jogoAtivo) {
        jogoAtivo = false;
        pararTimer();
        som.win();
        document.getElementById('overlay').classList.remove('hidden');
    }
}

function iniciarTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
        if (!jogoAtivo) return;
        segundos++;
        document.getElementById('display-tempo').textContent = `${String(Math.floor(segundos/60)).padStart(2,'0')}:${String(segundos%60).padStart(2,'0')}`;
    }, 1000);
}
function pararTimer() { if (timer) clearInterval(timer); }

// Controlos de UI
document.getElementById('btn-reiniciar').addEventListener('click', () => inicializarJogo(tamanhoGrelha));
document.getElementById('btn-reiniciar-overlay').addEventListener('click', () => {
    document.getElementById('overlay').classList.add('hidden');
    inicializarJogo(tamanhoGrelha);
});
document.getElementById('select-tamanho').addEventListener('change', (e) => {
    inicializarJogo(parseInt(e.target.value));
});

const soundToggleBtn = document.getElementById('sound-toggle');
soundToggleBtn.addEventListener('click', () => {
    som.ativo = !som.ativo;
    soundToggleBtn.textContent = som.ativo ? '🔊 Som' : '🔇 Mudo';
});

const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('brain_flow_theme', next);
});

inicializarJogo(5);
</script>
</body>
</html>
