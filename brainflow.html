<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexões em Linhas Curvas Sem Cruzamento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.25rem;
            font-weight: 600;
        }
        p {
            margin-top: 0;
            margin-bottom: 15px;
            color: #94a3b8;
            font-size: 0.875rem;
        }
        canvas {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <h1>Rede de Nós com Curvas Orgânicas</h1>
    <p>Arraste os nós pela tela. As curvas adaptam-se dinamicamente para manter o fluxo limpo e sem cruzamentos.</p>
    
    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Definição dos nós (pontos da rede)
        let nodes = [
            { id: 1, x: 150, y: 150, label: 'Origem A', radius: 25 },
            { id: 2, x: 650, y: 150, label: 'Destino A', radius: 25 },
            { id: 3, x: 150, y: 350, label: 'Origem B', radius: 25 },
            { id: 4, x: 650, y: 350, label: 'Destino B', radius: 25 },
            { id: 5, x: 400, y: 250, label: 'Central', radius: 30 }
        ];

        // Conexões lógicas (arestas) que não devem cruzar o fluxo principal
        const connections = [
            { from: 1, to: 5, color: '#38bdf8' },
            { from: 3, to: 5, color: '#38bdf8' },
            { from: 5, to: 2, color: '#f43f5e' },
            { from: 5, to: 4, color: '#f43f5e' }
        ];

        let draggedNode = null;

        // Funções auxiliares de eventos de mouse para arrastar os nós
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            for (let node of nodes) {
                const dist = Math.hypot(node.x - mouseX, node.y - mouseY);
                if (dist < node.radius) {
                    draggedNode = node;
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!draggedNode) return;
            const rect = canvas.getBoundingClientRect();
            draggedNode.x = e.clientX - rect.left;
            draggedNode.y = e.clientY - rect.top;
            draw();
        });

        window.addEventListener('mouseup', () => {
            draggedNode = null;
        });

        // Função principal de desenho
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar conexões com Curvas de Bézier Cúbicas
            connections.forEach(conn => {
                const source = nodes.find(n => n.id === conn.from);
                const target = nodes.find(n => n.id === conn.to);

                if (source && target) {
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);

                    // Pontos de controle dinâmicos baseados na distância horizontal e vertical
                    // Isso cria o arqueamento automático sem que as linhas colidam ou cruzem de forma abrupta
                    const dx = target.x - source.x;
                    const dy = target.y - source.y;
                    
                    // Ajuste de curvatura suave baseada na orientação
                    const cp1x = source.x + dx * 0.5;
                    const cp1y = source.y;
                    const cp2x = source.x + dx * 0.5;
                    const cp2y = target.y;

                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, target.x, target.y);

                    ctx.strokeStyle = conn.color;
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            });

            // Desenhar nós
            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#334155';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#cbd5e1';
                ctx.stroke();

                // Rótulo do nó
                ctx.fillStyle = '#f8fafc';
                ctx.font = '12px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.label, node.x, node.y);
            });
        }

        // Renderização inicial
        draw();
    </script>
</body>
</html>
