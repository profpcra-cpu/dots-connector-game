<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Bolar - Curvas Orgânicas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .info {
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #94a3b8;
        }
        canvas {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }
        .score {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            color: #f43f5e;
        }
    </style>
</head>
<body>

    <h1>JOGO BOLAR (Versão Curvas Suaves)</h1>
    <div class="info">Use as <b>Setas do Teclado</b> ou <b>A / D</b> para guiar a curva. Evite bater nas bordas!</div>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div class="score">Pontuação: <span id="scoreVal">0</span></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('scoreVal');

        // Estado do jogo
        let snake = {
            x: 300,
            y: 200,
            radius: 10,
            speed: 3.5,
            angle: 0,
            turnSpeed: 0.07,
            trail: []
        };

        let food = {
            x: 0,
            y: 0,
            radius: 8,
            color: '#f43f5e'
        };

        let score = 0;
        let keys = { left: false, right: false };
        let gameOver = false;

        // Posicionar comida aleatoriamente
        function spawnFood() {
            food.x = Math.random() * (canvas.width - 60) + 30;
            food.y = Math.random() * (canvas.height - 60) + 30;
        }

        // Controles de teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        function resetGame() {
            snake.x = 300;
            snake.y = 200;
            snake.angle = 0;
            snake.trail = [];
            score = 0;
            scoreVal.textContent = score;
            gameOver = false;
            spawnFood();
        }

        spawnFood();

        // Loop principal do jogo
        function update() {
            if (gameOver) return;

            // Atualizar direção baseada nas teclas pressionadas (curvas contínuas)
            if (keys.left) snake.angle -= snake.turnSpeed;
            if (keys.right) snake.angle += snake.turnSpeed;

            // Mover a cabeça para frente na direção do ângulo atual
            snake.x += Math.cos(snake.angle) * snake.speed;
            snake.y += Math.sin(snake.angle) * snake.speed;

            // Salvar posição atual no rastro (para desenhar a linha curva conectada)
            snake.trail.push({ x: snake.x, y: snake.y });
            
            // Controlar o tamanho máximo do rastro baseado na pontuação
            const maxLength = 40 + score * 15;
            if (snake.trail.length > maxLength) {
                snake.trail.shift();
            }

            // Verificar colisão com as bordas da tela
            if (snake.x < snake.radius || snake.x > canvas.width - snake.radius ||
                snake.y < snake.radius || snake.y > canvas.height - snake.radius) {
                gameOver = true;
            }

            // Verificar colisão com a comida
            const dist = Math.hypot(snake.x - food.x, snake.y - food.y);
            if (dist < snake.radius + food.radius) {
                score++;
                scoreVal.textContent = score;
                spawnFood();
            }
        }

        function draw() {
            // Limpar tela
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar rastro em curva suave (Linha orgânica sem cruzamento abrupto)
            if (snake.trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(snake.trail[0].x, snake.trail[0].y);
                for (let i = 1; i < snake.trail.length; i++) {
                    ctx.lineTo(snake.trail[i].x, snake.trail[i].y);
                }
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = snake.radius * 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // Desenhar a cabeça da "bola"
            ctx.beginPath();
            ctx.arc(snake.x, snake.y, snake.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#bae6fd';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#0284c7';
            ctx.stroke();

            // Desenhar comida
            ctx.beginPath();
            ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
            ctx.fillStyle = food.color;
            ctx.fill();

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 28px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = '16px system-ui';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('Clique na tela para recomeçar', canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) resetGame();
        });

        // Iniciar loop
        loop();
    </script>
</body>
</html>
