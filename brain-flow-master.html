<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brain Flow — Numberlink com Estrelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0b1020;
    --bg-gradient-1: #1e1b4b;
    --bg-gradient-2: #0b1020;
    --card-bg: rgba(30, 41, 59, 0.85);
    --card-border: rgba(148, 163, 184, 0.15);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(148, 163, 184, 0.18);
    --input-bg: rgba(15, 23, 42, 0.7);
    --btn-primary: #6366f1;
    --btn-accent: #8b5cf6;
    --board-bg: rgba(15, 23, 42, 0.55);
    --cell-empty: rgba(30, 41, 59, 0.5);
    --star-color: #fbbf24;
    --star-glow: rgba(251, 191, 36, 0.55);
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
    --shadow-btn: 0 6px 20px -6px rgba(99, 102, 241, 0.55);
    --c-green: #4ade80;
    --c-blue: #38bdf8;
    --c-amber: #f59e0b;
}
[data-theme="light"] {
    --bg-color: #eef2ff;
    --bg-gradient-1: #e0e7ff;
    --bg-gradient-2: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-color: #0f172a;
    --text-muted: #475569;
    --border-color: rgba(15, 23, 42, 0.1);
    --input-bg: rgba(255, 255, 255, 0.95);
    --board-bg: rgba(248, 250, 252, 0.9);
    --cell-empty: rgba(226, 232, 240, 0.6);
    --shadow-card: 0 20px 60px -20px rgba(30, 41, 59, 0.28);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
}
.container {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    padding: 20px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card), 0 0 0 1px var(--card-border) inset;
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--card-border);
    animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
}
.btn-small {
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
}
.btn-small:hover { color: var(--text-color); border-color: var(--text-muted); }

.score-board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 10px;
    border: 1px solid var(--border-color);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--text-muted);
}
.score-board > div {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.score-board strong {
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-color);
}
#display-nivel  { color: var(--c-blue); }
#display-pontos { color: var(--c-green); }
#display-tempo  { color: #60a5fa; }
#display-recorde{ color: var(--c-amber); }
#display-estrelas { color: var(--star-color); }

.instructions {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 4px 0 12px;
    min-height: 18px;
    line-height: 1.5;
}

#game-board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--board-bg);
    background-image:
        linear-gradient(var(--board-bg), var(--board-bg)),
        linear-gradient(135deg,
            rgba(99, 102, 241, 0.55) 0%,
            rgba(139, 92, 246, 0.35) 30%,
            rgba(56, 189, 248, 0.30) 65%,
            rgba(99, 102, 241, 0.45) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border: 2px solid transparent;
    box-shadow:
        0 12px 40px -14px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--card-border),
        0 0 24px -6px rgba(99, 102, 241, 0.35);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#game-board {
    position: absolute;
    inset: 0;
    display: grid;
    gap: 2px;
    padding: 4px;
}

.cell {
    background: var(--cell-empty);
    border-radius: 4px;
    position: relative;
    transition: background 0.15s ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.cell.error {
    animation: shake 0.3s ease;
    box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.8);
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-2px); }
    75%      { transform: translateX(2px); }
}

.endpoint {
    width: 68%;
    height: 68%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    box-shadow:
        inset -2px -2px 4px rgba(0, 0, 0, 0.35),
        0 3px 6px rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.75);
    z-index: 4;
    pointer-events: none;
    transition: transform 0.2s ease;
}
.endpoint.connected {
    box-shadow:
        inset -2px -2px 4px rgba(0, 0, 0, 0.35),
        0 0 0 4px rgba(255, 255, 255, 0.55),
        0 0 20px rgba(255, 255, 255, 0.6);
}

.cell.trail {
    background: var(--trail-color, transparent);
    z-index: 2;
}
.cell.trail::after {
    content: "";
    position: absolute;
    inset: 34%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    opacity: 0.9;
    z-index: 3;
}
.cell.trail.connected {
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55);
}
.cell.trail.connected::after { background: #fff; opacity: 1; }

.cell.trail.live::after {
    animation: trailPulse 0.9s ease-in-out infinite;
}
@keyframes trailPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.25); opacity: 1; }
}

.star {
    position: absolute;
    inset: 15%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 3;
    pointer-events: none;
    transition: all 0.3s ease;
    filter: drop-shadow(0 0 6px var(--star-glow));
    animation: starPulse 2s ease-in-out infinite;
}
@keyframes starPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px var(--star-glow)); }
    50%      { transform: scale(1.12); filter: drop-shadow(0 0 12px var(--star-glow)); }
}

.cell.star-capturada .star {
    filter: grayscale(1) brightness(0.55);
    animation: none;
    opacity: 0.55;
}

.cell.trail .star {
    mix-blend-mode: luminosity;
}

.cell.trail.atravessado::after {
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
}
.cell.trail.atravessado .endpoint {
    opacity: 0.85;
    border-color: rgba(255, 255, 255, 0.95);
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}
select, button {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.25s ease;
}
button {
    background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
    color: #fff;
    border: none;
    box-shadow: var(--shadow-btn);
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn-secondary {
    background: linear-gradient(135deg, #475569, #334155);
}
.btn-secondary:hover { background: linear-gradient(135deg, #64748b, #475569); }

#btn-avancar {
    margin-top: 10px;
    background: linear-gradient(135deg, #10b981, #14b8a6);
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
        <button id="theme-toggle" class="btn-small">🌙 Tema</button>
    </div>

    <div class="score-board">
        <div>Nível<br><strong id="display-nivel">1</strong></div>
        <div>Pontos<br><strong id="display-pontos">0</strong></div>
        <div>Tempo<br><strong id="display-tempo">00:00</strong></div>
        <div>Recorde<br><strong id="display-recorde">--:--</strong></div>
        <div>⭐<br><strong id="display-estrelas">0/0</strong></div>
    </div>

    <p class="instructions" id="info-instrucao">
        Arraste para ligar os números. ⭐ Capture estrelas para atravessar bolas de outras cores.
    </p>

    <div id="game-board-wrapper">
        <div id="game-board"></div>
    </div>

    <div class="controls-grid">
        <select id="select-mudar-nivel">
            <option value="" disabled selected>Selecionar Nível...</option>
            <option value="1">Nível 1 — 5×5</option>
            <option value="2">Nível 2 — 6×6</option>
            <option value="3">Nível 3 — 7×7</option>
            <option value="4">Nível 4 — 8×8</option>
        </select>
        <button id="btn-reiniciar-nivel" class="btn-secondary">🔄 Reiniciar</button>
    </div>

    <button id="btn-avancar" class="hidden">Avançar para Próximo Nível 🚀</button>
</div>
<script type="module">
import { db } from "./firebase-config.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const VERSAO_CODIGO = 'v5-2026-10-07-regioes';
console.log(`✅ Rodando versão ${VERSAO_CODIGO}`);

const jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
if (!jogadorSessao) { window.location.href = 'index.html'; }

/* ==========================================================
   GERADOR POR REGIÕES CONEXAS
   ==========================================================
   Estratégia garantidamente solucionável:
   1. Escolhe N sementes (uma por par).
   2. Cada célula é atribuída à semente mais próxima (Voronoi).
   3. Ajusta fronteiras para garantir que cada região seja conexa.
   4. Endpoints = 2 células da mesma região com maior distância
      Manhattan entre si.
   5. Estrelas = células onde regiões adjacentes se tocam em
      pontos que forçam travessia (interseção de caminhos).
   ========================================================== */

const CORES = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#06b6d4', '#ec4899', '#84cc16'];

function gerarPuzzle(n, qtdPares) {
    // 1. Sementes bem distribuídas
    const sementes = [];
    const usados = new Set();
    let tentativas = 0;
    while (sementes.length < qtdPares && tentativas < 200) {
        tentativas++;
        const r = Math.floor(Math.random() * n);
        const c = Math.floor(Math.random() * n);
        const k = `${r},${c}`;
        if (usados.has(k)) continue;
        // Distância mínima entre sementes
        let ok = true;
        for (const s of sementes) {
            if (Math.abs(s.r - r) + Math.abs(s.c - c) < 2) { ok = false; break; }
        }
        if (!ok) continue;
        usados.add(k);
        sementes.push({ r, c, id: sementes.length });
    }

    // 2. Voronoi (atribui cada célula à semente mais próxima)
    const regiao = Array.from({ length: n }, () => Array(n).fill(-1));
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            let melhor = 0, melhorDist = Infinity;
            for (const s of sementes) {
                const d = Math.abs(s.r - r) + Math.abs(s.c - c);
                if (d < melhorDist) { melhorDist = d; melhor = s.id; }
            }
            regiao[r][c] = melhor;
        }
    }

    // 3. Garante que cada região tem ao menos 2 células
    for (let i = 0; i < qtdPares; i++) {
        let contador = 0;
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (regiao[r][c] === i) contador++;
        if (contador < 2) {
            // Toma uma célula de outra região adjacente
            for (const s of sementes) {
                if (s.id === i) continue;
                const vizinhos = [
                    { r: s.r - 1, c: s.c }, { r: s.r + 1, c: s.c },
                    { r: s.r, c: s.c - 1 }, { r: s.r, c: s.c + 1 }
                ];
                for (const v of vizinhos) {
                    if (v.r < 0 || v.r >= n || v.c < 0 || v.c >= n) continue;
                    if (regiao[v.r][v.c] !== i) {
                        regiao[v.r][v.c] = i;
                        break;
                    }
                }
            }
        }
    }

    // 4. Encontra os 2 endpoints de cada região (par mais distante)
    const pares = [];
    for (let i = 0; i < qtdPares; i++) {
        const celulas = [];
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
            if (regiao[r][c] === i) celulas.push({ r, c });
        }
        if (celulas.length < 2) continue;

        let melhorA = celulas[0], melhorB = celulas[1], melhorDist = -1;
        for (let a = 0; a < celulas.length; a++) {
            for (let b = a + 1; b < celulas.length; b++) {
                const d = Math.abs(celulas[a].r - celulas[b].r) + Math.abs(celulas[a].c - celulas[b].c);
                if (d > melhorDist) {
                    melhorDist = d;
                    melhorA = celulas[a];
                    melhorB = celulas[b];
                }
            }
        }
        pares.push({
            cor: CORES[i % CORES.length],
            a: { r: melhorA.r, c: melhorA.c },
            b: { r: melhorB.r, c: melhorB.c },
            _celulas: celulas
        });
    }

    // 5. Estrelas = células onde a fronteira entre 2 regiões se toca
    //    e ambas têm caminhos que precisam se cruzar. Como garantimos
    //    Voronoi, colocamos estrelas em 1-2 células "vértice" das fronteiras.
    const estrelas = [];
    const ocupadas = new Set();
    for (const p of pares) {
        ocupadas.add(`${p.a.r},${p.a.c}`);
        ocupadas.add(`${p.b.r},${p.b.c}`);
    }

    // Conta quantas regiões cada célula toca (4-vizinhança)
    for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
            const k = `${r},${c}`;
            if (ocupadas.has(k)) continue;
            const vizinhosReg = new Set();
            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
            for (const [dr, dc] of dirs) {
                const nr = r + dr, nc = c + dc;
                if (nr < 0 || nr >= n || nc < 0 || nc >= n) continue;
                vizinhosReg.add(regiao[nr][nc]);
            }
            // Se a célula toca 2+ regiões diferentes (é uma fronteira),
            // pode ser candidata a estrela
            if (vizinhosReg.size >= 2 && estrelas.length < 3) {
                if (Math.random() < 0.5) {
                    estrelas.push({ r, c });
                }
            }
        }
    }

    // Remove propriedades internas
    const paresLimpos = pares.map(p => ({
        cor: p.cor,
        a: { r: p.a.r, c: p.a.c },
        b: { r: p.b.r, c: p.b.c }
    }));

    return {
        tamanho: n,
        pares: paresLimpos,
        estrelas,
        _regiao: regiao  // útil para debug
    };
}

/* ==========================================================
   CONFIG DE NÍVEIS
   ========================================================== */
const CONFIG_NIVEIS = {
    1: { tamanho: 5, qtdPares: 3 },
    2: { tamanho: 6, qtdPares: 4 },
    3: { tamanho: 7, qtdPares: 5 },
    4: { tamanho: 8, qtdPares: 6 }
};

const cachePuzzles = {};

function obterPuzzle(nivel) {
    if (!cachePuzzles[nivel]) {
        const cfg = CONFIG_NIVEIS[nivel] || CONFIG_NIVEIS[1];
        cachePuzzles[nivel] = gerarPuzzle(cfg.tamanho, cfg.qtdPares);
        console.log(`🎲 Puzzle nível ${nivel} gerado:`, {
            tamanho: cachePuzzles[nivel].tamanho,
            qtdPares: cachePuzzles[nivel].pares.length,
            estrelas: cachePuzzles[nivel].estrelas
        });
    }
    return cachePuzzles[nivel];
}

function regerarPuzzle(nivel) {
    const cfg = CONFIG_NIVEIS[nivel] || CONFIG_NIVEIS[1];
    cachePuzzles[nivel] = gerarPuzzle(cfg.tamanho, cfg.qtdPares);
    console.log(`🎲 Puzzle nível ${nivel} REGERADO`);
}

/* ==========================================================
   ESTADO
   ========================================================== */
const estado = {
    nivel: 1, tamanho: 5, grid: [], pares: [], estrelas: [],
    trilhas: {}, estrelasPorPar: {}, estrelasUsadasGlobal: {},
    endpointsAtravessados: {}, desenhando: null,
    pontos: 0, segundos: 0, timer: null, recordes: {}, concluido: false
};

/* ==========================================================
   DOM
   ========================================================== */
const board = document.getElementById('game-board');
const displayNivel = document.getElementById('display-nivel');
const displayPontos = document.getElementById('display-pontos');
const displayTempo = document.getElementById('display-tempo');
const displayRecorde = document.getElementById('display-recorde');
const displayEstrelas = document.getElementById('display-estrelas');
const infoInstrucao = document.getElementById('info-instrucao');
const btnAvancar = document.getElementById('btn-avancar');
const btnReiniciar = document.getElementById('btn-reiniciar-nivel');
const selectNivel = document.getElementById('select-mudar-nivel');
const themeToggle = document.getElementById('theme-toggle');

const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
themeToggle.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('brain_flow_theme', next);
});

function formatarTempo(s) {
    if (s === undefined || s === null) return '--:--';
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function keyRC(r, c) { return `${r},${c}`; }

function iniciarPuzzle(nivel, regerar = false) {
    if (!CONFIG_NIVEIS[nivel]) nivel = 1;
    if (regerar) regerarPuzzle(nivel);
    const puzzleBase = obterPuzzle(nivel);

    estado.nivel = nivel;
    estado.tamanho = puzzleBase.tamanho;
    estado.pares = puzzleBase.pares.map((p, i) => ({ ...p, id: i }));
    estado.estrelas = (puzzleBase.estrelas || []).map((s, i) => ({ ...s, id: i }));
    estado.trilhas = {};
    estado.estrelasPorPar = {};
    estado.estrelasUsadasGlobal = {};
    estado.endpointsAtravessados = {};
    estado.desenhando = null;
    estado.concluido = false;

    estado.grid = Array.from({ length: puzzleBase.tamanho }, () =>
        Array.from({ length: puzzleBase.tamanho }, () => ({
            cor: null, parId: null, tipo: 'vazio',
            temEstrela: false, estrelaId: null
        }))
    );

    for (const par of estado.pares) {
        estado.grid[par.a.r][par.a.c] = { cor: par.cor, parId: par.id, tipo: 'endpoint', temEstrela: false, estrelaId: null };
        estado.grid[par.b.r][par.b.c] = { cor: par.cor, parId: par.id, tipo: 'endpoint', temEstrela: false, estrelaId: null };
    }

    for (const est of estado.estrelas) {
        if (estado.grid[est.r][est.c].tipo === 'endpoint') continue;
        estado.grid[est.r][est.c].temEstrela = true;
        estado.grid[est.r][est.c].estrelaId = est.id;
    }

    displayEstrelas.textContent = `0/${estado.estrelas.length}`;
    displayNivel.textContent = nivel;
    infoInstrucao.textContent = 'Arraste para ligar os números. ⭐ Capture estrelas para atravessar bolas de outras cores.';
    btnAvancar.classList.add('hidden');
    renderizarBoard();
    atualizarVisual();
    iniciarTimer();
}

function renderizarBoard() {
    const n = estado.tamanho;
    board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    board.innerHTML = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.id = `cell-${r}-${c}`;
        board.appendChild(cell);
    }
}

function construirMapaVisual() {
    const n = estado.tamanho;
    const mapa = Array.from({ length: n }, () =>
        Array.from({ length: n }, () => ({
            tipo: 'vazio', cor: null, parId: null, temEstrela: false,
            estrelaId: null, estrelaCapturada: false, conectado: false,
            atravessado: false, live: false
        }))
    );
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const g = estado.grid[r][c];
        mapa[r][c].tipo = g.tipo;
        mapa[r][c].cor = g.cor;
        mapa[r][c].parId = g.parId;
        mapa[r][c].temEstrela = g.temEstrela;
        mapa[r][c].estrelaId = g.estrelaId;
    }
    for (const parId in estado.trilhas) {
        const t = estado.trilhas[parId];
        const par = estado.pares.find(p => p.id == parId);
        if (!par || t.length < 2) continue;
        const inicio = t[0], fim = t[t.length - 1];
        const conecta =
            (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
            (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);
        for (const p of t) {
            const cell = mapa[p.r][p.c];
            if (cell.tipo === 'endpoint') { if (conecta) cell.conectado = true; continue; }
            cell.tipo = 'trilha'; cell.cor = par.cor; cell.parId = parId;
            if (conecta) cell.conectado = true;
        }
    }
    for (const parId in estado.endpointsAtravessados) {
        for (const k of estado.endpointsAtravessados[parId]) {
            const [r, c] = k.split(',').map(Number);
            mapa[r][c].atravessado = true;
        }
    }
    if (estado.desenhando) {
        const d = estado.desenhando;
        for (let i = 0; i < d.trail.length; i++) {
            const p = d.trail[i];
            const cell = mapa[p.r][p.c];
            if (cell.tipo === 'endpoint') { if (cell.parId === d.parId) cell.conectado = true; continue; }
            cell.tipo = 'trilha'; cell.cor = d.cor; cell.parId = d.parId;
            if (i === d.trail.length - 1) cell.live = true;
        }
        for (const k of d.endpointsAtravessados) {
            const [r, c] = k.split(',').map(Number);
            mapa[r][c].atravessado = true;
            mapa[r][c].live = false;
        }
    }
    for (const estId in estado.estrelasUsadasGlobal) {
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
            if (mapa[r][c].estrelaId === Number(estId) && mapa[r][c].temEstrela) {
                mapa[r][c].estrelaCapturada = true;
            }
        }
    }
    return mapa;
}

function atualizarVisual() {
    const n = estado.tamanho;
    const mapa = construirMapaVisual();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const cell = document.getElementById(`cell-${r}-${c}`);
        if (!cell) continue;
        const d = mapa[r][c];
        cell.className = 'cell';
        cell.style.background = '';
        cell.innerHTML = '';
        cell.style.removeProperty('--trail-color');
        if (d.estrelaCapturada) cell.classList.add('star-capturada');
        if (d.tipo === 'endpoint') {
            const cls = d.conectado ? ' connected' : '';
            if (d.atravessado) cell.classList.add('atravessado');
            cell.innerHTML = `<div class="endpoint${cls}" style="background:${d.cor}"></div>`;
        } else if (d.tipo === 'trilha') {
            cell.classList.add('trail');
            if (d.conectado) cell.classList.add('connected');
            if (d.live) cell.classList.add('live');
            cell.style.setProperty('--trail-color', d.cor);
        }
        if (d.temEstrela) {
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '⭐';
            cell.appendChild(star);
        }
    }
    const total = estado.estrelas.length;
    const capturadas = Object.keys(estado.estrelasUsadasGlobal).length;
    displayEstrelas.textContent = `${capturadas}/${total}`;
}

let activePointerId = null;
board.addEventListener('pointerdown', (e) => {
    if (estado.concluido) return;
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
    const dado = estado.grid[r][c];
    if (dado.tipo === 'endpoint') {
        e.preventDefault();
        activePointerId = e.pointerId;
        try { board.setPointerCapture(e.pointerId); } catch (_) {}
        iniciarTrilha(dado.parId, dado.cor, r, c);
    }
});
board.addEventListener('pointermove', (e) => {
    if (!estado.desenhando) return;
    if (e.pointerId !== activePointerId) return;
    e.preventDefault();
    if (e.pointerType === 'pen' && e.buttons === 0) return;
    const cell = cellFromPoint(e.clientX, e.clientY);
    if (!cell) return;
    estenderTrilha(parseInt(cell.dataset.r), parseInt(cell.dataset.c));
});
board.addEventListener('pointerup', (e) => {
    if (e.pointerId !== activePointerId) return;
    finalizarDesenho();
});
board.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== activePointerId) return;
    cancelarDesenho();
});
window.addEventListener('pointerup', (e) => {
    if (e.pointerId === activePointerId && estado.desenhando) finalizarDesenho();
});
window.addEventListener('pointercancel', (e) => {
    if (e.pointerId === activePointerId && estado.desenhando) cancelarDesenho();
});
function cellFromPoint(clientX, clientY) {
    const els = board.querySelectorAll('.cell');
    for (const el of els) {
        const rect = el.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right &&
            clientY >= rect.top && clientY <= rect.bottom) return el;
    }
    return null;
}
function finalizarDesenho() {
    if (activePointerId !== null) { try { board.releasePointerCapture(activePointerId); } catch (_) {} }
    activePointerId = null;
    if (estado.desenhando) finalizarTrilha();
}
function cancelarDesenho() {
    if (activePointerId !== null) { try { board.releasePointerCapture(activePointerId); } catch (_) {} }
    activePointerId = null;
    if (estado.desenhando) { estado.desenhando = null; atualizarVisual(); }
}

function iniciarTrilha(parId, cor, r, c) {
    if (estado.trilhas[parId]) {
        for (const estId of (estado.estrelasPorPar[parId] || [])) {
            if (estado.estrelasUsadasGlobal[estId] === parId) delete estado.estrelasUsadasGlobal[estId];
        }
        delete estado.trilhas[parId];
        delete estado.estrelasPorPar[parId];
        delete estado.endpointsAtravessados[parId];
        for (let rr = 0; rr < estado.tamanho; rr++) for (let cc = 0; cc < estado.tamanho; cc++) {
            const g = estado.grid[rr][cc];
            if (g.tipo === 'trilha' && g.parId === parId) { g.tipo = 'vazio'; g.cor = null; g.parId = null; }
        }
    }
    estado.desenhando = {
        parId, cor, trail: [{ r, c }],
        estrelasCapturadas: new Set(),
        endpointsAtravessados: new Set()
    };
    atualizarVisual();
}

function estenderTrilha(r, c) {
    const d = estado.desenhando;
    if (!d) return;
    const trail = d.trail;
    if (!trail.length) return;
    const ultima = trail[trail.length - 1];
    if (ultima.r === r && ultima.c === c) return;

    if (trail.length >= 2) {
        const anterior = trail[trail.length - 2];
        if (anterior.r === r && anterior.c === c) {
            const removida = trail.pop();
            const celula = estado.grid[removida.r][removida.c];
            if (celula.temEstrela && d.estrelasCapturadas.has(celula.estrelaId)) {
                d.estrelasCapturadas.delete(celula.estrelaId);
            }
            const k = keyRC(removida.r, removida.c);
            if (d.endpointsAtravessados.has(k)) d.endpointsAtravessados.delete(k);
            atualizarVisual();
            return;
        }
    }
    const dr = Math.abs(r - ultima.r), dc = Math.abs(c - ultima.c);
    if (dr + dc !== 1) {
        const idx = trail.findIndex(p => p.r === r && p.c === c);
        if (idx >= 0) {
            for (let i = idx + 1; i < trail.length; i++) {
                const rem = trail[i];
                const celula = estado.grid[rem.r][rem.c];
                if (celula.temEstrela && d.estrelasCapturadas.has(celula.estrelaId)) {
                    d.estrelasCapturadas.delete(celula.estrelaId);
                }
                const k = keyRC(rem.r, rem.c);
                if (d.endpointsAtravessados.has(k)) d.endpointsAtravessados.delete(k);
            }
            trail.length = idx + 1;
            atualizarVisual();
        }
        return;
    }
    const alvo = estado.grid[r][c];
    if (alvo.tipo === 'endpoint' && alvo.parId === d.parId) {
        trail.push({ r, c }); finalizarTrilha(); return;
    }
    if (alvo.tipo === 'endpoint') {
        const saldo = d.estrelasCapturadas.size - d.endpointsAtravessados.size;
        if (saldo > 0) {
            trail.push({ r, c });
            d.endpointsAtravessados.add(keyRC(r, c));
            atualizarVisual();
            infoInstrucao.textContent = `⭐ Atravessando bola (${saldo - 1} restante(s))`;
        } else {
            piscarErro(r, c);
            infoInstrucao.textContent = '⚠️ Capture uma ⭐ para atravessar esta bola!';
        }
        return;
    }
    const idx = trail.findIndex(p => p.r === r && p.c === c);
    if (idx >= 0) {
        for (let i = idx + 1; i < trail.length; i++) {
            const rem = trail[i];
            const celula = estado.grid[rem.r][rem.c];
            if (celula.temEstrela && d.estrelasCapturadas.has(celula.estrelaId)) {
                d.estrelasCapturadas.delete(celula.estrelaId);
            }
            const k = keyRC(rem.r, rem.c);
            if (d.endpointsAtravessados.has(k)) d.endpointsAtravessados.delete(k);
        }
        trail.length = idx + 1;
        atualizarVisual();
        return;
    }
    if (alvo.tipo === 'trilha' && alvo.parId !== d.parId) {
        piscarErro(r, c);
        infoInstrucao.textContent = '⚠️ Não pode cruzar trilhas de outras cores!';
        return;
    }
    trail.push({ r, c });
    if (alvo.temEstrela && !d.estrelasCapturadas.has(alvo.estrelaId)) {
        d.estrelasCapturadas.add(alvo.estrelaId);
        infoInstrucao.textContent = `⭐ Estrela capturada! (${d.estrelasCapturadas.size - d.endpointsAtravessados.size} disponível(is))`;
    }
    atualizarVisual();
}

function finalizarTrilha() {
    const d = estado.desenhando;
    if (!d) return;
    const trail = d.trail;
    const par = estado.pares.find(p => p.id === d.parId);
    if (!par) { estado.desenhando = null; atualizarVisual(); return; }
    const inicio = trail[0], fim = trail[trail.length - 1];
    const conecta =
        (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
        (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);
    if (conecta && trail.length >= 2) {
        estado.trilhas[d.parId] = [...trail];
        estado.estrelasPorPar[d.parId] = new Set(d.estrelasCapturadas);
        estado.endpointsAtravessados[d.parId] = new Set(d.endpointsAtravessados);
        for (const estId of d.estrelasCapturadas) estado.estrelasUsadasGlobal[estId] = d.parId;
        for (let i = 0; i < trail.length; i++) {
            const p = trail[i];
            const g = estado.grid[p.r][p.c];
            if (g.tipo === 'endpoint') continue;
            g.tipo = 'trilha'; g.cor = d.cor; g.parId = d.parId;
        }
    }
    estado.desenhando = null;
    atualizarVisual();
    verificarVitoria();
}

function piscarErro(r, c) {
    const el = document.getElementById(`cell-${r}-${c}`);
    if (!el) return;
    el.classList.add('error');
    setTimeout(() => el.classList.remove('error'), 320);
}

function verificarVitoria() {
    if (estado.concluido) return;
    const n = estado.tamanho;
    for (const par of estado.pares) {
        const t = estado.trilhas[par.id];
        if (!t || t.length < 2) return;
        const inicio = t[0], fim = t[t.length - 1];
        const conecta =
            (inicio.r === par.a.r && inicio.c === par.a.c && fim.r === par.b.r && fim.c === par.b.c) ||
            (inicio.r === par.b.r && inicio.c === par.b.c && fim.r === par.a.r && fim.c === par.a.c);
        if (!conecta) return;
    }
    const mapa = construirMapaVisual();
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        const d = mapa[r][c];
        const ok = d.tipo === 'trilha' || d.tipo === 'endpoint' || d.temEstrela;
        if (!ok) return;
    }
    estado.concluido = true;
    concluirNivel();
}

async function concluirNivel() {
    pararTimer();
    infoInstrucao.textContent = `🎉 Nível ${estado.nivel} concluído em ${formatarTempo(estado.segundos)}!`;
    const ganho = estado.nivel * 25 + Math.max(0, 200 - estado.segundos);
    estado.pontos += ganho;
    if (!estado.recordes[estado.nivel] || estado.segundos < estado.recordes[estado.nivel]) {
        estado.recordes[estado.nivel] = estado.segundos;
    }
    displayPontos.textContent = estado.pontos;
    displayRecorde.textContent = formatarTempo(estado.recordes[estado.nivel]);
    try {
        await update(ref(db, 'jogadores/' + jogadorSessao.chave), {
            pontos: estado.pontos, nivel: estado.nivel + 1,
            recordesFlowNumeros: estado.recordes,
            ultimaAtualizacao: new Date().toISOString()
        });
    } catch (e) { console.error('Erro ao salvar:', e); }
    btnAvancar.classList.remove('hidden');
    btnAvancar.textContent = `Avançar para Nível ${Math.min(estado.nivel + 1, 4)} 🚀`;
}

function iniciarTimer() {
    pararTimer();
    estado.segundos = 0;
    displayTempo.textContent = '00:00';
    estado.timer = setInterval(() => {
        estado.segundos++;
        displayTempo.textContent = formatarTempo(estado.segundos);
    }, 1000);
}
function pararTimer() {
    if (estado.timer) clearInterval(estado.timer);
    estado.timer = null;
}

btnReiniciar.addEventListener('click', () => iniciarPuzzle(estado.nivel, true));
selectNivel.addEventListener('change', (e) => {
    const n = parseInt(e.target.value);
    if (n >= 1 && n <= 4) { selectNivel.value = ''; iniciarPuzzle(n, false); }
});
btnAvancar.addEventListener('click', () => iniciarPuzzle(Math.min(estado.nivel + 1, 4), false));

async function carregarDados() {
    try {
        const snap = await get(ref(db, 'jogadores/' + jogadorSessao.chave));
        if (snap.exists()) {
            const dados = snap.val();
            estado.pontos = dados.pontos || 0;
            estado.recordes = dados.recordesFlowNumeros || {};
            estado.nivel = Math.min(4, Math.max(1, dados.nivel || 1));
        }
    } catch (e) { console.warn('Modo offline', e); }
    displayPontos.textContent = estado.pontos;
    displayNivel.textContent = estado.nivel;
    iniciarPuzzle(estado.nivel, false);
}
carregarDados();
</script>
