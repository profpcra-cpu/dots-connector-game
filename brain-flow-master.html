<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Color Flow - Ligar Cores</title>

    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY");
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1020;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0b1020;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(148, 163, 184, 0.15);
            --card-glow: rgba(99, 102, 241, 0.25);

            --text-color: #f8fafc;
            --text-muted: #94a3b8;

            --border-color: rgba(148, 163, 184, 0.18);
            --input-bg: rgba(15, 23, 42, 0.7);

            --btn-primary: #6366f1;
            --btn-primary-hover: #818cf8;
            --btn-accent: #8b5cf6;

            /* Estilo Tabuleiro Madeira/Papel da Imagem */
            --board-bg: #fefae0;
            --board-border: #8b4513; 

            --node-size: 44px;
            --radius-lg: 20px;
            --shadow-card: 0 20px 60px -20px rgba(0, 0, 0, 0.65);
        }

        [data-theme="light"] {
            --bg-color: #eef2ff;
            --bg-gradient-1: #e0e7ff;
            --bg-gradient-2: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #0f172a;
            --text-muted: #475569;
            --board-bg: #fdf5e6;
            --board-border: #8b4513;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 0%, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 55%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--card-border);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-small {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
        }
        .btn-small:hover { color: var(--text-color); }

        /* Estilo da Barra Superior de QI da Imagem (Cérebro / Einstein) */
        .brain-meter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 8px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: bold;
        }
        .brain-meter div {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
        .score-board strong {
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }

        .instructions {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* TABULEIRO ESTILO CAIXA DE MADEIRA DA IMAGEM */
        #game-board {
            position: relative;
            width: 100%;
            height: 330px;
            background: var(--board-bg);
            border: 6px solid var(--board-border);
            border-radius: 16px;
            margin-top: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.25), 0 10px 25px rgba(0,0,0,0.4);
            cursor: crosshair;
        }

        /* BOLAS / PONTOS COLORIDOS (ESTILO ESFERA 3D DA IMAGEM) */
        .node {
            position: absolute;
            width: var(--node-size);
            height: var(--node-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: inset -4px -4px 8px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.7);
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
            z-index: 3;
        }
        .node:hover {
            transform: translate(-50%, -50%) scale(1.12);
            filter: brightness(1.15);
        }

        /* Brilho interno 3D para as bolas */
        .node::after {
            content: "";
            position: absolute;
            top: 6px;
            left: 8px;
            width: 10px;
            height: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .node.selected {
            box-shadow: 0 0 0 4px #ffffff, inset -4px -4px 8px rgba(0,0,0,0.4);
        }

        #canvas-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, var(--btn-primary), var(--btn-accent));
            color: white;
            border: none;
        }
        button:hover { filter: brightness(1.1); }
        .btn-secondary { background: #475569; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- BARRA SUPERIOR -->
        <div class="top-bar">
            <button class="btn-small" onclick="window.location.href='index.html'">🏠 Menu Hub</button>
            <button id="theme-toggle" class="btn-small">🌙 Tema</button>
        </div>

        <!-- MEDIDOR DE QI (Inspirado na imagem do cérebro e Einstein) -->
        <div class="brain-meter">
            <div>🧠 <span id="qi-cerebro">75</span></div>
            <div>Albert Einstein 👨‍🔬</div>
            <div>⚡ <span id="qi-einstein">180</span></div>
        </div>

        <div class="score-board">
            <div>Nível<br><strong id="display-nivel" style="color: #38bdf8;">1</strong></div>
            <div>Pontos<br><strong id="display-pontos" style="color: #4ade80;">0</strong></div>
            <div>Tempo<br><strong id="display-tempo" style="color: #60a5fa;">00:00</strong></div>
            <div>Recorde<br><strong id="display-recorde" style="color: #f59e0b;">--:--</strong></div>
        </div>

        <p class="instructions" id="info-instrucao">Ligue os pares de bolas da mesma cor sem cruzar linhas!</p>

        <!-- TABULEIRO DE MADEIRA -->
        <div id="game-board">
            <svg id="canvas-lines"></svg>
        </div>

        <div class="controls-grid">
            <select id="select-mudar-nivel">
                <option value="" disabled selected>Selecionar Nível...</option>
                <option value="1">Nível 1 (Fácil)</option>
                <option value="2">Nível 2 (Médio)</option>
                <option value="3">Nível 3 (Difícil)</option>
                <option value="4">Nível 4 (Especial)</option>
            </select>
            <button id="btn-reiniciar-nivel" class="btn-secondary">🔄 Reiniciar</button>
        </div>

        <button id="btn-avancar" class="hidden" style="margin-top: 10px; background-color: #10b981;">Avançar para Próximo Nível 🚀</button>
    </div>

    <!-- Lógica do Jogo -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let jogadorSessao = JSON.parse(localStorage.getItem('brain_hub_jogador'));
        if (!jogadorSessao) { window.location.href = 'index.html'; }

        let pontuacaoAcumulada = 0;
        let nivelAtual = 1;
        let segundos = 0;
        let timerInterval = null;
        let recordesNivel = {};

        // Cores disponíveis para os pares (estilo imagem de referência)
        const coresPares = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#ec4899', '#8b5cf6'];
        let paresDoNivel = [];
        let bolaSelecionada = null;
        let ligacoesCompletas = {};

        const displayNível = document.getElementById('display-nivel');
        const displayPontos = document.getElementById('display-pontos');
        const displayTempo = document.getElementById('display-tempo');
        const displayRecorde = document.getElementById('display-recorde');
        const infoInstrucao = document.getElementById('info-instrucao');
        const gameBoard = document.getElementById('game-board');
        const canvasLines = document.getElementById('canvas-lines');
        const btnAvancar = document.getElementById('btn-avancar');
        const btnReiniciarNivel = document.getElementById('btn-reiniciar-nivel');
        const selectMudarNivel = document.getElementById('select-mudar-nivel');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const qiCerebro = document.getElementById('qi-cerebro');

        // Gestão de Tema
        const savedTheme = localStorage.getItem('brain_flow_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('brain_flow_theme', newTheme);
        });

        function formatarTempo(seg) {
            if (!seg || seg === 0) return "--:--";
            let m = String(Math.floor(seg / 60)).padStart(2, '0');
            let s = String(seg % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function atualizarDisplayRecorde() {
            const melhorTempo = recordesNivel[nivelAtual] || 0;
            displayRecorde.textContent = formatarTempo(melhorTempo);
        }

        async function carregarDadosJogador() {
            const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
            try {
                const snapshot = await get(jogadorRef);
                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    pontuacaoAcumulada = dados.pontos || 0;
                    nivelAtual = dados.nivel || 1;
                    recordesNivel = dados.recordesFlow || {};
                }
                displayPontos.textContent = pontuacaoAcumulada;
                displayNível.textContent = nivelAtual;
                qiCerebro.textContent = 70 + (nivelAtual * 5);
                iniciarNovoJogoRonda();
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        carregarDadosJogador();

        btnReiniciarNivel.addEventListener('click', () => iniciarNovoJogoRonda());
        selectMudarNivel.addEventListener('change', (e) => {
            nivelAtual = parseInt(e.target.value);
            selectMudarNivel.value = "";
            iniciarNovoJogoRonda();
        });

        function iniciarNovoJogoRonda() {
            clearInterval(timerInterval);
            segundos = 0;
            displayTempo.textContent = "00:00";
            atualizarDisplayRecorde();

            timerInterval = setInterval(() => {
                segundos++;
                displayTempo.textContent = formatarTempo(segundos);
            }, 1000);

            btnAvancar.classList.add('hidden');
            infoInstrucao.textContent = `Nível ${nivelAtual}: Ligue os pares de bolas da mesma cor!`;
            document.querySelectorAll('.node').forEach(el => el.remove());
            canvasLines.innerHTML = '';
            ligacoesCompletas = {};
            bolaSelecionada = null;

            const boardWidth = gameBoard.clientWidth - 60;
            const boardHeight = gameBoard.clientHeight - 60;

            // Quantidade de pares de acordo com o nível
            const qtdPares = Math.min(2 + nivelAtual, 5);
            paresDoNivel = [];

            let posicoesUsadas = [];

            for (let i = 0; i < qtdPares; i++) {
                let cor = coresPares[i % coresPares.length];
                
                // Gerar 2 bolas para cada cor sem sobreposição
                let p1 = gerarPosicaoUnica(boardWidth, boardHeight, posicoesUsadas);
                let p2 = gerarPosicaoUnica(boardWidth, boardHeight, posicoesUsadas);

                paresDoNivel.push({ id: i, cor: cor, p1: p1, p2: p2, ligado: false });
            }

            // Renderizar as bolas no tabuleiro
            paresDoNivel.forEach(par => {
                criarElementoBola(par.p1.x, par.p1.y, par.cor, par.id, 'A');
                criarElementoBola(par.p2.x, par.p2.y, par.cor, par.id, 'B');
            });
        }

        function gerarPosicaoUnica(w, h, usadas) {
            let x, y, valido;
            let tentativas = 0;
            do {
                x = Math.floor(Math.random() * (w - 40)) + 30;
                y = Math.floor(Math.random() * (h - 40)) + 30;
                valido = true;
                for (let pos of usadas) {
                    if (Math.hypot(pos.x - x, pos.y - y) < 65) {
                        valido = false;
                        break;
                    }
                }
                tentativas++;
            } while (!valido && tentativas < 100);

            usadas.push({ x, y });
            return { x, y };
        }

        function criarElementoBola(x, y, cor, parId, tipo) {
            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;
            node.style.backgroundColor = cor;
            node.dataset.parId = parId;
            node.dataset.tipo = tipo;
            node.dataset.x = x;
            node.dataset.y = y;

            node.addEventListener('click', () => lidarComCliqueBola(node, parId, cor, x, y));
            gameBoard.appendChild(node);
        }

        function lidarComCliqueBola(node, parId, cor, x, y) {
            if (ligacoesCompletas[parId]) return; // Já ligado

            if (!bolaSelecionada) {
                bolaSelecionada = { node, parId, cor, x, y };
                node.classList.add('selected');
            } else {
                if (bolaSelecionada.parId === parId && bolaSelecionada.node !== node) {
                    // Par correto encontrado! Desenhar linha de ligação
                    desenharLinha(bolaSelecionada.x, bolaSelecionada.y, x, y, cor);
                    ligacoesCompletas[parId] = true;
                    bolaSelecionada.node.classList.remove('selected');
                    bolaSelecionada = null;

                    verificarFimDoNível();
                } else {
                    // Selecionou errado ou a mesma bola
                    bolaSelecionada.node.classList.remove('selected');
                    bolaSelecionada = { node, parId, cor, x, y };
                    node.classList.add('selected');
                }
            }
        }

        function desenharLinha(x1, y1, x2, y2, cor) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', cor);
            line.setAttribute('stroke-width', '6');
            line.setAttribute('stroke-linecap', 'round');
            canvasLines.appendChild(line);
        }

        async function verificarFimDoNível() {
            const totalPares = paresDoNivel.length;
            const totalLigados = Object.keys(ligacoesCompletas).length;

            if (totalLigados === totalPares) {
                clearInterval(timerInterval);
                infoInstrucao.textContent = `🎉 Nível ${nivelAtual} Concluído com Sucesso!`;

                const pontosGanhos = nivelAtual * 15;
                pontuacaoAcumulada += pontosGanhos;

                let melhorTempo = recordesNivel[nivelAtual] || 0;
                if (melhorTempo === 0 || segundos < melhorTempo) {
                    recordesNivel[nivelAtual] = segundos;
                }

                nivelAtual++;

                const jogadorRef = ref(db, 'jogadores/' + jogadorSessao.chave);
                await update(jogadorRef, {
                    pontos: pontuacaoAcumulada,
                    nivel: nivelAtual,
                    recordesFlow: recordesNivel
                });

                displayPontos.textContent = pontuacaoAcumulada;
                displayNível.textContent = nivelAtual;
                atualizarDisplayRecorde();

                btnAvancar.classList.remove('hidden');
            }
        }

        btnAvancar.addEventListener('click', () => iniciarNovoJogoRonda());
    </script>
</body>
</html>
